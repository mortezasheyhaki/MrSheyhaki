<html lang="en">
<head>

  <script>
  (function(){try{var t=localStorage.getItem("mrsheyhaki-theme");
  if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
  else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)
  document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.setAttribute("data-theme","light");
  }catch(e){}})();
  </script>
  <link rel="stylesheet" href="../../../learningarcade/theme.css" />
  <style>
    :root {
      --bg: #eff6ff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #bfdbfe;
      --purple: #3b82f6;
      --purple-deep: #1d4ed8;
      --ok: #2563eb;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
    }
    html[data-theme="dark"] {
      --bg: #0b1220;
      --card: #151b2b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --line: #1e3a5f;
      --blue: #60a5fa;
      --blue-deep: #1d4ed8;
      --purple: #60a5fa;
      --ok: #3b82f6;
      --accent: #60a5fa;
      --shadow: 0 14px 36px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; min-height: 100dvh; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(700px 360px at 100% 0%, rgba(59, 130, 246, 0.18), transparent 55%),
        var(--bg);
      color: var(--text);
      padding: 14px 14px 28px;
    }
    .wrap { max-width: 920px; margin: 0 auto; }
    .top {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px;
    }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      text-decoration: none; font-weight: 800; color: var(--text);
      background: var(--card); border: 1px solid var(--line);
      padding: 10px 14px; border-radius: 999px; min-height: 44px;
    }
    .badge {
      font-size: 0.75rem; font-weight: 900; letter-spacing: 0.06em;
      text-transform: uppercase; color: #fff;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      padding: 8px 12px; border-radius: 999px;
    }
    h1 {
      font-size: clamp(1.35rem, 3.5vw, 1.7rem);
      font-weight: 900; margin-bottom: 4px;
    }
    .lead {
      color: var(--muted); font-weight: 600; font-size: 0.95rem;
      margin-bottom: 14px; line-height: 1.4;
    }

    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    }
    .filter-btn {
      appearance: none; border: 2px solid var(--line); background: var(--card);
      color: var(--muted); font: inherit; font-weight: 800; font-size: 0.85rem;
      padding: 10px 14px; border-radius: 999px; cursor: pointer; min-height: 44px;
    }
    .filter-btn.active {
      background: var(--purple); border-color: var(--purple); color: #fff;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.28);
    }

    .stage {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 20px 16px 18px;
      margin-bottom: 16px;
    }
    .flashcard {
      width: 100%;
      max-width: 360px;
      margin: 0 auto 16px;
      min-height: 220px;
      border-radius: 22px;
      border: none;
      cursor: pointer;
      background: linear-gradient(160deg, #60a5fa 0%, #3b82f6 50%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 12px 0 #1d4ed8, 0 18px 32px rgba(37, 99, 235, 0.35);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px;
      padding: 24px 16px;
      transition: transform 0.18s ease, box-shadow 0.12s ease, opacity 0.18s ease;
      -webkit-user-select: none; user-select: none;
      touch-action: pan-y; /* allow vertical scroll, handle horizontal swipe ourselves */
      will-change: transform;
    }
    .flashcard.is-swiping {
      transition: none;
    }
    .flashcard.swipe-out-left {
      transform: translateX(-110%) rotate(-6deg);
      opacity: 0;
    }
    .flashcard.swipe-out-right {
      transform: translateX(110%) rotate(6deg);
      opacity: 0;
    }
    .flashcard.swipe-in {
      animation: flashIn 0.22s ease;
    }
    @keyframes flashIn {
      from { transform: scale(0.94); opacity: 0.4; }
      to { transform: scale(1); opacity: 1; }
    }
    .flashcard:active {
      transform: translateY(6px);
      box-shadow: 0 6px 0 #1d4ed8, 0 10px 20px rgba(37, 99, 235, 0.3);
    }
    .flashcard.is-playing {
      outline: 3px solid #fde68a;
    }
    .flash-num {
      font-size: clamp(2.6rem, 11vw, 4.5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      word-break: break-all;
      text-align: center;
    }
    .flash-word {
      font-size: clamp(1.05rem, 3.8vw, 1.6rem);
      font-weight: 800;
      opacity: 0.95;
      text-transform: lowercase;
      text-align: center;
      line-height: 1.25;
      max-width: 100%;
      padding: 0 4px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .flash-hint {
      font-size: 0.8rem;
      font-weight: 700;
      opacity: 0.75;
      margin-top: 6px;
    }
    .speaker {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.18);
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .nav-row {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      flex-wrap: wrap;
    }
    .nav-btn {
      appearance: none; border: none; cursor: pointer;
      font: inherit; font-weight: 800;
      min-height: 48px; min-width: 48px;
      padding: 12px 18px; border-radius: 999px;
      background: var(--bg); color: var(--text); border: 2px solid var(--line);
    }
    .nav-btn.primary {
      background: linear-gradient(180deg, #60a5fa, #3b82f6);
      color: #fff; border-color: transparent;
      box-shadow: 0 5px 0 var(--purple-deep);
    }
    .nav-btn.primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--purple-deep);
    }
    .counter {
      font-weight: 800; color: var(--muted); font-size: 0.9rem;
      min-width: 5ch; text-align: center;
    }

    .grid-label {
      font-size: 0.75rem; font-weight: 900; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .num-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 10px;
    }
    .num-tile {
      appearance: none; border: 2px solid var(--line);
      background: var(--card); color: var(--text);
      border-radius: 14px; min-height: 64px;
      font: inherit; font-weight: 900; font-size: 1.05rem;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      transition: border-color 0.15s, transform 0.12s, background 0.15s;
    }
    .num-tile small {
      font-size: 0.65rem; font-weight: 700; color: var(--muted);
      text-transform: lowercase;
    }
    .num-tile:hover { border-color: var(--purple); }
    .num-tile.active {
      background: linear-gradient(180deg, #60a5fa, #3b82f6);
      border-color: transparent; color: #fff;
      box-shadow: 0 4px 0 var(--purple-deep);
    }
    .num-tile.active small { color: rgba(255,255,255,0.85); }

    .audio-note {
      margin-top: 14px; font-size: 0.85rem; color: var(--muted); font-weight: 600;
      line-height: 1.4;
    }

    /* —— Phone layout —— */
    @media (max-width: 700px) {
      body {
        padding: 10px 10px max(20px, env(safe-area-inset-bottom));
      }
      .wrap { max-width: 100%; }
      .top { margin-bottom: 10px; gap: 8px; }
      .back { padding: 8px 12px; min-height: 42px; font-size: 0.9rem; }
      .badge { padding: 6px 10px; font-size: 0.7rem; }
      h1 { font-size: 1.35rem; margin-bottom: 2px; }
      .lead { font-size: 0.88rem; margin-bottom: 12px; }
      .filters {
        gap: 6px;
        margin-bottom: 12px;
        overflow-x: auto;
        flex-wrap: nowrap;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
      }
      .filter-btn {
        flex: 0 0 auto;
        padding: 8px 12px;
        min-height: 40px;
        font-size: 0.8rem;
      }
      .stage {
        padding: 14px 12px 14px;
        border-radius: 18px;
        margin-bottom: 12px;
      }
      .flashcard {
        max-width: 100%;
        min-height: 180px;
        padding: 18px 12px;
        border-radius: 18px;
        box-shadow: 0 8px 0 #1d4ed8, 0 14px 24px rgba(37, 99, 235, 0.3);
      }
      .flashcard:active {
        box-shadow: 0 4px 0 #1d4ed8, 0 8px 16px rgba(37, 99, 235, 0.28);
      }
      .speaker { width: 44px; height: 44px; font-size: 1.2rem; }
      .flash-num { font-size: clamp(2.4rem, 12vw, 3.4rem); }
      .flash-word { font-size: clamp(0.95rem, 4vw, 1.25rem); }
      .nav-row {
        gap: 8px;
        flex-wrap: nowrap;
      }
      .nav-btn {
        min-height: 44px;
        min-width: 44px;
        padding: 10px 14px;
        font-size: 0.88rem;
      }
      .nav-btn.primary {
        flex: 1 1 auto;
        min-width: 0;
        padding: 10px 12px;
      }
      .counter { font-size: 0.85rem; min-width: 4.5ch; }
      .grid-label { margin-bottom: 8px; }
      .num-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .num-tile {
        min-height: 56px;
        font-size: 0.95rem;
        border-radius: 12px;
        padding: 6px 4px;
      }
      .num-tile small {
        font-size: 0.58rem;
        line-height: 1.15;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .audio-note { font-size: 0.8rem; margin-top: 12px; }
    }
    @media (max-width: 380px) {
      .num-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .flashcard { min-height: 160px; padding: 14px 10px; }
      .nav-btn { padding: 8px 10px; min-width: 40px; }
      .filter-btn { padding: 8px 10px; font-size: 0.75rem; }
    }
  
    /* —— Dark mode polish (Numbers blue theme) —— */
    html[data-theme="dark"] body {
      background:
        radial-gradient(700px 360px at 0% 0%, rgba(59,130,246,.12), transparent 55%),
        var(--bg);
    }
    html[data-theme="dark"] .stage,
    html[data-theme="dark"] .card,
    html[data-theme="dark"] .panel,
    html[data-theme="dark"] .box,
    html[data-theme="dark"] .finish-box,
    html[data-theme="dark"] .level-card,
    html[data-theme="dark"] .menu-card,

    html[data-theme="dark"] .back {

    html[data-theme="dark"] input,

    html[data-theme="dark"] .btn-ghost,
    html[data-theme="dark"] .btn-secondary {

    }
    html[data-theme="dark"] .progress {
      background: #1e3a5f;
    }

  </style>

<body class="no-profile-fab">
  <div class="wrap">
    <div class="top">
      <a class="back" href="../">← Numbers</a>
      <span class="badge">Flashcards</span>
    </div>
    <h1>Number flashcards</h1>
    <p class="lead">Tap a number to see the word and hear it. Easy: 0–20. Medium: 10 bigger numbers.</p>

    <div class="filters" role="tablist" aria-label="Filter numbers">
      <button type="button" class="filter-btn active" data-filter="easy">Easy · 0–20</button>
      <button type="button" class="filter-btn" data-filter="medium">Medium · Big numbers</button>
      <button type="button" class="filter-btn" data-filter="all">All</button>
    </div>

    <section class="stage">
      <button type="button" class="flashcard" id="flashcard" aria-label="Play number sound">
        <span class="speaker" aria-hidden="true">🔊</span>
        <span class="flash-num" id="flashNum">0</span>
        <span class="flash-word" id="flashWord">zero</span>
        <span class="flash-hint">Swipe ← → or tap to hear</span>
      </button>
      <div class="nav-row">
        <button type="button" class="nav-btn" id="btnPrev" aria-label="Previous">←</button>
        <span class="counter"><span id="idxLabel">1</span> / <span id="totalLabel">0</span></span>
        <button type="button" class="nav-btn primary" id="btnPlay">Hear again</button>
        <button type="button" class="nav-btn" id="btnNext" aria-label="Next">→</button>
      </div>
    </section>

    <p class="grid-label">Or pick any number</p>
    <div class="num-grid" id="numGrid"></div>
    <p class="audio-note" id="audioNote">Audio loaded from this folder. If a file is missing, the browser voice is used as a backup.</p>
  </div>

  <script src="../../../learningarcade/theme.js"></script>
  <script>
  (function () {
    "use strict";

    var ALL = [
      { n: 0, word: "zero", groups: ["easy"] },
      { n: 1, word: "one", groups: ["easy"] },
      { n: 2, word: "two", groups: ["easy"] },
      { n: 3, word: "three", groups: ["easy"] },
      { n: 4, word: "four", groups: ["easy"] },
      { n: 5, word: "five", groups: ["easy"] },
      { n: 6, word: "six", groups: ["easy"] },
      { n: 7, word: "seven", groups: ["easy"] },
      { n: 8, word: "eight", groups: ["easy"] },
      { n: 9, word: "nine", groups: ["easy"] },
      { n: 10, word: "ten", groups: ["easy"] },
      { n: 11, word: "eleven", groups: ["easy"] },
      { n: 12, word: "twelve", groups: ["easy"] },
      { n: 13, word: "thirteen", groups: ["easy"] },
      { n: 14, word: "fourteen", groups: ["easy"] },
      { n: 15, word: "fifteen", groups: ["easy"] },
      { n: 16, word: "sixteen", groups: ["easy"] },
      { n: 17, word: "seventeen", groups: ["easy"] },
      { n: 18, word: "eighteen", groups: ["easy"] },
      { n: 19, word: "nineteen", groups: ["easy"] },
      { n: 20, word: "twenty", groups: ["easy"] },
      { n: 100, word: "one hundred", groups: ["medium"] },
      { n: 105, word: "one hundred and five", groups: ["medium"] },
      { n: 200, word: "two hundred", groups: ["medium"] },
      { n: 875, word: "eight hundred and seventy-five", groups: ["medium"] },
      { n: 1000, word: "one thousand", groups: ["medium"] },
      { n: 1500, word: "one thousand five hundred", groups: ["medium"] },
      { n: 5420, word: "five thousand four hundred and twenty", groups: ["medium"] },
      { n: 25000, word: "twenty-five thousand", groups: ["medium"] },
      { n: 100000, word: "one hundred thousand", groups: ["medium"] },
      { n: 1000000, word: "one million", groups: ["medium"] }
    ];

    var filter = "easy";
    var list = ALL.slice();
    var index = 0;
    var currentAudio = null;
    var audioCache = {};

    function $(id) { return document.getElementById(id); }

    function formatNum(n) {
      if (n >= 1000) return n.toLocaleString("en-US");
      return String(n);
    }

    function filtered() {
      if (filter === "all") return ALL.slice();
      return ALL.filter(function (item) {
        return item.groups.indexOf(filter) !== -1;
      });
    }

    function audioSrc(n) {
      return "audio/" + n + ".mp3";
    }

    function speakWord(word) {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(word);
        u.lang = "en-US";
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    var heardIds = {};
    function playSound(item) {
      try {
        heardIds[item.n] = true;
        var count = Object.keys(heardIds).length;
        if (window.LAStars && count >= 5) {
          var stars = count >= 20 ? 3 : count >= 10 ? 2 : 1;
          LAStars.recordPlay("topics-numbers-flashcards");
          LAStars.save("topics-numbers-flashcards", stars);
        }
      } catch (e) {}

      var card = $("flashcard");
      card.classList.add("is-playing");
      setTimeout(function () { card.classList.remove("is-playing"); }, 400);

      if (currentAudio) {
        try { currentAudio.pause(); } catch (e) {}
        currentAudio = null;
      }

      var key = String(item.n);
      var tryPlay = function (audio) {
        currentAudio = audio;
        var p = audio.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () { speakWord(item.word); });
        }
      };

      if (audioCache[key] === false) {
        speakWord(item.word);
        return;
      }

      if (audioCache[key] instanceof Audio) {
        audioCache[key].currentTime = 0;
        tryPlay(audioCache[key]);
        return;
      }

      var a = new Audio(audioSrc(item.n));
      a.addEventListener("canplaythrough", function onReady() {
        a.removeEventListener("canplaythrough", onReady);
        audioCache[key] = a;
        tryPlay(a);
      });
      a.addEventListener("error", function onErr() {
        a.removeEventListener("error", onErr);
        audioCache[key] = false;
        speakWord(item.word);
      });
      // kick load
      a.load();
      // also try play soon (some browsers)
      setTimeout(function () {
        if (audioCache[key] === false) return;
        if (a.readyState >= 2) tryPlay(a);
      }, 80);
    }

    function show(i) {
      if (!list.length) return;
      index = (i + list.length) % list.length;
      var item = list[index];
      $("flashNum").textContent = formatNum(item.n);
      $("flashWord").textContent = item.word;
      $("idxLabel").textContent = String(index + 1);
      $("totalLabel").textContent = String(list.length);
      document.querySelectorAll(".num-tile").forEach(function (btn) {
        btn.classList.toggle("active", Number(btn.getAttribute("data-n")) === item.n);
      });
    }

    function renderGrid() {
      var grid = $("numGrid");
      grid.innerHTML = "";
      list.forEach(function (item, i) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "num-tile";
        b.setAttribute("data-n", String(item.n));
        b.innerHTML = formatNum(item.n) + "<small>" + item.word + "</small>";
        b.addEventListener("click", function () {
          show(i);
          playSound(item);
        });
        grid.appendChild(b);
      });
    }

    function applyFilter(next) {
      filter = next;
      document.querySelectorAll(".filter-btn").forEach(function (btn) {
        btn.classList.toggle("active", btn.getAttribute("data-filter") === filter);
      });
      list = filtered();
      index = 0;
      renderGrid();
      show(0);
    }

    $("btnPlay").addEventListener("click", function () {
      playSound(list[index]);
    });
    $("btnPrev").addEventListener("click", function () {
      goPrev();
    });
    $("btnNext").addEventListener("click", function () {
      goNext();
    });
    document.querySelectorAll(".filter-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        applyFilter(btn.getAttribute("data-filter"));
      });
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { e.preventDefault(); goNext(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
      if (e.key === " " || e.key === "Enter") {
        if (e.target && (e.target.tagName === "BUTTON" || e.target.tagName === "A")) return;
        e.preventDefault();
        playSound(list[index]);
      }
    });

    function goNext() {
      show(index + 1);
      playSound(list[index]);
    }
    function goPrev() {
      show(index - 1);
      playSound(list[index]);
    }

    /* —— Touch Event Listeners (swipe + tap on flashcard) —— */
    (function setupTouchListeners() {
      var card = $("flashcard");
      if (!card) return;

      var startX = 0, startY = 0, dx = 0, dy = 0;
      var tracking = false;
      var touchId = null;
      var ignoreClick = false;
      var THRESHOLD = 50;
      var MAX_VERTICAL = 70;
      var TAP_SLOP = 14;

      function resetVisual() {
        card.classList.remove("is-swiping");
        card.style.transform = "";
        card.style.opacity = "";
      }

      function onStart(x, y, id) {
        tracking = true;
        touchId = id != null ? id : null;
        startX = x;
        startY = y;
        dx = 0;
        dy = 0;
        card.classList.add("is-swiping");
        card.classList.remove("swipe-in", "swipe-out-left", "swipe-out-right");
      }

      function onMove(x, y) {
        if (!tracking) return;
        dx = x - startX;
        dy = y - startY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) {
          var rot = dx * 0.05;
          card.style.transform = "translateX(" + dx + "px) rotate(" + rot + "deg)";
          card.style.opacity = String(Math.max(0.4, 1 - Math.abs(dx) / 260));
        }
      }

      function finishSwipe(dir) {
        tracking = false;
        ignoreClick = true;
        resetVisual();
        card.classList.add(dir === "left" ? "swipe-out-left" : "swipe-out-right");
        setTimeout(function () {
          card.classList.remove("swipe-out-left", "swipe-out-right");
          if (dir === "left") goNext();
          else goPrev();
          card.classList.add("swipe-in");
          setTimeout(function () {
            card.classList.remove("swipe-in");
            ignoreClick = false;
          }, 220);
        }, 150);
      }

      function onEnd() {
        if (!tracking) return;
        tracking = false;
        touchId = null;
        var absX = Math.abs(dx);
        var absY = Math.abs(dy);
        if (absX >= THRESHOLD && absX > absY && absY < MAX_VERTICAL) {
          finishSwipe(dx < 0 ? "left" : "right");
          return "swipe";
        }
        resetVisual();
        if (absX < TAP_SLOP && absY < TAP_SLOP) return "tap";
        return "cancel";
      }

      /* Primary: Touch Events (best for phones) */
      card.addEventListener("touchstart", function (e) {
        if (!e.changedTouches || !e.changedTouches[0]) return;
        var t = e.changedTouches[0];
        onStart(t.clientX, t.clientY, t.identifier);
      }, { passive: true });

      card.addEventListener("touchmove", function (e) {
        if (!tracking || !e.touches || !e.touches.length) return;
        var t = null;
        for (var i = 0; i < e.touches.length; i++) {
          if (touchId == null || e.touches[i].identifier === touchId) {
            t = e.touches[i];
            break;
          }
        }
        if (!t) t = e.touches[0];
        onMove(t.clientX, t.clientY);
        // Lock horizontal swipe — prevent page scroll
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
          e.preventDefault();
        }
      }, { passive: false });

      card.addEventListener("touchend", function (e) {
        if (!tracking) return;
        if (e.changedTouches && e.changedTouches[0] && touchId != null) {
          var match = false;
          for (var i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) { match = true; break; }
          }
          if (!match) return;
        }
        var result = onEnd();
        if (result === "tap") {
          playSound(list[index]);
        }
      }, { passive: true });

      card.addEventListener("touchcancel", function () {
        tracking = false;
        touchId = null;
        resetVisual();
      }, { passive: true });

      /* Desktop: mouse listeners */
      card.addEventListener("mousedown", function (e) {
        if (e.button !== 0) return;
        onStart(e.clientX, e.clientY, null);
      });
      window.addEventListener("mousemove", function (e) {
        if (!tracking || touchId != null) return; // only mouse path
        onMove(e.clientX, e.clientY);
      });
      window.addEventListener("mouseup", function () {
        if (!tracking || touchId != null) return;
        var result = onEnd();
        if (result === "tap") playSound(list[index]);
      });

      /* Click fallback (accessibility / older browsers) */
      card.addEventListener("click", function (e) {
        if (ignoreClick) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        // If a touch just handled tap, ignore synthetic click
        if (e.detail === 0) return;
      });
    })();

    applyFilter("easy");
  })();
  </script>
