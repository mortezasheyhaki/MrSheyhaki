<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Third Person Switch | Mr. Sheyhaki</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../../theme.css">
</head>
<body>
<main class="tps-page">
  <section class="tps-hero">
    <div class="tps-hero-top">
      <a class="tps-back" href="../" aria-label="Back">←</a>
      <span class="tps-eyebrow">GRAMMAR · SIMPLE PRESENT</span>
    </div>
    <h1>Third Person Switch</h1>
    <p>Choose the correct verb for <strong>he / she / it</strong>. Remember the <strong>-s</strong> ending!</p>
  </section>
  <section class="tps-panel" id="startPanel">
    <div class="tps-rules">
      <h2>Quick rules</h2>
      <ul>
        <li><b>I / you / we / they</b> → base verb</li>
        <li><b>he / she / it</b> → verb + <b>s</b></li>
        <li>go → goes · watch → watches · study → studies</li>
      </ul>
    </div>
    <button class="tps-start" id="startBtn">START GAME</button>
  </section>
  <section class="tps-panel tps-hidden" id="gamePanel">
    <div class="tps-progress"><span id="roundLabel">Round 1 / 12</span><span id="scoreLabel">Score 0</span></div>
    <div class="tps-prompt" id="prompt"></div>
    <div class="tps-options" id="options"></div>
    <div class="tps-feedback" id="feedback" aria-live="polite"></div>
  </section>
  <section class="tps-panel tps-hidden" id="endPanel">
    <div class="tps-end">
      <div class="tps-stars" id="endStars">★★★</div>
      <h2>Nice work!</h2>
      <p id="endText"></p>
      <button class="tps-start" id="replayBtn">PLAY AGAIN</button>
      <a class="tps-link" href="../">Back to Grammar</a>
    </div>
  </section>
</main>
<script src="../../la-stars.js"></script>
  <script src="script.js"></script>
<script src="../../../theme.js"></script>
</body>
</html>
