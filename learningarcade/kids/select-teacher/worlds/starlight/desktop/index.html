<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Starlight Forest · Ms. Moonlight | Mr. Sheyhaki</title>
  <meta name="description" content="Welcome to Ms. Moonlight's Starlight Forest. Choose what you want to do today.">
  <script>
  (function(){try{var t=localStorage.getItem("mrsheyhaki-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #3d2c29;
      --muted: #8a6e68;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      max-height: 100dvh;
      font-family: Nunito, system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
      background: #f0c4a0;
    }
    @media (prefers-reduced-motion: reduce) {
      .sparkle, .spark { animation: none !important; }
    }

    /* ===== FULL-BLEED COURTYARD ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #f0c4a0;
    }
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 30% center; /* keep school + path visible on left */
      display: block;
    }
    /* light readable wash only on the right where the panel sits */
    .bg-veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        95deg,
        rgba(255, 236, 220, 0.05) 0%,
        rgba(255, 236, 220, 0.02) 42%,
        rgba(255, 232, 214, 0.28) 72%,
        rgba(255, 228, 208, 0.48) 100%
      );
    }

    .fx {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px rgba(255, 220, 180, 0.9);
      opacity: 0;
      animation: sparkle 2.8s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    /* ===== PAGE ===== */
    .page {
      position: relative;
      z-index: 3;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.98);
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 2px 12px rgba(120,80,50,0.12);
      backdrop-filter: blur(8px);
      transition: transform 0.15s, background 0.15s, color 0.15s;
    }
    .back-btn:hover {
      background: #fff;
      transform: translateY(-1px);
      color: var(--text);
    }
    .world-badge {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #c2410c;
      background: rgba(255,255,255,0.92);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(251,146,60,0.35);
      box-shadow: 0 2px 12px rgba(120,80,50,0.1);
      backdrop-filter: blur(8px);
    }

    /* Stage: character grounded left, panel right-middle */
    .stage-wrap {
      flex: 1 1 auto;
      display: flex;
      align-items: flex-end; /* ground the scene */
      justify-content: center;
      padding: 0 20px 0;
      min-height: 0;
      overflow: hidden;
    }
    .stage {
      width: 100%;
      max-width: 1120px;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(380px, 480px);
      gap: 12px 20px;
      align-items: end; /* both columns bottom-aligned like the mock */
      padding-bottom: max(12px, 2vh);
    }

    .character-col {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 100%;
      min-height: 0;
    }
    .character-img {
      width: auto;
      height: min(82vh, 620px);
      max-width: min(100%, 480px);
      object-fit: contain;
      object-position: bottom center;
      /* soft shadow without expensive live filter when possible */
      filter: drop-shadow(0 16px 28px rgba(100, 60, 30, 0.32));
      user-select: none;
      pointer-events: none;
      display: block;
      content-visibility: auto;
      contain: layout paint;
      /* promote to own layer once for smooth paint */
      transform: translateZ(0);
      will-change: auto;
    }
    /* reduce shadow cost on weak GPUs */
    @media (max-width: 900px) {
      .character-img {
        filter: drop-shadow(0 8px 16px rgba(100, 60, 30, 0.25));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .character-img {
        will-change: auto;
        transform: none;
      }
    }

    .sparkle {
      position: absolute;
      font-size: 18px;
      opacity: 0.8;
      animation: bob 3.2s ease-in-out infinite;
      pointer-events: none;
      filter: drop-shadow(0 1px 2px rgba(255,255,255,0.8));
    }
    .sparkle.s1 { top: 18%; left: 10%; }
    .sparkle.s2 { top: 26%; right: 8%; animation-delay: 0.8s; font-size: 14px; }
    .sparkle.s3 { top: 12%; right: 20%; animation-delay: 1.4s; font-size: 16px; }
    .sparkle.s4 { bottom: 34%; left: 6%; animation-delay: 0.5s; font-size: 15px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }
      50% { transform: translateY(-10px) scale(1.15); opacity: 1; }
    }

    /* Panel sits mid-right, slightly above pure bottom so it matches mock */
    .panel-col {
      display: flex;
      align-items: center; /* vertically center panel next to character torso */
      justify-content: center;
      height: 100%;
      padding-bottom: 4vh;
    }
    .panel {
      width: 100%;
      min-width: min(100%, 380px);
      background: linear-gradient(165deg, rgba(255,253,249,0.97) 0%, rgba(255,246,236,0.97) 100%);
      border-radius: 28px;
      border: 3px solid rgba(255,255,255,0.98);
      box-shadow:
        0 4px 0 rgba(255, 200, 160, 0.35),
        0 20px 40px rgba(140, 90, 50, 0.2),
        inset 0 1px 0 #fff;
      padding: 28px 26px 20px;
      position: relative;
      backdrop-filter: blur(6px);
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 22px;
      border: 2px dashed rgba(251, 146, 60, 0.25);
      pointer-events: none;
    }
    .panel-head {
      text-align: center;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }
    .panel-head .hi {
      font-size: clamp(26px, 3.6vw, 34px);
      font-weight: 900;
      line-height: 1.15;
      color: #c2410c;
      letter-spacing: -0.3px;
    }
    .panel-head .hi span { color: #ea580c; }

    .deco {
      position: absolute;
      font-size: 18px;
      opacity: 0.9;
      pointer-events: none;
    }
    .deco.plane { top: 14px; left: 16px; transform: rotate(-18deg); }
    .deco.cloud { top: 12px; right: 16px; }
    .deco.star1 { top: 44px; right: 40px; font-size: 13px; }
    .deco.star2 { top: 40px; left: 46px; font-size: 12px; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .action {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 14px 11px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      box-shadow:
        0 4px 0 rgba(0,0,0,0.12),
        0 8px 18px rgba(0,0,0,0.1);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s;
      position: relative;
      overflow: hidden;
    }
    .action::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 55%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.15) 35%,
        rgba(255,255,255,0.65) 50%,
        rgba(255,255,255,0.15) 65%,
        transparent 100%
      );
      transform: skewX(-18deg);
      transition: left 0.55s ease;
      pointer-events: none;
      z-index: 2;
    }
    .action:hover::after { left: 120%; }
    .action .icon,
    .action .label,
    .action .chev { position: relative; z-index: 3; }
    .action:hover {
      transform: translateY(-3px);
      filter: brightness(1.05);
      box-shadow: 0 6px 0 rgba(0,0,0,0.1), 0 14px 24px rgba(0,0,0,0.14);
    }
    .action:active {
      transform: translateY(1px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.12);
    }
    .action .icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      font-size: 18px;
    }
    .action .label { flex: 1; text-align: left; }
    .action .chev { opacity: 0.85; font-size: 17px; font-weight: 900; }

    .action.play   { background: linear-gradient(135deg, #fb923c, #f97316); }
    .action.learn  { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .action.speak  { background: linear-gradient(135deg, #f9a8d4, #f472b6); }
    .action.write  { background: linear-gradient(135deg, #c4b5fd, #a78bfa); }
    .action.listen { background: linear-gradient(135deg, #5eead4, #2dd4bf); }
    .action.read   { background: linear-gradient(135deg, #86efac, #4ade80); color: #14532d; }
    .action.read .chev { color: #14532d; }
    .action.play .icon   { color: #ea580c; }
    .action.learn .icon  { color: #d97706; }
    .action.speak .icon  { color: #db2777; }
    .action.write .icon  { color: #7c3aed; }
    .action.listen .icon { color: #0d9488; }
    .action.read .icon   { color: #16a34a; }

    .footer-hint {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .site-theme-fab {
      position: fixed;
      right: max(14px, env(safe-area-inset-right, 0px));
      top: max(14px, env(safe-area-inset-top, 0px));
      z-index: 10050;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .site-theme-fab:hover { transform: translateY(-2px) scale(1.04); }
    html[data-theme="light"] .site-theme-fab {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(15, 23, 42, 0.1);
      color: #202636;
      box-shadow: 0 10px 28px rgba(32, 38, 54, 0.16);
    }

    /* Dark: courtyard still visible */
    html[data-theme="dark"] body { background: #2a1c16; color: #f5e6dc; }
    html[data-theme="dark"] .bg-veil {
      background: linear-gradient(
        95deg,
        rgba(20, 12, 10, 0.18) 0%,
        rgba(20, 12, 10, 0.1) 42%,
        rgba(30, 18, 14, 0.32) 72%,
        rgba(25, 15, 12, 0.42) 100%
      );
    }
    html[data-theme="dark"] .back-btn {
      background: rgba(40, 28, 22, 0.9);
      border-color: rgba(255,255,255,0.12);
      color: #e7cfc0;
    }
    html[data-theme="dark"] .back-btn:hover {
      background: rgba(50, 36, 28, 0.95);
      color: #fff;
    }
    html[data-theme="dark"] .world-badge {
      background: rgba(40, 28, 22, 0.9);
      border-color: rgba(251, 146, 60, 0.4);
      color: #fdba74;
    }
    html[data-theme="dark"] .panel {
      background: linear-gradient(165deg, rgba(45, 32, 26, 0.95) 0%, rgba(55, 38, 30, 0.95) 100%);
      border-color: rgba(255, 200, 160, 0.22);
      box-shadow:
        0 4px 0 rgba(0, 0, 0, 0.35),
        0 22px 44px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }
    html[data-theme="dark"] .panel::before { border-color: rgba(251, 146, 60, 0.2); }
    html[data-theme="dark"] .panel-head .hi { color: #fdba74; }
    html[data-theme="dark"] .panel-head .hi span { color: #fb923c; }
    html[data-theme="dark"] .footer-hint { color: #c4a99a; }

    @media (max-width: 900px) {
      .stage {
        grid-template-columns: 1fr;
        align-items: center;
        max-width: 440px;
        padding-bottom: 10px;
      }
      .stage-wrap { align-items: center; }
      .character-col {
        height: auto;
        max-height: 34vh;
      }
      .character-img {
        height: min(32vh, 260px);
        max-width: 220px;
      }
      .panel-col {
        height: auto;
        padding-bottom: 0;
        align-items: flex-start;
      }
    }
    @media (max-width: 420px) {
      .actions { gap: 8px; }
      .action { font-size: 14px; padding: 10px 10px 10px 8px; }
      .action .icon { width: 32px; height: 32px; font-size: 15px; }
      .panel { padding: 16px 12px 12px; }
    }
  
    .profile-fab, a.profile-fab {
      display: none !important;
    }

  
    /* ========== PHONE LAYOUT (portrait composition) ========== */
    @media (max-width: 900px) {
      .stage {
        grid-template-columns: 1fr !important;
        max-width: 100% !important;
        height: 100% !important;
        display: block !important;
        position: relative !important;
        padding-bottom: 0 !important;
      }
      .stage-wrap {
        align-items: stretch !important;
        padding: 0 8px 8px !important;
      }
      .character-col {
        position: absolute !important;
        left: 0 !important;
        bottom: 0 !important;
        top: 6% !important;
        width: 58% !important;
        max-width: 260px !important;
        height: auto !important;
        max-height: none !important;
        justify-content: flex-start !important;
        align-items: flex-end !important;
        pointer-events: none !important;
        z-index: 4 !important;
      }
      .character-img {
        height: min(72vh, 520px) !important;
        max-height: min(72vh, 520px) !important;
        max-width: 100% !important;
        width: auto !important;
        object-position: left bottom !important;
      }
      .panel-col {
        position: absolute !important;
        right: 10px !important;
        left: auto !important;
        top: 50% !important;
        transform: translateY(-48%) !important;
        width: min(52%, 210px) !important;
        height: auto !important;
        padding-bottom: 0 !important;
        align-items: center !important;
        z-index: 6 !important;
      }
      .panel {
        padding: 14px 12px 10px !important;
        border-radius: 20px !important;
      }
      .panel-head .hi {
        font-size: clamp(15px, 4.2vw, 18px) !important;
      }
      .actions { gap: 8px !important; }
      .action {
        font-size: 12.5px !important;
        padding: 9px 8px 9px 6px !important;
        min-height: 42px !important;
      }
      .action .icon {
        width: 28px !important;
        height: 28px !important;
        font-size: 13px !important;
      }
      .footer-hint { font-size: 10px !important; margin-top: 8px !important; }
      .bg-veil {
        background: linear-gradient(
          100deg,
          rgba(255, 240, 220, 0.05) 0%,
          rgba(255, 236, 218, 0.12) 38%,
          rgba(255, 232, 214, 0.55) 68%,
          rgba(255, 228, 208, 0.78) 100%
        ) !important;
      }
      html[data-theme="dark"] .bg-veil {
        background: linear-gradient(
          100deg,
          rgba(20, 12, 10, 0.2) 0%,
          rgba(20, 12, 10, 0.15) 38%,
          rgba(30, 18, 14, 0.45) 68%,
          rgba(25, 15, 12, 0.55) 100%
        ) !important;
      }
    }
    @media (max-width: 900px) and (max-height: 680px) {
      .character-img { max-height: min(65vh, 420px) !important; height: min(65vh, 420px) !important; }
      .panel { padding: 12px 10px 8px !important; }
      .action { min-height: 38px !important; font-size: 12px !important; padding: 8px 7px 8px 5px !important; }
      .action .icon { width: 26px !important; height: 26px !important; font-size: 12px !important; }
    }

  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <img
      class="bg-img"
      src="./assets/bg-courtyard.jpg"
      alt=""
      width="1920"
      height="1080"
      decoding="async"
      fetchpriority="high"
    >
  </div>
  <div class="bg-veil" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>

  <div class="page">
    <div class="top-bar">
      <a class="back-btn" href="../../">← Teachers</a>
      <div class="world-badge">✦ Starlight Forest</div>
    </div>

    <div class="stage-wrap">
      <main class="stage">
        <div class="character-col">
          <span class="sparkle s1">♡</span>
          <span class="sparkle s2">✦</span>
          <span class="sparkle s3">✧</span>
          <span class="sparkle s4">♡</span>
          <picture>
            <source
              type="image/webp"
              srcset="./assets/ms-moonlight-480.webp 480w,
                      ./assets/ms-moonlight-full.webp 560w,
                      ./assets/ms-moonlight-720.webp 720w"
              sizes="(max-width: 900px) 220px, min(480px, 42vw)"
            >
            <img
              class="character-img"
              src="./assets/ms-moonlight-480.png"
              srcset="./assets/ms-moonlight-480.png 480w,
                      ./assets/ms-moonlight-full.png 720w"
              sizes="(max-width: 900px) 220px, min(480px, 42vw)"
              alt="Ms. Moonlight waving hello"
              width="720"
              height="1057"
              decoding="async"
              fetchpriority="high"
              loading="eager"
            >
          </picture>
        </div>

        <div class="panel-col">
          <section class="panel" aria-label="Today's activities">
            <span class="deco plane" aria-hidden="true">✈️</span>
            <span class="deco cloud" aria-hidden="true">☁️</span>
            <span class="deco star1" aria-hidden="true">✨</span>
            <span class="deco star2" aria-hidden="true">⭐</span>

            <div class="panel-head">
              <h1 class="hi">Hey!<br><span>What are we<br>doing today?</span></h1>
            </div>

            <div class="actions">
              <a class="action play" href="./play/">
                <span class="icon">▶</span>
                <span class="label">Play</span>
                <span class="chev">›</span>
              </a>
              <a class="action learn" href="./learn/">
                <span class="icon">🎓</span>
                <span class="label">Learn</span>
                <span class="chev">›</span>
              </a>
              <a class="action speak" href="./speak/">
                <span class="icon">🎤</span>
                <span class="label">Speak</span>
                <span class="chev">›</span>
              </a>
              <a class="action write" href="./write/">
                <span class="icon">✏️</span>
                <span class="label">Write</span>
                <span class="chev">›</span>
              </a>
              <a class="action listen" href="./listen/">
                <span class="icon">🎧</span>
                <span class="label">Listen</span>
                <span class="chev">›</span>
              </a>
              <a class="action read" href="./read/">
                <span class="icon">📖</span>
                <span class="label">Read</span>
                <span class="chev">›</span>
              </a>
            </div>

            <p class="footer-hint">Pick one and let’s start learning with a smile 🌸</p>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script>
    try {
      localStorage.setItem('selectedTeacher', 'moonlight');
      localStorage.setItem('selectedWorld', 'starlight');
    } catch (e) {}
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const fx = document.getElementById('fx');
      if (!fx) return;
      for (let i = 0; i < 10; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = (55 + Math.random() * 42) + '%';
        s.style.top = (10 + Math.random() * 75) + '%';
        s.style.animationDuration = (2 + Math.random() * 3) + 's';
        s.style.animationDelay = (Math.random() * 4) + 's';
        fx.appendChild(s);
      }
    })();
  </script>
  <script src="../theme.js"></script>
  <button type="button" class="site-theme-fab" aria-label="Toggle dark / light mode" title="Dark mode">🌙</button>
</body>
</html>
