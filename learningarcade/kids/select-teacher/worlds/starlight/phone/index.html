<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function(){try{var t=localStorage.getItem("mrsheyhaki-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Starlight Forest · Ms. Moonlight | Phone</title>
  <meta name="description" content="Welcome to Ms. Moonlight's Starlight Forest. Choose what you want to do today.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #3d2c29;
      --muted: #8a6e68;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      max-height: 100dvh;
      font-family: Nunito, system-ui, sans-serif;
      color: var(--text);
      overflow: hidden;
      background: #f5d9b8;
      -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-reduced-motion: reduce) {
      .sparkle, .spark, .action::after { animation: none !important; transition: none !important; }
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(160deg, #f8e4c8 0%, #f0d0a8 45%, #e8c49a 100%);
    }
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 20% center;
      display: block;
      opacity: 0.92;
    }
    .bg-veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        100deg,
        rgba(255, 240, 220, 0.05) 0%,
        rgba(255, 236, 218, 0.12) 38%,
        rgba(255, 232, 214, 0.55) 68%,
        rgba(255, 228, 208, 0.78) 100%
      );
    }

    .fx {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .spark {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px 2px rgba(255, 220, 180, 0.9);
      opacity: 0;
      animation: sparkle 2.8s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50% { opacity: 0.85; transform: scale(1.15); }
    }

    .page {
      position: relative;
      z-index: 3;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .top-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 4px;
      gap: 8px;
      position: relative;
      z-index: 10;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(255,255,255,0.98);
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 0 2px 10px rgba(120,80,50,0.12);
      backdrop-filter: blur(8px);
    }
    .world-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.55px;
      text-transform: uppercase;
      color: #c2410c;
      background: rgba(255,255,255,0.94);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(251,146,60,0.35);
      box-shadow: 0 2px 10px rgba(120,80,50,0.1);
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .stage-wrap {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    /* Character LEFT — large portrait like reference */
    .character-col {
      position: absolute;
      left: 0;
      bottom: 0;
      top: 8%;
      width: 58%;
      max-width: 260px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      z-index: 4;
      pointer-events: none;
    }
    .character-img {
      width: auto;
      height: 100%;
      max-height: min(72vh, 520px);
      max-width: 100%;
      object-fit: contain;
      object-position: left bottom;
      filter: drop-shadow(0 10px 20px rgba(100, 60, 30, 0.28));
      user-select: none;
      display: block;
    }

    .sparkle {
      position: absolute;
      font-size: 14px;
      opacity: 0.7;
      animation: bob 3.2s ease-in-out infinite;
      pointer-events: none;
      z-index: 5;
    }
    .sparkle.s1 { top: 18%; left: 12%; }
    .sparkle.s2 { top: 28%; left: 42%; animation-delay: 0.8s; font-size: 12px; }
    .sparkle.s3 { top: 12%; left: 38%; animation-delay: 1.4s; font-size: 13px; }
    .sparkle.s4 { bottom: 36%; left: 8%; animation-delay: 0.5s; font-size: 12px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.45; }
      50% { transform: translateY(-8px) scale(1.12); opacity: 1; }
    }

    /* Panel RIGHT over soft open space */
    .panel-col {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-48%);
      width: min(52%, 210px);
      z-index: 6;
    }
    .panel {
      width: 100%;
      background: linear-gradient(165deg, rgba(255,253,249,0.98) 0%, rgba(255,246,236,0.98) 100%);
      border-radius: 20px;
      border: 2.5px solid rgba(255,255,255,0.98);
      box-shadow:
        0 3px 0 rgba(255, 200, 160, 0.35),
        0 14px 28px rgba(140, 90, 50, 0.2),
        inset 0 1px 0 #fff;
      padding: 14px 12px 10px;
      position: relative;
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 15px;
      border: 1.5px dashed rgba(251, 146, 60, 0.22);
      pointer-events: none;
    }
    .panel-head {
      text-align: center;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    .panel-head .hi {
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 900;
      line-height: 1.18;
      color: #c2410c;
      letter-spacing: -0.25px;
    }
    .panel-head .hi span { color: #ea580c; }

    .deco {
      position: absolute;
      font-size: 13px;
      opacity: 0.85;
      pointer-events: none;
      z-index: 0;
    }
    .deco.plane { top: 8px; left: 8px; transform: rotate(-18deg); font-size: 12px; }
    .deco.cloud { top: 8px; right: 10px; font-size: 12px; }
    .deco.star1 { top: 22px; right: 26px; font-size: 10px; }
    .deco.star2 { top: 24px; left: 28px; font-size: 9px; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      position: relative;
      z-index: 1;
    }
    .action {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 8px 9px 6px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-weight: 800;
      font-size: 12.5px;
      box-shadow:
        0 3px 0 rgba(0,0,0,0.12),
        0 6px 12px rgba(0,0,0,0.1);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s;
      position: relative;
      overflow: hidden;
      min-height: 42px;
    }
    .action::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 55%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.15) 35%,
        rgba(255,255,255,0.7) 50%,
        rgba(255,255,255,0.15) 65%,
        transparent 100%
      );
      transform: skewX(-18deg);
      transition: left 0.55s ease;
      pointer-events: none;
      z-index: 2;
    }
    .action:hover::after,
    .action:active::after { left: 120%; }
    .action .icon,
    .action .label,
    .action .chev { position: relative; z-index: 3; }
    .action:hover {
      transform: translateY(-2px) scale(1.03);
      filter: brightness(1.06);
      box-shadow:
        0 5px 0 rgba(0,0,0,0.1),
        0 10px 18px rgba(0,0,0,0.16),
        0 0 16px rgba(255,255,255,0.4);
    }
    .action:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 0 rgba(0,0,0,0.12);
    }
    .action .icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.96);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      font-size: 13px;
    }
    .action .label { flex: 1; text-align: left; line-height: 1.1; }
    .action .chev { opacity: 0.85; font-size: 14px; font-weight: 900; }

    .action.play   { background: linear-gradient(135deg, #fb923c, #f97316); }
    .action.learn  { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .action.speak  { background: linear-gradient(135deg, #f9a8d4, #f472b6); }
    .action.write  { background: linear-gradient(135deg, #c4b5fd, #a78bfa); }
    .action.listen { background: linear-gradient(135deg, #5eead4, #2dd4bf); }
    .action.read   { background: linear-gradient(135deg, #86efac, #4ade80); color: #14532d; }
    .action.read .chev { color: #14532d; }
    .action.play .icon   { color: #ea580c; }
    .action.learn .icon  { color: #d97706; }
    .action.speak .icon  { color: #db2777; }
    .action.write .icon  { color: #7c3aed; }
    .action.listen .icon { color: #0d9488; }
    .action.read .icon   { color: #16a34a; }

    .footer-hint {
      text-align: center;
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      position: relative;
      z-index: 1;
      line-height: 1.3;
    }

    @media (min-width: 400px) {
      .character-col { width: 55%; max-width: 280px; }
      .panel-col { width: min(48%, 230px); right: 14px; }
      .panel-head .hi { font-size: 17px; }
      .action { font-size: 13px; min-height: 44px; }
      .action .icon { width: 30px; height: 30px; }
    }
    @media (max-height: 680px) {
      .character-col { top: 6%; }
      .character-img { max-height: min(65vh, 420px); }
      .panel { padding: 12px 10px 8px; }
      .panel-head { margin-bottom: 8px; }
      .action { padding: 8px 7px 8px 5px; min-height: 38px; font-size: 12px; }
      .action .icon { width: 26px; height: 26px; font-size: 12px; }
      .actions { gap: 6px; }
      .footer-hint { font-size: 9px; margin-top: 6px; }
    }
    @media (max-width: 340px) {
      .panel-col { width: 54%; right: 6px; }
      .character-col { width: 55%; }
      .action { font-size: 11px; }
    }
  
    .site-theme-fab {
      position: fixed;
      right: max(12px, env(safe-area-inset-right, 0px));
      top: max(12px, env(safe-area-inset-top, 0px));
      z-index: 10050;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .site-theme-fab:hover { transform: translateY(-2px) scale(1.04); }
    html[data-theme="light"] .site-theme-fab {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(15, 23, 42, 0.1);
      color: #202636;
      box-shadow: 0 10px 28px rgba(32, 38, 54, 0.16);
    }
    html[data-theme="dark"] body { background: #2a1c16; color: #f5e6dc; }
    html[data-theme="dark"] .bg-veil {
      background: linear-gradient(
        100deg,
        rgba(20, 12, 10, 0.2) 0%,
        rgba(20, 12, 10, 0.15) 38%,
        rgba(30, 18, 14, 0.45) 68%,
        rgba(25, 15, 12, 0.55) 100%
      ) !important;
    }
    html[data-theme="dark"] .back-btn {
      background: rgba(40, 28, 22, 0.9);
      border-color: rgba(255,255,255,0.12);
      color: #e7cfc0;
    }
    html[data-theme="dark"] .world-badge {
      background: rgba(40, 28, 22, 0.9);
      border-color: rgba(251, 146, 60, 0.4);
      color: #fdba74;
    }
    html[data-theme="dark"] .panel {
      background: linear-gradient(165deg, rgba(45, 32, 26, 0.95) 0%, rgba(55, 38, 30, 0.95) 100%);
      border-color: rgba(255, 200, 160, 0.22);
      box-shadow:
        0 3px 0 rgba(0, 0, 0, 0.35),
        0 14px 28px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }
    html[data-theme="dark"] .panel::before { border-color: rgba(251, 146, 60, 0.2); }
    html[data-theme="dark"] .panel-head .hi { color: #fdba74; }
    html[data-theme="dark"] .panel-head .hi span { color: #fb923c; }
    html[data-theme="dark"] .footer-hint { color: #c4a99a; }

  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <img
      class="bg-img"
      src="./assets/bg-courtyard.jpg"
      alt=""
      width="1920"
      height="1080"
      decoding="async"
      fetchpriority="high"
    >
  </div>
  <div class="bg-veil" aria-hidden="true"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>

  <div class="page">
    <div class="top-bar">
      <a class="back-btn" href="../../">← Teachers</a>
      <div class="world-badge">✦ Starlight Forest</div>
    </div>

    <div class="stage-wrap">
      <div class="character-col">
        <span class="sparkle s1">♡</span>
        <span class="sparkle s2">✦</span>
        <span class="sparkle s3">✧</span>
        <span class="sparkle s4">♡</span>
        <picture>
          <source
            type="image/webp"
            srcset="./assets/ms-moonlight-480.webp 480w,
                    ./assets/ms-moonlight-full.webp 560w"
            sizes="240px"
          >
          <img
            class="character-img"
            src="./assets/ms-moonlight-480.png"
            alt="Ms. Moonlight waving hello"
            width="480"
            height="704"
            decoding="async"
            fetchpriority="high"
            loading="eager"
          >
        </picture>
      </div>

      <div class="panel-col">
        <section class="panel" aria-label="Today's activities">
          <span class="deco plane" aria-hidden="true">✈️</span>
          <span class="deco cloud" aria-hidden="true">☁️</span>
          <span class="deco star1" aria-hidden="true">✨</span>
          <span class="deco star2" aria-hidden="true">⭐</span>

          <div class="panel-head">
            <h1 class="hi">Hey!<br><span>What are we<br>doing today?</span></h1>
          </div>

          <div class="actions">
            <a class="action play" href="./play/">
              <span class="icon">▶</span>
              <span class="label">Play</span>
              <span class="chev">›</span>
            </a>
            <a class="action learn" href="./learn/">
              <span class="icon">🎓</span>
              <span class="label">Learn</span>
              <span class="chev">›</span>
            </a>
            <a class="action speak" href="./speak/">
              <span class="icon">🎤</span>
              <span class="label">Speak</span>
              <span class="chev">›</span>
            </a>
            <a class="action write" href="./write/">
              <span class="icon">✏️</span>
              <span class="label">Write</span>
              <span class="chev">›</span>
            </a>
            <a class="action listen" href="./listen/">
              <span class="icon">🎧</span>
              <span class="label">Listen</span>
              <span class="chev">›</span>
            </a>
            <a class="action read" href="./read/">
              <span class="icon">📖</span>
              <span class="label">Read</span>
              <span class="chev">›</span>
            </a>
          </div>

          <p class="footer-hint">Pick one and let’s start learning with a smile 🌸</p>
        </section>
      </div>
    </div>
  </div>

  <script>
    try {
      localStorage.setItem('selectedTeacher', 'moonlight');
      localStorage.setItem('selectedWorld', 'starlight');
    } catch (e) {}
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const fx = document.getElementById('fx');
      if (!fx) return;
      for (let i = 0; i < 8; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = (45 + Math.random() * 50) + '%';
        s.style.top = (12 + Math.random() * 70) + '%';
        s.style.animationDuration = (2 + Math.random() * 3) + 's';
        s.style.animationDelay = (Math.random() * 4) + 's';
        fx.appendChild(s);
      }
    })();
  </script>
  <button type="button" class="site-theme-fab" aria-label="Toggle dark / light mode">🌙</button>
  <script src="../theme.js"></script>
</body>
</html>
