<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function(){try{var t=localStorage.getItem("mrsheyhaki-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Play · Starlight Forest | Mr. Sheyhaki</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --text: #3d2c29; --muted: #8a6e68; --bg1: #ffe8d6; --bg2: #fff0e4; --card: #fffaf5; }
    html[data-theme="dark"] {
      --text: #f5e6dc;
      --muted: #c4a99a;
      --bg1: #2a1c16;
      --bg2: #3a2820;
      --card: #3d2a22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: Nunito, system-ui, sans-serif;
      background: linear-gradient(165deg, var(--bg1), var(--bg2));
      color: var(--text); text-align: center; padding: 24px;
      transition: background 0.25s ease, color 0.25s ease;
    }
    a { color: #ea580c; font-weight: 800; text-decoration: none; }
    html[data-theme="dark"] a { color: #fb923c; }
    .card {
      background: var(--card); border-radius: 24px; padding: 36px 28px;
      box-shadow: 0 12px 32px rgba(180,110,70,0.15);
      max-width: 360px; width: 100%;
      border: 2px solid rgba(255,255,255,0.5);
    }
    html[data-theme="dark"] .card {
      border-color: rgba(255,200,160,0.15);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: var(--muted); margin: 0 0 20px; }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px; border-radius: 999px;
      background: linear-gradient(135deg, #fb923c, #f97316);
      color: #fff !important; font-weight: 800; font-size: 14px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.1);
      transition: transform 0.15s ease;
    }
    .back:hover { transform: translateY(-2px); }

    .site-theme-fab {
      position: fixed;
      right: max(14px, env(safe-area-inset-right, 0px));
      top: max(14px, env(safe-area-inset-top, 0px));
      z-index: 10050;
      width: 48px; height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      color: #fff; font-size: 22px; line-height: 1;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .site-theme-fab:hover { transform: translateY(-2px) scale(1.04); }
    html[data-theme="light"] .site-theme-fab {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(15, 23, 42, 0.1);
      color: #202636;
      box-shadow: 0 10px 28px rgba(32, 38, 54, 0.16);
    }
    .profile-fab, a.profile-fab { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Play</h1>
    <p>Ms. Moonlight is preparing this activity. Coming soon!</p>
    <a class="back" href="../">← Back to Starlight Forest</a>
  </div>
  <button type="button" class="site-theme-fab" aria-label="Toggle dark / light mode">🌙</button>
  <script src="../theme.js"></script>
</body>
</html>
