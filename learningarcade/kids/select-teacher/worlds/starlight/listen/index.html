<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.setAttribute("data-theme","light");}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen · Starlight Forest | Mr. Sheyhaki</title>
  <style>
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: Nunito, system-ui, sans-serif;
      background: linear-gradient(165deg, #ffe8d6, #fff0e4);
      color: #3d2c29; text-align: center; padding: 24px;
    }
    a { color: #ea580c; font-weight: 800; text-decoration: none; }
    .card {
      background: #fffaf5; border-radius: 24px; padding: 36px 28px;
      box-shadow: 0 12px 32px rgba(180,110,70,0.15);
      max-width: 360px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #8a6e68; margin: 0 0 20px; }
  
    /* Site theme FAB (matches main arcade) */
    .site-theme-fab {
      position: fixed;
      right: max(14px, env(safe-area-inset-right, 0px));
      top: max(14px, env(safe-area-inset-top, 0px));
      z-index: 10050;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .site-theme-fab:hover { transform: translateY(-2px) scale(1.04); }
    html[data-theme="light"] .site-theme-fab {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(15, 23, 42, 0.1);
      color: #202636;
      box-shadow: 0 10px 28px rgba(32, 38, 54, 0.16);
    }


    /* Hide profile FAB injected by theme.js on kids world pages */
    .profile-fab,
    a.profile-fab,
    .nav-profile:not(.arcade-nav .nav-profile) {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

</style>
</head>
<body>
  <div class="card">
    <h1>Listen</h1>
    <p>Ms. Moonlight is preparing this activity. Coming soon!</p>
    <a href="../">← Back to Starlight Forest</a>
  </div>
<script src="../../../../../theme.js"></script>
</body>
</html>
