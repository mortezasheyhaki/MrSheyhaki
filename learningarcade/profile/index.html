<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#6937d8" />
  <title>My Profile | Learning Arcade</title>
  <meta name="description" content="Your Learning Arcade profile and achievements." />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../theme.css" />
  <style>
    :root {
      --pf-bg: #eef0ff;
      --pf-bg-deep: #e4e7ff;
      --pf-card: #ffffff;
      --pf-purple: #6937d8;
      --pf-purple-deep: #5425b8;
      --pf-purple-soft: #f3efff;
      --pf-text: #1a1530;
      --pf-muted: #6b728e;
      --pf-star: #f5b942;
      --pf-hot: #ff8a3d;
      --pf-radius: 20px;
      --pf-shadow: 0 16px 48px rgba(80, 60, 160, 0.12), 0 0 0 1px rgba(105, 55, 216, 0.06);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--pf-bg);
    }

    body.profile-app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      padding:
        max(10px, var(--safe-t))
        max(14px, var(--safe-r))
        max(10px, var(--safe-b))
        max(14px, var(--safe-l));
      box-sizing: border-box;
      background-color: var(--pf-bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(105, 55, 216, 0.18), transparent 55%),
        radial-gradient(ellipse 40% 30% at 100% 100%, rgba(167, 139, 250, 0.12), transparent 50%),
        linear-gradient(rgba(105, 55, 216, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(105, 55, 216, 0.04) 1px, transparent 1px);
      background-size: auto, auto, 28px 28px, 28px 28px;
    }

    body.profile-app .arcade-header-bar,
    body.profile-app .site-footer,
    body.profile-app .profile-fab { display: none !important; }

    .pf-shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      gap: 12px;
    }

    /* —— Header —— */
    .pf-top {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 2px;
    }
    .pf-back {
      width: 42px; height: 42px;
      border-radius: 14px;
      border: 0;
      background: #fff;
      color: var(--pf-purple);
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      display: grid; place-items: center;
      text-decoration: none;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(105, 55, 216, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .pf-back:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(105, 55, 216, 0.18); }
    .pf-title-wrap { flex: 1; min-width: 0; }
    .pf-title-wrap h1 {
      margin: 0;
      font-size: clamp(1.15rem, 3.5vw, 1.45rem);
      font-weight: 900;
      color: var(--pf-text);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .pf-title-wrap p {
      margin: 3px 0 0;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--pf-muted);
    }
    .pf-name-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 999px;
      padding: 5px 6px 5px 14px;
      max-width: 46%;
      box-shadow: 0 4px 16px rgba(105, 55, 216, 0.1);
      border: 1px solid rgba(105, 55, 216, 0.08);
    }
    .pf-name-chip input {
      border: 0;
      background: transparent;
      color: var(--pf-text);
      font-weight: 800;
      font-size: 0.88rem;
      width: 100px;
      min-width: 0;
      outline: none;
    }
    .pf-name-chip input::placeholder { color: #b0b5c8; }
    .pf-name-chip input:read-only { cursor: default; }
    .pf-name-chip button {
      border: 0;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(145deg, #7c4dff, var(--pf-purple));
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--pf-purple-deep);
      flex-shrink: 0;
      transition: transform 0.12s ease;
    }
    .pf-name-chip button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--pf-purple-deep); }

    /* —— Tabs —— */
    .pf-tabs {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 5px;
      border: 1px solid rgba(105, 55, 216, 0.08);
      box-shadow: 0 4px 20px rgba(80, 60, 160, 0.06);
    }
    .pf-tab {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 11px 10px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      background: transparent;
      color: var(--pf-muted);
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
    }
    .pf-tab:hover { color: var(--pf-purple); }
    .pf-tab.is-on {
      background: #fff;
      color: var(--pf-purple);
      box-shadow: 0 4px 14px rgba(105, 55, 216, 0.15), 0 0 0 1px rgba(105, 55, 216, 0.06);
    }

    /* —— Main panel —— */
    .pf-panel {
      flex: 1;
      min-height: 0;
      background: var(--pf-card);
      border-radius: 24px;
      box-shadow: var(--pf-shadow);
      display: none;
      flex-direction: column;
      overflow: hidden;
      padding: 16px 16px 14px;
    }
    .pf-panel.is-on { display: flex; }

    .pf-panel-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    .pf-panel-head h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--pf-text);
      letter-spacing: -0.02em;
    }
    .pf-count {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--pf-purple);
      background: var(--pf-purple-soft);
      padding: 5px 12px;
      border-radius: 999px;
    }

    /* —— Achievements —— */
    .ach-viewport {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      touch-action: pan-y;
      border-radius: 16px;
    }
    .ach-track {
      display: flex;
      height: 100%;
      transition: transform 0.32s cubic-bezier(.22,.9,.3,1);
      will-change: transform;
    }
    .ach-page {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: auto;
      gap: 10px;
      padding: 2px;
      box-sizing: border-box;
      align-content: start;
    }

    .ach-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 8px;
      border-radius: 16px;
      background: linear-gradient(165deg, #ffffff 0%, #f7f4ff 100%);
      border: 1.5px solid #ebe4ff;
      box-shadow: 0 2px 0 rgba(105,55,216,.05), 0 6px 16px rgba(32,38,54,.04);
      text-decoration: none;
      color: inherit;
      text-align: center;
      aspect-ratio: 1 / 1;
      width: 100%;
      min-height: 0;
      height: auto;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }
    .ach-tile.is-hot {
      border-color: #ffc08a;
      background: linear-gradient(165deg, #fff9f3 0%, #fff0e4 100%);
      box-shadow: 0 2px 0 rgba(255,138,61,.12), 0 8px 20px rgba(255,138,61,.1);
    }
    a.ach-tile:hover {
      transform: translateY(-3px);
      border-color: #c4b5fd;
      box-shadow: 0 8px 22px rgba(105, 55, 216, 0.14);
    }
    a.ach-tile:active { transform: translateY(0) scale(0.98); }
    .ach-tile-title {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--pf-text);
      line-height: 1.25;
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ach-plays {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--pf-muted);
    }
    .ach-plays.is-hot { color: var(--pf-hot); font-weight: 800; }

    /* Stars */
    .ach-tile .game-stars {
      display: flex;
      gap: 3px;
      justify-content: center;
      align-items: center;
      line-height: 1;
    }
    .ach-tile .game-stars .star {
      font-size: 0.95rem;
      color: #ddd6fe;
      position: relative;
      display: inline-block;
    }
    .ach-tile .game-stars .star.is-filled {
      color: var(--pf-star);
      text-shadow: 0 1px 0 rgba(180, 120, 20, 0.25);
    }
    .ach-tile .game-stars .star.on-fire {
      color: #ff8a3d;
      filter: drop-shadow(0 0 4px rgba(255, 120, 40, 0.55));
      animation: ach-star-pulse 1.2s ease-in-out infinite alternate;
    }
    .ach-tile .game-stars .star.on-fire::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,140,50,0.35), transparent 70%);
      pointer-events: none;
    }
    @keyframes ach-star-pulse {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }
    .ach-tile .game-stars .star .la-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .ach-tile .game-stars .star .la-particle--fire,
    .ach-tile .game-stars .star .la-particle--smoke {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      opacity: 0.7;
    }
    .ach-tile .game-stars .star .la-particle--fire { background: #ff8a3d; }
    .ach-tile .game-stars .star .la-particle--smoke { background: #94a3b8; }

    .ach-empty {
      grid-column: 1 / -1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 20px;
      color: var(--pf-muted);
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .ach-nav {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      padding-top: 4px;
    }
    .ach-arrow {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 0;
      background: var(--pf-purple-soft);
      color: var(--pf-purple);
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.15s ease, transform 0.12s ease;
    }
    .ach-arrow:hover { background: #e8e0ff; }
    .ach-arrow:active { transform: scale(0.94); }
    .ach-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .ach-dot {
      width: 8px; height: 8px;
      border-radius: 999px;
      border: 0;
      padding: 0;
      background: #d4cce8;
      cursor: pointer;
      transition: width 0.2s ease, background 0.2s ease;
    }
    .ach-dot.is-on {
      width: 22px;
      background: var(--pf-purple);
    }

    .pf-hint {
      flex: 0 0 auto;
      margin: 0;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--pf-muted);
      opacity: 0.85;
    }

    /* —— Scores —— */
    .scores-status {
      margin: 0 0 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--pf-muted);
    }
    .scores-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .score-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: linear-gradient(165deg, #faf9ff, #f3efff);
      border: 1px solid #ebe4ff;
      text-decoration: none;
      color: inherit;
    }
    .score-row strong { display: block; font-size: 0.9rem; color: var(--pf-text); }
    .score-row small { color: var(--pf-muted); font-weight: 600; font-size: 0.72rem; }
    .score-row .score-val {
      font-weight: 900;
      font-size: 1rem;
      color: var(--pf-purple);
      align-self: center;
    }

    /* —— Leaderboard —— */
    .lb-filters {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .lb-filters::-webkit-scrollbar { display: none; }
    .lb-chip {
      flex-shrink: 0;
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 0.75rem;
      font-weight: 800;
      background: var(--pf-purple-soft);
      color: var(--pf-purple);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lb-chip.is-on {
      background: var(--pf-purple);
      color: #fff;
      box-shadow: 0 3px 0 var(--pf-purple-deep);
    }
    .lb-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .lb-podium {
      display: grid;
      grid-template-columns: 1fr 1.15fr 1fr;
      gap: 8px;
      align-items: end;
      margin-bottom: 14px;
      padding: 4px 0 8px;
    }
    .lb-pod {
      text-align: center;
      padding: 12px 8px 14px;
      border-radius: 16px;
      background: linear-gradient(180deg, #faf9ff, #f0ebff);
      border: 1.5px solid #e4dcff;
    }
    .lb-pod.is-first {
      background: linear-gradient(180deg, #fff9e8, #fff3d0);
      border-color: #f5d78e;
      padding-top: 18px;
      padding-bottom: 18px;
    }
    .lb-pod-rank { font-size: 1.25rem; margin-bottom: 4px; }
    .lb-pod-name {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--pf-text);
      word-break: break-word;
    }
    .lb-pod-score {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--pf-purple);
      margin-top: 4px;
    }
    .lb-list { display: flex; flex-direction: column; gap: 6px; }
    .lb-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: #faf9ff;
      border: 1px solid #efeaff;
    }
    .lb-row.is-me {
      background: #f3efff;
      border-color: var(--pf-purple);
    }
    .lb-row-rank {
      font-weight: 900;
      font-size: 0.8rem;
      color: var(--pf-muted);
      text-align: center;
    }
    .lb-row-name {
      font-weight: 800;
      font-size: 0.88rem;
      color: var(--pf-text);
    }
    .lb-row-score {
      font-weight: 900;
      color: var(--pf-purple);
      font-size: 0.9rem;
    }
    .lb-empty {
      text-align: center;
      padding: 36px 16px;
      color: var(--pf-muted);
      font-weight: 700;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* —— Dark theme —— */
    html[data-theme="dark"] body.profile-app {
      --pf-bg: #0c0918;
      --pf-card: #16122a;
      --pf-text: #f3f0ff;
      --pf-muted: #a89bbf;
      --pf-purple-soft: #2a2340;
      --pf-shadow: 0 16px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(167, 139, 250, 0.1);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(105, 55, 216, 0.35), transparent 55%),
        radial-gradient(ellipse 40% 30% at 100% 100%, rgba(167, 139, 250, 0.12), transparent 50%),
        linear-gradient(rgba(167, 139, 250, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(167, 139, 250, 0.05) 1px, transparent 1px);
    }
    html[data-theme="dark"] .pf-back,
    html[data-theme="dark"] .pf-name-chip {
      background: #1e1835;
      border-color: rgba(167, 139, 250, 0.15);
      color: #e8e0ff;
    }
    html[data-theme="dark"] .pf-name-chip input { color: #f3f0ff; }
    html[data-theme="dark"] .pf-title-wrap h1 { color: #fff; }
    html[data-theme="dark"] .pf-tabs {
      background: rgba(22, 18, 42, 0.85);
      border-color: rgba(167, 139, 250, 0.12);
    }
    html[data-theme="dark"] .pf-tab { color: #a89bbf; }
    html[data-theme="dark"] .pf-tab.is-on {
      background: #2a2340;
      color: #ddd6fe;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }
    html[data-theme="dark"] .pf-panel {
      background: var(--pf-card);
    }
    html[data-theme="dark"] .pf-count { background: #2a2340; color: #c4b5fd; }
    html[data-theme="dark"] .ach-tile {
      background: linear-gradient(165deg, #1e1835, #18132c);
      border-color: rgba(167, 139, 250, 0.18);
    }
    html[data-theme="dark"] .ach-tile.is-hot {
      background: linear-gradient(165deg, #2a1c18, #241612);
      border-color: rgba(255, 138, 61, 0.35);
    }
    html[data-theme="dark"] a.ach-tile:hover { border-color: #a78bfa; }
    html[data-theme="dark"] .ach-tile-title { color: #ede7ff; }
    html[data-theme="dark"] .ach-arrow { background: #2a2340; color: #c4b5fd; }
    html[data-theme="dark"] .ach-dot { background: #3d3558; }
    html[data-theme="dark"] .score-row {
      background: linear-gradient(165deg, #1e1835, #18132c);
      border-color: rgba(167, 139, 250, 0.15);
    }
    html[data-theme="dark"] .lb-pod {
      background: linear-gradient(180deg, #1e1835, #18132c);
      border-color: rgba(167, 139, 250, 0.18);
    }
    html[data-theme="dark"] .lb-pod.is-first {
      background: linear-gradient(180deg, #2a2410, #221e10);
      border-color: rgba(245, 185, 66, 0.35);
    }
    html[data-theme="dark"] .lb-row {
      background: #1a1530;
      border-color: rgba(167, 139, 250, 0.12);
    }
    html[data-theme="dark"] .lb-row.is-me {
      background: #2e2648;
      border-color: #7c5cbf;
    }
    html[data-theme="dark"] .lb-chip { background: #2a2340; color: #c4b5fd; }
    html[data-theme="dark"] .lb-chip.is-on { background: var(--pf-purple); color: #fff; }

    /* —— Responsive —— */
    @media (max-width: 900px) {
      .ach-page { grid-template-columns: repeat(4, 1fr); gap: 9px; }
    }
    @media (max-width: 640px) {
      body.profile-app {
        padding:
          max(8px, var(--safe-t))
          max(10px, var(--safe-r))
          max(8px, var(--safe-b))
          max(10px, var(--safe-l));
      }
      .pf-shell { gap: 10px; }
      .pf-name-chip input { width: 72px; }
      .pf-panel { padding: 12px 10px 10px; border-radius: 20px; }
      .ach-page {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .ach-tile {
        aspect-ratio: 1 / 1;
        min-height: 0;
        padding: 8px 6px;
        border-radius: 14px;
        gap: 4px;
      }
      .ach-tile-title { font-size: 0.62rem; }
      .pf-tab { font-size: 0.78rem; padding: 9px 4px; }
      .lb-pod-name { font-size: 0.65rem; }
      .lb-pod-score { font-size: 0.95rem; }
    }
    @media (max-width: 380px) {
      .ach-page { grid-template-columns: repeat(2, 1fr); }
      .pf-title-wrap p { display: none; }
    }
  </style>
</head>
<body class="profile-app">
  <div class="pf-shell">
    <header class="pf-top">
      <a class="pf-back" href="../" id="pfBack" aria-label="Back">←</a>
      <div class="pf-title-wrap">
        <h1>My Profile</h1>
        <p>Stars save automatically on this device</p>
      </div>
      <div class="pf-name-chip">
        <input id="playerName" type="text" maxlength="32" placeholder="Your name" autocomplete="nickname" readonly />
        <button type="button" id="saveNameBtn" class="is-edit" aria-label="Edit name">✎</button>
      </div>
    </header>

    <div class="pf-tabs" role="tablist">
      <button type="button" class="pf-tab is-on" data-tab="achievements" role="tab" aria-selected="true">★ Stars</button>
      <button type="button" class="pf-tab" data-tab="leaderboard" role="tab" aria-selected="false">🏆 Board</button>
      <button type="button" class="pf-tab" data-tab="scores" role="tab" aria-selected="false">Scores</button>
    </div>

    <!-- Achievements -->
    <section class="pf-panel is-on" id="panel-achievements" role="tabpanel">
      <div class="pf-panel-head">
        <h2>Achievements</h2>
        <span class="pf-count" id="achCount">0 games</span>
      </div>
      <div class="ach-viewport" id="achViewport">
        <div class="ach-track" id="achTrack">
          <!-- pages injected -->
        </div>
      </div>
      <div class="ach-nav">
        <button type="button" class="ach-arrow" id="achPrev" aria-label="Previous">‹</button>
        <div class="ach-dots" id="achDots"></div>
        <button type="button" class="ach-arrow" id="achNext" aria-label="Next">›</button>
      </div>
    </section>


    <!-- Leaderboard -->
    <section class="pf-panel" id="panel-leaderboard" role="tabpanel">
      <div class="pf-panel-head">
        <h2>Leaderboard</h2>
        <span class="pf-count" id="lbMeta">Overall</span>
      </div>
      <div class="lb-filters" id="lbFilters" role="tablist" aria-label="Filter by game">
        <button type="button" class="lb-chip is-on" data-game="overall">Overall</button>
      </div>
      <div class="lb-body" id="lbBody">
        <div class="lb-podium" id="lbPodium"></div>
        <div class="lb-list" id="lbList"></div>
      </div>
      <p class="lb-empty" id="lbEmpty" hidden>No scores on the board yet.<br>Finish games with your name set to appear here.</p>
    </section>
    <!-- Scores -->
    <section class="pf-panel" id="panel-scores" role="tabpanel">
      <div class="pf-panel-head">
        <h2>Saved scores</h2>
      </div>
      <p class="scores-status" id="scoresStatus">Loading…</p>
      <div class="scores-scroll" id="scoreList"></div>
    </section>

    <p class="pf-hint" id="swipeHint">Swipe or use arrows to see more games</p>
  </div>

  <!-- optional class kept in DOM for compatibility, hidden -->
  <input type="hidden" id="classCode" value="" />

  <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
  <script src="../firebase-scores.js"></script>
  <script src="../la-stars.js"></script>
  <script src="../theme.js"></script>
  <script>
(function () {
  "use strict";

  var TITLES = {
    "opposite-snap": "Opposite Snap",
    "sound-match-picture": "Sound Match",
    "vocab-clothes-voice-hunt": "Voice Hunt",
    "writing-sara-daily": "Sara's Routine",
    "vocab-clothes-match": "Clothes Match",
    "vocab-clothes-dictation": "Clothes Dictation",
    "there-is-there-are": "There is / are",
    "starter-3a-a-an-swipe": "A / An Swipe",
    "starter-7a-question-builder": "Question Builder",
    "starter-6a-listen-and-write": "Listen & Write",
    "starter-7a-build-the-question": "Build Question",
    "starter-3a-plural-s-sound-match": "Plural -s Sound",
    "starter-3a-pictures-words-match": "Pictures & Words",
    "starter-3b-listen-match": "Listen & Match",
    "starter-3b-dialogue-completer": "Dialogue",
    "starter-3b-this-that-sentences": "This / That",
    "starter-3a-whats-in-your-bag": "What's in Bag?",
    "nouns": "Nouns",
    "match-rush": "Match Rush",
    "starter-4b-car-adjectives": "Car Adjectives",
    "starter-4b-opposite-snap": "Opposite Snap",
    "be-verbs": "Be Verbs"
  };

  var GAME_URLS = {
    "opposite-snap": "../vocabulary/Adjectives/Opposite_Snap/",
    "sound-match-picture": "../vocabulary/Adjectives/Sound_Match_Picture/",
    "vocab-clothes-voice-hunt": "../vocabulary/clothes/voice-treasure-hunt/",
    "vocab-clothes-match": "../vocabulary/clothes/match/",
    "vocab-clothes-dictation": "../vocabulary/clothes/dictation/",
    "writing-sara-daily": "../writing/Daily%20Routine/Sara/",
    "there-is-there-are": "../grammar/there-is-there-are/",
    "nouns": "../grammar/nouns/",
    "match-rush": "../vocabulary/match-rush/",
    "starter-3a-a-an-swipe": "../../resources/american-english-file/starter/unit-3/a/games/a-an-swipe/",
    "starter-3a-plural-s-sound-match": "../../resources/american-english-file/starter/unit-3/a/games/plural-s-sound-match/",
    "starter-3a-pictures-words-match": "../../resources/american-english-file/starter/unit-3/a/games/pictures-words-match/",
    "starter-3a-whats-in-your-bag": "../../resources/american-english-file/starter/unit-3/a/games/whats-in-your-bag/",
    "starter-3b-listen-match": "../../resources/american-english-file/starter/unit-3/b/games/listen-match/",
    "starter-3b-dialogue-completer": "../../resources/american-english-file/starter/unit-3/b/games/dialogue-completer/",
    "starter-3b-this-that-sentences": "../../resources/american-english-file/starter/unit-3/b/games/this-that-sentences/"
  };

  function prettyTitle(id) {
    if (TITLES[id]) return TITLES[id];
    return String(id)
      .replace(/^starter-\d+[a-z]-/i, "")
      .replace(/^starter-pe\d+-/i, "")
      .replace(/^vocab-/i, "")
      .replace(/^writing-/i, "")
      .replace(/^aef\d?\s*/i, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function gameUrl(id) {
    return GAME_URLS[id] || null;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* —— Name chip —— */
  var input = document.getElementById("playerName");
  var saveNameBtn = document.getElementById("saveNameBtn");
  var editingName = false;

  function loadName() {
    var n = "";
    try {
      if (window.LAScores && LAScores.getPlayerName) n = LAScores.getPlayerName() || "";
      if (!n) n = localStorage.getItem("laPlayerName") || "";
    } catch (e) {}
    input.value = n;
  }

  function setNameMode(editing) {
    editingName = editing;
    input.readOnly = !editing;
    if (editing) {
      saveNameBtn.textContent = "✓";
      saveNameBtn.setAttribute("aria-label", "Save name");
      input.focus();
    } else {
      saveNameBtn.textContent = "✎";
      saveNameBtn.setAttribute("aria-label", "Edit name");
    }
  }

  saveNameBtn.addEventListener("click", function () {
    if (!editingName) {
      setNameMode(true);
      return;
    }
    var n = (input.value || "").trim().slice(0, 32);
    try {
      if (n) localStorage.setItem("laPlayerName", n);
      else localStorage.removeItem("laPlayerName");
    } catch (e) {}
    if (window.LAScores && LAScores.setPlayerName) LAScores.setPlayerName(n);
    input.value = n;
    setNameMode(false);
    loadAchievements();
    loadScores();
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && editingName) {
      e.preventDefault();
      saveNameBtn.click();
    }
  });

  loadName();
  setNameMode(false);

  /* —— Tabs —— */
  var tabs = document.querySelectorAll(".pf-tab");
  var panels = {
    achievements: document.getElementById("panel-achievements"),
    leaderboard: document.getElementById("panel-leaderboard"),
    scores: document.getElementById("panel-scores")
  };
  var swipeHint = document.getElementById("swipeHint");

  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      var id = tab.getAttribute("data-tab");
      tabs.forEach(function (t) {
        t.classList.toggle("is-on", t === tab);
        t.setAttribute("aria-selected", t === tab ? "true" : "false");
      });
      Object.keys(panels).forEach(function (k) {
        panels[k].classList.toggle("is-on", k === id);
      });
      if (swipeHint) {
        if (id === "achievements") {
          swipeHint.style.visibility = "visible";
        } else if (id === "leaderboard") {
          swipeHint.style.visibility = "visible";
          swipeHint.textContent = "Filter by game · top scores across the class";
        } else {
          swipeHint.style.visibility = "hidden";
        }
      }
      if (id === "leaderboard") loadLeaderboard();
    });
  });

  /* —— Achievements grid (swipe pages) —— */
  var PER_PAGE = 20; // 5×4 desktop; mobile CSS may show fewer cells but same data chunking
  var pageIndex = 0;
  var pageCount = 1;
  var track = document.getElementById("achTrack");
  var dotsEl = document.getElementById("achDots");
  var prevBtn = document.getElementById("achPrev");
  var nextBtn = document.getElementById("achNext");
  var achCount = document.getElementById("achCount");
  var viewport = document.getElementById("achViewport");

  function perPageForViewport() {
    var w = window.innerWidth;
    if (w <= 380) return 9;  // 3×3
    if (w <= 640) return 12; // 4×3
    if (window.innerHeight <= 500) return 15; // 5×3
    return 20; // 5×4
  }

  function fireLevelFromPlays(plays) {
    plays = Number(plays) || 0;
    if (plays >= 10) return 3;
    if (plays > 6) return 2;
    if (plays > 3) return 1;
    return 0;
  }

  function ensureParticles(star) {
    if (star.querySelector(".la-particles")) return;
    var wrap = document.createElement("span");
    wrap.className = "la-particles";
    wrap.setAttribute("aria-hidden", "true");
    var wind = (Math.random() * 2 - 1) * 12;
    for (var i = 0; i < 5; i++) {
      var p = document.createElement("span");
      p.className = "la-particle la-particle--fire";
      p.style.setProperty("--d", (i * 0.18) + "s");
      p.style.setProperty("--x", (Math.random() * 10 - 5).toFixed(1) + "px");
      p.style.setProperty("--w", (wind * (0.35 + Math.random() * 0.3)).toFixed(1) + "px");
      wrap.appendChild(p);
    }
    for (var j = 0; j < 4; j++) {
      var s = document.createElement("span");
      s.className = "la-particle la-particle--smoke";
      s.style.setProperty("--d", (j * 0.35 + 0.2) + "s");
      s.style.setProperty("--x", (Math.random() * 12 - 6).toFixed(1) + "px");
      s.style.setProperty("--s", (0.7 + Math.random() * 0.8).toFixed(2));
      s.style.setProperty("--w", (wind * (0.9 + Math.random() * 0.5)).toFixed(1) + "px");
      wrap.appendChild(s);
    }
    star.appendChild(wrap);
  }

  function starsEl(n, fire) {
    n = Math.min(3, Math.max(0, Number(n) || 0));
    fire = Math.min(3, Math.max(0, Number(fire) || 0));
    var wrap = document.createElement("div");
    wrap.className = "game-stars";
    wrap.setAttribute("data-fire", String(fire));
    for (var i = 1; i <= 3; i++) {
      var star = document.createElement("span");
      star.className = "star";
      star.setAttribute("data-n", String(i));
      if (i <= n) {
        star.classList.add("is-filled");
        star.textContent = "★";
      } else {
        star.textContent = "☆";
      }
      if (i <= fire) {
        star.classList.add("on-fire");
        ensureParticles(star);
      }
      wrap.appendChild(star);
    }
    return wrap;
  }

  function loadPlaysMap() {
    try {
      var key = "laGamePlays";
      var nm = (localStorage.getItem("laPlayerName") || "").trim().toLowerCase();
      var cd = (localStorage.getItem("laClassCode") || "").trim().toUpperCase();
      if (nm && cd) key = "laGamePlays::" + nm + "::" + cd;
      else if (nm) key = "laGamePlays::" + nm;
      var raw = localStorage.getItem(key);
      var data = raw ? JSON.parse(raw) : {};
      if (!Object.keys(data || {}).length && key !== "laGamePlays") {
        try { data = JSON.parse(localStorage.getItem("laGamePlays") || "{}") || {}; } catch (e2) { data = {}; }
      }
      return data || {};
    } catch (e) {
      return {};
    }
  }

  function goPage(i) {
    pageIndex = Math.max(0, Math.min(pageCount - 1, i));
    track.style.transform = "translateX(" + -pageIndex * 100 + "%)";
    dotsEl.querySelectorAll(".ach-dot").forEach(function (d, idx) {
      d.classList.toggle("is-on", idx === pageIndex);
    });
    prevBtn.disabled = pageIndex <= 0;
    nextBtn.disabled = pageIndex >= pageCount - 1;
  }

  function loadAchievements() {
    var data = {};
    try {
      var starsKey = "laGameStars";
      var nm = (localStorage.getItem("laPlayerName") || "").trim().toLowerCase();
      var cd = (localStorage.getItem("laClassCode") || "").trim().toUpperCase();
      if (nm && cd) starsKey = "laGameStars::" + nm + "::" + cd;
      else if (nm) starsKey = "laGameStars::" + nm;
      var raw = localStorage.getItem(starsKey);
      data = raw ? JSON.parse(raw) : {};
      if (!Object.keys(data || {}).length && starsKey !== "laGameStars") {
        try {
          data = JSON.parse(localStorage.getItem("laGameStars") || "{}") || {};
        } catch (e2) {
          data = {};
        }
      }
    } catch (e) {
      data = {};
    }

    var keys = Object.keys(data || {}).filter(function (id) {
      return Number(data[id]) > 0;
    });
    keys.sort(function (a, b) {
      return Number(data[b]) - Number(data[a]) || prettyTitle(a).localeCompare(prettyTitle(b));
    });

    achCount.textContent = keys.length + " game" + (keys.length === 1 ? "" : "s");

    var per = perPageForViewport();
    pageCount = Math.max(1, Math.ceil(keys.length / per) || 1);
    pageIndex = Math.min(pageIndex, pageCount - 1);

    track.innerHTML = "";
    dotsEl.innerHTML = "";

    if (!keys.length) {
      var emptyPage = document.createElement("div");
      emptyPage.className = "ach-page";
      emptyPage.innerHTML =
        '<div class="ach-empty">No achievements yet.<br>Finish a game to earn stars ★</div>';
      track.appendChild(emptyPage);
      pageCount = 1;
      goPage(0);
      if (swipeHint) swipeHint.textContent = "Play games to unlock achievements";
      return;
    }

    for (var p = 0; p < pageCount; p++) {
      var page = document.createElement("div");
      page.className = "ach-page";
      var slice = keys.slice(p * per, (p + 1) * per);
      var playsMap = loadPlaysMap();
      slice.forEach(function (id) {
        var n = Math.min(3, Number(data[id]) || 0);
        var plays = Number(playsMap[id] || 0);
        var fire = fireLevelFromPlays(plays);
        var title = prettyTitle(id);
        var url = gameUrl(id);
        var el = url ? document.createElement("a") : document.createElement("article");
        el.className = "ach-tile" + (fire > 0 ? " is-hot" : "");
        if (url) el.href = url;
        var label = title + " — " + n + " of 3 stars";
        if (fire > 0) label += ", " + fire + " on fire · played " + plays + "×";
        el.title = label;

        var titleEl = document.createElement("span");
        titleEl.className = "ach-tile-title";
        titleEl.textContent = title;
        el.appendChild(titleEl);
        el.appendChild(starsEl(n, fire));

        if (plays > 0) {
          var playsEl = document.createElement("span");
          playsEl.className = "ach-plays" + (fire > 0 ? " is-hot" : "");
          playsEl.textContent = plays >= 10 ? "🔥 " + plays + "×" : plays + "× played";
          el.appendChild(playsEl);
        }
        page.appendChild(el);
      });
      track.appendChild(page);

      var dot = document.createElement("button");
      dot.type = "button";
      dot.className = "ach-dot" + (p === pageIndex ? " is-on" : "");
      dot.setAttribute("aria-label", "Page " + (p + 1));
      (function (idx) {
        dot.addEventListener("click", function () {
          goPage(idx);
        });
      })(p);
      dotsEl.appendChild(dot);
    }

    goPage(pageIndex);
    if (swipeHint) {
      swipeHint.textContent =
        pageCount > 1 ? "Swipe or use arrows to see more games" : "Tap a game to play again";
    }
  }

  prevBtn.addEventListener("click", function () {
    goPage(pageIndex - 1);
  });
  nextBtn.addEventListener("click", function () {
    goPage(pageIndex + 1);
  });

  /* Touch / pointer swipe */
  (function bindSwipe() {
    var startX = 0;
    var startY = 0;
    var dragging = false;
    viewport.addEventListener(
      "pointerdown",
      function (e) {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        try {
          viewport.setPointerCapture(e.pointerId);
        } catch (err) {}
      },
      { passive: true }
    );
    viewport.addEventListener(
      "pointerup",
      function (e) {
        if (!dragging) return;
        dragging = false;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
        if (dx < 0) goPage(pageIndex + 1);
        else goPage(pageIndex - 1);
      },
      { passive: true }
    );
  })();

  window.addEventListener("resize", function () {
    loadAchievements();
  });

  /* —— Scores —— */
  function formatDate(ms) {
    if (!ms) return "";
    try {
      return new Date(ms).toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      });
    } catch (e) {
      return "";
    }
  }

  function loadScores() {
    var scoresStatus = document.getElementById("scoresStatus");
    var scoreList = document.getElementById("scoreList");
    scoresStatus.textContent = "Loading…";
    scoreList.innerHTML = "";

    if (!window.LAScores || !LAScores.myScores) {
      scoresStatus.textContent = "";
      scoreList.innerHTML =
        '<div class="scores-empty">Cloud scores need a connection.<br>Your stars still save on this device.</div>';
      return;
    }

    var p = LAScores.ensureAuth ? LAScores.ensureAuth() : Promise.resolve();
    p.then(function () {
      return LAScores.myScores();
    })
      .then(function (rows) {
        rows = rows || [];
        if (!rows.length) {
          scoresStatus.textContent = "";
          scoreList.innerHTML =
            '<div class="scores-empty">No cloud scores yet.<br>Enter your name above — scores save when you finish games.</div>';
          return;
        }
        scoresStatus.textContent =
          rows.length + " score" + (rows.length === 1 ? "" : "s");
        scoreList.innerHTML = rows
          .map(function (r) {
            var title = r.gameName || TITLES[r.gameId] || prettyTitle(r.gameId);
            var url = gameUrl(r.gameId);
            var body =
              "<div><strong>" +
              escapeHtml(title) +
              "</strong><small>" +
              formatDate(r.at) +
              "</small></div><div class=\"pts\">" +
              r.score +
              "</div>";
            if (url) return '<a class="score-row" href="' + url + '">' + body + "</a>";
            return '<div class="score-row">' + body + "</div>";
          })
          .join("");
      })
      .catch(function () {
        scoresStatus.textContent = "";
        scoreList.innerHTML =
          '<div class="scores-empty">Could not load cloud scores.<br>Local stars still work.</div>';
      });
  }


  /* —— Leaderboard —— */
  var lbCache = { overall: [], games: {}, loaded: false, filter: "overall" };
  var lbFilters = document.getElementById("lbFilters");
  var lbPodium = document.getElementById("lbPodium");
  var lbList = document.getElementById("lbList");
  var lbEmpty = document.getElementById("lbEmpty");
  var lbMeta = document.getElementById("lbMeta");
  var lbBody = document.getElementById("lbBody");

  function myNameKey() {
    var n = "";
    try {
      if (window.LAScores && LAScores.getPlayerName) n = LAScores.getPlayerName() || "";
      if (!n) n = localStorage.getItem("laPlayerName") || "";
    } catch (e) {}
    return String(n).trim().toLowerCase();
  }

  function medal(rank) {
    if (rank === 1) return "🥇";
    if (rank === 2) return "🥈";
    if (rank === 3) return "🥉";
    return String(rank);
  }

  function buildLbFilters(gameIds) {
    lbFilters.innerHTML = '<button type="button" class="lb-chip is-on" data-game="overall">Overall</button>';
    (gameIds || []).forEach(function (id) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lb-chip";
      btn.setAttribute("data-game", id);
      btn.textContent = prettyTitle(id);
      lbFilters.appendChild(btn);
    });
  }

  lbFilters.addEventListener("click", function (e) {
    var btn = e.target.closest(".lb-chip");
    if (!btn) return;
    lbFilters.querySelectorAll(".lb-chip").forEach(function (b) {
      b.classList.toggle("is-on", b === btn);
    });
    lbCache.filter = btn.getAttribute("data-game") || "overall";
    renderLeaderboard();
  });

  function renderLeaderboard() {
    var filter = lbCache.filter || "overall";
    var rows =
      filter === "overall"
        ? lbCache.overall || []
        : (lbCache.games && lbCache.games[filter]) || [];

    lbMeta.textContent = filter === "overall" ? "Overall" : prettyTitle(filter);

    if (!rows.length) {
      lbBody.hidden = true;
      lbEmpty.hidden = false;
      return;
    }
    lbBody.hidden = false;
    lbEmpty.hidden = true;

    var me = myNameKey();
    var top3 = rows.slice(0, 3);
    // Visual order: 2nd, 1st, 3rd
    var visual = [];
    if (top3[1]) visual.push({ row: top3[1], rank: 2 });
    if (top3[0]) visual.push({ row: top3[0], rank: 1 });
    if (top3[2]) visual.push({ row: top3[2], rank: 3 });

    lbPodium.innerHTML = visual
      .map(function (item) {
        var isMe = me && item.row.key === me;
        return (
          '<div class="lb-pod' +
          (item.rank === 1 ? " is-first" : "") +
          (isMe ? " is-me" : "") +
          '">' +
          '<div class="lb-pod-medal">' +
          medal(item.rank) +
          "</div>" +
          '<div class="lb-pod-name">' +
          escapeHtml(item.row.name) +
          "</div>" +
          '<div class="lb-pod-score">' +
          item.row.score +
          "</div>" +
          '<div class="lb-pod-rank">#' +
          item.rank +
          (filter === "overall" && item.row.games
            ? " · " + item.row.games + "g"
            : "") +
          "</div>" +
          "</div>"
        );
      })
      .join("");

    var rest = rows.slice(3, 30);
    lbList.innerHTML = rest
      .map(function (p, i) {
        var rank = i + 4;
        var isMe = me && p.key === me;
        return (
          '<div class="lb-row' +
          (isMe ? " is-me" : "") +
          '">' +
          '<span class="lb-row-rank">' +
          rank +
          "</span>" +
          '<span class="lb-row-name">' +
          escapeHtml(p.name) +
          "</span>" +
          '<span class="lb-row-score">' +
          p.score +
          "</span>" +
          "</div>"
        );
      })
      .join("");

    // If I'm not in top list, still highlight if in rest — already done via is-me
  }

  function loadLeaderboard() {
    if (!window.LAScores || !LAScores.top) {
      lbBody.hidden = true;
      lbEmpty.hidden = false;
      lbEmpty.innerHTML =
        "Leaderboard needs a connection.<br>Your local stars still work on the Stars tab.";
      return;
    }
    if (lbCache.loaded) {
      renderLeaderboard();
      return;
    }
    lbEmpty.hidden = false;
    lbEmpty.textContent = "Loading leaderboard…";
    lbBody.hidden = true;

    var auth = LAScores.ensureAuth ? LAScores.ensureAuth() : Promise.resolve();
    auth
      .catch(function () {
        return null;
      })
      .then(function () {
        return LAScores.listGames().then(function (ids) {
          if (!ids || !ids.length) {
            ids = Object.keys((LAScores.GAMES || {}));
          }
          return Promise.all(
            (ids || []).map(function (gid) {
              return LAScores.top(gid, 50).then(function (rows) {
                return { gameId: gid, rows: rows || [] };
              });
            })
          );
        });
      })
      .then(function (gameBuckets) {
        var perGame = {};
        var overall = {};

        (gameBuckets || []).forEach(function (bucket) {
          var gameId = bucket.gameId;
          perGame[gameId] = {};
          (bucket.rows || []).forEach(function (v) {
            var name = String(v.name || "Player").trim() || "Player";
            var key = name.toLowerCase();
            var score = Number(v.score) || 0;
            var at = Number(v.at) || 0;
            var prev = perGame[gameId][key];
            if (!prev || score > prev.score || (score === prev.score && at > prev.at)) {
              perGame[gameId][key] = { name: name, score: score, at: at };
            }
          });
        });

        Object.keys(perGame).forEach(function (gameId) {
          Object.keys(perGame[gameId]).forEach(function (key) {
            var p = perGame[gameId][key];
            if (!overall[key]) {
              overall[key] = { name: p.name, total: 0, games: 0, best: 0 };
            }
            overall[key].total += p.score;
            overall[key].games += 1;
            if (p.score > overall[key].best) overall[key].best = p.score;
          });
        });

        function toRanked(map, scoreKey) {
          return Object.keys(map)
            .map(function (k) {
              var o = map[k];
              return {
                name: o.name,
                score: o[scoreKey] != null ? o[scoreKey] : o.score,
                games: o.games || 1,
                best: o.best != null ? o.best : o.score,
                key: k
              };
            })
            .sort(function (a, b) {
              if (b.score !== a.score) return b.score - a.score;
              if ((b.games || 0) !== (a.games || 0)) return (b.games || 0) - (a.games || 0);
              return a.name.localeCompare(b.name);
            });
        }

        lbCache.overall = toRanked(overall, "total");
        lbCache.games = {};
        Object.keys(perGame).forEach(function (gameId) {
          lbCache.games[gameId] = toRanked(perGame[gameId], "score");
        });
        lbCache.loaded = true;
        buildLbFilters(Object.keys(perGame).sort());
        renderLeaderboard();
      })
      .catch(function (err) {
        console.warn("[Profile LB]", err);
        lbBody.hidden = true;
        lbEmpty.hidden = false;
        lbEmpty.innerHTML = "Could not load leaderboard.<br>Check your connection and try again.";
      });
  }


  // Smart back: return to previous page when possible, else arcade hub
  (function () {
    var back = document.getElementById("pfBack");
    if (!back) return;
    back.addEventListener("click", function (e) {
      try {
        var ref = document.referrer || "";
        var sameOrigin = ref.indexOf(location.origin) === 0;
        var notSelf = sameOrigin && ref.indexOf("/profile") === -1;
        if (notSelf && window.history.length > 1) {
          e.preventDefault();
          history.back();
          return;
        }
      } catch (err) {}
      // fallback href="../" (arcade) already on the link
    });
  })();

  try {
    loadAchievements();
  } catch (e) {
    console.warn(e);
  }
  try {
    loadScores();
  } catch (e) {
    console.warn(e);
  }
})();
  </script>
</body>
</html>
