<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#5b21b6" />
  <title>My Profile · Mr. Sheyhaki</title>
  <meta name="description" content="Your Learning Arcade profile, stars, and scores." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../theme.css" />
  <style>
    :root {
      --pf-bg: #f3f1ff;
      --pf-surface: #ffffff;
      --pf-text: #0f172a;
      --pf-muted: #64748b;
      --pf-accent: #6d28d9;
      --pf-accent-2: #4f46e5;
      --pf-border: rgba(15, 23, 42, 0.08);
      --pf-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.06);
      --pf-radius: 18px;
      --pf-star: #f5b942;
    }
    html[data-theme="dark"] {
      --pf-bg: #0b0f1a;
      --pf-surface: #151a2a;
      --pf-text: #f1f5f9;
      --pf-muted: #94a3b8;
      --pf-border: rgba(148, 163, 184, 0.12);
      --pf-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 16px 40px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    body.profile-app {
      margin: 0;
      min-height: 100dvh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--pf-bg);
      color: var(--pf-text);
    }
    body.profile-app::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 45% at 0% 0%, rgba(109, 40, 217, 0.14), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 0%, rgba(79, 70, 229, 0.1), transparent 50%);
      z-index: 0;
    }
    body.profile-app .arcade-header-bar,
    body.profile-app .site-topbar,
    body.profile-app .site-footer,
    body.profile-app .profile-fab { display: none !important; }

    .pf-shell {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100dvh;
    }

    /* Header */
    .pf-top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pf-back {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--pf-accent);
      background: var(--pf-surface);
      border: 1px solid var(--pf-border);
      box-shadow: var(--pf-shadow);
      transition: transform 0.12s ease;
    }
    .pf-back:hover { transform: translateY(-1px); }

    .pf-title-wrap { flex: 1; min-width: 140px; }
    .pf-title-wrap h1 {
      margin: 0;
      font-family: "Fredoka", sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--pf-text);
    }
    .pf-title-wrap p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--pf-muted);
    }

    .pf-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pf-name-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--pf-surface);
      border: 1px solid var(--pf-border);
      border-radius: 999px;
      padding: 4px 4px 4px 14px;
      box-shadow: var(--pf-shadow);
    }
    .pf-name-chip input {
      border: 0;
      background: transparent;
      color: var(--pf-text);
      font-weight: 700;
      font-size: 0.88rem;
      width: 100px;
      min-width: 0;
      outline: none;
    }
    .pf-name-chip input::placeholder { color: var(--pf-muted); font-weight: 600; }
    .pf-name-chip input:read-only { cursor: default; }
    .pf-name-chip button {
      border: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(145deg, #7c3aed, var(--pf-accent));
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(109, 40, 217, 0.3);
    }

    .pf-logout-btn {
      border: 1.5px solid rgba(239, 68, 68, 0.3);
      background: rgba(254, 242, 242, 0.95);
      color: #b91c1c;
      font: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }
    .pf-logout-btn:hover {
      background: #fef2f2;
      border-color: rgba(239, 68, 68, 0.5);
    }
    .pf-logout-btn:disabled { opacity: 0.6; cursor: wait; }
    html[data-theme="dark"] .pf-logout-btn {
      background: rgba(127, 29, 29, 0.35);
      border-color: rgba(248, 113, 113, 0.35);
      color: #fca5a5;
    }

    /* Identity card */
    .pf-identity {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 18px;
      background: var(--pf-surface);
      border: 1px solid var(--pf-border);
      border-radius: var(--pf-radius);
      box-shadow: var(--pf-shadow);
    }
    .pf-avatar {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(145deg, #7c3aed, #4f46e5);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(109, 40, 217, 0.3);
    }
    .pf-identity-meta { min-width: 0; flex: 1; }
    .pf-identity-meta h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pf-identity-meta p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--pf-muted);
    }
    .pf-stat-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pf-pill {
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(109, 40, 217, 0.08);
      border: 1px solid rgba(109, 40, 217, 0.12);
      text-align: center;
      min-width: 72px;
    }
    html[data-theme="dark"] .pf-pill {
      background: rgba(139, 92, 246, 0.12);
      border-color: rgba(139, 92, 246, 0.2);
    }
    .pf-pill strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--pf-accent);
    }
    html[data-theme="dark"] .pf-pill strong { color: #a78bfa; }
    .pf-pill span {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--pf-muted);
    }

    /* Tabs */
    .pf-tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--pf-surface);
      border: 1px solid var(--pf-border);
      border-radius: 14px;
      box-shadow: var(--pf-shadow);
    }
    .pf-tab {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 11px 8px;
      font: inherit;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
      background: transparent;
      color: var(--pf-muted);
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .pf-tab:hover { color: var(--pf-accent); }
    .pf-tab.is-on {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(79, 70, 229, 0.1));
      color: var(--pf-accent);
      box-shadow: inset 0 0 0 1px rgba(109, 40, 217, 0.15);
    }
    html[data-theme="dark"] .pf-tab.is-on {
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
    }

    /* Panels */
    .pf-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: var(--pf-surface);
      border: 1px solid var(--pf-border);
      border-radius: var(--pf-radius);
      box-shadow: var(--pf-shadow);
      padding: 16px;
      flex: 1;
      min-height: 320px;
    }
    .pf-panel.is-on { display: flex; }

    .pf-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .pf-panel-head h2 {
      margin: 0;
      font-family: "Fredoka", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .pf-count {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--pf-muted);
      background: rgba(100, 116, 139, 0.1);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Achievements */
    .ach-viewport {
      overflow: hidden;
      border-radius: 14px;
      flex: 1;
      min-height: 200px;
    }
    .ach-track {
      display: flex;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      height: 100%;
    }
    .ach-page {
      min-width: 100%;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
    }
    @media (min-width: 520px) {
      .ach-page { grid-template-columns: repeat(3, 1fr); }
    }
    .ach-tile {
      background: rgba(109, 40, 217, 0.05);
      border: 1px solid var(--pf-border);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
    }
    html[data-theme="dark"] .ach-tile {
      background: rgba(139, 92, 246, 0.08);
    }
    .ach-tile-title {
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .ach-plays {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--pf-muted);
      margin-top: 6px;
    }
    .ach-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 16px;
      color: var(--pf-muted);
      font-weight: 600;
    }
    .game-stars {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .game-stars .star {
      font-size: 1.05rem;
      opacity: 0.25;
      filter: grayscale(1);
    }
    .game-stars .star.is-filled,
    .game-stars .star.on {
      opacity: 1;
      filter: none;
      color: var(--pf-star);
    }

    .ach-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .ach-arrow {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--pf-border);
      background: var(--pf-bg);
      color: var(--pf-text);
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }
    .ach-dots { display: flex; gap: 6px; }
    .ach-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(100, 116, 139, 0.3);
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .ach-dot.is-on { background: var(--pf-accent); }

    /* Leaderboard */
    .lb-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .lb-chip {
      border: 1px solid var(--pf-border);
      background: var(--pf-bg);
      color: var(--pf-muted);
      font: inherit;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lb-chip.is-on {
      background: rgba(109, 40, 217, 0.12);
      color: var(--pf-accent);
      border-color: rgba(109, 40, 217, 0.25);
    }
    .lb-body { display: flex; flex-direction: column; gap: 14px; }
    .lb-podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-items: end;
    }
    .lb-pod {
      background: rgba(109, 40, 217, 0.06);
      border: 1px solid var(--pf-border);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }
    .lb-pod-rank { font-size: 0.7rem; font-weight: 800; color: var(--pf-muted); }
    .lb-pod-medal { font-size: 1.4rem; margin: 4px 0; }
    .lb-pod-name {
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-pod-score { font-size: 0.9rem; font-weight: 800; color: var(--pf-accent); margin-top: 4px; }
    .lb-list { display: flex; flex-direction: column; gap: 6px; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(100, 116, 139, 0.06);
      border: 1px solid transparent;
    }
    .lb-row.is-me {
      background: rgba(109, 40, 217, 0.1);
      border-color: rgba(109, 40, 217, 0.2);
    }
    .lb-row-rank { font-weight: 800; color: var(--pf-muted); width: 28px; }
    .lb-row-name { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-row-score { font-weight: 800; color: var(--pf-accent); }
    .lb-empty {
      text-align: center;
      color: var(--pf-muted);
      font-weight: 600;
      padding: 32px 12px;
      line-height: 1.5;
    }

    /* Scores */
    #scoreList { display: flex; flex-direction: column; gap: 6px; }
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(100, 116, 139, 0.06);
      border: 1px solid var(--pf-border);
    }
    .score-row .name { font-weight: 700; font-size: 0.9rem; }
    .score-val { font-weight: 800; color: var(--pf-accent); }
    .scores-empty, #scoresStatus {
      text-align: center;
      color: var(--pf-muted);
      font-weight: 600;
      padding: 24px 12px;
    }

    #swipeHint {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--pf-muted);
      margin: 0;
    }

    @media (max-width: 480px) {
      .pf-identity { flex-wrap: wrap; }
      .pf-stat-pills { width: 100%; }
      .pf-pill { flex: 1; }
      .pf-name-chip input { width: 72px; }
    }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mrsheyhaki-theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body class="profile-app">
  <div class="pf-shell">
    <header class="pf-top">
      <a class="pf-back" href="../" id="pfBack" aria-label="Back">←</a>
      <div class="pf-title-wrap">
        <h1>My Profile</h1>
        <p>Stars &amp; scores across Learning Arcade</p>
      </div>
      <div class="pf-actions">
        <div class="pf-name-chip">
          <input id="playerName" type="text" maxlength="32" placeholder="Your name" autocomplete="nickname" readonly />
          <button type="button" id="saveNameBtn" class="is-edit" aria-label="Edit name">✎</button>
        </div>
        <button type="button" class="pf-logout-btn" id="pfLogout" title="Log out">Log out</button>
      </div>
    </header>

    <section class="pf-identity" aria-label="Account summary">
      <div class="pf-avatar" id="pfAvatar">?</div>
      <div class="pf-identity-meta">
        <h2 id="pfDisplayName">Player</h2>
        <p id="pfSubtitle">Signed in to Learning Arcade</p>
      </div>
      <div class="pf-stat-pills">
        <div class="pf-pill">
          <strong id="pfStarTotal">0</strong>
          <span>Stars</span>
        </div>
        <div class="pf-pill">
          <strong id="pfGameCount">0</strong>
          <span>Games</span>
        </div>
      </div>
    </section>

    <div class="pf-tabs" role="tablist">
      <button type="button" class="pf-tab is-on" data-tab="achievements" role="tab" aria-selected="true">★ Stars</button>
      <button type="button" class="pf-tab" data-tab="leaderboard" role="tab" aria-selected="false">🏆 Board</button>
      <button type="button" class="pf-tab" data-tab="scores" role="tab" aria-selected="false">Scores</button>
    </div>

    <section class="pf-panel is-on" id="panel-achievements" role="tabpanel">
      <div class="pf-panel-head">
        <h2>Achievements</h2>
        <span class="pf-count" id="achCount">0 games</span>
      </div>
      <div class="ach-viewport" id="achViewport">
        <div class="ach-track" id="achTrack"></div>
      </div>
      <div class="ach-nav">
        <button type="button" class="ach-arrow" id="achPrev" aria-label="Previous">‹</button>
        <div class="ach-dots" id="achDots"></div>
        <button type="button" class="ach-arrow" id="achNext" aria-label="Next">›</button>
      </div>
      <p id="swipeHint">Swipe or use arrows to browse</p>
    </section>

    <section class="pf-panel" id="panel-leaderboard" role="tabpanel">
      <div class="pf-panel-head">
        <h2>Leaderboard</h2>
        <span class="pf-count" id="lbMeta">Overall</span>
      </div>
      <div class="lb-filters" id="lbFilters" role="tablist" aria-label="Filter by game">
        <button type="button" class="lb-chip is-on" data-game="overall">Overall</button>
      </div>
      <div class="lb-body" id="lbBody">
        <div class="lb-podium" id="lbPodium"></div>
        <div class="lb-list" id="lbList"></div>
      </div>
      <p class="lb-empty" id="lbEmpty" hidden>No scores on the board yet.<br>Finish games with your name set to appear here.</p>
    </section>

    <section class="pf-panel" id="panel-scores" role="tabpanel">
      <div class="pf-panel-head">
        <h2>Your scores</h2>
        <span class="pf-count" id="scoresStatus">—</span>
      </div>
      <div id="scoreList"></div>
    </section>
  </div>

  <script src="/learningarcade/vendor/supabase.min.js"></script>
  <script src="../firebase-scores.js"></script>
  <script src="../auth-system/auth.js"></script>
  <script src="../progress.js"></script>
  <script src="../la-stars.js"></script>
  <script src="../theme.js"></script>
  <script>

  };

  var GAME_URLS = {

    "vocab-clothes-voice-hunt": "../vocabulary/clothes/voice-treasure-hunt/",

  function prettyTitle(id) {
    if (TITLES[id]) return TITLES[id];
    return String(id)
      .replace(/^starter-\d+[a-z]-/i, "")
      .replace(/^starter-pe\d+-/i, "")
      .replace(/^vocab-/i, "")
      .replace(/^writing-/i, "")
      .replace(/^aef\d?\s*/i, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function gameUrl(id) {
    return GAME_URLS[id] || null;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* —— Name chip —— */
  var input = document.getElementById("playerName");
  var saveNameBtn = document.getElementById("saveNameBtn");
  var editingName = false;

  function loadName() {
    var n = "";
    try {
      if (window.LAScores && LAScores.getPlayerName) n = LAScores.getPlayerName() || "";
      if (!n) n = localStorage.getItem("laPlayerName") || "";
    } catch (e) {}
    input.value = n;
  }

  function setNameMode(editing) {

    input.readOnly = !editing;
    if (editing) {
      saveNameBtn.textContent = "✓";
      saveNameBtn.setAttribute("aria-label", "Save name");

      saveNameBtn.textContent = "✎";
      saveNameBtn.setAttribute("aria-label", "Edit name");

  }

  saveNameBtn.addEventListener("click", function () {
    if (!editingName) {
      setNameMode(true);
      return;
    }
    var n = (input.value || "").trim().slice(0, 32);

      if (n) localStorage.setItem("laPlayerName", n);

  /* —— Achievements grid (swipe pages) —— */
  var PER_PAGE = 20; // 5×4 desktop; mobile CSS may show fewer cells but same data chunking
  var pageIndex = 0;
  var pageCount = 1;
  var track = document.getElementById("achTrack");
  var dotsEl = document.getElementById("achDots");
  var prevBtn = document.getElementById("achPrev");
  var nextBtn = document.getElementById("achNext");
  var achCount = document.getElementById("achCount");
  var viewport = document.getElementById("achViewport");

  function perPageForViewport() {
    var w = window.innerWidth;
    if (w <= 380) return 9;  // 3×3
    if (w <= 640) return 12; // 4×3
    if (window.innerHeight <= 500) return 15; // 5×3
    return 20; // 5×4
  }

  function fireLevelFromPlays(plays) {
    plays = Number(plays) || 0;
    if (plays >= 10) return 3;
    if (plays > 6) return 2;
    if (plays > 3) return 1;
    return 0;
  }

  function ensureParticles(star) {
    if (star.querySelector(".la-particles")) return;
    var wrap = document.createElement("span");
    wrap.className = "la-particles";
    wrap.setAttribute("aria-hidden", "true");
    var wind = (Math.random() * 2 - 1) * 12;
    for (var i = 0; i < 5; i++) {
      var p = document.createElement("span");
      p.className = "la-particle la-particle--fire";
      p.style.setProperty("--d", (i * 0.18) + "s");
      p.style.setProperty("--x", (Math.random() * 10 - 5).toFixed(1) + "px");
      p.style.setProperty("--w", (wind * (0.35 + Math.random() * 0.3)).toFixed(1) + "px");
      wrap.appendChild(p);
    }
    for (var j = 0; j < 4; j++) {
      var s = document.createElement("span");
      s.className = "la-particle la-particle--smoke";
      s.style.setProperty("--d", (j * 0.35 + 0.2) + "s");
      s.style.setProperty("--x", (Math.random() * 12 - 6).toFixed(1) + "px");
      s.style.setProperty("--s", (0.7 + Math.random() * 0.8).toFixed(2));
      s.style.setProperty("--w", (wind * (0.9 + Math.random() * 0.5)).toFixed(1) + "px");
      wrap.appendChild(s);
    }
    star.appendChild(wrap);
  }

  function starsEl(n, fire) {
    n = Math.min(3, Math.max(0, Number(n) || 0));
    fire = Math.min(3, Math.max(0, Number(fire) || 0));
    var wrap = document.createElement("div");
    wrap.className = "game-stars";
    wrap.setAttribute("data-fire", String(fire));
    for (var i = 1; i <= 3; i++) {
      var star = document.createElement("span");
      star.className = "star";
      star.setAttribute("data-n", String(i));
      if (i <= n) {
        star.classList.add("is-filled");
        star.textContent = "★";
      } else {
        star.textContent = "☆";
      }
      if (i <= fire) {
        star.classList.add("on-fire");
        ensureParticles(star);
      }
      wrap.appendChild(star);
    }
    return wrap;
  }

  function loadPlaysMap() {
    try {
      var key = "laGamePlays";
      var nm = (localStorage.getItem("laPlayerName") || "").trim().toLowerCase();
      var cd = (localStorage.getItem("laClassCode") || "").trim().toUpperCase();
      if (nm && cd) key = "laGamePlays::" + nm + "::" + cd;
      else if (nm) key = "laGamePlays::" + nm;
      var raw = localStorage.getItem(key);
      var data = raw ? JSON.parse(raw) : {};
      if (!Object.keys(data || {}).length && key !== "laGamePlays") {
        try { data = JSON.parse(localStorage.getItem("laGamePlays") || "{}") || {}; } catch (e2) { data = {}; }
      }
      return data || {};
    } catch (e) {
      return {};
    }
  }

  function goPage(i) {
    pageIndex = Math.max(0, Math.min(pageCount - 1, i));
    track.style.transform = "translateX(" + -pageIndex * 100 + "%)";
    dotsEl.querySelectorAll(".ach-dot").forEach(function (d, idx) {
      d.classList.toggle("is-on", idx === pageIndex);
    });
    prevBtn.disabled = pageIndex <= 0;
    nextBtn.disabled = pageIndex >= pageCount - 1;
  }

  function loadAchievements() {
    var data = {};
    try {
      var starsKey = "laGameStars";
      var nm = (localStorage.getItem("laPlayerName") || "").trim().toLowerCase();
      var cd = (localStorage.getItem("laClassCode") || "").trim().toUpperCase();
      if (nm && cd) starsKey = "laGameStars::" + nm + "::" + cd;
      else if (nm) starsKey = "laGameStars::" + nm;
      var raw = localStorage.getItem(starsKey);
      data = raw ? JSON.parse(raw) : {};
      if (!Object.keys(data || {}).length && starsKey !== "laGameStars") {
        try {
          data = JSON.parse(localStorage.getItem("laGameStars") || "{}") || {};
        } catch (e2) {
          data = {};
        }
      }
    } catch (e) {
      data = {};
    }

    var keys = Object.keys(data || {}).filter(function (id) {
      return Number(data[id]) > 0;
    });
    keys.sort(function (a, b) {
      return Number(data[b]) - Number(data[a]) || prettyTitle(a).localeCompare(prettyTitle(b));
    });

    achCount.textContent = keys.length + " game" + (keys.length === 1 ? "" : "s");

    var per = perPageForViewport();
    pageCount = Math.max(1, Math.ceil(keys.length / per) || 1);
    pageIndex = Math.min(pageIndex, pageCount - 1);

    track.innerHTML = "";
    dotsEl.innerHTML = "";

    if (!keys.length) {
      var emptyPage = document.createElement("div");
      emptyPage.className = "ach-page";
      emptyPage.innerHTML =
        '<div class="ach-empty">No achievements yet.<br>Finish a game to earn stars ★</div>';
      track.appendChild(emptyPage);
      pageCount = 1;
      goPage(0);
      if (swipeHint) swipeHint.textContent = "Play games to unlock achievements";
      return;
    }

    for (var p = 0; p < pageCount; p++) {
      var page = document.createElement("div");
      page.className = "ach-page";
      var slice = keys.slice(p * per, (p + 1) * per);
      var playsMap = loadPlaysMap();
      slice.forEach(function (id) {
        var n = Math.min(3, Number(data[id]) || 0);
        var plays = Number(playsMap[id] || 0);
        var fire = fireLevelFromPlays(plays);
        var title = prettyTitle(id);
        var url = gameUrl(id);
        var el = url ? document.createElement("a") : document.createElement("article");
        el.className = "ach-tile" + (fire > 0 ? " is-hot" : "");
        if (url) el.href = url;
        var label = title + " — " + n + " of 3 stars";
        if (fire > 0) label += ", " + fire + " on fire · played " + plays + "×";
        el.title = label;

        var titleEl = document.createElement("span");
        titleEl.className = "ach-tile-title";
        titleEl.textContent = title;
        el.appendChild(titleEl);
        el.appendChild(starsEl(n, fire));

        if (plays > 0) {
          var playsEl = document.createElement("span");
          playsEl.className = "ach-plays" + (fire > 0 ? " is-hot" : "");
          playsEl.textContent = plays >= 10 ? "🔥 " + plays + "×" : plays + "× played";
          el.appendChild(playsEl);
        }
        page.appendChild(el);
      });
      track.appendChild(page);

      var dot = document.createElement("button");
      dot.type = "button";
      dot.className = "ach-dot" + (p === pageIndex ? " is-on" : "");
      dot.setAttribute("aria-label", "Page " + (p + 1));
      (function (idx) {
        dot.addEventListener("click", function () {
          goPage(idx);
        });
      })(p);
      dotsEl.appendChild(dot);
    }

    goPage(pageIndex);
    if (swipeHint) {
      swipeHint.textContent =
        pageCount > 1 ? "Swipe or use arrows to see more games" : "Tap a game to play again";
    }
  }

  prevBtn.addEventListener("click", function () {
    goPage(pageIndex - 1);
  });
  nextBtn.addEventListener("click", function () {
    goPage(pageIndex + 1);
  });

  /* Touch / pointer swipe */
  (function bindSwipe() {
    var startX = 0;
    var startY = 0;
    var dragging = false;
    viewport.addEventListener(
      "pointerdown",
      function (e) {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        try {
          viewport.setPointerCapture(e.pointerId);
        } catch (err) {}
      },
      { passive: true }
    );
    viewport.addEventListener(
      "pointerup",
      function (e) {
        if (!dragging) return;
        dragging = false;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
        if (dx < 0) goPage(pageIndex + 1);
        else goPage(pageIndex - 1);
      },
      { passive: true }
    );
  })();

  window.addEventListener("resize", function () {
    loadAchievements();
  });

  /* —— Scores —— */
  function formatDate(ms) {
    if (!ms) return "";
    try {
      return new Date(ms).toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      });
    } catch (e) {
      return "";
    }
  }

  /* Logged-in students: show THEIR saved progress (private, per account). */
  function loadMyProgress(scoresStatus, scoreList) {
    window.LAProgress.getSummary().then(function (s) {
      if (!s.gamesPlayed) {
        scoresStatus.textContent = "";
        scoreList.innerHTML =
          '<div class="scores-empty">No saved progress yet.<br>Finish a game while logged in and it appears here.</div>';
        return;
      }
      var mins = Math.round(s.totalTimeSeconds / 60);
      scoresStatus.textContent =
        s.gamesPlayed + " games played · " + s.gamesCompleted + " completed · " +
        s.totalAttempts + " attempts · " + s.averageBestAccuracy + "% avg best" +
        (mins ? " · " + mins + " min" : "");
      var html = Object.keys(s.byCategory).map(function (k) {
        var c = s.byCategory[k];
        return '<div class="score-row"><div><strong>' + escapeHtml(k) + "</strong><small>" +
          c.games + " game" + (c.games === 1 ? "" : "s") + " · " + c.completed + " completed · " +
          c.attempts + " attempts</small></div><div class=\"score-val\">" + c.averageBestAccuracy + "%</div></div>";
      }).join("");
      scoreList.innerHTML = html;
      window.LAProgress.getMine().then(function (rows) {
        rows.sort(function (a, b) { return (b.lastPlayedAt || 0) - (a.lastPlayedAt || 0); });
        scoreList.innerHTML = html + rows.map(function (r) {
          var title = r.gameName || TITLES[r.gameId] || prettyTitle(r.gameId);
          var best = r.bestMaxScore > 0 ? r.bestScore + "/" + r.bestMaxScore : r.bestScore;
          var latest = r.latestMaxScore > 0 ? r.latestScore + "/" + r.latestMaxScore : r.latestScore;
          var url = gameUrl(r.gameId);
          var body = "<div><strong>" + escapeHtml(title) + "</strong><small>" +
            "Best " + best + " · Latest " + latest + " · " + r.attempts + " play" + (r.attempts === 1 ? "" : "s") +
            (r.unit ? " · " + escapeHtml(r.unit) : "") + " · " + formatDate(r.lastPlayedAt) +
            '</small></div><div class="score-val">' + (r.bestAccuracy || 0) + "%</div>";
          return url ? '<a class="score-row" href="' + url + '">' + body + "</a>" : '<div class="score-row">' + body + "</div>";
        }).join("");
      });
    }).catch(function () {
      scoresStatus.textContent = "";
      scoreList.innerHTML = '<div class="scores-empty">Could not load your progress.<br>Local stars still work.</div>';
    });
  }

  function loadScores() {
    var scoresStatus = document.getElementById("scoresStatus");
    var scoreList = document.getElementById("scoreList");
    scoresStatus.textContent = "Loading…";
    scoreList.innerHTML = "";

    if (window.LAAuth && LAAuth.isLoggedIn() && window.LAProgress) {
      loadMyProgress(scoresStatus, scoreList);
      return;
    }

    if (!window.LAScores || !LAScores.myScores) {
      scoresStatus.textContent = "";
      scoreList.innerHTML =
        '<div class="scores-empty">Cloud scores need a connection.<br>Your stars still save on this device.</div>';
      return;
    }

    var p = LAScores.ensureAuth ? LAScores.ensureAuth() : Promise.resolve();
    p.then(function () {
      return LAScores.myScores();
    })
      .then(function (rows) {
        rows = rows || [];
        if (!rows.length) {
          scoresStatus.textContent = "";
          scoreList.innerHTML =
            '<div class="scores-empty">No cloud scores yet.<br>Enter your name above — scores save when you finish games.</div>';
          return;
        }
        scoresStatus.textContent =
          rows.length + " score" + (rows.length === 1 ? "" : "s");
        scoreList.innerHTML = rows
          .map(function (r) {
            var title = r.gameName || TITLES[r.gameId] || prettyTitle(r.gameId);
            var url = gameUrl(r.gameId);
            var body =
              "<div><strong>" +
              escapeHtml(title) +
              "</strong><small>" +
              formatDate(r.at) +
              "</small></div><div class=\"pts\">" +
              r.score +
              "</div>";
            if (url) return '<a class="score-row" href="' + url + '">' + body + "</a>";
            return '<div class="score-row">' + body + "</div>";
          })
          .join("");
      })
      .catch(function () {
        scoresStatus.textContent = "";
        scoreList.innerHTML =
          '<div class="scores-empty">Could not load cloud scores.<br>Local stars still work.</div>';
      });
  }


  /* —— Leaderboard —— */
  var lbCache = { overall: [], games: {}, loaded: false, filter: "overall" };
  var lbFilters = document.getElementById("lbFilters");
  var lbPodium = document.getElementById("lbPodium");
  var lbList = document.getElementById("lbList");
  var lbEmpty = document.getElementById("lbEmpty");
  var lbMeta = document.getElementById("lbMeta");
  var lbBody = document.getElementById("lbBody");

  function myNameKey() {
    var n = "";
    try {
      if (window.LAScores && LAScores.getPlayerName) n = LAScores.getPlayerName() || "";
      if (!n) n = localStorage.getItem("laPlayerName") || "";
    } catch (e) {}
    return String(n).trim().toLowerCase();
  }

  function medal(rank) {
    if (rank === 1) return "🥇";
    if (rank === 2) return "🥈";
    if (rank === 3) return "🥉";
    return String(rank);
  }

  function buildLbFilters(gameIds) {
    lbFilters.innerHTML = '<button type="button" class="lb-chip is-on" data-game="overall">Overall</button>';
    (gameIds || []).forEach(function (id) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lb-chip";
      btn.setAttribute("data-game", id);
      btn.textContent = prettyTitle(id);
      lbFilters.appendChild(btn);
    });
  }

  lbFilters.addEventListener("click", function (e) {
    var btn = e.target.closest(".lb-chip");
    if (!btn) return;
    lbFilters.querySelectorAll(".lb-chip").forEach(function (b) {
      b.classList.toggle("is-on", b === btn);
    });
    lbCache.filter = btn.getAttribute("data-game") || "overall";
    renderLeaderboard();
  });

  function renderLeaderboard() {
    var filter = lbCache.filter || "overall";
    var rows =
      filter === "overall"
        ? lbCache.overall || []
        : (lbCache.games && lbCache.games[filter]) || [];

    lbMeta.textContent = filter === "overall" ? "Overall" : prettyTitle(filter);

    if (!rows.length) {
      lbBody.hidden = true;
      lbEmpty.hidden = false;
      return;
    }
    lbBody.hidden = false;
    lbEmpty.hidden = true;

    var me = myNameKey();
    var top3 = rows.slice(0, 3);
    // Visual order: 2nd, 1st, 3rd
    var visual = [];
    if (top3[1]) visual.push({ row: top3[1], rank: 2 });
    if (top3[0]) visual.push({ row: top3[0], rank: 1 });
    if (top3[2]) visual.push({ row: top3[2], rank: 3 });

    lbPodium.innerHTML = visual
      .map(function (item) {
        var isMe = me && item.row.key === me;
        return (
          '<div class="lb-pod' +
          (item.rank === 1 ? " is-first" : "") +
          (isMe ? " is-me" : "") +
          '">' +
          '<div class="lb-pod-medal">' +
          medal(item.rank) +
          "</div>" +
          '<div class="lb-pod-name">' +
          escapeHtml(item.row.name) +
          "</div>" +
          '<div class="lb-pod-score">' +
          item.row.score +
          "</div>" +
          '<div class="lb-pod-rank">#' +
          item.rank +
          (filter === "overall" && item.row.games
            ? " · " + item.row.games + "g"
            : "") +
          "</div>" +
          "</div>"
        );
      })
      .join("");

    var rest = rows.slice(3, 30);
    lbList.innerHTML = rest
      .map(function (p, i) {
        var rank = i + 4;
        var isMe = me && p.key === me;
        return (
          '<div class="lb-row' +
          (isMe ? " is-me" : "") +
          '">' +
          '<span class="lb-row-rank">' +
          rank +
          "</span>" +
          '<span class="lb-row-name">' +
          escapeHtml(p.name) +
          "</span>" +
          '<span class="lb-row-score">' +
          p.score +
          "</span>" +
          "</div>"
        );
      })
      .join("");

    // If I'm not in top list, still highlight if in rest — already done via is-me
  }

  function loadLeaderboard() {
    if (!window.LAScores || !LAScores.top) {
      lbBody.hidden = true;
      lbEmpty.hidden = false;
      lbEmpty.innerHTML =
        "Leaderboard needs a connection.<br>Your local stars still work on the Stars tab.";
      return;
    }
    if (lbCache.loaded) {
      renderLeaderboard();
      return;
    }
    lbEmpty.hidden = false;
    lbEmpty.textContent = "Loading leaderboard…";
    lbBody.hidden = true;

    var auth = LAScores.ensureAuth ? LAScores.ensureAuth() : Promise.resolve();
    auth
      .catch(function () {
        return null;
      })
      .then(function () {
        return LAScores.listGames().then(function (ids) {
          if (!ids || !ids.length) {
            ids = Object.keys((LAScores.GAMES || {}));
          }
          return Promise.all(
            (ids || []).map(function (gid) {
              return LAScores.top(gid, 50).then(function (rows) {
                return { gameId: gid, rows: rows || [] };
              });
            })
          );
        });
      })
      .then(function (gameBuckets) {
        var perGame = {};
        var overall = {};

        (gameBuckets || []).forEach(function (bucket) {
          var gameId = bucket.gameId;
          perGame[gameId] = {};
          (bucket.rows || []).forEach(function (v) {
            var name = String(v.name || "Player").trim() || "Player";
            var key = name.toLowerCase();
            var score = Number(v.score) || 0;
            var at = Number(v.at) || 0;
            var prev = perGame[gameId][key];
            if (!prev || score > prev.score || (score === prev.score && at > prev.at)) {
              perGame[gameId][key] = { name: name, score: score, at: at };
            }
          });
        });

        Object.keys(perGame).forEach(function (gameId) {
          Object.keys(perGame[gameId]).forEach(function (key) {
            var p = perGame[gameId][key];
            if (!overall[key]) {
              overall[key] = { name: p.name, total: 0, games: 0, best: 0 };
            }
            overall[key].total += p.score;
            overall[key].games += 1;
            if (p.score > overall[key].best) overall[key].best = p.score;
          });
        });

        function toRanked(map, scoreKey) {
          return Object.keys(map)
            .map(function (k) {
              var o = map[k];
              return {
                name: o.name,
                score: o[scoreKey] != null ? o[scoreKey] : o.score,
                games: o.games || 1,
                best: o.best != null ? o.best : o.score,
                key: k
              };
            })
            .sort(function (a, b) {
              if (b.score !== a.score) return b.score - a.score;
              if ((b.games || 0) !== (a.games || 0)) return (b.games || 0) - (a.games || 0);
              return a.name.localeCompare(b.name);
            });
        }

        lbCache.overall = toRanked(overall, "total");
        lbCache.games = {};
        Object.keys(perGame).forEach(function (gameId) {
          lbCache.games[gameId] = toRanked(perGame[gameId], "score");
        });
        lbCache.loaded = true;
        buildLbFilters(Object.keys(perGame).sort());
        renderLeaderboard();
      })
      .catch(function (err) {
        console.warn("[Profile LB]", err);
        lbBody.hidden = true;
        lbEmpty.hidden = false;
        lbEmpty.innerHTML = "Could not load leaderboard.<br>Check your connection and try again.";
      });
  }


  // Smart back: return to previous page when possible, else arcade hub
  (function () {
    var back = document.getElementById("pfBack");
    if (!back) return;
    back.addEventListener("click", function (e) {
      try {
        var ref = document.referrer || "";
        var sameOrigin = ref.indexOf(location.origin) === 0;
        var notSelf = sameOrigin && ref.indexOf("/profile") === -1;
        if (notSelf && window.history.length > 1) {
          e.preventDefault();
          history.back();
          return;
        }
      } catch (err) {}
      // fallback href="../" (arcade) already on the link
    });
  })();

  try {
    loadAchievements();
  } catch (e) {
    console.warn(e);
  }
  try {
    loadScores();
  } catch (e) {
    console.warn(e);
  }


  // Log out — clear Supabase + local session, then go home
  (function () {
    var btn = document.getElementById("pfLogout");
    if (!btn) return;
    btn.addEventListener("click", function () {
      btn.disabled = true;
      btn.textContent = "Signing out…";
      var go = function () { window.location.href = "/"; };
      if (window.LAAuth && typeof LAAuth.logoutAsync === "function") {
        LAAuth.logoutAsync().then(go).catch(go);
      } else if (window.LAAuth && typeof LAAuth.logout === "function") {
        var r = LAAuth.logout();
        if (r && r.done && typeof r.done.then === "function") r.done.then(go).catch(go);
        else go();
      } else {
        try { localStorage.removeItem("laAuthSession"); } catch (e) {}
        go();
      }
    });
  })();

})();
  </script>
  <script>
  // Fill identity card from session / name field
  (function () {
    function refreshIdentity() {
      var nameInput = document.getElementById("playerName");
      var display = document.getElementById("pfDisplayName");
      var avatar = document.getElementById("pfAvatar");
      var subtitle = document.getElementById("pfSubtitle");
      var n = (nameInput && nameInput.value) || "";
      try {
        if (window.LAAuth && LAAuth.getSession) {
          var s = LAAuth.getSession();
          if (s) {
            n = s.displayName || s.username || n;
            if (subtitle) subtitle.textContent = "@" + (s.username || "player");
          }
        }
      } catch (e) {}
      n = String(n || "Player").trim() || "Player";
      if (display) display.textContent = n;
      if (avatar) avatar.textContent = n.charAt(0).toUpperCase();
    }
    refreshIdentity();
    var nameInput = document.getElementById("playerName");
    if (nameInput) {
      nameInput.addEventListener("change", refreshIdentity);
      var obs = new MutationObserver(refreshIdentity);
      obs.observe(nameInput, { attributes: true, attributeFilter: ["value"] });
    }
    // Update star / game counts from achievements when available
    function syncStats() {
      try {
        var tiles = document.querySelectorAll(".ach-tile");
        var games = tiles.length;
        var stars = 0;
        tiles.forEach(function (t) {
          stars += t.querySelectorAll(".star.is-filled, .star.on").length;
        });
        var g = document.getElementById("pfGameCount");
        var s = document.getElementById("pfStarTotal");
        if (g) g.textContent = String(games);
        if (s) s.textContent = String(stars);
      } catch (e) {}
    }
    setTimeout(syncStats, 800);
    setTimeout(syncStats, 2000);
    document.addEventListener("click", function (e) {
      if (e.target && e.target.closest && e.target.closest(".pf-tab")) {
        setTimeout(syncStats, 300);
      }
    });
  })();
  </script>
  <script src="/visit-counter.js" defer></script>
