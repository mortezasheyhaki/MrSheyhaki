<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6937d8">
<title>Daily Routine | Mr. Sheyhaki</title>
<meta name="description" content="Pick a character and write about their daily routine.">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../../style.css">
<link rel="stylesheet" href="../../../theme.css">
<style>
  .character-list {
    display: grid;
    gap: 16px;
    max-width: 560px;
    margin: 0 auto;
    padding: 8px 0 32px;
  }

  .character-card {
    display: grid;
    grid-template-columns: 110px 1fr;
    align-items: center;
    gap: 16px;
    padding: 14px 16px 14px 14px;
    border: 1px solid rgba(105, 55, 216, 0.14);
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 8px 0 rgba(84, 37, 184, 0.1), 0 14px 28px rgba(32, 38, 54, 0.07);
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .character-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 0 rgba(84, 37, 184, 0.12), 0 18px 32px rgba(32, 38, 54, 0.1);
  }

  .character-card:active {
    transform: translateY(2px);
    box-shadow: 0 4px 0 rgba(84, 37, 184, 0.1);
  }

  .character-photo {
    width: 110px;
    height: 110px;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(145deg, #f3efff, #fff8ef);
    border: 2px solid #e8e0ff;
    flex-shrink: 0;
  }

  .character-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .character-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    min-width: 0;
  }

  .character-info h2 {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #202636;
    line-height: 1.15;
  }

  .character-level {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    background: #f3efff;
    color: #6937d8;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .character-start {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 40px;
    padding: 0 18px;
    border: 0;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(135deg, #7b4de8, #6937d8);
    box-shadow: 0 4px 0 #5425b8;
    font-family: Inter, system-ui, sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    pointer-events: none;
  }

  .character-start svg {
    width: 14px;
    height: 14px;
  }

  @media (max-width: 420px) {
    .character-card {
      grid-template-columns: 88px 1fr;
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
    }
    .character-photo {
      width: 88px;
      height: 88px;
      border-radius: 14px;
    }
    .character-info h2 {
      font-size: 1.15rem;
    }
  }
</style>
</head>
<body>
<header class="arcade-header-bar">
    <nav class="arcade-nav" id="mainNav" aria-label="Main navigation">
      <a href="../../../" class="nav-link" aria-label="Home" data-icon="🏠"><span class="nav-ico" aria-hidden="true">🏠</span><span class="nav-text">Home</span></a>
      <a href="../../" class="nav-link active" aria-current="page" aria-label="Learning Arcade" data-icon="🕹️"><span class="nav-ico" aria-hidden="true">🕹️</span><span class="nav-text">Arcade</span></a>
      <a href="../../leaderboard/" class="nav-link" aria-label="Leaderboard" data-icon="🏆"><span class="nav-ico" aria-hidden="true">🏆</span><span class="nav-text">Board</span></a>
      <a href="../../profile/" class="nav-link" aria-label="My Profile" data-icon="👤"><span class="nav-ico" aria-hidden="true">👤</span><span class="nav-text">Profile</span></a>
    </nav>
</header>

<main class="writing">
  <section class="arcade-intro skill-intro">
    <div class="skill-intro-top">
      <a class="skill-back-btn" href="../" data-back-one aria-label="Back" title="Back"><span aria-hidden="true">←</span></a>
      <span class="eyebrow">WRITING · DAILY ROUTINE</span>
    </div>
    <h1>Choose a person</h1>
    <p style="margin: 8px auto 0; max-width: 360px; color: #687184; font-weight: 600; line-height: 1.4;">
      Pick a name and write about their daily routine.
    </p>
  </section>

  <section class="character-list" aria-label="People">
    <a class="character-card" href="Sara/" aria-label="Start Sara daily routine — level A1">
      <div class="character-photo">
        <img src="Sara/images/01-get-up.jpg" alt="Sara" width="110" height="110" loading="lazy">
      </div>
      <div class="character-info">
        <h2>Sara</h2>
        <span class="character-level">A1</span>
        <div class="game-stars" data-game="writing-sara-daily" aria-label="Progress stars" style="margin:4px 0">
          <span class="star" data-n="1">☆</span>
          <span class="star" data-n="2">☆</span>
          <span class="star" data-n="3">☆</span>
        </div>
        <span class="character-start">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.3 5.4v13.2L18.8 12 8.3 5.4Z" fill="currentColor"/></svg>
          Start
        </span>
      </div>
    </a>
  </section>
</main>

<footer class="site-footer"><p>© <span id="year"></span> Mr. Sheyhaki · English Teacher</p></footer>
<script src="../../../script.js"></script>
<script src="../../../theme.js"></script>
<script>document.getElementById('year') && (document.getElementById('year').textContent = new Date().getFullYear());</script>
<script src="../../la-stars.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){if(window.LAStars)LAStars.apply();});</script>
</body>
</html>
