<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6937d8" />
  <title>Leaderboard | Learning Arcade</title>
  <meta name="description" content="Player rankings based on scores across Learning Arcade games." />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="../../theme.css" />
  <style>
    .lb-wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }
    .lb-card {
      padding: 20px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 8px 0 rgba(84,37,184,.1), 0 14px 28px rgba(32,38,54,.07);
      margin-bottom: 20px;
    }
    .lb-card h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
      font-weight: 800;
      color: #202636;
    }
    .lb-status {
      min-height: 1.3em;
      margin: 0 0 12px;
      font-weight: 700;
      color: #687184;
      font-size: 0.9rem;
    }
    .lb-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .lb-filter {
      border: 2px solid #e8e0ff;
      background: #fff;
      color: #2c2450;
      font: inherit;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .lb-filter.is-on {
      background: #6937d8;
      border-color: #6937d8;
      color: #fff;
      box-shadow: 0 3px 0 #5425b8;
    }
    .lb-list { display: grid; gap: 10px; }
    .lb-row {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 4px 0 rgba(84,37,184,.08);
    }
    .lb-row.is-me {
      background: #f3edff;
      box-shadow: 0 4px 0 rgba(105,55,216,.2);
      border: 1.5px solid rgba(105,55,216,.25);
    }
    .lb-rank {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      color: #fff;
      background: #687184;
    }
    .lb-rank.r1 { background: linear-gradient(135deg, #f5b942, #e67e22); }
    .lb-rank.r2 { background: linear-gradient(135deg, #b0b8c8, #7a8499); }
    .lb-rank.r3 { background: linear-gradient(135deg, #d4a574, #a0673d); }
    .lb-name {
      font-weight: 800;
      font-size: 1.05rem;
      color: #202636;
    }
    .lb-meta {
      display: block;
      margin-top: 2px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #687184;
    }
    .lb-pts {
      font-size: 1.25rem;
      font-weight: 900;
      color: #6937d8;
      text-align: right;
    }
    .lb-pts small {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #687184;
    }
    .lb-empty {
      text-align: center;
      padding: 28px 16px;
      color: #687184;
      font-weight: 600;
      background: #f8f7fc;
      border-radius: 16px;
    }
    .lb-podium {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
      align-items: end;
    }
    .podium-card {
      text-align: center;
      padding: 14px 8px 16px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 4px 0 rgba(84,37,184,.08);
    }
    .podium-card.p1 {
      order: 2;
      padding-top: 20px;
      background: linear-gradient(180deg, #fff9e6, #fff);
      box-shadow: 0 6px 0 rgba(245,185,66,.35);
    }
    .podium-card.p2 { order: 1; }
    .podium-card.p3 { order: 3; }
    .podium-medal { font-size: 1.6rem; line-height: 1; margin-bottom: 6px; }
    .podium-card.p1 .podium-medal { font-size: 2rem; }
    .podium-name {
      font-weight: 800;
      font-size: 0.9rem;
      color: #202636;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .podium-score {
      font-weight: 900;
      color: #6937d8;
      font-size: 1.05rem;
      margin-top: 4px;
    }
    @media (max-width: 400px) {
      .lb-podium { gap: 6px; }
      .podium-name { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
<header class="arcade-header-bar">
  <a href="../profile/" class="profile-fab" aria-label="My Profile" title="My Profile">👤</a>
  <nav class="arcade-nav" id="mainNav" aria-label="Main navigation">
      <a href="../../" class="nav-link" aria-label="Home" data-icon="🏠"><span class="nav-ico" aria-hidden="true">🏠</span><span class="nav-text">Home</span></a>
      <a href="../" class="nav-link" aria-label="Arcade" data-icon="🕹️"><span class="nav-ico" aria-hidden="true">🕹️</span><span class="nav-text">Arcade</span></a>
      <a href="../../resources/" class="nav-link" aria-label="Resources" data-icon="📚"><span class="nav-ico" aria-hidden="true">📚</span><span class="nav-text">Resources</span></a>
      <a href="./" class="nav-link active" aria-current="page" aria-label="Leaderboard" data-icon="🏆"><span class="nav-ico" aria-hidden="true">🏆</span><span class="nav-text">Leaderboard</span></a>
      <a href="../../about/" class="nav-link" aria-label="About" data-icon="ℹ️"><span class="nav-ico" aria-hidden="true">ℹ️</span><span class="nav-text">About</span></a>
    </nav>
</header>

<main class="lb-wrap">
  <section class="arcade-intro skill-intro" style="margin-bottom: 8px;">
    <div class="skill-intro-top">
      <a class="skill-back-btn" href="../" data-back-one aria-label="Back" title="Back"><span aria-hidden="true">←</span></a>
      <span class="eyebrow">LEARNING ARCADE</span>
    </div>
    <h1>Leaderboard</h1>
    <p style="margin:8px 0 0;color:#687184;font-weight:600;">Player ranks from saved scores across all games.</p>
  </section>

  <section class="lb-card">
    <h2>Rankings</h2>
    <div class="lb-filters" id="lbFilters" role="tablist" aria-label="Leaderboard filters">
      <button type="button" class="lb-filter is-on" data-filter="overall">Overall</button>
    </div>
    <p class="lb-status" id="lbStatus">Loading rankings…</p>
    <div id="lbPodium" class="lb-podium" hidden></div>
    <div class="lb-list" id="lbList"></div>
  </section>
</main>

<footer class="site-footer"><p>© <span id="year"></span> Mr. Sheyhaki · English Teacher</p></footer>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script src="../firebase-scores.js"></script>
<script src="../../script.js"></script>
<script src="../../theme.js"></script>
<script>
(function () {
  var year = document.getElementById('year');
  if (year) year.textContent = new Date().getFullYear();

  var statusEl = document.getElementById('lbStatus');
  var listEl = document.getElementById('lbList');
  var podiumEl = document.getElementById('lbPodium');
  var filtersEl = document.getElementById('lbFilters');
  var myName = (LAScores.getPlayerName() || '').trim().toLowerCase();
  var currentFilter = 'overall';
  var cache = { overall: null, games: {} };

  var TITLES = {
    'opposite-snap': 'Opposite Snap',
    'sound-match-picture': 'Sound Match Picture',
    'vocab-clothes-voice-hunt': 'Voice Treasure Hunt',
    'writing-sara-daily': "Sara's Daily Routine",
    'vocab-clothes-match': 'Clothes Match',
    'vocab-clothes-dictation': 'Clothes Dictation',
    'there-is-there-are': 'There is / There are',
    'nouns': 'Nouns',
    'match-rush': 'Match Rush'
  };

  function prettyTitle(id) {
    if (TITLES[id]) return TITLES[id];
    if (LAScores.GAMES && LAScores.GAMES[id] && LAScores.GAMES[id].title) return LAScores.GAMES[id].title;
    return String(id)
      .replace(/^starter-\d+[a-z]-/i, '')
      .replace(/^vocab-/i, '')
      .replace(/^writing-/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /** Fetch all scores once and build overall + per-game rankings */
  function loadAll() {
    statusEl.textContent = 'Loading rankings…';
    listEl.innerHTML = '';
    podiumEl.hidden = true;
    podiumEl.innerHTML = '';

    return LAScores.ensureAuth()
      .catch(function () { return null; })
      .then(function () {
        // Read full scores tree via listGames + top, or direct DB if available
        if (typeof firebase === 'undefined' || !firebase.database) {
          throw new Error('Firebase not available');
        }
        return firebase.database().ref('scores').once('value');
      })
      .then(function (snap) {
        var perGame = {}; // gameId -> { nameLower: { name, score, at } }
        var overall = {}; // nameLower -> { name, total, games, best }

        if (snap && snap.forEach) {
          snap.forEach(function (gameSnap) {
            var gameId = gameSnap.key;
            perGame[gameId] = {};
            gameSnap.forEach(function (child) {
              var v = child.val() || {};
              var name = String(v.name || 'Player').trim() || 'Player';
              var key = name.toLowerCase();
              var score = Number(v.score) || 0;
              var at = Number(v.at) || 0;

              // best score per player per game
              var prev = perGame[gameId][key];
              if (!prev || score > prev.score || (score === prev.score && at > prev.at)) {
                perGame[gameId][key] = { name: name, score: score, at: at };
              }
            });
          });
        }

        // Build overall from best-per-game
        Object.keys(perGame).forEach(function (gameId) {
          Object.keys(perGame[gameId]).forEach(function (key) {
            var p = perGame[gameId][key];
            if (!overall[key]) {
              overall[key] = { name: p.name, total: 0, games: 0, best: 0 };
            }
            overall[key].total += p.score;
            overall[key].games += 1;
            if (p.score > overall[key].best) overall[key].best = p.score;
          });
        });

        function toRanked(map, scoreKey) {
          return Object.keys(map)
            .map(function (k) {
              var o = map[k];
              return {
                name: o.name,
                score: o[scoreKey] != null ? o[scoreKey] : o.score,
                games: o.games || 1,
                best: o.best != null ? o.best : o.score,
                key: k
              };
            })
            .sort(function (a, b) {
              if (b.score !== a.score) return b.score - a.score;
              if ((b.games || 0) !== (a.games || 0)) return (b.games || 0) - (a.games || 0);
              return a.name.localeCompare(b.name);
            });
        }

        cache.overall = toRanked(overall, 'total');
        cache.games = {};
        Object.keys(perGame).forEach(function (gameId) {
          cache.games[gameId] = toRanked(perGame[gameId], 'score');
        });

        buildFilters(Object.keys(perGame).sort());
        render();
      })
      .catch(function (err) {
        console.warn('[Leaderboard]', err);
        statusEl.textContent = 'Could not load rankings. Check your connection.';
        listEl.innerHTML = '<div class="lb-empty">No ranking data available right now.</div>';
      });
  }

  function buildFilters(gameIds) {
    var html = '<button type="button" class="lb-filter' + (currentFilter === 'overall' ? ' is-on' : '') + '" data-filter="overall">Overall</button>';
    gameIds.forEach(function (id) {
      var on = currentFilter === id ? ' is-on' : '';
      html += '<button type="button" class="lb-filter' + on + '" data-filter="' + escapeHtml(id) + '">' +
        escapeHtml(prettyTitle(id)) + '</button>';
    });
    filtersEl.innerHTML = html;
  }

  filtersEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.lb-filter');
    if (!btn) return;
    currentFilter = btn.getAttribute('data-filter') || 'overall';
    Array.prototype.forEach.call(filtersEl.querySelectorAll('.lb-filter'), function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-filter') === currentFilter);
    });
    render();
  });

  function medal(rank) {
    if (rank === 1) return '🥇';
    if (rank === 2) return '🥈';
    if (rank === 3) return '🥉';
    return '';
  }

  function render() {
    var rows = currentFilter === 'overall'
      ? (cache.overall || [])
      : (cache.games[currentFilter] || []);

    if (!rows.length) {
      statusEl.textContent = 'No scores yet for this board.';
      podiumEl.hidden = true;
      podiumEl.innerHTML = '';
      listEl.innerHTML = '<div class="lb-empty">Play games and tap <b>Save score</b> to appear here.</div>';
      return;
    }

    var label = currentFilter === 'overall' ? 'overall points' : prettyTitle(currentFilter);
    statusEl.textContent = rows.length + ' player' + (rows.length === 1 ? '' : 's') + ' · ranked by ' + label;

    // Podium for top 3
    if (rows.length >= 1) {
      podiumEl.hidden = false;
      var top3 = rows.slice(0, 3);
      var orderClass = ['p1', 'p2', 'p3'];
      // visual order: 2nd, 1st, 3rd
      var visual = [];
      if (top3[1]) visual.push({ r: 2, p: top3[1] });
      if (top3[0]) visual.push({ r: 1, p: top3[0] });
      if (top3[2]) visual.push({ r: 3, p: top3[2] });
      podiumEl.innerHTML = visual.map(function (item) {
        return '<div class="podium-card p' + item.r + '">' +
          '<div class="podium-medal">' + medal(item.r) + '</div>' +
          '<div class="podium-name">' + escapeHtml(item.p.name) + '</div>' +
          '<div class="podium-score">' + item.p.score + '</div>' +
          '</div>';
      }).join('');
    } else {
      podiumEl.hidden = true;
    }

    listEl.innerHTML = rows.map(function (p, i) {
      var rank = i + 1;
      var rankCls = rank === 1 ? ' r1' : rank === 2 ? ' r2' : rank === 3 ? ' r3' : '';
      var isMe = myName && p.key === myName;
      var meta = currentFilter === 'overall'
        ? (p.games + ' game' + (p.games === 1 ? '' : 's') + ' · best ' + p.best)
        : '';
      return '<div class="lb-row' + (isMe ? ' is-me' : '') + '">' +
        '<div class="lb-rank' + rankCls + '">' + (rank <= 3 ? medal(rank) : rank) + '</div>' +
        '<div><div class="lb-name">' + escapeHtml(p.name) + (isMe ? ' (you)' : '') + '</div>' +
        (meta ? '<span class="lb-meta">' + meta + '</span>' : '') +
        '</div>' +
        '<div class="lb-pts">' + p.score +
        (currentFilter === 'overall' ? '<small>total</small>' : '') +
        '</div></div>';
    }).join('');
  }

  loadAll();
})();
</script>
</body>
</html>
