    </nav>
</header>

<main class="vocabulary">

  <section class="arcade-intro skill-intro">
    <div class="skill-intro-top">
      <a class="skill-back-btn" href="../adult/" data-back-one aria-label="Back" title="Back"><span aria-hidden="true">←</span></a>
      <span class="eyebrow">VOCABULARY ARCADE</span>
    </div>
    <h1>Vocabulary</h1>
  </section>

  <section class="game-grid" aria-label="Vocabulary games">
    <article class="game-card game-card--coming-soon" aria-disabled="true">
      <div class="coming-soon-visual" aria-hidden="true">
        <div class="coming-soon-art">
          <span class="cs-book">📚</span>
          <span class="cs-spark cs-spark-1">✨</span>
          <span class="cs-spark cs-spark-2">⭐</span>
          <span class="cs-spark cs-spark-3">✨</span>
          <div class="cs-dashed"></div>
        </div>
        <span class="coming-soon-badge">SOON</span>
      </div>
      <div class="game-card-icon" aria-hidden="true">📚</div>
      <h3>Coming soon</h3>
      <span class="game-tag">Vocabulary Arcade</span>
      <p>New vocabulary games are on the way. Check back soon!</p>
      <div class="game-meta">Coming soon</div>
    </article>
  </section>

  <style>
    .game-card--coming-soon {
      grid-column: 1 / -1;
      text-align: center;
      max-width: 440px;
      margin: 0 auto;
      opacity: 0.95;
      pointer-events: none;
      position: relative;
      overflow: hidden;
    }
    .coming-soon-visual {
      position: relative;
      height: 140px;
      margin: -4px -4px 14px;
      border-radius: 16px;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(123, 69, 229, 0.22), transparent 55%),
        radial-gradient(ellipse at 70% 60%, rgba(167, 139, 250, 0.18), transparent 50%),
        linear-gradient(145deg, #f3eefe 0%, #e8e0ff 50%, #f8f5ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed rgba(123, 69, 229, 0.35);
    }
    html[data-theme="dark"] .coming-soon-visual,
    body.dark-mode .coming-soon-visual {
      background:
        radial-gradient(ellipse at 30% 40%, rgba(123, 69, 229, 0.35), transparent 55%),
        radial-gradient(ellipse at 70% 60%, rgba(167, 139, 250, 0.2), transparent 50%),
        linear-gradient(145deg, #1e1b2e 0%, #2a2440 50%, #1a1628 100%);
      border-color: rgba(167, 139, 250, 0.3);
    }
    .coming-soon-art {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cs-book {
      font-size: 3.2rem;
      line-height: 1;
      filter: drop-shadow(0 6px 12px rgba(94, 47, 200, 0.25));
      animation: csFloat 3s ease-in-out infinite;
    }
    .cs-dashed {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(123, 69, 229, 0.4);
      animation: csSpin 12s linear infinite;
    }
    .cs-spark {
      position: absolute;
      font-size: 1rem;
      opacity: 0.85;
      animation: csTwinkle 2s ease-in-out infinite;
    }
    .cs-spark-1 { top: 4px; right: 0; animation-delay: 0s; }
    .cs-spark-2 { bottom: 8px; left: 2px; animation-delay: 0.6s; }
    .cs-spark-3 { top: 12px; left: -4px; animation-delay: 1.2s; font-size: 0.85rem; }
    .coming-soon-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-family: "Press Start 2P", monospace;
      font-size: 0.55rem;
      letter-spacing: 0.06em;
      color: #fff;
      background: linear-gradient(135deg, #7b45e5, #5e2fc8);
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(94, 47, 200, 0.35);
    }
    @keyframes csFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes csSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes csTwinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
  </style>

</main>
