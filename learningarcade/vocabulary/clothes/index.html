<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clothes | Vocabulary Arcade | Mr. Sheyhaki</title>
<meta name="description" content="Learn clothes vocabulary: match pictures, audio, and words, then practice spelling.">
<link rel="stylesheet" href="../../../style.css">
<link rel="stylesheet" href="../../../theme.css">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app clothes-hub">
  <section class="panel">
    <div class="hub-top">
      <a class="back-pill" href="../">← Vocabulary</a>
    </div>
    <div class="hero-icon" aria-hidden="true">👕</div>
    <h1>Clothes</h1>
    <p class="lead">15 clothes words · match &amp; spell</p>

    <div class="activity-grid">
      <a class="activity-card" href="match/">
        <span class="act-icon" aria-hidden="true">🃏</span>
        <strong>Match Making</strong>
        <span>Pic · Audio · Word</span>
      </a>
      <a class="activity-card" href="dictation/">
        <span class="act-icon" aria-hidden="true">✍️</span>
        <strong>Dictation</strong>
        <span>Picture · Spell</span>
      </a>
      <a class="activity-card" href="voice-treasure-hunt/">
        <span class="act-icon" aria-hidden="true">🗺️</span>
        <strong>Voice Treasure Hunt</strong>
        <span>Listen · Find · Speak</span>
        <div class="game-stars" data-game="vocab-clothes-voice-hunt" aria-label="Progress stars">
          <span class="star" data-n="1">☆</span>
          <span class="star" data-n="2">☆</span>
          <span class="star" data-n="3">☆</span>
        </div>
      </a>
    </div>
  </section>
</main>
<script src="../../../theme.js"></script>
<script src="../../theme.js"></script>
<script src="../../la-stars.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){if(window.LAStars)LAStars.apply();});</script>
</body>
</html>
