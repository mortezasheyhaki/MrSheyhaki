<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Clothes Match Making | Mr. Sheyhaki</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../../../theme.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="back-button" href="../" id="headerBack">← Clothes</a>
  <div class="header-center">
    <span class="eyebrow">VOCABULARY</span>
    <strong>Match Making</strong>
  </div>
  <span class="header-spacer" aria-hidden="true"></span>
</header>

<main class="app app-fixed">
  <section id="startScreen" class="panel panel-fill">
    <div class="hero-icon" aria-hidden="true">🃏</div>
    <h1>Match Making</h1>
    <p class="lead">Tap matching pairs. Instant feedback.</p>
    <ul class="feature-list">
      <li>Mode 1: Picture → Word</li>
      <li>Mode 2: Audio → Word</li>
      <li>Mode 3: Audio → Picture</li>
    </ul>
    <div class="mode-tabs" id="modeTabs" role="tablist">
      <button type="button" class="mode-tab active" data-mode="0" role="tab" aria-selected="true">
        <span class="mode-ico" aria-hidden="true">🖼️</span>
        <span class="mode-label">Pic · Word</span>
      </button>
      <button type="button" class="mode-tab" data-mode="1" role="tab" aria-selected="false">
        <span class="mode-ico" aria-hidden="true">🔊</span>
        <span class="mode-label">Audio · Word</span>
      </button>
      <button type="button" class="mode-tab" data-mode="2" role="tab" aria-selected="false">
        <span class="mode-ico" aria-hidden="true">🎧</span>
        <span class="mode-label">Audio · Pic</span>
      </button>
    </div>
    <button id="startBtn" class="primary-btn" type="button">START ▶</button>
  </section>

  <section id="gameScreen" class="panel panel-fill" hidden>
    <div class="game-toolbar">
      <button type="button" id="backToModes" class="modes-btn" aria-label="Back to modes" title="Modes">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="stats-bar stats-inline">
        <div class="stat"><span class="stat-label">ROUND</span><strong id="roundText">1 / 3</strong></div>
        <div class="stat"><span class="stat-label">SCORE</span><strong id="scoreText">0</strong></div>
        <div class="stat"><span class="stat-label">MATCHED</span><strong id="matchedText">0 / 5</strong></div>
      </div>
    </div>
    <p class="prompt" id="promptText">Audio → Word</p>
    <div class="pairs-grid pairs-5" id="pairsGrid"></div>
    <p class="instruction" id="instruction">Tap one, then its match</p>
    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
  </section>

  <section id="endScreen" class="panel panel-fill" hidden>
    <div class="hero-icon" aria-hidden="true">🏆</div>
    <h1 id="endTitle">Well done!</h1>
    <p id="endSummary" class="lead"></p>
    <div class="end-stats">
      <div><span class="stat-label">SCORE</span><strong id="finalScore">0</strong></div>
      <div><span class="stat-label">ACCURACY</span><strong id="finalAccuracy">0%</strong></div>
      <div><span class="stat-label">ROUNDS</span><strong id="finalRounds">3</strong></div>
    </div>
    <div class="end-stars game-stars" data-game="vocab-clothes-match" aria-label="Progress stars">
      <span class="star" data-n="1">☆</span><span class="star" data-n="2">☆</span><span class="star" data-n="3">☆</span>
    </div>
    <div class="end-actions">
      <a class="icon-square-btn back-square" href="../" aria-label="Back"><span aria-hidden="true">←</span></a>
      <button id="playAgainBtn" class="icon-square-btn again-square" type="button" aria-label="Again"><span aria-hidden="true">↻</span></button>
    </div>
  </section>
</main>

<script src="../../../la-stars.js"></script>
<script src="script.js"></script>
<script src="../../../../theme.js"></script>
</body>
</html>
