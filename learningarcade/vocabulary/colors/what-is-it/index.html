<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>What is it? · Colors | Mr. Sheyhaki</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../../../theme.css">
<link rel="stylesheet" href="../../../theme.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="back-button" href="../">← Colors</a>
  <div class="header-center">
    <span class="eyebrow">VOCABULARY · COLORS</span>
    <strong>What is it?</strong>
  </div>
  <span class="header-spacer" aria-hidden="true"></span>
</header>

<main class="app app-fixed">
  <section id="startScreen" class="panel panel-fill">
    <div class="hero-icon" aria-hidden="true">💬</div>
    <h1>What is it?</h1>
    <p class="lead">Look at the picture. Write a full sentence.</p>
    <ul class="feature-list">
      <li>It's a black bag.</li>
      <li>They're blue keys.</li>
      <li>10 color + noun sentences</li>
    </ul>
    <button id="startBtn" class="primary-btn" type="button">START ▶</button>
  </section>

  <section id="gameScreen" class="panel panel-fill" hidden>
    <div class="stats-bar">
      <div class="stat"><span class="stat-label">ITEM</span><strong id="itemText">1 / 10</strong></div>
      <div class="stat"><span class="stat-label">SCORE</span><strong id="scoreText">0</strong></div>
      <div class="stat"><span class="stat-label">CORRECT</span><strong id="correctText">0</strong></div>
    </div>
    <div class="dict-img-wrap">
      <img id="sceneImg" src="images/black.png" alt="Picture" decoding="async">
    </div>
    <p class="prompt" id="promptText" style="text-align:center;margin:10px 0 8px;font-weight:800;font-size:1.15rem;color:var(--text,#202636)">What is it?</p>
    <input id="typeInput" class="type-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="It's a … / They're …">
    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    <button id="checkBtn" class="primary-btn" type="button" disabled>CHECK</button>
  </section>

  <section id="endScreen" class="panel panel-fill" hidden>
    <div class="hero-icon" aria-hidden="true">🏆</div>
    <h1 id="endTitle">Well done!</h1>
    <p id="endSummary" class="lead"></p>
    <div class="end-stats">
      <div><span class="stat-label">SCORE</span><strong id="finalScore">0</strong></div>
      <div><span class="stat-label">ACCURACY</span><strong id="finalAccuracy">0%</strong></div>
      <div><span class="stat-label">ITEMS</span><strong id="finalWords">10</strong></div>
    </div>
    <div class="end-stars game-stars" data-game="vocab-colors-what-is-it" aria-label="Progress stars">
      <span class="star" data-n="1">☆</span><span class="star" data-n="2">☆</span><span class="star" data-n="3">☆</span>
    </div>
    <div class="end-actions">
      <a class="icon-square-btn back-square" href="../" aria-label="Back"><span aria-hidden="true">←</span></a>
      <button id="playAgainBtn" class="icon-square-btn again-square" type="button" aria-label="Again"><span aria-hidden="true">↻</span></button>
    </div>
  </section>
</main>

<script src="../../../la-stars.js"></script>
<script src="script.js"></script>
<script src="../../../../theme.js"></script>
</body>
</html>
