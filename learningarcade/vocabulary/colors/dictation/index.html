<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Colors Dictation | Mr. Sheyhaki</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../../../theme.css">
<link rel="stylesheet" href="../../../theme.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="back-button" href="../">← Colors</a>
  <div class="header-center">
    <span class="eyebrow">VOCABULARY · COLORS</span>
    <strong>Dictation</strong>
  </div>
  <span class="header-spacer" aria-hidden="true"></span>
</header>

<main class="app app-fixed">
  <section id="startScreen" class="panel panel-fill">
    <div class="hero-icon" aria-hidden="true">✍️</div>
    <h1>Dictation</h1>
    <p class="lead">Look at the picture and write the color.</p>
    <ul class="feature-list">
      <li>10 colors</li>
      <li>Spelling practice</li>
      <li>Correct answer plays the audio</li>
    </ul>
    <button id="startBtn" class="primary-btn" type="button">START ▶</button>
  </section>

  <section id="gameScreen" class="panel panel-fill" hidden>
    <div class="stats-bar">
      <div class="stat"><span class="stat-label">ITEM</span><strong id="itemText">1 / 10</strong></div>
      <div class="stat"><span class="stat-label">SCORE</span><strong id="scoreText">0</strong></div>
      <div class="stat"><span class="stat-label">CORRECT</span><strong id="correctText">0</strong></div>
    </div>
    <div class="dict-img-wrap">
      <img id="sceneImg" src="../images/red.png" alt="Color" decoding="async">
    </div>
    <p class="prompt" id="promptText" style="text-align:center;margin:8px 0 4px;font-weight:800;color:var(--text,#202636)">Write the color.</p>
    <div style="text-align:center;margin-bottom:12px">
      <button type="button" id="playAudioBtn" class="audio-pill dict-audio-btn" aria-label="Play audio" title="Hear the color">
        <svg class="audio-speaker" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
        <span class="audio-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
    </div>
    <input id="typeInput" class="type-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the color…">
    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    <button id="checkBtn" class="primary-btn" type="button" disabled>CHECK</button>
  </section>

  <section id="endScreen" class="panel panel-fill" hidden>
    <div class="hero-icon" aria-hidden="true">🏆</div>
    <h1 id="endTitle">Well done!</h1>
    <p id="endSummary" class="lead"></p>
    <div class="end-stats">
      <div><span class="stat-label">SCORE</span><strong id="finalScore">0</strong></div>
      <div><span class="stat-label">ACCURACY</span><strong id="finalAccuracy">0%</strong></div>
      <div><span class="stat-label">WORDS</span><strong id="finalWords">10</strong></div>
    </div>
    <div class="end-stars game-stars" data-game="vocab-colors-dictation" aria-label="Progress stars">
      <span class="star" data-n="1">☆</span><span class="star" data-n="2">☆</span><span class="star" data-n="3">☆</span>
    </div>
    <div class="end-actions">
      <a class="icon-square-btn back-square" href="../" aria-label="Back"><span aria-hidden="true">←</span></a>
      <button id="playAgainBtn" class="icon-square-btn again-square" type="button" aria-label="Again"><span aria-hidden="true">↻</span></button>
    </div>
  </section>
</main>

<script src="../../../la-stars.js"></script>
<script src="script.js"></script>
<script src="../../../../theme.js"></script>
</body>
</html>
