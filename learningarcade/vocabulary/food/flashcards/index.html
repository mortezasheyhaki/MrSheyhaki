<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Food Flashcards | Mr. Sheyhaki</title>
<meta name="description" content="Flip food flashcards — picture and English word. Elementary vocabulary.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../../../theme.css">
</head>
<body class="game-page">
<header class="game-header">
  <a class="back-button" href="../" id="headerBack">← Food</a>
  <div class="header-center">
    <span class="eyebrow">VOCABULARY · ELEMENTARY</span>
    <strong>Food Flashcards</strong>
  </div>
  <span class="header-spacer" aria-hidden="true"></span>
</header>

<main class="app app-fixed">
  <!-- START -->
  <section id="startScreen" class="panel panel-fill">
    <div class="hero-icon" aria-hidden="true">🃏</div>
    <h1>Food Flashcards</h1>
    <p class="lead">Flip cards to learn food words. Picture on one side, word on the other.</p>

    <div class="mode-tabs" id="modeTabs" role="tablist" aria-label="Card side first">
      <button type="button" class="mode-tab active" data-mode="pic-first" role="tab" aria-selected="true">
        <span class="mode-ico" aria-hidden="true">🖼️</span>
        <span class="mode-label">Picture first</span>
      </button>
      <button type="button" class="mode-tab" data-mode="word-first" role="tab" aria-selected="false">
        <span class="mode-ico" aria-hidden="true">🔤</span>
        <span class="mode-label">Word first</span>
      </button>
    </div>

    <ul class="feature-list">
      <li>45 food words</li>
      <li>Tap card to flip · hear the word</li>
      <li>Shuffle · known tracker</li>
    </ul>
    <button id="startBtn" class="primary-btn" type="button">START ▶</button>
  </section>

  <!-- STUDY -->
  <section id="studyScreen" class="panel panel-fill" hidden>
    <div class="study-top">
      <button type="button" id="backToStart" class="icon-btn" aria-label="Back">←</button>
      <div class="progress-meta">
        <span id="counterText">1 / 45</span>
        <span class="dot" aria-hidden="true">·</span>
        <span id="knownText">0 known</span>
      </div>
      <button type="button" id="shuffleBtn" class="icon-btn" aria-label="Shuffle" title="Shuffle">⇄</button>
    </div>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="stage">
      <div class="flash-wrap" id="flashWrap">
        <button type="button" class="flash-card" id="flashCard" aria-label="Flip card">
          <div class="face face-front" id="faceFront">
            <img id="frontImg" alt="" decoding="async">
            <span class="face-word" id="frontWord" hidden></span>
            <span class="face-hint">Tap to flip</span>
          </div>
          <div class="face face-back" id="faceBack">
            <span class="face-word" id="backWord"></span>
            <img id="backImg" alt="" decoding="async" hidden>
            <span class="face-hint">Tap to flip</span>
          </div>
        </button>
      </div>
    </div>

    <div class="study-actions">
      <button type="button" id="prevBtn" class="nav-btn" aria-label="Previous">‹</button>
      <button type="button" id="audioBtn" class="audio-btn" aria-label="Play audio">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <button type="button" id="knowBtn" class="know-btn" aria-label="Mark known" aria-pressed="false">✓</button>
      <button type="button" id="nextBtn" class="nav-btn" aria-label="Next">›</button>
    </div>
  </section>
</main>

<script src="script.js"></script>
<script src="../../../../theme.js"></script>
</body>
</html>
