<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Learning Arcade | Mr. Sheyhaki</title>

  <meta
    name="description"
    content="Fun games for English learners — choose Adults or Kids & Teens."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: var(--la-bg, #07080f);
      color: var(--la-text, #f4f6fb);
      min-height: 100dvh;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }


    /* =========================================================
       THEME VARIABLES (dark default on this page, light optional)
    ========================================================= */
    :root,
    html[data-theme="dark"] {
      --la-bg: #07080f;
      --la-text: #f4f6fb;
      --la-muted: #94a3b8;
      --la-card-adult-border: rgba(56, 189, 248, 0.55);
      --la-card-kids-border: rgba(251, 191, 36, 0.55);
      --la-nav-bg: rgba(8, 10, 20, 0.85);
      --la-nav-border: rgba(255, 255, 255, 0.18);
      --la-nav-link: #e2e8f0;
      --la-title-glow: #e879f9;
    }

    html[data-theme="light"] {
      --la-bg: #f0f4ff;
      --la-text: #1e1b4b;
      --la-muted: #64748b;
      --la-card-adult-border: rgba(37, 99, 235, 0.45);
      --la-card-kids-border: rgba(217, 119, 6, 0.45);
      --la-nav-bg: rgba(255, 255, 255, 0.9);
      --la-nav-border: rgba(15, 23, 42, 0.12);
      --la-nav-link: #334155;
      --la-title-glow: #7c3aed;
    }




    /* =========================================================
       ARCADE BACKGROUND
    ========================================================= */

    .arcade-bg {
      position: relative;

      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 28px 16px 56px;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 15% 10%,
          rgba(99, 102, 241, 0.35),
          transparent 45%
        ),

        radial-gradient(
          ellipse at 85% 20%,
          rgba(236, 72, 153, 0.22),
          transparent 42%
        ),

        radial-gradient(
          ellipse at 50% 100%,
          rgba(34, 211, 238, 0.12),
          transparent 50%
        ),

        radial-gradient(
          ellipse at 50% 40%,
          rgba(15, 23, 42, 0.9),
          #07080f 70%
        );
    }


    /* GRID BACKGROUND */

    .arcade-bg::before {
      content: "";

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(148, 163, 184, 0.04) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(148, 163, 184, 0.04) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      pointer-events: none;

      z-index: 0;
    }


    /* SCANLINES */

    .arcade-bg::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.12) 2px,
          rgba(0, 0, 0, 0.12) 4px
        );

      opacity: 0.35;

      pointer-events: none;

      z-index: 0;
    }


    .arcade-bg > * {
      position: relative;
      z-index: 1;
    }


    /* =========================================================
       FLOATING ARCADE ICONS
    ========================================================= */

    .float-icons {
      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 0;

      overflow: hidden;
    }


    .fi {
      position: absolute;

      width: 58px;
      height: 58px;

      object-fit: contain;

      opacity: 0.42;

      pointer-events: none;

      filter:
        drop-shadow(
          0 0 6px rgba(167, 139, 250, 0.45)
        )
        drop-shadow(
          0 0 14px rgba(56, 189, 248, 0.18)
        );

      animation:
        float-y 6s ease-in-out infinite;
    }


    /* LEFT / RIGHT POSITIONS */

    .fi-left {
      left: 3%;
    }

    .fi-right {
      right: 3%;
    }


    /* ICON 1 */

    .fi-1 {
      top: 10%;

      width: 68px;
      height: 68px;

      animation-delay: 0s;
    }


    /* ICON 2 */

    .fi-2 {
      top: 27%;

      width: 50px;
      height: 50px;

      opacity: 0.32;

      animation-delay: 0.8s;
    }


    /* ICON 3 */

    .fi-3 {
      top: 45%;

      width: 64px;
      height: 64px;

      animation-delay: 1.6s;
    }


    /* ICON 4 */

    .fi-4 {
      top: 64%;

      width: 54px;
      height: 54px;

      opacity: 0.35;

      animation-delay: 2.2s;
    }


    /* ICON 5 */

    .fi-5 {
      top: 80%;

      width: 48px;
      height: 48px;

      opacity: 0.30;

      animation-delay: 1.1s;
    }


    /* FLOATING ANIMATION */

    @keyframes float-y {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-14px);
      }

    }


    /* HIDE FLOATING ICONS ON SMALL SCREENS */

    @media (max-width: 900px) {

      .float-icons {
        display: none;
      }

    }


    /* =========================================================
       HEADER
    ========================================================= */

    .arcade-header {
      text-align: center;

      margin-bottom: 44px;

      max-width: 960px;
    }


    .eyebrow {
      display: inline-block;

      font-size: 0.95rem;
      font-weight: 700;

      letter-spacing: 0.14em;

      text-transform: uppercase;

      color: #e0f2fe;

      margin-bottom: 12px;

      padding: 6px 16px;

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.18),
          rgba(167, 139, 250, 0.14),
          rgba(236, 72, 153, 0.1)
        );

      border:
        1px solid rgba(125, 211, 252, 0.45);

      box-shadow:
        0 0 12px rgba(56, 189, 248, 0.35),
        0 0 28px rgba(167, 139, 250, 0.2),
        inset 0 0 12px rgba(255, 255, 255, 0.04);

      text-shadow:
        0 0 8px rgba(125, 211, 252, 0.7),
        0 0 16px rgba(96, 165, 250, 0.4);
    }


    /* =========================================================
       NEON TITLE
    ========================================================= */

    @keyframes neon-flicker {

      0%,
      19%,
      21%,
      23%,
      25%,
      54%,
      56%,
      100% {

        opacity: 1;

        text-shadow:
          0 0 4px #fff,
          0 0 10px #ff2d95,
          0 0 20px #ff2d95,
          0 0 35px #00d4ff,
          0 0 55px #7c3aed;
      }

      20%,
      24%,
      55% {

        opacity: 0.7;

        text-shadow: none;
      }

    }


    .arcade-title-flicker {

      font-family:
        "Press Start 2P",
        system-ui,
        monospace;

      font-size:
        clamp(1.15rem, 4.2vw, 2.1rem);

      font-weight: 400;

      letter-spacing: 0.06em;

      text-transform: uppercase;

      line-height: 1.35;

      margin-bottom: 18px;

      color: #ffe566;

      animation:
        neon-flicker 3s linear infinite;
    }


    /* =========================================================
       TAGLINE
    ========================================================= */

    .tagline-row {

      display: inline-flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 8px 14px;

      padding: 8px 18px;

      border-radius: 999px;

      border:
        1px solid rgba(125, 211, 252, 0.35);

      background:
        rgba(15, 23, 42, 0.75);

      backdrop-filter:
        blur(8px);

      font-size: 0.78rem;

      font-weight: 700;

      letter-spacing: 0.12em;

      color: #e2e8f0;

      box-shadow:
        0 0 16px rgba(56, 189, 248, 0.15);
    }


    .tagline-row span {
      color: #64748b;
    }


    /* =========================================================
       CHOICE CARDS
    ========================================================= */

    .choice-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(320px, 1fr));

      gap: 32px;

      width: 100%;

      max-width: 980px;
    }


    .choice-card {

      position: relative;

      border-radius: 24px;

      padding: 40px 32px 36px;

      min-height: 420px;

      text-decoration: none;

      color: inherit;

      display: flex;

      flex-direction: column;

      align-items: center;

      text-align: center;

      transition:
        transform 0.2s,
        box-shadow 0.2s;

      overflow: hidden;
    }


    .choice-card:hover {
      transform:
        translateY(-8px);
    }


    /* =========================================================
       ADULT CARD PULSE
    ========================================================= */

    @keyframes pulse-blue {

      0%,
      100% {

        box-shadow:
          0 0 10px #60a5fa,
          0 0 22px rgba(96, 165, 250, 0.5),
          0 0 40px rgba(59, 130, 246, 0.28),
          inset 0 0 24px rgba(59, 130, 246, 0.05);
      }

      50% {

        box-shadow:
          0 0 16px #60a5fa,
          0 0 36px rgba(96, 165, 250, 0.75),
          0 0 64px rgba(59, 130, 246, 0.48),
          inset 0 0 32px rgba(59, 130, 246, 0.1);
      }

    }


    /* =========================================================
       KIDS CARD PULSE
    ========================================================= */

    @keyframes pulse-gold {

      0%,
      100% {

        box-shadow:
          0 0 10px #fbbf24,
          0 0 22px rgba(251, 191, 36, 0.45),
          0 0 40px rgba(236, 72, 153, 0.3),
          inset 0 0 24px rgba(250, 204, 21, 0.05);
      }

      50% {

        box-shadow:
          0 0 16px #fbbf24,
          0 0 36px rgba(251, 191, 36, 0.7),
          0 0 64px rgba(236, 72, 153, 0.48),
          inset 0 0 32px rgba(250, 204, 21, 0.1);
      }

    }


    .choice-card.adults {

      background:
        linear-gradient(
          160deg,
          #0f172a 0%,
          #1e1b4b 55%,
          #0f172a 100%
        );

      border:
        2px solid #60a5fa;

      animation:
        pulse-blue 2.4s ease-in-out infinite;
    }


    .choice-card.adults:hover {

      animation: none;

      box-shadow:
        0 0 16px #60a5fa,
        0 0 36px rgba(96, 165, 250, 0.85),
        0 0 70px rgba(59, 130, 246, 0.55),
        inset 0 0 32px rgba(59, 130, 246, 0.12);
    }


    .choice-card.kids {

      background:
        linear-gradient(
          160deg,
          #2e1065 0%,
          #701a75 50%,
          #4c1d95 100%
        );

      border:
        2px solid #fbbf24;

      animation:
        pulse-gold 2.4s ease-in-out infinite;
    }


    .choice-card.kids:hover {

      animation: none;

      box-shadow:
        0 0 16px #fbbf24,
        0 0 36px rgba(251, 191, 36, 0.8),
        0 0 70px rgba(236, 72, 153, 0.55),
        inset 0 0 32px rgba(250, 204, 21, 0.12);
    }


    /* =========================================================
       CARD IMAGE
    ========================================================= */

    .card-image {

      width: 200px;
      height: 200px;

      border-radius: 20px;

      margin-bottom: 24px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      border: 2px solid rgba(255, 255, 255, 0.12);

      background: rgba(0, 0, 0, 0.2);

      flex-shrink: 0;
    }


    .choice-card.adults .card-image {

      border-color:
        rgba(96, 165, 250, 0.35);
    }


    .choice-card.kids .card-image {

      border-color:
        rgba(250, 204, 21, 0.35);
    }


    .card-image img {

      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 18px;
    }


    /* =========================================================
       CARD TEXT
    ========================================================= */

    .card-title {

      font-size: 2rem;

      font-weight: 900;

      letter-spacing: 0.03em;

      text-transform: uppercase;

      margin-bottom: 10px;

      line-height: 1.15;
    }


    .choice-card.adults .card-title {

      color: #60a5fa;

      text-shadow:
        0 0 18px rgba(96, 165, 250, 0.5);
    }


    .choice-card.kids .card-title {

      background:
        linear-gradient(
          90deg,
          #fbbf24,
          #f472b6
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;
    }


    .card-desc {

      font-size: 1.05rem;

      color: #94a3b8;

      line-height: 1.5;

      margin-bottom: 28px;

      max-width: 260px;
    }


    .choice-card.kids .card-desc {

      color: #e9d5ff;
    }


    /* =========================================================
       CARD BUTTON
    ========================================================= */

    .card-btn {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-top: auto;

      padding: 14px 32px;

      border-radius: 999px;

      font-size: 0.9rem;

      font-weight: 700;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      border:
        2px solid currentColor;

      background:
        transparent;

      transition:
        background 0.15s,
        color 0.15s;
    }


    .choice-card.adults .card-btn {

      color: #93c5fd;
    }


    .choice-card.adults:hover .card-btn {

      background:
        rgba(96, 165, 250, 0.2);

      color: #fff;
    }


    .choice-card.kids .card-btn {

      color: #fde68a;
    }


    .choice-card.kids:hover .card-btn {

      background:
        rgba(250, 204, 21, 0.2);

      color: #fff;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .arcade-footer {

      margin-top: 48px;

      text-align: center;

      font-size: 0.9rem;

      color: #64748b;
    }


    .arcade-footer strong {

      color: #a78bfa;
    }


    /* =========================================================
       BACK HOME
    ========================================================= */

    .back-home {

      align-self: flex-start;

      margin-bottom: 12px;

      max-width: 980px;

      width: 100%;
    }


    .back-home a {

      color: #94a3b8;

      text-decoration: none;

      font-size: 0.9rem;

      font-weight: 500;

      transition:
        color 0.15s;
    }


    .back-home a:hover {

      color: #e2e8f0;
    }


    /* =========================================================
       MUSIC BUTTON
    ========================================================= */

    .music-toggle {

      position: fixed;

      bottom: 20px;
      right: 20px;

      z-index: 50;

      padding: 10px 16px;

      border-radius: 999px;

      border:
        1px solid rgba(125, 211, 252, 0.45);

      background:
        rgba(15, 23, 42, 0.85);

      backdrop-filter:
        blur(8px);

      color: #e0f2fe;

      font-size: 0.85rem;

      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 0 16px rgba(56, 189, 248, 0.25);

      transition:
        background 0.15s,
        box-shadow 0.15s,
        color 0.15s,
        border-color 0.15s;
    }


    .music-toggle:hover {

      background:
        rgba(30, 41, 59, 0.95);

      box-shadow:
        0 0 24px rgba(56, 189, 248, 0.4);
    }


    .music-toggle.is-playing {

      border-color:
        rgba(251, 191, 36, 0.5);

      color: #fde68a;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .choice-grid {

        grid-template-columns: 1fr;

        max-width: 400px;
      }


      .choice-card {

        min-height: 380px;

        padding: 32px 24px 28px;
      }


      .card-image {

        width: 160px;
        height: 160px;
      }


      .card-title {

        font-size: 1.6rem;
      }


      .arcade-bg {

        padding-top: 20px;
      }

    }

  </style>



  <style>
    /* =========================================================
       LIGHT MODE — Learning Arcade
    ========================================================= */
    html[data-theme="light"] .arcade-bg {
      background:
        radial-gradient(ellipse at 15% 10%, rgba(99, 102, 241, 0.18), transparent 45%),
        radial-gradient(ellipse at 85% 20%, rgba(236, 72, 153, 0.12), transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(34, 211, 238, 0.08), transparent 50%),
        linear-gradient(180deg, #eef2ff 0%, #f8fafc 40%, #f0f4ff 100%);
    }

    html[data-theme="light"] .arcade-bg::before {
      background-image:

    html[data-theme="light"] .arcade-bg::after {

    html[data-theme="light"] .eyebrow {
      color: #4c1d95;

      text-shadow: none;

    }

    html[data-theme="light"] .tagline-row {

      background-clip: text;
      color: transparent;
    }
    html[data-theme="light"] .choice-card.kids .card-desc {
      color: #64748b;
    }
    html[data-theme="light"] .choice-card.adults .card-btn {
      color: #1d4ed8;
      border-color: #2563eb;
    }
    html[data-theme="light"] .choice-card.adults:hover .card-btn {
      background: #2563eb;

    }
    html[data-theme="light"] .choice-card.kids .card-btn {
      color: #b45309;
      border-color: #d97706;
    }
    html[data-theme="light"] .choice-card.kids:hover .card-btn {
      background: #d97706;
      color: #fff;
    }
    html[data-theme="light"] .card-image {
      border-color: rgba(15, 23, 42, 0.12);
      background: rgba(241, 245, 249, 0.9);
      color: #94a3b8;
    }

    /* Light nav */
    html[data-theme="light"] .arcade-nav {
      background: rgba(255, 255, 255, 0.92) !important;
      border-color: rgba(15, 23, 42, 0.12) !important;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }
    html[data-theme="light"] .arcade-nav .nav-link {
      color: #334155 !important;
    }
    html[data-theme="light"] .arcade-nav .nav-link:hover {
      background: rgba(99, 102, 241, 0.08) !important;

    }
    html[data-theme="light"] .arcade-nav .nav-link.active {
      color: #fff !important;
      background: linear-gradient(135deg, #7c5cff, #4ecbff) !important;
    }

    /* Theme FAB on arcade page */
    .site-theme-fab {
      position: fixed;
      right: max(14px, env(safe-area-inset-right, 0px));
      top: max(14px, env(safe-area-inset-top, 0px));
      z-index: 10050;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;

  </button>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script>

    (function () {

      const music =
        document.getElementById("bgMusic");

      const toggle =
        document.getElementById("musicToggle");

      let started = false;


      /* MUSIC VOLUME */

      music.volume = 0.35;


      /* UPDATE MUSIC BUTTON */

      function updateBtn() {

        if (!music.paused) {

          toggle.textContent =
            "🔊 Music";

          toggle.classList.add(
            "is-playing"
          );

        } else {

          toggle.textContent =
            "🔇 Music";

          toggle.classList.remove(
            "is-playing"
          );

        }

      }


      /* MUSIC TOGGLE */

      toggle.addEventListener(
        "click",

        async () => {

          try {

            if (music.paused) {

              await music.play();

              started = true;

            } else {

              music.pause();

            }


            updateBtn();

          } catch (e) {}

        }

      );


      /* SELECT SOUND */

      function playSelectSound() {

        try {

          const ctx =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();


          const osc =
            ctx.createOscillator();


          const gain =
            ctx.createGain();


          osc.type =
            "square";


          osc.frequency.setValueAtTime(
            520,
            ctx.currentTime
          );


          osc.frequency.exponentialRampToValueAtTime(
            880,
            ctx.currentTime + 0.06
          );


          gain.gain.setValueAtTime(
            0.12,
            ctx.currentTime
          );


          gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.12
          );


          osc.connect(gain);

          gain.connect(
            ctx.destination
          );


          osc.start(
            ctx.currentTime
          );


          osc.stop(
            ctx.currentTime + 0.13
          );

        } catch (e) {}

      }


      /* CARD NAVIGATION */

      document
        .querySelectorAll(
          ".choice-card"
        )

        .forEach((card) => {

          card.addEventListener(
            "click",

            function (e) {

              e.preventDefault();


              const href =
                this.getAttribute("href");


              if (!started) {

                music.play()

                  .then(() => {

                    started = true;

                    updateBtn();

                  })

                  .catch(() => {});

              }


              playSelectSound();


              setTimeout(() => {

                window.location.href =
                  href;

              }, 140);

            }

          );

        });


    })();

  </script>
