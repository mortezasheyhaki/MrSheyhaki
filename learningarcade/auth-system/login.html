<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6937d8" />
  <title>Login · Learning Arcade</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../theme.css" />
  <style>
    .auth-wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .auth-card {
      background: rgba(255,255,255,.97);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 10px 0 rgba(84,37,184,.1), 0 18px 36px rgba(32,38,54,.08);
    }
    html[data-theme=dark] .auth-card {
      background: #1e2130;
      box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 18px 36px rgba(0,0,0,.3);
    }
    .auth-title {
      margin: 0 0 6px;
      font-size: 1.5rem;
      font-weight: 900;
      color: #202636;
      text-align: center;
    }
    html[data-theme=dark] .auth-title { color: #f0f2f8; }
    .auth-sub {
      margin: 0 0 24px;
      text-align: center;
      color: #687184;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      border: 2px solid #e8e0ff;
      background: #fff;
      color: #2c2450;
      font: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.15s;
    }
    .auth-tab.is-on {
      background: #6937d8;
      border-color: #6937d8;
      color: #fff;
      box-shadow: 0 3px 0 #5425b8;
    }
    html[data-theme=dark] .auth-tab {
      background: #2a2e42;
      border-color: #3a3f55;
      color: #d0d4e4;
    }
    html[data-theme=dark] .auth-tab.is-on {
      background: #7c4dff;
      border-color: #7c4dff;
      color: #fff;
    }
    .auth-field {
      margin-bottom: 14px;
    }
    .auth-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8b86b0;
      margin-bottom: 6px;
    }
    .auth-field input {
      width: 100%;
      box-sizing: border-box;
      border: 2px solid #e8e0ff;
      background: #faf9ff;
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #202636;
      outline: none;
      transition: border-color 0.15s;
    }
    .auth-field input:focus {
      border-color: #6937d8;
    }
    html[data-theme=dark] .auth-field input {
      background: #2a2e42;
      border-color: #3a3f55;
      color: #f0f2f8;
    }
    .auth-error {
      min-height: 1.3em;
      margin: 0 0 12px;
      font-weight: 700;
      font-size: 0.88rem;
      color: #e11d48;
      text-align: center;
    }
    .auth-success {
      color: #059669;
    }
    .auth-btn {
      width: 100%;
      border: none;
      background: #6937d8;
      color: #fff;
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #5425b8;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .auth-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #5425b8;
    }
    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .auth-guest {
      display: block;
      width: 100%;
      margin-top: 14px;
      border: 2px solid #e8e0ff;
      background: transparent;
      color: #5b527a;
      font: inherit;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    html[data-theme=dark] .auth-guest {
      border-color: #3a3f55;
      color: #a0a6c0;
    }
    .auth-back {
      display: inline-block;
      margin-bottom: 16px;
      font-weight: 800;
      color: #6937d8;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <a class="auth-back" id="authBack" href="../../">← Back to Home</a>

    <div class="auth-card">
      <h1 class="auth-title" id="authTitle">Welcome back</h1>
      <p class="auth-sub" id="authSub">Login to save your progress</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab is-on" id="tabLogin">Login</button>
        <button type="button" class="auth-tab" id="tabRegister">Register</button>
      </div>

      <form id="authForm" autocomplete="on">
        <div class="auth-field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" maxlength="24" placeholder="e.g. ali_7a" required autocomplete="username" />
        </div>

        <div class="auth-field hidden" id="displayNameField">
          <label for="displayName">Display name (optional)</label>
          <input id="displayName" name="displayName" type="text" maxlength="32" placeholder="e.g. Ali" autocomplete="nickname" />
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" maxlength="64" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <p class="auth-error" id="authMsg"></p>

        <button type="submit" class="auth-btn" id="authSubmit">Login</button>
      </form>

      <a class="auth-guest" id="authGuest" href="../../">Continue as Guest</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      // Smart return URL: ?next= / home
      function getReturnUrl() {
        try {
          var params = new URLSearchParams(window.location.search);
          var next = params.get("next");
          if (next && next.charAt(0) === "/" && next.indexOf("//") === -1) {
            return next;
          }
        } catch (e) {}
        return "../../";
      }

      var returnUrl = getReturnUrl();
      var backLink = document.getElementById("authBack");
      var guestLink = document.getElementById("authGuest");
      if (backLink) backLink.href = returnUrl;
      if (guestLink) guestLink.href = returnUrl;

      var mode = "login"; // or "register"
      var form = document.getElementById("authForm");
      var tabLogin = document.getElementById("tabLogin");
      var tabRegister = document.getElementById("tabRegister");
      var title = document.getElementById("authTitle");
      var sub = document.getElementById("authSub");
      var submitBtn = document.getElementById("authSubmit");
      var msg = document.getElementById("authMsg");
      var displayField = document.getElementById("displayNameField");
      var passwordInput = document.getElementById("password");

      function setMode(m) {
        mode = m;
        msg.textContent = "";
        msg.className = "auth-error";

        if (m === "login") {
          tabLogin.classList.add("is-on");
          tabRegister.classList.remove("is-on");
          title.textContent = "Welcome back";
          sub.textContent = "Login to save your progress";
          submitBtn.textContent = "Login";
          displayField.classList.add("hidden");
          passwordInput.autocomplete = "current-password";
        } else {
          tabLogin.classList.remove("is-on");
          tabRegister.classList.add("is-on");
          title.textContent = "Create account";
          sub.textContent = "Register to keep your stars & progress";
          submitBtn.textContent = "Register";
          displayField.classList.remove("hidden");
          passwordInput.autocomplete = "new-password";
        }
      }

      tabLogin.onclick = function () { setMode("login"); };
      tabRegister.onclick = function () { setMode("register"); };

      // If already logged in → redirect
      if (window.LAAuth && LAAuth.isLoggedIn()) {
        window.location.href = returnUrl;
        return;
      }

      form.onsubmit = async function (e) {
        e.preventDefault();
        msg.textContent = "";
        msg.className = "auth-error";
        submitBtn.disabled = true;
        submitBtn.textContent = mode === "login" ? "Logging in…" : "Creating…";

        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;
        var displayName = document.getElementById("displayName").value;

        var result;
        if (mode === "login") {
          result = await LAAuth.login(username, password);
        } else {
          result = await LAAuth.register(username, password, displayName);
        }

        submitBtn.disabled = false;
        submitBtn.textContent = mode === "login" ? "Login" : "Register";

        if (result.ok) {
          msg.className = "auth-error auth-success";
          msg.textContent = mode === "login" ? "Welcome back!" : "Account created!";
          setTimeout(function () {
            window.location.href = returnUrl;
          }, 700);
        } else {
          msg.textContent = result.error || "Something went wrong";
        }
      };
    })();
  </script>
</body>
</html>
