<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic · Tactics For Listening | Mr. Sheyhaki</title>

<link rel="stylesheet" href="../../../style.css">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../../theme.css">
<style>
  :root {
    --tfl-blue: #2563eb;
    --tfl-blue-light: #dbeafe;
    --tfl-blue-border: #93c5fd;
  }
  html[data-theme="dark"] {
    --tfl-blue: #60a5fa;
    --tfl-blue-light: rgba(96, 165, 250, 0.14);
    --tfl-blue-border: rgba(96, 165, 250, 0.28);
  }
  .arcade-intro .eyebrow { color: var(--tfl-blue) !important; }
  .back-link { color: var(--tfl-blue); font-weight: 800; text-decoration: none; font-size: 13px; }
  .unit-grid {
    width: min(calc(100% - 48px), var(--container, 1180px));
    margin: 0 auto 56px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .unit-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 16px 14px 14px;
    border-radius: 16px;
    border: 1.5px solid var(--border, #e7e9ef);
    background: #fff;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 6px 18px rgba(32,38,54,.04);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    overflow: hidden;
  }
  html[data-theme="dark"] .unit-card {
    background: rgba(30, 32, 40, 0.92);
    border-color: rgba(255,255,255,0.08);
  }
  .unit-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(37, 99, 235, 0.1);
    border-color: var(--tfl-blue-border);
  }
  .unit-card.is-soon {
    opacity: 0.55;
    pointer-events: none;
    border-style: dashed;
  }
  .unit-card-index {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--tfl-blue-light);
    color: var(--tfl-blue);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.04em;
  }
  .unit-card h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
  }
  .unit-card p {
    margin: 0;
    font-size: 11px;
    color: var(--muted, #687184);
    line-height: 1.35;
  }
  .unit-card .shine {
    position: absolute;
    top: 0; left: -120%;
    width: 55%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.2), transparent);
    transform: skewX(-18deg);
    pointer-events: none;
  }
  .unit-card:hover .shine { animation: tfl-shine 0.65s ease forwards; }
  @keyframes tfl-shine {
    from { left: -120%; }
    to { left: 140%; }
  }
</style>
</head>
<body class="page-calm">

<header class="arcade-header-bar">

  <a href="../../../learningarcade/profile/" class="nav-link nav-profile" aria-label="Profile" title="My Profile" data-icon="👤"><span class="nav-ico" aria-hidden="true">👤</span><span class="nav-text">Profile</span></a>
</nav>
</header>

<main>
  <section class="arcade-intro">
    <p style="margin:0 0 12px"><a href="../" class="back-link">← Tactics For Listening</a></p>
    <span class="eyebrow">BASIC · 24 UNITS</span>
    <h1>Basic</h1>
    <p>Everyday conversations — names, greetings, numbers, and first social exchanges.</p>
  </section>

    <div>
      <h2>Units</h2>

<script>
(function () {
  var titles = {
    1: "Names & greetings",
    2: "Coming soon",
    3: "Coming soon",
    4: "Coming soon",
    5: "Coming soon",
    6: "Coming soon",
    7: "Coming soon",
    8: "Coming soon",
    9: "Coming soon",
    10: "Coming soon",
    11: "Coming soon",
    12: "Coming soon",
    13: "Coming soon",
    14: "Coming soon",
    15: "Coming soon",
    16: "Coming soon",
    17: "Coming soon",
    18: "Coming soon",
    19: "Coming soon",
    20: "Coming soon",
    21: "Coming soon",
    22: "Coming soon",
    23: "Coming soon",
    24: "Coming soon"
  };
  var grid = document.getElementById("unitGrid");
  for (var i = 1; i <= 24; i++) {
    var n = String(i).padStart(2, "0");
    var ready = i === 1;
    var el = document.createElement(ready ? "a" : "div");
    el.className = "unit-card" + (ready ? "" : " is-soon");
    if (ready) el.href = "unit-" + n + "/";
    el.innerHTML =
      '<span class="shine" aria-hidden="true"></span>' +
      '<span class="unit-card-index">Unit ' + n + '</span>' +
      '<h3>Unit ' + i + '</h3>' +
      '<p>' + (titles[i] || "Coming soon") + '</p>';
    grid.appendChild(el);
  }
})();
</script>
</body>
