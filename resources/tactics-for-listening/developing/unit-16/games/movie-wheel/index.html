<!DOCTYPE html>
<html lang="en" class="ww-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Movie Wheel · Unit 16 · Developing · Tactics For Listening | Mr. Sheyhaki</title>
<meta name="description" content="Listen to each recording, then tap the kind of movie it describes. Tactics For Listening Developing Unit 16 — Movies.">
<link rel="stylesheet" href="style.css">
<style>a.profile-fab,.profile-fab{display:none!important;visibility:hidden!important;pointer-events:none!important}</style>
</head>
<body class="game-page ww-page" data-course="tactics-for-listening" data-type="game" data-level="developing" data-unit="16">
<div class="deco" aria-hidden="true">
  <span style="top:9%;left:6%">🎬</span>
  <span style="top:24%;left:14%;animation-delay:-2s">🍿</span>
  <span style="top:62%;left:4%;animation-delay:-5s">🎞️</span>
  <span style="top:84%;left:16%;animation-delay:-3s">🎥</span>
  <span style="top:10%;right:8%;animation-delay:-4s">🎟️</span>
  <span style="top:36%;right:4%;animation-delay:-1s">📽️</span>
  <span style="top:66%;right:12%;animation-delay:-6s">🎭</span>
  <span style="top:86%;right:4%;animation-delay:-2.5s">🎬</span>
</div>
<div class="app">
  <header>
    <div class="header-left">
      <a class="ww-back" href="../../" aria-label="Back to Unit 16">←</a>
      <h1>🎡 Movie Wheel</h1>
    </div>
    <div class="hud">
      <span class="pill" id="round">Clip 1/6</span>
      <span class="pill" id="score">✅ 0</span>
      <button type="button" class="iconbtn" id="mute" aria-label="Toggle sound effects">🔊</button>
    </div>
  </header>
  <div class="bar"><i id="prog"></i></div>

  <div class="stage" id="stage">
    <div class="ring"></div>
    <svg class="chains" id="chains" aria-hidden="true"></svg>
    <div class="center" id="target">
      <button type="button" class="mw-play" id="play" aria-label="Play the recording"></button>
    </div>
    <div class="feedback" id="fb" aria-live="polite"></div>
  </div>

  <p class="tip" id="tip">Tap play to listen</p>
</div>

<div class="screen on" id="start">
  <div class="screen-card">
    <div class="screen-icon" aria-hidden="true">🎡</div>
    <h2>Movie Wheel</h2>
    <p>Listen to each person. When the recording ends, tap the kind of movie they describe on the wheel.</p>
    <button type="button" class="btn" id="go">Start</button>
    <a class="screen-back" href="../../">← Back to Unit 16</a>
  </div>
</div>

<div class="screen" id="end" hidden></div>

<script src="../../../../../../script.js"></script>
<script src="../../../../../../theme.js"></script>
<script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
<script src="/learningarcade/la-sfx.js"></script>
<script src="script.js"></script>
</body>
</html>
