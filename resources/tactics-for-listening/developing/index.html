<script>
(function () {
  var titles = { 1: "The weekend" };
  var grid = document.getElementById("unitGrid");
  for (var i = 1; i <= 24; i++) {
    var n = String(i).padStart(2, "0");
    var ready = i === 1;
    var el = document.createElement(ready ? "a" : "div");
    el.className = "tfl-unit " + (ready ? "is-ready" : "is-soon");
    if (ready) el.href = "unit-" + n + "/";
    if (!ready) el.setAttribute("aria-disabled", "true");
    el.innerHTML =
      '<span class="tfl-unit-no">Unit</span>' +
      '<span class="tfl-unit-num">' + n + '</span>' +
      (ready
        ? '<h3 class="tfl-unit-title">' + titles[i] + '</h3>'
        : '<p class="tfl-unit-soon">Coming soon</p><span class="tfl-unit-lock" aria-hidden="true">🔒</span>');
    grid.appendChild(el);
  }
})();
</script>
