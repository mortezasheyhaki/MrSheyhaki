<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)
document.documentElement.setAttribute("data-theme","dark");
else document.documentElement.setAttribute("data-theme","light");
}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Listen &amp; Complete · Abilities · Unit 11 | Teen2Teen 1 | Mr. Sheyhaki</title>
<meta name="description" content="Listen, then complete the sentence with word chips – Teen2Teen 1 Unit 11.">
<link rel="stylesheet" href="../../../../../../style.css">
<link rel="stylesheet" href="../../../../../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page" data-course="teen2teen" data-type="game" data-level="1" data-unit="11">
<main class="app" id="app">
  <section class="start-screen" id="startScreen">
    <header class="topbar">
      <a class="back" href="../" aria-label="Back">←</a>
      <span class="title">Listen &amp; Complete</span>
      <span class="badge">Unit 11</span>
    </header>
    <div class="start-body">
      <div class="hero" aria-hidden="true">🧩</div>
      <h1>Listen &amp; Complete</h1>
      <p class="lead">Listen to the sentence, then tap the chips to complete it.</p>
      <p class="muted">8 sentences · can / can’t</p>
      <button type="button" class="primary-btn" id="startBtn">Start</button>
    </div>
  </section>

  <section class="game-screen hidden" id="gameScreen">
    <header class="topbar">
      <a class="back" href="../" aria-label="Back">←</a>
      <span class="title" id="roundLabel">1 / 8</span>
      <div class="score-pill" id="scorePill" aria-label="Score">
        <span>★</span> <span id="scoreNum">0</span>
      </div>
    </header>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

    <div class="listen-panel">
      <button type="button" class="mc-play" id="playBtn" aria-label="Play sentence">
        <span class="wave"></span><span class="wave"></span><span class="wave"></span>
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <div class="eq"><span></span><span></span><span></span><span></span></div>
      </button>
      <div class="listen-text">
        <strong>Listen</strong>
        <span id="feedback">Tap play, then complete the sentence.</span>
      </div>
    </div>

    <div class="sentence-row" id="sentenceRow" aria-label="Complete the sentence"></div>
    <div class="chip-bank" id="chipBank" role="group" aria-label="Word chips"></div>
  </section>
</main>
<script src="../../../../../../script.js"></script>
<script src="../../../../../../theme.js"></script>
<script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
<script src="/learningarcade/la-sfx.js"></script>
<script src="script.js"></script>
</body>
</html>
