<!DOCTYPE html>
<html lang="en">
<head>
<script src="/resources/auth-gate.js"></script>
<script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)
document.documentElement.setAttribute("data-theme","dark");
else document.documentElement.setAttribute("data-theme","light");
}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Brazil Reading Check · Unit 12 | Teen2Teen 1 | Mr. Sheyhaki</title>
<meta name="description" content="Brazil Reading Check – Teen2Teen 1 Unit 12: You should visit Brazil! Listen, circle the names and tick the true sentences.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../../../../../../style.css">
<link rel="stylesheet" href="../../../../../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="bk" id="game-app">

  <div class="bk-topbar">
    <button class="bk-switch" id="bk-theme" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="bk-sw-ico" aria-hidden="true">☀️</span>
      <span class="bk-sw-ico" aria-hidden="true">🌙</span>
      <span class="bk-knob" aria-hidden="true"></span>
    </button>
  </div>

  <!-- Book-style header -->
  <header class="bk-head">
    <a class="bk-back" href="../" aria-label="Back to games">←</a>
    <div class="bk-num" aria-hidden="true">12</div>
    <div class="bk-title">
      <h1>You should visit Brazil!</h1>
    </div>
    <div class="bk-badge" aria-hidden="true">Teen<b>2</b>Teen<small>Friends</small></div>
  </header>

  <!-- Phone tabs (hidden on desktop) -->
  <nav class="bk-tabs" role="tablist" aria-label="Game parts">
    <button class="bk-tab is-on" data-tab="read" role="tab" aria-selected="true">1 · Listen &amp; read</button>
    <button class="bk-tab" data-tab="circle" role="tab" aria-selected="false">2 · Circle</button>
    <button class="bk-tab" data-tab="check" role="tab" aria-selected="false">3 · Tick</button>
  </nav>

  <div class="bk-panels">
    <!-- Part 1: listen and read -->
    <section class="bk-panel is-on" data-panel="read" aria-labelledby="p1">
      <div class="bk-panel-head">
        <span class="bk-part">1</span>
        <h2 id="p1">Read and listen</h2>
      </div>
      <div class="bk-player" id="bk-player">
        <button class="bk-listen" id="bk-listen" aria-label="Play the webchat">
          <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
        </button>
        <div class="bk-track" id="bk-track" role="slider" tabindex="0" aria-label="Seek the audio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bk-fill"></span></div>
        <div class="bk-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <span class="bk-time" id="bk-time">0:00</span>
      </div>
      <div class="bk-chat" id="bk-chat"></div>
    </section>

    <!-- Part 2: circle the names -->
    <section class="bk-panel" data-panel="circle" aria-labelledby="p2">
      <div class="bk-panel-head">
        <span class="bk-part">2</span>
        <h2 id="p2">Circle the correct name or names</h2>
      </div>
      <div class="bk-qs" id="bk-qs"></div>
    </section>

    <!-- Part 3: tick the true sentences -->
    <section class="bk-panel" data-panel="check" aria-labelledby="p3">
      <div class="bk-panel-head">
        <span class="bk-part">3</span>
        <h2 id="p3">According to Ana, what's Brazil like? Tick the true sentences.</h2>
      </div>
      <div class="bk-stmts" id="bk-stmts"></div>
    </section>
  </div>

  <footer class="bk-foot">
    <p class="bk-result" id="bk-result" aria-live="polite"></p>
    <div class="bk-actions">
      <button class="bk-btn bk-btn--check" id="bk-check">Check answers ✓</button>
      <button class="bk-btn bk-btn--finish" id="bk-finish" hidden>See my score ⭐</button>
    </div>
  </footer>

  <audio id="bk-audio" preload="auto" src="https://cdn.imgurl.ir/uploads/u5443_.mp3"></audio>
</main>

<script src="../../../../../../script.js"></script>
<script src="../../../../../../theme.js"></script>
<script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
<script src="script.js"></script>
<script src="/visit-counter.js" defer></script>
</body>
</html>
