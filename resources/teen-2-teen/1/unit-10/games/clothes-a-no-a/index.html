<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)
document.documentElement.setAttribute("data-theme","dark");
else document.documentElement.setAttribute("data-theme","light");
}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>A / No A · Unit 10 | Teen2Teen 1 | Mr. Sheyhaki</title>
<meta name="description" content="Swipe clothes words: a or no a? Teen2Teen 1 Unit 10">
<link rel="stylesheet" href="../../../../../../style.css">
<link rel="stylesheet" href="../../../../../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page" data-course="teen2teen" data-type="game" data-level="1" data-unit="10">

<main id="game-app" class="aa-game">

  <!-- Top bar -->
  <div class="aa-topbar">
    <a href="../" class="aa-back" aria-label="Back">←</a>
    <div class="aa-title">A / No A · Unit 10</div>
    <div class="aa-hud">
      <span class="aa-hud-item"><span class="aa-hud-label">Score</span> <strong id="score">0</strong></span>
      <span class="aa-hud-item aa-time"><span class="aa-hud-label">Time</span> <strong id="timer">60</strong></span>
      <span class="aa-hud-item"><span class="aa-hud-label">Combo</span> <strong id="combo">0x</strong></span>
    </div>
  </div>

  <div class="aa-progress">
    <div class="aa-progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- Game screen -->
  <div class="aa-play" id="gameScreen">
    <div class="aa-targets">
      <div class="aa-target aa-target-noa" id="targetNoA" data-answer="noa">
        <span class="aa-target-dir">←</span>
        <span class="aa-target-label">
          <span class="aa-crossed-a" aria-hidden="true"><span class="aa-a-letter">a</span><span class="aa-cross">✕</span></span>
          <span>no a</span>
        </span>
      </div>
      <div class="aa-target aa-target-a" id="targetA" data-answer="a">
        <span class="aa-target-dir">→</span>
        <span class="aa-target-label">a</span>
      </div>
    </div>

    <div class="aa-card-area">
      <div class="aa-card" id="swipeCard" role="button" tabindex="0" aria-label="Swipe left for no a or right for a">
        <img class="aa-card-img" id="cardImg" src="" alt="" draggable="false">
        <span class="aa-word" id="word">—</span>
      </div>
    </div>

    <p class="aa-hint">Swipe left or right</p>
    <p class="aa-feedback" id="feedback" aria-live="polite"></p>
    <p class="sr-only" id="status" aria-live="polite"></p>
  </div>

  <!-- Start overlay -->
  <div class="aa-overlay" id="startOverlay">
    <div class="aa-panel">
      <div class="aa-hero" aria-hidden="true">👕</div>
      <h1>A / No A</h1>
      <p class="aa-desc">Does this clothes word take <strong>a</strong> or <strong>no a</strong>?</p>
      <div class="aa-guide">
        <span class="aa-guide-noa">
          <strong>←</strong>
          <span class="aa-crossed-a small"><span class="aa-a-letter">a</span><span class="aa-cross">✕</span></span>
          no a
        </span>
        <span class="aa-guide-a"><strong>→</strong> a</span>
      </div>
      <p class="aa-tip">Example: <em>a sweater</em> · <em>shorts</em></p>
      <button type="button" class="aa-btn" id="startBtn">Start</button>
    </div>
  </div>

  <!-- End overlay (fallback if LAFinish unavailable) -->
  <div class="aa-overlay aa-hidden" id="endModal">
    <div class="aa-panel">
      <div class="aa-hero" id="resultIcon" aria-hidden="true">🏆</div>
      <h1 id="endTitle">Excellent!</h1>
      <p class="aa-desc" id="endMessage">Great job!</p>
      <div class="aa-results">
        <div><span>Score</span><strong id="finalScore">0</strong></div>
        <div><span>Accuracy</span><strong id="accuracy">0%</strong></div>
        <div><span>Best combo</span><strong id="bestCombo">0x</strong></div>
      </div>
      <button type="button" class="aa-btn" id="playAgain">Play again</button>
    </div>
  </div>

</main>

<script src="../../../../../../script.js"></script>
<script src="../../../../../../theme.js"></script>
<script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
<script src="/learningarcade/la-sfx.js"></script>
<script src="script.js"></script>
</body>
</html>
