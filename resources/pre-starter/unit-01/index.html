<style>
:root {
    --u-purple: #14b8a6;
    --u-purple-light: #ccfbf1;
    --u-purple-border: #99f6e4;
    --u-on-accent: #ffffff;
    --u-text: #202636;
    --u-muted: #687184;
    --u-border: #e7e9ef;
    --u-ok: #07966d;
    --u-bad: #ed3036;
    --u-orange: #ed7d00;
    --u-bg: #f6f5fa;
    --u-card: #ffffff;
    --u-soft: #faf9fc;
    --u-bank: #f3f4f8;
    --u-shadow: 0 6px 20px rgba(32,38,54,.05);
  }
  html[data-theme="dark"] {
    --u-purple: #5eead4;
    --u-purple-light: rgba(94, 234, 212, 0.12);
    --u-purple-border: rgba(94, 234, 212, 0.25);
    --u-on-accent: #042f2e;
    --u-text: #e8ecf4;
    --u-muted: #94a3b8;
    --u-border: #2d3548;
    --u-ok: #34d399;
    --u-bad: #f87171;
    --u-orange: #fb923c;
    --u-bg: #0f1220;
    --u-card: #1a1f2e;
    --u-soft: #151a28;
    --u-bank: #121722;
    --u-shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  body { background: var(--u-bg); color: var(--u-text); }
  .back-row { width: min(calc(100% - 32px), 960px); margin: 20px auto 0; }
  .back-row a { color: var(--u-purple); font-weight: 800; text-decoration: none; font-size: 0.9rem; }
  .unit-hero {
    width: min(calc(100% - 32px), 960px);
    margin: 16px auto 24px;
    padding: 28px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-radius: 22px;
    border: 1px solid var(--u-purple-border);
    background: linear-gradient(135deg, var(--u-purple-light) 0%, var(--u-soft) 100%);
  }
  .unit-hero .unit-index {
    color: var(--u-purple);
    font-size: clamp(48px, 10vw, 72px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
  }
  .unit-hero h1 { margin: 0 0 6px; font-size: clamp(1.25rem, 4vw, 1.6rem); }
  .unit-hero p { margin: 0; color: var(--u-muted); font-weight: 600; font-size: 0.95rem; }
  .section-label {
    width: min(calc(100% - 32px), 960px);
    margin: 8px auto 12px;
    font-size: 0.75rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--u-purple);
  }
  .topic-grid {
    width: min(calc(100% - 32px), 960px);
    margin: 0 auto 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .topic-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 22px 20px;
    background: var(--u-card);
    border: 1px solid var(--u-border);
    border-radius: 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--u-shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    min-height: 150px;
  }
  
  .topic-card { position: relative; overflow: hidden; }
  .topic-card::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.08) 60%, transparent 100%);
    transform: skewX(-20deg);
    pointer-events: none;
  }
  html[data-theme="dark"] .topic-card::after {
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.04) 40%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.04) 60%, transparent 100%);
  }
  .topic-card:hover::after { animation: card-shine 0.75s ease forwards; }
  @keyframes card-shine {
    from { left: -120%; }
    to { left: 140%; }
  }

  .topic-card:hover {
    transform: translateY(-3px);
    border-color: var(--u-purple-border);
    box-shadow: var(--u-shadow);
  }
  .topic-card h3 { margin: 0; font-size: 1.2rem; font-weight: 800; }
  .topic-card p { margin: 0; color: var(--u-muted); font-size: 0.9rem; font-weight: 600; line-height: 1.45; flex: 1; }
  .topic-meta { font-size: 0.78rem; font-weight: 800; color: var(--u-purple); }
  .topic-go { margin-top: auto; font-size: 0.8rem; font-weight: 900; color: var(--u-purple); }
  .site-footer { text-align: center; padding: 24px; color: var(--u-muted); font-size: 0.85rem; font-weight: 600; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--u-purple-light, #ccfbf1);
    color: var(--u-purple, #14b8a6);
    text-decoration: none;
    border: 1px solid var(--u-purple-border, #99f6e4);
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  .back-btn:hover {
    transform: translateY(-1px);
    background: color-mix(in srgb, var(--u-purple, #14b8a6) 18%, var(--u-card, #fff));
  }
  .back-btn:active { transform: translateY(0); }
  .back-btn svg {
    width: 20px;
    height: 20px;
    display: block;
  }
  .back-row { margin-bottom: 8px; }

</style>
</head>
