<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronunciation | Greetings | Unit 1 | Pre-starter</title>
<link rel="stylesheet" href="../../../../../style.css">
<link rel="stylesheet" href="../../../../style.css">
<link rel="stylesheet" href="../../../../../theme.css">
<style>
  :root {
    --u-purple: #14b8a6;
    --u-purple-light: #ccfbf1;
    --u-purple-border: #99f6e4;
    --u-on-accent: #ffffff;
    --u-text: #202636;
    --u-muted: #687184;
    --u-border: #e7e9ef;
    --u-ok: #07966d;
    --u-bg: #f6f5fa;
    --u-card: #ffffff;
    --u-soft: #faf9fc;
    --u-shadow: 0 6px 20px rgba(32,38,54,.05);
  }
  html[data-theme="dark"] {
    --u-purple: #5eead4;
    --u-purple-light: rgba(94, 234, 212, 0.12);
    --u-purple-border: rgba(94, 234, 212, 0.25);
    --u-on-accent: #042f2e;
    --u-text: #e8ecf4;
    --u-muted: #94a3b8;
    --u-border: #2d3548;
    --u-ok: #34d399;
    --u-bg: #0f1220;
    --u-card: #1a1f2e;
    --u-soft: #151a28;
    --u-shadow: 0 8px 28px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--u-bg);
    color: var(--u-text);
  }
  .back-row { width: min(calc(100% - 32px), 900px); margin: 20px auto 12px; }
  .back-row a { color: var(--u-purple); font-weight: 800; text-decoration: none; font-size: 0.9rem; }
  .wrap { width: min(calc(100% - 32px), 900px); margin: 0 auto 48px; }
  .panel {
    background: var(--u-card);
    border: 1px solid var(--u-border);
    border-radius: 20px;
    padding: 22px 18px 22px;
    box-shadow: var(--u-shadow);
  }
  h1 { margin: 0 0 6px; font-size: 1.4rem; font-weight: 900; color: var(--u-text); }
  .desc { color: var(--u-muted); font-weight: 600; font-size: 0.95rem; margin: 0 0 14px; }
  .drill-progress {
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--u-muted);
    margin-bottom: 14px;
  }
  .drill-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  @media (max-width: 800px) {
    .drill-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .drill-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .drill-card { min-height: 120px; padding: 10px 8px; }
    .drill-phrase { font-size: 0.88rem; }
    .drill-btn { padding: 8px 10px; min-height: 36px; }
    .panel { padding: 16px 12px 18px; }
  }
  .drill-card {
    border: 2px solid var(--u-purple-border);
    border-radius: 14px;
    padding: 12px 10px 12px;
    background: var(--u-soft);
    display: flex;
    flex-direction: column;
    min-height: 132px;
  }
  .drill-card.active {
    border-color: var(--u-purple);
    background: var(--u-purple-light);
  }
  .drill-card.done {
    border-color: var(--u-ok);
    background: rgba(7,150,109,.12);
  }
  .drill-phrase {
    font-size: 0.95rem;
    font-weight: 900;
    margin-bottom: 4px;
    line-height: 1.25;
  }
  .drill-syll {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--u-purple);
    margin-bottom: 2px;
  }
  .drill-tip {
    font-size: 0.72rem;
    color: var(--u-muted);
    font-weight: 600;
    margin-bottom: 10px;
    flex: 1;
    line-height: 1.3;
  }
  .drill-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .drill-btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 0.75rem;
    padding: 7px 10px;
    border-radius: 9px;
    background: var(--u-purple);
    color: var(--u-on-accent, #fff);
  }
  .drill-btn.ghost {
    background: var(--u-card);
    color: var(--u-text);
    border: 1px solid var(--u-border);
  }
  .drill-btn:disabled { opacity: 0.55; cursor: default; }
  .act-btn {
    appearance: none;
    border: 1px solid var(--u-border);
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 0.9rem;
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--u-card);
    color: var(--u-text);
  }
  .feedback { margin-top: 12px; font-weight: 800; font-size: 0.95rem; min-height: 22px; }
  .feedback.ok { color: var(--u-ok); }
  .site-footer { text-align: center; padding: 24px; color: var(--u-muted); font-size: 0.85rem; font-weight: 600; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--u-purple-light, #ccfbf1);
    color: var(--u-purple, #14b8a6);
    text-decoration: none;
    border: 1px solid var(--u-purple-border, #99f6e4);
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  .back-btn:hover {
    transform: translateY(-1px);
    background: color-mix(in srgb, var(--u-purple, #14b8a6) 18%, var(--u-card, #fff));
  }
  .back-btn:active { transform: translateY(0); }
  .back-btn svg {
    width: 20px;
    height: 20px;
    display: block;
  }
  .back-row { margin-bottom: 8px; }

</style>
</head>
<body>
<header class="arcade-header-bar">
  <nav class="arcade-nav" id="mainNav" aria-label="Main navigation">
    <a href="../../../../../" class="nav-link" aria-label="Home" data-icon="🏠"><span class="nav-ico" aria-hidden="true">🏠</span><span class="nav-text">Home</span></a>
    <a href="../../../../../learningarcade/" class="nav-link" aria-label="Arcade" data-icon="🕹️"><span class="nav-ico" aria-hidden="true">🕹️</span><span class="nav-text">Arcade</span></a>
    <a href="../../../../../topics/" class="nav-link" aria-label="Topics" data-icon="🎯"><span class="nav-ico" aria-hidden="true">🎯</span><span class="nav-text">Topics</span></a>
    <a href="../../../../" class="nav-link active" aria-current="page" aria-label="Resources" data-icon="📚"><span class="nav-ico" aria-hidden="true">📚</span><span class="nav-text">Resources</span></a>
    <a href="../../../../../about/" class="nav-link" aria-label="About" data-icon="ℹ️"><span class="nav-ico" aria-hidden="true">ℹ️</span><span class="nav-text">About</span></a>
  </nav>
</header>
<main>
  <div class="back-row"><a class="back-btn" href="../" aria-label="Back to Greetings" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </a></div>
  <div class="wrap">
    <div class="panel">
      <h1>Say it clearly</h1>
      <p class="desc">Tap <strong>Play</strong>, say the phrase, then <strong>I said it</strong>. Stress is in CAPITALS.</p>
      <div class="drill-progress" id="drillProgress">0 / 8 practiced</div>
      <div class="drill-grid" id="drillList"></div>
      <button type="button" class="act-btn" id="btnResetDrills">Reset drills</button>
      <div class="feedback" id="drillFeedback"></div>
    </div>
  </div>
</main>
<footer class="site-footer"><p>© <span id="year"></span> Mr. Sheyhaki · Resources</p></footer>
<script src="../../../../script.js"></script>
<script src="../../../../../theme.js"></script>
<script>
(function () {
  document.getElementById("year") && (document.getElementById("year").textContent = new Date().getFullYear());

  function markGreetingDone(id) {
    try {
      var KEY = "ps-u1-greetings-done";
      var data = JSON.parse(localStorage.getItem(KEY) || "{}") || {};
      data[id] = true;
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {}
  }

  var DRILLS = [
    { phrase: "Hello.", syll: "he-LLO", tip: "Stress on LLO." },
    { phrase: "Hi.", syll: "HI", tip: "Short & friendly." },
    { phrase: "How are you?", syll: "how are YOU?", tip: "Rise at end." },
    { phrase: "I'm fine, thank you.", syll: "I'm FINE…", tip: "Stress FINE." },
    { phrase: "What's your name?", syll: "…NAME?", tip: "Rise at end." },
    { phrase: "My name's Amy.", syll: "NAME's A-my", tip: "Stress NAME." },
    { phrase: "Nice to meet you!", syll: "NICE… MEET", tip: "Two stresses." },
    { phrase: "Good bye.", syll: "good BYE", tip: "Stress BYE." }
  ];
  var drillDone = {};
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function renderDrills(){
    var list = document.getElementById("drillList");
    list.innerHTML = "";
    var doneCount = 0;
    DRILLS.forEach(function (d, i) {
      var done = !!drillDone[i];
      if (done) doneCount++;
      var card = document.createElement("div");
      card.className = "drill-card" + (done ? " done" : "");
      card.innerHTML =
        '<div class="drill-phrase">' + esc(d.phrase) + '</div>' +
        '<div class="drill-syll">' + esc(d.syll) + '</div>' +
        '<div class="drill-tip">' + esc(d.tip) + '</div>' +
        '<div class="drill-actions">' +
          '<button type="button" class="drill-btn" data-say="' + i + '">▶ Play</button>' +
          '<button type="button" class="drill-btn ghost" data-done="' + i + '"' + (done ? " disabled" : "") + '>' +
            (done ? "✓" : "Done") +
          '</button></div>';
      list.appendChild(card);
    });
    document.getElementById("drillProgress").textContent = doneCount + " / " + DRILLS.length + " practiced";
    var fb = document.getElementById("drillFeedback");
    if (doneCount === DRILLS.length) {
      fb.textContent = "All phrases practiced! ✓";
      markGreetingDone("pronunciation");
      fb.className = "feedback ok";
    } else {
      fb.textContent = "";
      fb.className = "feedback";
    }
    list.querySelectorAll("[data-say]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var i = parseInt(btn.getAttribute("data-say"), 10);
        list.querySelectorAll(".drill-card").forEach(function (c) { c.classList.remove("active"); });
        btn.closest(".drill-card").classList.add("active");
        try {
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(DRILLS[i].phrase);
            u.lang = "en-US";
            u.rate = 0.85;
            window.speechSynthesis.speak(u);
          }
        } catch (e) {}
      });
    });
    list.querySelectorAll("[data-done]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        drillDone[parseInt(btn.getAttribute("data-done"), 10)] = true;
        renderDrills();
      });
    });
  }
  renderDrills();
  document.getElementById("btnResetDrills").addEventListener("click", function () {
    drillDone = {};
    renderDrills();
  });
})();
</script>
</body>
</html>
