<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fridge Grammar | Unit 9A | Mr. Sheyhaki</title>
  <meta name="description" content="Is there / Are there + a, an, some, any. Look in the fridge.">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="app">

    <header class="top-bar">
      <a href="../" class="back-btn" id="backBtn" aria-label="Back">←</a>
      <div class="top-center">
        <span class="unit-label">Unit 9A · Grammar</span>
        <span class="game-title">Fridge Check</span>
      </div>
      <div class="top-stats">
        <div class="stat">
          <span class="stat-label">Part</span>
          <strong id="partNum">1</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Q</span>
          <strong id="qProgress">1/8</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Score</span>
          <strong id="scoreText">0</strong>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="part-tabs">
        <button type="button" class="part-tab active" id="tab1">Part 1 · Questions</button>
        <button type="button" class="part-tab" id="tab2" disabled>Part 2 · Sentences</button>
      </div>

      <div class="desktop-split">
        <div class="fridge-col">
          <div class="fridge-wrap">
            <img src="images/fridge.png" alt="Open refrigerator with food" class="fridge-img" id="fridgeImg">
            <button type="button" class="zoom-btn" id="zoomBtn" title="View fridge">🔍</button>
          </div>
        </div>

        <div class="play-col">
          <p class="instruction" id="instruction">
            Look in the fridge. Write a question with <strong>Is there / Are there</strong> + <strong>a / an / any</strong>, then choose the short answer.
          </p>

          <div class="q-stage" id="qStage"></div>

          <div class="feedback" id="feedback" hidden></div>

          <div class="action-row">
            <button type="button" class="primary-btn" id="checkBtn" disabled>Check</button>
            <button type="button" class="primary-btn continue-btn" id="continueBtn" hidden>Continue →</button>
          </div>
        </div>
      </div>
    </main>

    <div class="zoom-overlay" id="zoomOverlay" hidden>
      <button type="button" class="zoom-close" id="zoomClose" aria-label="Close">✕</button>
      <img src="images/fridge.png" alt="Fridge large view">
    </div>

    <div class="overlay" id="successOverlay" hidden>
      <div class="overlay-card">
        <div class="overlay-ring">
          <div class="overlay-emoji" id="endEmoji">🎉</div>
        </div>
        <h2 id="endTitle">Great work!</h2>
        <p class="end-score" id="endMsg">You finished both parts.</p>
        <div class="end-actions">
          <button type="button" class="end-icon-btn" id="againBtn" title="Play again" aria-label="Play again">
            <span class="end-ico">↻</span>
            <span class="end-ico-label">Again</span>
          </button>
          <a class="end-icon-btn" href="../" id="backHome" title="Back to Unit 9A" aria-label="Back to Unit 9A">
            <span class="end-ico">←</span>
            <span class="end-ico-label">Unit 9A</span>
          </a>
        </div>
      </div>
    </div>

  </div>
  <script src="/theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
