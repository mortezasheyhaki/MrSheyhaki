<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>Listen & Write | Unit 9A | Mr. Sheyhaki</title>
  <meta name="description" content="Listen to the shopping list and write the food and drink they need. Unit 9A – American English File 1.">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="app">

    <!-- Top bar -->
    <header class="top-bar">
      <a href="../" class="back-btn" id="backBtn" aria-label="Back to games">←</a>
      <div class="top-center">
        <span class="unit-label">Unit 9A</span>
        <span class="game-title">Listen & Write</span>
      </div>
      <div class="top-stats">
        <div class="stat">
          <span class="stat-label">Listens</span>
          <span class="stat-value" id="listensLeft">3</span>
        </div>
        <div class="stat">
          <span class="stat-label">Attempts</span>
          <span class="stat-value" id="attemptsLeft">3</span>
        </div>
      </div>
    </header>

    <!-- Main content -->
    <main class="main-content">

      <!-- Instruction -->
      <p class="instruction" id="instruction">
        Listen to the conversation and write the shopping list (11 items).
      </p>

<!-- Audio player -->
<div class="audio-wrap">
  <button class="play-btn" id="playBtn" aria-label="Play audio" type="button">
    <span class="play-icon" id="playIcon">▶</span>
    <div class="visualizer" id="visualizer" hidden>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </button>
  <div class="audio-info">
    <span class="audio-label">Audio · 9.03</span>
    <span class="audio-hint" id="audioHint">Tap to play · 3 listens left</span>
  </div>
</div>

      <!-- Writing boxes -->
      <div class="boxes" id="boxes">
        <!-- Generated by JS -->
      </div>

      <!-- Feedback area -->
      <div class="feedback" id="feedback" hidden></div>

<!-- Continue / Next button -->
<button class="continue-btn" id="continueBtn" hidden type="button">
  Continue
</button>

    </main>

    <!-- Success overlay -->
    <div class="overlay" id="successOverlay">
      <div class="overlay-card">
        <div class="overlay-icon">✓</div>
        <h2>Well done!</h2>
        <p>All answers are correct.</p>
        <button class="continue-btn" id="successContinue" type="button">Continue</button>
      </div>
    </div>

  </div>

  <script src="/theme.js"></script>
  <script src="script.js"></script>

<script>
(function(){
  var btn = document.getElementById("backBtn");
  if (!btn) return;
  btn.addEventListener("click", function(e){
    // If we were opened from Unit 9A (or anywhere else), go back in history
    if (window.history.length > 1) {
      e.preventDefault();
      window.history.back();
    }
    // else fall through to href="../"
  });
})();
</script>

</body>
</html>
