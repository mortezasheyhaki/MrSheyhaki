<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Who Said It? · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Reading</span>
        <h1>Who Said It?</h1>
      </div>
</header>

    <p class="part-desc">Read the texts. Complete each sentence with a name. <span class="hint-muted">Tap a card to zoom.</span></p>

    <div class="split">
      <!-- LEFT: floating article cards -->
      <aside class="articles" id="articles" aria-label="People texts">
        <!-- filled by JS -->
      </aside>

      <!-- RIGHT: writing / sentences -->
      <section class="writing">
        <div class="writing-head">
          <span class="prompt-label">Complete with a name</span>
          <span id="progressLabel" class="progress-label">0 / 7</span>
        </div>
        <div class="sentences" id="sentences"></div>
        <div class="actions-center">
          <button id="checkBtn" class="btn primary">Check all</button>
          <button id="resetBtn" class="btn secondary">Reset</button>
        </div>
        <div id="feedback" class="feedback" role="status"></div>
        <div id="done" class="done-box hidden">
          <div class="stars" id="stars" aria-label="Star rating"></div>
          <p>Well done! <span id="finalScore"></span></p>
          <button id="restartBtn" class="btn secondary">Try again</button>
        </div>
      </section>
    </div>
  </div>

  <!-- Zoom overlay -->
  <div id="zoom" class="zoom hidden" role="dialog" aria-modal="true">
    <div class="zoom-card" id="zoomCard">
      <button type="button" class="zoom-close" id="zoomClose" aria-label="Close">×</button>
      <div id="zoomBody"></div>
    </div>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
