<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Change the Sentences · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../../../theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Grammar</span>
        <h1>Simple Present</h1>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="a">a · Change the sentences</button>
      <button class="tab" data-tab="b">b · + or − verbs</button>
    </nav>

    <!-- ========== PART A ========== -->
    <section id="partA" class="part">
      <p class="part-desc">Change the subject. Make the verb agree.</p>

      <div class="progress-row">
        <span id="aCounter">1 / 10</span>
        <div class="mini-bar"><div id="aBar" class="mini-fill"></div></div>
        <span id="aScore">0 correct</span>
      </div>

      <div class="card" id="aCard">
        <div class="prompt-label">Original</div>
        <p class="prompt" id="aPrompt"></p>

        <div class="prompt-label">Your sentence</div>
        <div class="answer-row">
          <span class="subject-fixed" id="aSubject"></span>
          <input type="text" id="aInput" class="answer-input" placeholder="goes to the movies..." autocomplete="off" spellcheck="false" autocapitalize="off">
        </div>

        <div class="card-actions">
          <button id="aCheck" class="btn primary">Check</button>
          <button id="aSkip" class="btn secondary">Skip</button>
        </div>

        <div id="aFeedback" class="feedback" role="status"></div>
      </div>

      <div class="nav-row">
        <button id="aPrev" class="ctrl" disabled>← Prev</button>
        <button id="aNext" class="ctrl">Next →</button>
      </div>

      <div id="aDone" class="done-box hidden">
        <div class="stars" id="aStars" aria-label="Star rating"></div>
        <p>Part A complete! <span id="aFinalScore"></span></p>
        <button id="aRestart" class="btn secondary">Restart Part A</button>
        <button id="goToB" class="btn primary">Go to Part B →</button>
      </div>
    </section>

    <!-- ========== PART B ========== -->
    <section id="partB" class="part hidden">
      <p class="part-desc">Complete each sentence with a <span class="plus">+</span> or <span class="minus">−</span> verb from the list.</p>

      <div class="verb-bank" id="verbBank">
        <span class="vchip">eat</span>
        <span class="vchip">have</span>
        <span class="vchip">listen</span>
        <span class="vchip">play</span>
        <span class="vchip">read</span>
        <span class="vchip">speak</span>
        <span class="vchip">study</span>
        <span class="vchip">wear</span>
        <span class="vchip">work</span>
      </div>

      <!-- Mobile: one-at-a-time progress -->
      <div class="progress-row b-progress mobile-only" id="bProgressRow">
        <span id="bCounter">1 / 8</span>
        <div class="mini-bar"><div id="bBar" class="mini-fill"></div></div>
        <span id="bScoreEl">0 correct</span>
      </div>

      <div class="b-list" id="bList"></div>

      <div class="actions-center desktop-only" id="bActionsDesktop">
        <button id="bCheck" class="btn primary">Check all</button>
        <button id="bReset" class="btn secondary">Reset</button>
      </div>

      <!-- Mobile one-at-a-time actions (round buttons) -->
      <div class="card-actions mobile-only" id="bActionsMobile">
        <button id="bCheckOne" class="btn primary">Check</button>
        <button id="bSkipOne" class="btn secondary">Skip</button>
      </div>
      <div class="nav-row mobile-only" id="bNavMobile">
        <button id="bPrev" class="ctrl" disabled>← Prev</button>
        <button id="bNext" class="ctrl">Next →</button>
      </div>

      <div id="bFeedback" class="feedback" role="status"></div>

      <div id="bDone" class="done-box hidden">
        <div class="stars" id="bStars" aria-label="Star rating"></div>
        <p>Part B complete! <span id="bFinalScore"></span></p>
        <button id="bRestart" class="btn secondary">Restart Part B</button>
      </div>
    </section>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="../../../../../../theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
