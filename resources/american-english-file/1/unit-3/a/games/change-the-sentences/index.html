<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Change the Sentences · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Grammar</span>
        <h1>Simple Present</h1>
      </div>
</header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="a">a · Change the sentences</button>
      <button class="tab" data-tab="b">b · + or − verbs</button>
    </nav>

    <!-- ========== PART A ========== -->
    <section id="partA" class="part">
      <p class="part-desc">Change the subject. Make the verb agree.</p>

      <div class="progress-row">
        <span id="aCounter">1 / 10</span>
        <div class="mini-bar"><div id="aBar" class="mini-fill"></div></div>
        <span id="aScore">0 correct</span>
      </div>

      <div class="card card-a" id="aCard">
        <div class="original-block">
          <span class="prompt-label">Original</span>
          <p class="prompt" id="aPrompt"></p>
        </div>

        <div class="arrow-hint" aria-hidden="true">↓</div>

        <div class="answer-block">
          <span class="prompt-label">Your sentence</span>
          <div class="answer-field" id="aAnswerField">
            <span class="subject-chip" id="aSubject"></span>
            <input type="text" id="aInput" class="answer-input" placeholder="goes to the movies..." autocomplete="off" spellcheck="false" autocapitalize="off">
          </div>
        </div>

        <div class="card-actions">
          <button id="aPrev" class="nav-circle" aria-label="Previous" disabled>←</button>
          <button id="aCheck" class="btn primary">Check</button>
          <button id="aSkip" class="btn secondary">Skip</button>
          <button id="aNext" class="nav-circle" aria-label="Next">→</button>
        </div>

        <div id="aFeedback" class="feedback" role="status"></div>
      </div>


      <div id="aDone" class="done-box hidden">
        <div class="stars" id="aStars" aria-label="Star rating"></div>
        <p>Part A complete! <span id="aFinalScore"></span></p>
        <button id="aRestart" class="btn secondary">Restart Part A</button>
        <button id="goToB" class="btn primary">Go to Part B →</button>
      </div>
    </section>

    <!-- ========== PART B ========== -->
    <section id="partB" class="part hidden">
      <p class="part-desc">Write the correct form of the verb in ( ). <strong class="plus-legend">+</strong> = positive &nbsp;·&nbsp; <strong class="minus-legend">−</strong> = negative</p>

      <div class="progress-row">
        <span id="bCounter">1 / 8</span>
        <div class="mini-bar"><div id="bBar" class="mini-fill"></div></div>
        <span id="bScoreEl">0 correct</span>
      </div>

      <div class="card card-b" id="bCard">
        <div class="b-list" id="bList"></div>

        <div class="card-actions">
          <button id="bCheck" class="btn primary">Check</button>
          <button id="bSkip" class="btn secondary">Skip</button>
        </div>

        <div id="bFeedback" class="feedback" role="status"></div>
      </div>

      <div id="bDone" class="done-box hidden">
        <div class="stars" id="bStars" aria-label="Star rating"></div>
        <p>Part B complete! <span id="bFinalScore"></span></p>
        <button id="bRestart" class="btn secondary">Restart Part B</button>
      </div>
    </section>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
