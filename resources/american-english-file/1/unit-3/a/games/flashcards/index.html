<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flashcards · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../../../theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back to games">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Vocabulary</span>
        <h1>Flashcards</h1>
      </div>
      <div class="counter">
        <span id="current">1</span> / <span id="total">24</span>
      </div>
    </header>

    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

    <main class="deck-area">
      <div id="card" class="card" tabindex="0">
        <div class="card-inner">
          <div class="card-face card-front">
            <img id="cardImage" src="" alt="Verb phrase illustration" draggable="false">
            <div class="swipe-hint">Swipe or use arrows</div>
          </div>
          <div class="card-face card-back">
            <p id="cardPhrase" class="phrase-text"></p>
            <button id="audioBtn" class="audio-btn" aria-label="Play audio">
              <svg viewBox="0 0 24 24" width="28" height="28"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <div class="controls">
      <button id="prevBtn" class="ctrl-btn" aria-label="Previous">←</button>
      <button id="flipBtn" class="ctrl-btn primary" aria-label="Flip card">Flip</button>
      <button id="nextBtn" class="ctrl-btn" aria-label="Next">→</button>
    </div>

    <div class="footer-actions">
      <button id="shuffleBtn" class="btn secondary">Shuffle</button>
      <button id="restartBtn" class="btn secondary">Restart</button>
    </div>

    <p class="tip">Tap the card or press <kbd>Space</kbd> to flip · Swipe left/right or use arrow keys</p>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="../../../../../../theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
