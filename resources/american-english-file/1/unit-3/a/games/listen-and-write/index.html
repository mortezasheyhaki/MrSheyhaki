<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen & Write · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back to games">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Vocabulary</span>
        <h1>Listen & Write</h1>
        <p>Listen to the verb phrase and type what you hear.</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Progress</span>
          <span id="progress">0</span><span class="stat-total">/24</span>
        </div>
      <button type="button" class="theme-toggle-btn" data-theme-toggle aria-label="Toggle light/dark mode" title="Theme">🌙</button>
        <div class="stat">
          <span class="stat-label">Score</span>
          <span id="score">0</span>
        </div>
      </div>
    </header>

    <div class="progress-bar" aria-hidden="true">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <main class="play-area">
      <div class="audio-panel">
        <button id="playBtn" class="play-btn" aria-label="Play audio">
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
          <svg id="playIcon" viewBox="0 0 24 24" width="36" height="36">
            <path d="M8 5v14l11-7z" fill="currentColor"/>
          </svg>
          <div class="eq"><span></span><span></span><span></span><span></span></div>
        </button>
<p class="hint">Tap to listen · you can replay as many times as you like</p>
      </div>

      <form id="answerForm" class="answer-form" autocomplete="off">
        <label for="answerInput" class="sr-only">Type the verb phrase</label>
        <input
          type="text"
          id="answerInput"
          class="answer-input"
          placeholder="Type the verb phrase here…"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
        />
        <div class="form-actions">
          <button type="submit" id="checkBtn" class="btn primary">Check</button>
          <button type="button" id="skipBtn" class="btn secondary">Skip</button>
        </div>
      </form>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </main>

    <footer class="game-footer">
      <button id="restartBtn" class="btn secondary hidden">Play again</button>
    </footer>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
