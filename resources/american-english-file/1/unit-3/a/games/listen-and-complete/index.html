<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen and Complete · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back to games">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Vocabulary</span>
        <h1>Listen and Complete</h1>
        <p>Listen to the ending, then write the full verb phrase.</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Progress</span>
          <span id="progress">0</span><span class="stat-total">/10</span>
        </div>
        <div class="stat">
          <span class="stat-label">Score</span>
          <span id="score">0</span>
        </div>
      </div>
    </header>

    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

    <main class="play-area">
      <div class="audio-panel">
        <button id="playBtn" class="play-btn" aria-label="Play the ending">
          <span class="wave"></span>
          <span class="wave"></span>
          <span class="wave"></span>
          <svg viewBox="0 0 24 24" width="34" height="34"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <p class="hint">Tap to hear the ending · you can replay anytime</p>
      </div>

      <form id="answerForm" class="answer-form" autocomplete="off">
        <label for="answerInput" class="sr-only">Type the full verb phrase</label>
        <input
          type="text"
          id="answerInput"
          class="answer-input"
          placeholder="e.g. watch TV"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
        />
        <div class="form-actions">
          <button type="submit" id="checkBtn" class="btn primary">Check</button>
          <button type="button" id="skipBtn" class="btn secondary">Skip</button>
        </div>
      </form>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </main>

    <footer class="game-footer">
      <button id="restartBtn" class="btn secondary hidden">Play again</button>
    </footer>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
</body>
</html>
