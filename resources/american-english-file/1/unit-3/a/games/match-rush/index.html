<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Rush · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../../../theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back to games">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Vocabulary</span>
        <h1>Match Rush</h1>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Mode</span>
          <span id="modeLabel">1/3</span>
        </div>
        <div class="stat">
          <span class="stat-label">Score</span>
          <span id="score">0</span>
        </div>
      </div>
    </header>

    <!-- Mode tabs -->
    <nav class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="0">Verb → Phrase</button>
      <button class="mode-tab" data-mode="1">Audio → Picture</button>
      <button class="mode-tab" data-mode="2">Audio → Phrase</button>
    </nav>

    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

    <p id="modeDesc" class="mode-desc">Match each verb to the correct phrase ending.</p>

    <main class="match-area" id="matchArea">
      <!-- filled by JS -->
    </main>

    <footer class="game-footer">
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <div class="footer-actions">
        <button id="nextRoundBtn" class="btn primary hidden" aria-hidden="true" style="display:none">Next Round →</button>
        <button id="nextModeBtn" class="btn primary hidden" aria-hidden="true" style="display:none">Next Mode →</button>
        <button id="restartBtn" class="btn secondary hidden">Play again</button>
      </div>
    </footer>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script src="/learningarcade/la-stars.js"></script>
  <script src="../../../../../../theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
