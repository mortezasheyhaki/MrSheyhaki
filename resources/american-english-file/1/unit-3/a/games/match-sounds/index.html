<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Sounds · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back to games">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Vocabulary</span>
        <h1>Match the Sounds</h1>
        <p>Listen to each sound and match it to the correct verb phrase.</p>
      </div>
      <div class="score-box">
        <span class="score-label">Score</span>
        <span id="score">0</span><span class="score-total">/5</span>
      </div>
</header>

    <main class="match-area">
      <section class="column sounds-col" aria-label="Sounds">
        <h2 class="col-title">🔊 Sounds</h2>
        <div id="sounds" class="cards"></div>
      </section>

      <div class="divider" aria-hidden="true">
        <span class="divider-line"></span>
        <span class="divider-icon">⇄</span>
        <span class="divider-line"></span>
      </div>

      <section class="column phrases-col" aria-label="Verb phrases">
        <h2 class="col-title">📝 Verb Phrases</h2>
        <div id="phrases" class="cards"></div>
      </section>
    </main>

    <footer class="game-footer">
      <button id="resetBtn" class="btn secondary">Play again</button>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </footer>
  </div>

  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
