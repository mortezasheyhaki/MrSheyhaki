<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Listen & Change · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../../../theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Grammar</span>
        <h1>Listen & Change</h1>
      </div>
    </header>

    <p class="part-desc">Listen. Change the subject. Write the full sentence.</p>

    <div class="progress-row">
      <span id="counter">1 / 10</span>
      <div class="mini-bar"><div id="bar" class="mini-fill"></div></div>
      <span id="scoreEl">0 correct</span>
    </div>

    <div class="card" id="card">
      <div class="prompt-label">Listen</div>
      <div class="listen-row">
        <button type="button" id="playBtn" class="play-btn" aria-label="Play audio">▶</button>
        <span class="listen-hint">Tap to hear the sentence</span>
      </div>

      <div class="prompt-label">Your sentence</div>
      <div class="answer-row">
        <span class="subject-fixed" id="subject"></span>
        <input type="text" id="input" class="answer-input" placeholder="" autocomplete="off" spellcheck="false" autocapitalize="off">
      </div>

      <div class="card-actions">
        <button id="checkBtn" class="btn primary">Check</button>
        <button id="skipBtn" class="btn secondary">Skip</button>
      </div>

      <div id="feedback" class="feedback" role="status"></div>
    </div>

    <div class="nav-row">
      <button id="prevBtn" class="ctrl" disabled>← Prev</button>
      <button id="nextBtn" class="ctrl">Next →</button>
    </div>

    <div id="done" class="done-box hidden">
      <div class="stars" id="stars" aria-label="Star rating"></div>
      <p>Complete! <span id="finalScore"></span></p>
      <button id="restartBtn" class="btn secondary">Play again</button>
    </div>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="../../../../../../theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
