<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Listen & Change · Unit 3A | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3A · Grammar</span>
        <h1>Listen & Change</h1>
      </div>
</header>

    <p class="part-desc">Listen. Change the subject. Write the full sentence.</p>

    <div class="progress-row">
      <span id="counter">1 / 10</span>
      <div class="mini-bar"><div id="bar" class="mini-fill"></div></div>
      <span id="scoreEl">0 correct</span>
    </div>

    <div class="card" id="card">
      <div class="listen-block">
        <span class="prompt-label">Listen</span>
        <div class="listen-row">
          <button type="button" id="playBtn" class="play-btn" aria-label="Play audio">
            <span class="wave"></span>
            <span class="wave"></span>
            <span class="wave"></span>
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            <div class="eq"><span></span><span></span><span></span><span></span></div>
          </button>
          <span class="listen-hint">Tap to hear the sentence</span>
        </div>
      </div>

      <div class="arrow-hint" aria-hidden="true">↓</div>

      <div class="answer-block">
        <span class="prompt-label">Your sentence <span class="subject-note">use <span class="subject-chip" id="subject"></span></span></span>
        <div class="answer-field" id="answerField">
          <input type="text" id="input" class="answer-input" placeholder="" autocomplete="off" spellcheck="false" autocapitalize="off">
        </div>
      </div>

      <div class="card-actions">
        <button id="prevBtn" class="nav-circle" aria-label="Previous" disabled>←</button>
        <button id="checkBtn" class="btn primary">Check</button>
        <button id="skipBtn" class="btn secondary">Skip</button>
        <button id="nextBtn" class="nav-circle" aria-label="Next">→</button>
      </div>

      <div id="feedback" class="feedback" role="status"></div>
    </div>

    <div id="done" class="done-box hidden">
      <div class="stars" id="stars" aria-label="Star rating"></div>
      <p>Complete! <span id="finalScore"></span></p>
      <button id="restartBtn" class="btn secondary">Play again</button>
    </div>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
