<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Look & Write · Jobs · Unit 3B</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3B · Vocabulary</span>
        <h1>Look & Write</h1>
        <p>Look at the picture and type the job</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-label">Progress</span><span id="progress">0</span><span class="stat-total">/30</span></div>
        <div class="stat"><span class="stat-label">Score</span><span id="score">0</span></div>
      </div>
    </header>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

    <section id="play" class="play">
      <p class="q-num" id="qNum">1 of 30</p>
      <div class="pic-wrap"><img id="pic" alt="job"></div>
      <input type="text" id="input" class="answer-input" placeholder="Type the job…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <div id="feedback" class="feedback"></div>
      <button type="button" class="check-btn" id="checkBtn">Check</button>
    </section>

    <div id="done" class="done hidden">
      <div class="stars" id="stars"></div>
      <h2>Complete!</h2>
      <p id="finalScore"></p>
      <button type="button" class="btn secondary" id="restartBtn">Play again</button>
      <a class="btn primary" href="../">Back to games</a>
    </div>
  </div>
  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
