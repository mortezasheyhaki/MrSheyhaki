<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jobs Match · Unit 3B | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="game-page" data-course="american-english-file" data-type="game" data-level="1" data-unit="3" data-lesson="b">
<main id="game-app" class="mc-game">

  <!-- Mode select -->
  <section id="modeScreen" class="screen">
    <header class="mc-topbar">
      <a class="mc-back" href="../" aria-label="Back">←</a>
      <span class="mc-title">Jobs Match</span>
      <span class="mc-badge">Unit 3B</span>
    </header>
    <div class="mc-start">
      <p class="mc-desc">Choose a match type · 5 rounds · 6 pairs each</p>
      <div class="mc-mode-list">
        <button type="button" class="mc-mode-card mc-mode-btn" data-mode="word-pic">
          <span class="mc-mode-num">1</span>
          <span><strong>Words ↔ Pictures</strong><p>Match job names to photos. Audio plays on a correct match.</p></span>
        </button>
        <button type="button" class="mc-mode-card mc-mode-btn" data-mode="word-audio">
          <span class="mc-mode-num">2</span>
          <span><strong>Words ↔ Audio</strong><p>Match job names to the spoken word.</p></span>
        </button>
        <button type="button" class="mc-mode-card mc-mode-btn" data-mode="audio-pic">
          <span class="mc-mode-num">3</span>
          <span><strong>Audio ↔ Pictures</strong><p>Listen and match to the correct photo.</p></span>
        </button>
      </div>
    </div>
  </section>

  <!-- Play -->
  <section id="playScreen" class="screen hidden">
    <header class="mc-topbar">
      <a class="mc-back" href="#" id="backToModes" aria-label="Modes" onclick="return false;">←</a>
      <span class="mc-title" id="modeLabel">Words ↔ Pictures</span>
      <span class="mc-badge">Unit 3B</span>
    </header>
    <div class="mc-progress-row">
      <span class="mc-progress">Round <span id="roundNum">1</span> / 5 · <span id="matchedCount">0</span>/6 · Score <span id="score">0</span></span>
      <div class="mc-track"><div id="progressFill" class="mc-fill"></div></div>
    </div>
    <p class="mc-instruction" id="hint">Tap a card on each side to match.</p>
    <div class="mc-board">
      <div class="mc-col mc-col-left" id="colLeft"></div>
      <div class="mc-col mc-col-right" id="colRight"></div>
    </div>
    <div class="mc-actions">
      <button type="button" class="mc-btn secondary" id="resetRoundBtn">Reset round</button>
    </div>
    <div id="feedback" class="mc-feedback" role="status"></div>
  </section>

  <!-- Round / game complete -->
  <section id="doneScreen" class="screen hidden">
    <section class="mc-done">
      <div class="stars mc-stars" id="stars"></div>
      <h1 id="doneTitle">Round complete!</h1>
      <p id="finalScore"></p>
      <button type="button" class="mc-btn" id="nextRoundBtn">Next round</button>
      <button type="button" class="mc-btn secondary" id="replayModeBtn">Play this mode again</button>
      <button type="button" class="mc-btn secondary" id="changeModeBtn">Change mode</button>
    </section>
  </section>
</main>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="/learningarcade/la-finish.js"></script>
  <script src="../jobs-media.js"></script>
<script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
<script src="/visit-counter.js" defer></script>
</body>
</html>
