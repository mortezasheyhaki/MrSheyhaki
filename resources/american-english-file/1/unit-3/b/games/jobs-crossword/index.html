<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jobs Crossword · Unit 3B | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3B · Vocabulary</span>
        <h1>Jobs Crossword</h1>
        <p>Complete the crossword using the picture clues.</p>
      </div>
      <button type="button" class="check-btn" id="checkBtn">Check</button>
    </header>

    <div class="grid-wrap">
      <div id="grid" class="grid" role="grid"></div>
    </div>

    <div class="clues">
      <div class="clue-col">
        <h3>Across →</h3>
        <div id="acrossClues" class="clue-list"></div>
      </div>
      <div class="clue-col">
        <h3>Down ↓</h3>
        <div id="downClues" class="clue-list"></div>
      </div>
    </div>

    <div id="feedback" class="feedback"></div>
  </div>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
