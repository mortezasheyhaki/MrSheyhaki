<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Match the Questions · Unit 3B | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3B · Grammar</span>
        <h1>Match the Questions</h1>
        <p>Read the answer. Tap the correct question above it.</p>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Progress</span>
          <span id="progress">0</span><span class="stat-total">/5</span>
        </div>
        <div class="stat">
          <span class="stat-label">Score</span>
          <span id="score">0</span>
        </div>
      </div>
    </header>

    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

    <section class="questions-panel">
      <div class="panel-label">Questions · always available</div>
      <div id="questions" class="questions-grid" role="list"></div>
    </section>

    <section class="answer-panel">
      <div class="panel-label">Answer <span id="answerNum">1</span> of 5 · drop zone</div>
      <div class="drop-zone" id="dropZone">
        <div class="drop-label" id="dropLabel">Drop question here</div>
        <div class="answer-card" id="answerCard">
          <p id="answerText" class="answer-text"></p>
        </div>
      </div>
      <p class="hint" id="hint">Drag a question onto the answer — or tap it.</p>
      <div id="feedback" class="feedback" role="status"></div>
    </section>

    <div id="done" class="done-box hidden">
      <div class="stars" id="stars" aria-label="Star rating"></div>
      <h2>Complete!</h2>
      <p id="finalScore"></p>
      <button type="button" class="btn secondary" id="restartBtn">Play again</button>
      <a class="btn primary" href="../">Back to games</a>
    </div>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
