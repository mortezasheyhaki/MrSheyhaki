<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function(){try{var t=localStorage.getItem("mrsheyhaki-theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>His Job, Her Job · Unit 3B</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3B · Listening</span>
        <h1>His Job, Her Job</h1>
        <p id="headerSub">Listen and complete the chart</p>
      </div>
    </header>

    <!-- CHART PHASE -->
    <div id="phaseChart">
      <div class="part-tabs" role="tablist">
        <button type="button" class="part-tab active" data-part="1" role="tab" aria-selected="true">Part 1 · Alex</button>
        <button type="button" class="part-tab" data-part="2" role="tab" aria-selected="false">Part 2 · Sue</button>
      </div>

      <div class="listen-card">
        <button type="button" class="audio-btn" id="audioBtn" aria-label="Play audio">
          <span class="audio-rings"></span>
          <span class="audio-core">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
              <rect x="4" y="9" width="3" height="6" rx="1.5" fill="currentColor"/>
              <rect x="10.5" y="5" width="3" height="14" rx="1.5" fill="currentColor"/>
              <rect x="17" y="8" width="3" height="8" rx="1.5" fill="currentColor"/>
            </svg>
          </span>
        </button>
        <div class="listen-info">
          <strong id="partTitle">Part 1 · Alex</strong>
          <span>Tap to listen · you can replay</span>
        </div>
      </div>

      <div class="chart-wrap">
        <div id="chart" class="chart"></div>
      </div>
      <span id="personLabel" class="sr-only">Alex</span>

      <div class="footer-bar">
        <div id="feedback" class="feedback"></div>
        <button type="button" class="check-btn" id="checkBtn">Check answers</button>
      </div>
    </div>

    <!-- GUESS PHASE -->
    <div id="phaseGuess" class="phase-guess hidden">
      <div class="guess-card">
        <div class="guess-icon">🤔</div>
        <h2>What do you think they do?</h2>
        <p class="guess-lead">Use your notes from the chart. Type their jobs.</p>

        <label class="guess-label" for="alexInput">Alex’s job</label>
        <input type="text" id="alexInput" class="guess-input" placeholder="e.g. a teacher…" autocomplete="off" autocorrect="off" spellcheck="false">

        <label class="guess-label" for="sueInput">Sue’s job</label>
        <input type="text" id="sueInput" class="guess-input" placeholder="e.g. a doctor…" autocomplete="off" autocorrect="off" spellcheck="false">

        <div id="guessFeedback" class="feedback"></div>
        <p id="attemptInfo" class="attempt-info"></p>

        <button type="button" class="check-btn" id="guessBtn">Check my guesses</button>

        <div id="listenCheck" class="listen-check hidden">
          <p id="listenCheckMsg" class="listen-check-msg"></p>
          <button type="button" class="audio-btn big" id="answerAudioBtn" aria-label="Play answers">
            <span class="audio-rings"></span>
            <span class="audio-core">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none">
                <rect x="4" y="9" width="3" height="6" rx="1.5" fill="currentColor"/>
                <rect x="10.5" y="5" width="3" height="14" rx="1.5" fill="currentColor"/>
                <rect x="17" y="8" width="3" height="8" rx="1.5" fill="currentColor"/>
              </svg>
            </span>
          </button>
          <span class="hint-audio">Listen and check</span>
        </div>
      </div>
    </div>

    <!-- DONE overlay after chart part -->
    <div id="done" class="done hidden">
      <div class="stars" id="stars"></div>
      <h2>Nice work!</h2>
      <p id="finalScore"></p>
      <div class="done-actions">
        <button type="button" class="btn secondary" id="retryBtn">Try again</button>
        <button type="button" class="btn primary" id="nextPartBtn">Part 2 · Sue →</button>
        <button type="button" class="btn primary hidden" id="toGuessBtn">What do they do? →</button>
      </div>
    </div>
  </div>
  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
