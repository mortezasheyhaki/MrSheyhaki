<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jobs Flashcards · Unit 3B | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="header-text">
        <span class="eyebrow">Unit 3B · Vocabulary</span>
        <h1>Jobs Flashcards</h1>
      </div>
      <button type="button" class="icon-btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
    </header>

    <div class="progress-row">
      <span id="counter">1</span><span class="sep">/</span><span>30</span>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    </div>

    <div class="card-stage" id="cardStage">
      <div class="swipe-hint left" id="hintLeft" aria-hidden="true">←</div>
      <div class="swipe-hint right" id="hintRight" aria-hidden="true">→</div>

      <div class="flash-card" id="card" role="button" tabindex="0" aria-label="Flashcard — tap to flip, swipe to change">
        <div class="face front" id="front">
          <img id="cardImg" alt="" draggable="false">
          <div class="face-badge">Picture</div>
          <div class="word-bar" id="frontWord"></div>
        </div>
        <div class="face back" id="back">
          <span id="cardWord"></span>
          <div class="face-badge">Word</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="nav-btn" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <button type="button" class="audio-btn" id="audioBtn" aria-label="Play audio">
        <span class="audio-rings" aria-hidden="true"></span>
        <span class="audio-core">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
            <rect x="4" y="9" width="3" height="6" rx="1.5" fill="currentColor"/>
            <rect x="10.5" y="5" width="3" height="14" rx="1.5" fill="currentColor"/>
            <rect x="17" y="8" width="3" height="8" rx="1.5" fill="currentColor"/>
          </svg>
        </span>
      </button>

      <button type="button" class="nav-btn" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <p class="hint">Swipe ← → to change · Tap card to flip · Tap 🔊 to listen</p>
  </div>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
