<!DOCTYPE html>
<html lang="en">
<head>
  <script>
(function () {
  try {
    var t = localStorage.getItem("mrsheyhaki-theme");
    if (t !== "light" && t !== "dark") {
      t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Make Questions · Unit 3B | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrap">
    <header class="top-bar">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="top-info">
        <p class="instruction">Make questions using a pronoun and the bold verb.</p>
        <div class="progress-row">
          <span id="progressLabel">1 / 10</span>
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <span id="scoreLabel">0 correct</span>
        </div>
      </div>
    </header>

    <section class="play-card" id="playCard">
      <div class="label">Original</div>
      <div class="original-box" id="originalBox"></div>

      <div class="arrow" aria-hidden="true">↓</div>

      <div class="label">Your question</div>
      <div class="answer-row" id="answerRow">
        <input type="text" id="answerInput" class="answer-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the start of the question…" enterkeyhint="done" />
        <span class="ending" id="endingText"></span>
      </div>

      <div class="hint" id="hint">Use <strong>Do</strong> or <strong>Does</strong> + pronoun + base verb</div>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <div class="controls">
        <button type="button" class="nav-btn" id="prevBtn" aria-label="Previous" disabled>←</button>
        <button type="button" class="check-btn" id="checkBtn">Check</button>
        <button type="button" class="skip-btn" id="skipBtn">Skip</button>
        <button type="button" class="nav-btn" id="nextBtn" aria-label="Next">→</button>
      </div>
    </section>

    <div id="done" class="done-box hidden">
      <div class="stars" id="stars" aria-label="Star rating"></div>
      <h2>Complete!</h2>
      <p id="finalScore"></p>
      <button type="button" class="btn secondary" id="restartBtn">Play again</button>
      <a class="btn primary" href="../">Back to games</a>
    </div>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../theme.js"></script>
</body>
</html>
