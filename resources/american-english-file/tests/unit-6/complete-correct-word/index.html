<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)
document.documentElement.setAttribute("data-theme","dark");
else document.documentElement.setAttribute("data-theme","light");
}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit 6 · Complete with the Correct Word | AEF 1 | Mr. Sheyhaki</title>
<meta name="description" content="Choose the correct word from the bank to complete each sentence. American English File 1 Unit 6.">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --ink:#1b2430; --mut:#6b7280; --line:#dfe5ee;
  --acc:#0f766e; --acc-soft:#e6f4f1; --acc-d:#0b5c56;
  --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --btn:#0f766e; --btn-d:#0b5c56; --shadow:rgba(15,23,42,.08);
  --bank-bg:#1a2332; --bank-label:#8b95a8;
  --chip-bg:#243044; --chip-ink:#e8eef8; --chip-border:rgba(255,255,255,.06);
  --chip-used-bg:#1e2838; --chip-used-ink:#5b6578;
}
html[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2d; --ink:#e8edf6; --mut:#9aa6b8; --line:#2a3447;
  --acc:#2dd4bf; --acc-soft:rgba(45,212,191,.14); --acc-d:#0f8a7b;
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --bad:#f87171; --bad-bg:rgba(248,113,113,.14);
  --btn:#2dd4bf; --btn-d:#0f8a7b; --shadow:rgba(0,0,0,.35);
  --bank-bg:#121a28; --bank-label:#7a8499;
  --chip-bg:#1e2a3d; --chip-ink:#e8eef8; --chip-border:rgba(255,255,255,.07);
  --chip-used-bg:#161e2c; --chip-used-ink:#4e586c;
}
html,body{ margin:0; height:100%; overflow:hidden; }
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
*{ box-sizing:border-box; }

.app{
  position:fixed; inset:0; display:flex; flex-direction:column;
  max-width:720px; margin:0 auto;
  padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  gap:12px;
}

.top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto; }
.back{
  display:inline-flex; align-items:center; gap:.35rem; min-height:40px; padding:.4rem .95rem;
  border-radius:999px; background:var(--card); border:2px solid rgba(124,58,237,.16);
  color:#5b21b6; font-weight:700; font-size:.92rem; text-decoration:none;
  box-shadow:0 3px 0 rgba(124,58,237,.12);
}
html[data-theme="dark"] .back{ color:#c4b5fd; border-color:rgba(167,139,250,.28); }
.count{ font-weight:700; font-size:.92rem; color:var(--mut); font-variant-numeric:tabular-nums; }

.head{ flex:0 0 auto; }
.head h1{ margin:0; font-size:clamp(1.05rem, 3.2vw, 1.22rem); font-weight:800; letter-spacing:-.01em; }
.head p{ margin:4px 0 0; font-size:.9rem; color:var(--mut); line-height:1.4; }
.example{ margin:6px 0 0; font-size:.88rem; color:var(--mut); }
.example i{ color:var(--acc); font-weight:800; font-style:normal; text-decoration:underline; }

.stage{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
  overflow:auto; padding:4px 0;
}

.card{
  width:100%; background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:22px 22px 24px; box-shadow:0 12px 32px -12px var(--shadow);
}
.qnum{
  display:inline-block; font-size:.75rem; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; color:var(--acc); background:var(--acc-soft);
  padding:5px 10px; border-radius:999px; margin-bottom:12px;
}
.sentence{
  font-size:clamp(18px, 3.4vw, 22px); font-weight:650; line-height:1.75; color:var(--ink);
}
.blank{
  display:inline-block; min-width:5.2em; margin:0 .15em; padding:0 6px 2px;
  border-bottom:2.5px solid var(--acc); color:var(--acc); font-weight:800;
  text-align:center; vertical-align:baseline;
}
.blank.filled{ color:var(--ink); border-bottom-color:var(--acc-d); }
.blank.ok{ color:var(--ok); border-bottom-color:var(--ok); }
.blank.bad{ color:var(--bad); border-bottom-color:var(--bad); }
.blank .fix{
  display:inline; margin-left:6px; font-size:.78em; font-weight:800; color:var(--bad);
}

.bank-wrap{
  width:100%;
  background:var(--bank-bg);
  border-radius:22px;
  padding:14px 14px 16px;
  box-shadow:0 10px 28px -12px rgba(0,0,0,.35);
}
.bank-label{
  text-align:center;
  font-size:.72rem;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--bank-label);
  margin-bottom:12px;
}
.bank{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:10px;
  max-width:420px;
  margin:0 auto;
}
.chip{
  appearance:none;
  border:1px solid var(--chip-border);
  background:var(--chip-bg);
  color:var(--chip-ink);
  font:inherit;
  font-weight:700;
  font-size:15px;
  padding:12px 10px;
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.25);
  transition:transform .12s, opacity .2s, box-shadow .12s, background .2s, color .2s, filter .2s;
  user-select:none; -webkit-user-select:none;
  text-align:center;
}
.chip:active:not(:disabled){ transform:translateY(2px); box-shadow:0 0 0 rgba(0,0,0,.25); }
.chip.picked{
  outline:2px solid var(--acc);
  outline-offset:1px;
  background:#2a3d55;
  color:#fff;
}
.chip.used{
  opacity:.38;
  filter:grayscale(.35);
  cursor:default;
  box-shadow:none;
  background:var(--chip-used-bg);
  color:var(--chip-used-ink);
  pointer-events:none;
}
.chip:disabled{ pointer-events:none; }

.fb{
  min-height:1.4em; text-align:center; font-weight:800; font-size:.95rem;
  color:var(--mut); flex:0 0 auto;
}
.fb.ok{ color:var(--ok); }
.fb.bad{ color:var(--bad); }

.actions{ display:flex; gap:10px; flex:0 0 auto; width:100%; }
.btn{
  flex:1; min-height:54px; border:0; border-radius:16px;
  background:var(--btn); color:#fff; font:inherit; font-size:1.05rem; font-weight:800;
  box-shadow:0 5px 0 var(--btn-d); cursor:pointer;
  transition:transform .12s, box-shadow .12s, opacity .2s;
}
.btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--btn-d); }
.btn:disabled{ background:#cfd6dc; box-shadow:0 5px 0 #e6e0d4; color:#6b7280; cursor:default; }
html[data-theme="dark"] .btn:disabled{ background:#2a3447; box-shadow:0 5px 0 #1a2233; color:#6b7280; }
.btn.ghost{
  background:var(--card); color:var(--ink); border:1.5px solid var(--line);
  box-shadow:0 5px 0 var(--line);
}
.btn.ghost:active{ box-shadow:0 2px 0 var(--line); }

@media (max-width:560px){
  .card{ padding:16px 14px 18px; }
  .sentence{ font-size:17px; }
  .chip{ font-size:14px; padding:11px 8px; }
  .btn{ min-height:50px; font-size:1rem; }
  .bank{ gap:8px; }
}
@media (max-height:680px){
  .head p, .example{ display:none; }
  .stage{ gap:12px; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

<body>
<div class="app">
  <div class="top">
    <a class="back" href="/resources/american-english-file/tests/unit-6/">← Unit 6</a>
    <span class="count" id="count">1 / 6</span>
  </div>
  <div class="head">
    <h1>Complete the sentences with the correct word</h1>
    <p>Tap a word from the bank, then press Check. After that, press Next.</p>
    <p class="example">Example: You can see <i>through</i> a glass bottle.</p>
  </div>

  <div class="stage" id="stage">
    <div class="card">
      <div class="qnum" id="qnum">Sentence 1 of 6</div>
      <div class="sentence" id="sentence"></div>
    </div>
    <div class="bank-wrap">
      <div class="bank-label">Word bank</div>
      <div class="bank" id="bank"></div>
    </div>
  </div>

  <div class="fb" id="fb" role="status" aria-live="polite"></div>
  <div class="actions">
    <button class="btn" id="checkBtn" type="button" disabled>Check</button>
    <button class="btn" id="nextBtn" type="button" hidden>Next</button>
    <button class="btn ghost" id="retryBtn" type="button" hidden>Try again</button>
    <button class="btn" id="finishBtn" type="button" hidden>Finish</button>
  </div>
</div>

<script src="/theme.js"></script>
<script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
<script src="/learningarcade/la-sfx.js"></script>
<script src="../../assets/tests-stars.js"></script>
<script src="../../assets/tests-ui.js"></script>
<script>
(function () {
  var GAME_ID = "aef1-u6-complete-correct-word";
  var ITEMS = [
    { before: "It’s very hot in the Sahara ", after: ".", ans: "desert" },
    { before: "He can see his house far away, so he walks ", after: " it.", ans: "toward" },
    { before: "What’s that ", after: " noise? I don’t know what it is.", ans: "strange" },
    { before: "Silver and gold are ", after: ".", ans: "valuable" },
    { before: "We are thirsty, so we ", after: " to drink some water.", ans: "decide" },
    { before: "It’s raining, so she opens the door and says ‘Come ", after: ".’", ans: "inside" }
  ];
  /* 6 words for the 6 sentences (example word "through" is not in the bank) */
  var CHIPS = ["decide", "strange", "inside", "toward", "valuable", "desert"];

  var TOTAL = ITEMS.length;
  var $ = function (id) { return document.getElementById(id); };
  var idx = 0;
  var answers = [];
  var results = [];
  var picked = null;
  var checkedHere = false;
  var score = 0;
  var done = false;
  var usedWords = {}; // permanently mute chips once used on a previous sentence

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) {
    return String(s).toLowerCase().replace(/[’`']/g, "'").replace(/\s+/g, " ").trim();
  }
  function sfx(name) {
    try { if (window.LASfx && typeof LASfx[name] === "function") LASfx[name](); } catch (e) {}
  }

  function renderBank() {
    var bank = $("bank");
    bank.innerHTML = "";
    CHIPS.forEach(function (w) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = w;
      b.dataset.word = w;
      b.addEventListener("click", function () { onPick(w); });
      bank.appendChild(b);
    });
    refreshChips();
  }

  function refreshChips() {
    document.querySelectorAll(".chip").forEach(function (el) {
      var w = el.dataset.word;
      var isPicked = picked === w;
      var isSpent = !!usedWords[w] && !isPicked;
      el.classList.toggle("picked", isPicked && !checkedHere);
      el.classList.toggle("used", isPicked || isSpent);
      el.disabled = checkedHere || done || isSpent;
    });
  }

  function renderSentence() {
    var it = ITEMS[idx];
    $("qnum").textContent = "Sentence " + (idx + 1) + " of " + TOTAL;
    $("count").textContent = (idx + 1) + " / " + TOTAL;

    var chosen = answers[idx] || "";
    var blankClass = "blank" + (chosen ? " filled" : "");
    var fix = "";

    if (checkedHere) {
      var ok = results[idx];
      blankClass = "blank filled " + (ok ? "ok" : "bad");
      if (!ok) fix = '<span class="fix">→ ' + esc(it.ans) + "</span>";
    }

    $("sentence").innerHTML =
      esc(it.before) +
      '<span class="' + blankClass + '">' + (chosen ? esc(chosen) : "______") + fix + "</span>" +
      esc(it.after);

    picked = chosen || null;
    refreshChips();

    $("fb").textContent = "";
    $("fb").className = "fb";

    $("checkBtn").hidden = checkedHere;
    $("checkBtn").disabled = !chosen || checkedHere;
    $("nextBtn").hidden = !checkedHere || done;
    $("nextBtn").textContent = idx === TOTAL - 1 ? "See results" : "Next";
    $("retryBtn").hidden = true;
    $("finishBtn").hidden = true;
  }

  function onPick(word) {
    if (checkedHere || done || usedWords[word]) return;
    if (picked === word) {
      answers[idx] = "";
      picked = null;
    } else {
      answers[idx] = word;
      picked = word;
      sfx("tap");
    }
    renderSentence();
  }

  function onCheck() {
    if (checkedHere || !answers[idx]) return;
    checkedHere = true;
    var ok = norm(answers[idx]) === norm(ITEMS[idx].ans);
    results[idx] = ok;
    if (ok) score++;
    // lock this word as used so it stays muted on later sentences
    usedWords[answers[idx]] = true;
    sfx(ok ? "correct" : "wrong");

    $("fb").className = "fb " + (ok ? "ok" : "bad");
    $("fb").textContent = ok ? "Correct!" : "Not quite.";

    renderSentence();
  }

  function onNext() {
    if (!checkedHere) return;

    if (idx < TOTAL - 1) {
      idx++;
      checkedHere = false;
      picked = null;
      renderSentence();
      return;
    }

    done = true;
    $("nextBtn").hidden = true;
    $("checkBtn").hidden = true;
    $("count").textContent = score + " / " + TOTAL;

    var perfect = score === TOTAL;
    $("finishBtn").hidden = false;
    $("retryBtn").hidden = perfect;

    sfx(perfect ? "win" : "wrong");
    $("fb").className = "fb " + (perfect ? "ok" : "bad");
    $("fb").textContent = perfect
      ? "Perfect! Every answer is correct. Press Finish."
      : "You got " + score + " / " + TOTAL + " correct. Try again, or press Finish.";

    document.querySelectorAll(".chip").forEach(function (el) {
      el.disabled = true;
      el.classList.remove("picked");
    });
  }

  function finishGame() {
    var pct = Math.round(score / TOTAL * 100);
    try {
      if (window.TestStars && typeof TestStars.award === "function" && score === TOTAL) {
        TestStars.award(GAME_ID);
      }
    } catch (e0) {}
    try {
      if (window.LAStars) {
        if (typeof LAStars.recordPlay === "function") LAStars.recordPlay(GAME_ID);
        if (typeof LAStars.saveFromAccuracy === "function") LAStars.saveFromAccuracy(GAME_ID, pct);
      }
    } catch (e1) {}
    if (window.LAFinish && typeof LAFinish.show === "function") {
      LAFinish.show({
        gameId: GAME_ID,
        score: score,
        total: TOTAL,
        accuracy: pct,
        onAgain: reset,
        backHref: "/resources/american-english-file/tests/unit-6/",
        category: "tests",
        unit: "aef1-6"
      });
    }
  }

  function reset() {
    idx = 0;
    answers = [];
    results = [];
    picked = null;
    checkedHere = false;
    score = 0;
    done = false;
    usedWords = {};
    renderBank();
    renderSentence();
  }

  $("checkBtn").addEventListener("click", onCheck);
  $("nextBtn").addEventListener("click", onNext);
  $("retryBtn").addEventListener("click", reset);
  $("finishBtn").addEventListener("click", finishGame);

  renderBank();
  renderSentence();
})();
</script>
</body>
</html>
