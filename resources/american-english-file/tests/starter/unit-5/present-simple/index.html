<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit 5 · Present Simple Sentences | AEF Starter | Mr. Sheyhaki</title>
<meta name="description" content="Choose the correct form to complete each sentence.">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<style>
/* ===== Do / Don't — fixed-viewport layout, no page scroll (desktop + mobile) ===== */
html, body { margin:0 !important; padding:0 !important; height:100%; overflow:hidden !important; }
body.u5{
  --bg:#f0fdfa; --card:#fff; --ink:#1e1b3a; --mut:#64668a; --line:#d5e8ec;
  --acc:#7c3aed; --acc-d:#5b21b6; --acc-two:#a78bfa; --acc-soft:rgba(15,118,110,.10);
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b91c1c; --warn-bg:#fee2e2; --amber:#b45309; --amber-bg:#fef3c7;
  --btn-ink:#fff; --ghost:#fff;
  --app-bg:radial-gradient(900px 480px at 0% -10%, rgba(20,184,166,.16), transparent 60%),
           linear-gradient(180deg, #f0fdfa 0%, #eef4ff 100%);
  height:100dvh; height:100vh; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--app-bg) fixed; display:flex; flex-direction:column; overflow:hidden;
}
html[data-theme="dark"] body.u5{
  --bg:#0f1420; --card:#171e2d; --ink:#e8edf6; --mut:#a3a9c4; --line:#2c3550;
  --acc:#2dd4bf; --acc-d:#0f766e; --acc-two:#5eead4; --acc-soft:rgba(45,212,191,.14);
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --warn:#f87171; --warn-bg:rgba(248,113,113,.14);
  --amber:#fbbf24; --amber-bg:rgba(251,191,36,.14); --btn-ink:#062b27; --ghost:#1e2433;
  --app-bg:linear-gradient(180deg, #111728 0%, #0f1420 100%);
}
body.u5 *, body.u5 *::before, body.u5 *::after { box-sizing:border-box; }

/* page frame: exactly one viewport tall, nothing scrolls */
body.u5 .wrap{
  width:100%; max-width:540px; height:100%; min-height:0; margin:0 auto;
  display:flex; flex-direction:column; gap:10px;
  padding:12px 14px max(14px, env(safe-area-inset-bottom));
  overflow:hidden;
}

/* header (overrides shared .header + .top rules) */
body.u5 .wrap > .top.header{
  flex:none; display:flex; align-items:center; gap:10px; margin:0;
  padding:8px 10px 8px 12px; min-height:56px;
  background:rgba(255,255,255,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line); border-radius:18px; box-shadow:0 6px 18px -14px rgba(30,27,58,.35);
}
html[data-theme="dark"] body.u5 .wrap > .top.header{ background:rgba(23,30,45,.9); }
body.u5 .back-btn{
  display:inline-flex; align-items:center; gap:.3rem; min-height:38px; padding:.35rem .9rem;
  border-radius:999px; background:var(--card); border:2px solid rgba(91,33,182,.18); color:var(--acc);
  font-weight:800; font-size:.88rem; text-decoration:none; box-shadow:0 2px 0 rgba(91,33,182,.12); white-space:nowrap;
}
body.u5 .count{ margin-left:auto; font-weight:800; font-size:.9rem; color:var(--mut); font-variant-numeric:tabular-nums; }
body.u5 .tui-sound{
  appearance:none; border:2px solid rgba(91,33,182,.18); background:var(--card); color:inherit;
  width:38px; height:38px; min-width:38px; border-radius:50%; font-size:1rem; cursor:pointer; flex:none; padding:0;
  display:inline-grid; place-items:center; box-shadow:0 2px 0 rgba(91,33,182,.12);
}

/* title block (overrides global .hero band) */
body.u5 .hero{
  flex:none; background:none !important; overflow:visible !important; text-align:center;
  padding:0; margin:0;
}
body.u5 .badge{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:.7px; text-transform:uppercase;
  padding:5px 12px; border-radius:999px; background:var(--acc-soft); color:var(--acc);
}
body.u5 .hero h1{ margin:6px 0 2px; font-size:clamp(1.2rem, 4.4vw, 1.5rem); font-weight:900; line-height:1.15; color:var(--ink); }
body.u5 .hero p{ margin:0; color:var(--mut); font-size:.85rem; }

/* question card: content starts at the top, never floats in the middle */
body.u5 .stage{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:flex-start;
  background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:clamp(14px, 3vh, 24px) clamp(14px, 4vw, 22px); overflow:hidden;
  box-shadow:0 14px 30px -20px rgba(30,27,58,.25);
}
body.u5 .stage.hide{ display:none !important; }
body.u5 .kind{ font-size:.7rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:8px; }
body.u5 .question{ font-size:clamp(1.05rem, 3.6vw, 1.3rem); font-weight:800; line-height:1.45; margin:0 0 clamp(12px, 3vh, 22px); overflow-wrap:anywhere; }

/* answer options (overrides shared body .opts button rules) */
body.u5 .opts{ display:grid; gap:clamp(8px, 1.6vh, 12px); }
body.u5 .opts button.ans{
  appearance:none; font:inherit; font-size:clamp(.95rem, 3.4vw, 1.05rem); font-weight:700; line-height:1.2;
  min-height:clamp(46px, 7vh, 56px); padding:10px 16px; margin:0; width:100%;
  border:2px solid var(--line); border-radius:14px; background:var(--bg); color:var(--ink);
  box-shadow:none; transform:none; cursor:pointer; text-align:left;
  transition:border-color .15s, background-color .15s, color .15s;
}
body.u5 .opts button.ans:hover{ transform:none; box-shadow:none; }
body.u5 .opts button.ans:active{ transform:none; box-shadow:none; }
body.u5 .opts button.ans:disabled{ cursor:default; }
body.u5 .opts button.ans.sel{ border-color:var(--acc); background:var(--acc-soft); color:var(--acc); }
body.u5 .opts button.ans.correct, body.u5 .opts button.ans.reveal{ border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
body.u5 .opts button.ans.wrong{ border-color:var(--amber); background:var(--amber-bg); color:var(--amber); }

body.u5 .fb{ min-height:1.3em; margin-top:auto; padding-top:10px; font-weight:750; font-size:.92rem; flex:none; }
body.u5 .fb.ok{ color:var(--ok); }
body.u5 .fb.bad{ color:var(--warn); }

/* bottom bar: progress + button, always visible */
body.u5 .bottom{ flex:none; display:flex; flex-direction:column; gap:8px; }
body.u5 .progress-label{ display:flex; justify-content:space-between; font-size:.7rem; font-weight:800; letter-spacing:.06em; color:var(--mut); }
body.u5 .progress-bar{ height:7px; border-radius:99px; background:rgba(127,127,127,.16); overflow:hidden; }
body.u5 .progress-fill{ height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--acc),var(--acc-two)); transition:width .35s; }
body.u5 .actions{ display:flex; justify-content:center; }
body.u5 .btn{
  appearance:none; border:none; cursor:pointer; min-height:48px; min-width:150px; padding:.65rem 1.7rem; margin:0;
  border-radius:999px; font:inherit; font-size:1rem; font-weight:800; color:var(--btn-ink);
  background:var(--acc); box-shadow:0 3px 0 var(--acc-d); transform:none;
}
body.u5 .btn:hover{ transform:none; }
body.u5 .btn:disabled{ opacity:.4; cursor:default; box-shadow:none; }
body.u5 .btn.ghost{
  background:var(--ghost); color:var(--acc); border:2px solid rgba(91,33,182,.2);
  box-shadow:0 2px 0 rgba(91,33,182,.1); text-decoration:none; display:inline-flex; align-items:center;
}

/* results */
body.u5 .result{ flex:1 1 auto; min-height:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; overflow:hidden; }
body.u5 .result.show{ display:flex; }
body.u5 .result .big{ font-size:clamp(1.8rem, 7vw, 2.6rem); font-weight:900; color:var(--acc); }
body.u5 .review{ list-style:none; margin:10px 0 0; padding:0; text-align:left; display:grid; gap:6px; width:100%; }
body.u5 .review li{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-size:.84rem; }
body.u5 .review li.ok .a{ color:var(--ok); }
body.u5 .review li.bad .a{ color:var(--warn); }
body.u5 .result-actions{ display:none; gap:8px; justify-content:center; flex-wrap:wrap; }
body.u5 .result-actions.show{ display:flex; }

/* short screens (phones in landscape, small laptops): tighten spacing */
@media (max-height:680px){
  body.u5 .hero p{ display:none; }
  body.u5 .hero h1{ font-size:1.2rem; margin:4px 0 0; }
  body.u5 .wrap{ gap:8px; padding-top:10px; padding-bottom:10px; }
}
/* narrow phones */
@media (max-width:420px){
  body.u5 .wrap{ padding-left:10px; padding-right:10px; gap:8px; }
  body.u5 .stage{ padding:14px 12px; border-radius:16px; }
  body.u5 .btn{ min-width:136px; padding:.6rem 1.4rem; }
}
</style>

<body class="u5">
<div class="wrap">
  <div class="top header">
    <a class="back-btn" href="../">← Unit 5</a>
    <span class="count" id="count">1 / 4</span>
  </div>
  <div class="hero">
    <span class="badge">GRAMMAR</span>
    <h1>Present Simple Sentences</h1>
    <p>Choose the correct form to complete each sentence.</p>
  </div>
  <div class="stage" id="stage">
    <div class="kind" id="kind">GRAMMAR</div>
    <p class="question" id="question"></p>
    <div class="opts" id="opts" role="group"></div>
    <div class="fb" id="fb" role="status"></div>
  </div>
  <div class="result" id="result">
    <div class="big" id="score">0 / 4</div>
    <h2 id="resultTitle"></h2>
    <p class="msg" id="resultMsg" style="color:var(--mut)"></p>
    <ul class="review" id="review"></ul>
  </div>
  <div class="bottom">
    <div>
      <div class="progress-label"><span>PROGRESS</span><span id="progressText">0 / 4</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="actions" id="actions">
      <button type="button" class="btn" id="mainBtn" disabled>Check</button>
    </div>
    <div class="result-actions" id="resultActions">
      <button type="button" class="btn" id="retryBtn">Try again</button>
      <a class="btn ghost" href="../">← Unit 5</a>
    </div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var GAME_ID = "starter-u5-present-simple";
  var ITEMS = [
  {
    "q": "I ______ orange juice. <span style='color:var(--mut);font-size:.85em'>(like / −)</span>",
    "opts": [
      "don't like",
      "like",
      "doesn't like"
    ],
    "ans": 0
  },
  {
    "q": "My friends ______ a lot of burgers. <span style='color:var(--mut);font-size:.85em'>(eat / +)</span>",
    "opts": [
      "eat",
      "don't eat",
      "eats"
    ],
    "ans": 0
  },
  {
    "q": "They ______ a lot of TV. <span style='color:var(--mut);font-size:.85em'>(watch / −)</span>",
    "opts": [
      "don't watch",
      "watch",
      "doesn't watch"
    ],
    "ans": 0
  },
  {
    "q": "We ______ the radio in the morning. <span style='color:var(--mut);font-size:.85em'>(listen to / +)</span>",
    "opts": [
      "listen to",
      "don't listen to",
      "listens to"
    ],
    "ans": 0
  }
];
  var TOTAL = ITEMS.length;
  var idx = 0, correct = 0, answered = false, sel = null;
  var answers = [];
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });
  }

  function shuffledOrder(n) {
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { var r = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[r]; a[r] = t; }
    return a;
  }
  function render() {
    answered = false; sel = null;
    var item = ITEMS[idx];
    $("count").textContent = (idx + 1) + " / " + TOTAL;
    $("kind").textContent = "GRAMMAR" + "  ·  " + (idx + 1) + " / " + TOTAL;
    $("question").innerHTML = item.q;
    $("fb").className = "fb"; $("fb").textContent = "";
    $("mainBtn").textContent = "Check"; $("mainBtn").disabled = true;
    $("progressText").textContent = idx + " / " + TOTAL;
    $("progressFill").style.width = (idx / TOTAL * 100) + "%";
    $("stage").classList.remove("hide");
    $("actions").style.display = "";
    $("result").classList.remove("show");
    $("resultActions").classList.remove("show");
    var box = $("opts"); box.innerHTML = "";
    shuffledOrder(item.opts.length).forEach(function (j) {
      var o = item.opts[j];
      var b = document.createElement("button");
      b.type = "button"; b.className = "ans"; b.setAttribute("data-j", j);
      b.textContent = o;
      b.addEventListener("click", function () {
        if (answered) return;
        sel = j;
        Array.prototype.forEach.call(box.querySelectorAll(".ans"), function (x) {
          x.classList.toggle("sel", x === b);
        });
        $("mainBtn").disabled = false;
      });
      box.appendChild(b);
    });
  }
  function check() {
    if (answered || sel === null) return;
    $("mainBtn").disabled = true;
    
      answered = true;
      var item = ITEMS[idx];
      var ok = sel === item.ans;
      answers[idx] = { ok: ok, text: item.opts[sel] };
      if (ok) correct++;
      Array.prototype.forEach.call(document.querySelectorAll("#opts .ans"), function (b) {
        var j = parseInt(b.getAttribute("data-j"), 10);
        b.disabled = true; b.classList.remove("sel");
        if (j === item.ans) b.classList.add(ok ? "correct" : "reveal");
        else if (j === sel) b.classList.add("wrong");
      });
      $("fb").className = "fb " + (ok ? "ok" : "bad");
      $("fb").textContent = ok ? "Correct!" : ("→ " + (item.tip || item.opts[item.ans]));
      $("progressText").textContent = (idx + 1) + " / " + TOTAL;
      $("progressFill").style.width = ((idx + 1) / TOTAL * 100) + "%";
      $("mainBtn").disabled = false;
      $("mainBtn").textContent = idx === TOTAL - 1 ? "See results" : "Next";
    
  }
  function next() {
    idx++;
    if (idx >= TOTAL) finish(); else render();
  }
  function onMain() { if (!answered) check(); else next(); }
  function finish() {
    $("stage").classList.add("hide");
    $("actions").style.display = "none";
    $("progressFill").style.width = "100%";
    var pct = Math.round((correct / TOTAL) * 100);
    $("score").textContent = correct + " / " + TOTAL;
    $("resultTitle").textContent = correct === TOTAL ? "Excellent!" : pct >= 70 ? "Well done!" : "Good effort!";
    $("resultMsg").textContent = correct === TOTAL ? "Every answer is correct." : "Review the answers below.";
    var html = "";
    ITEMS.forEach(function (item, i) {
      var a = answers[i] || { ok:false, text:"—" };
      html += '<li class="' + (a.ok?"ok":"bad") + '"><div><b>' + (i+1) + ".</b> " + item.q.replace(/<[^>]+>/g,"") +
        '</div><div class="a">You: ' + esc(a.text) + (a.ok?"":' · <b style="color:var(--ok)">' + esc(item.opts[item.ans]) + "</b>") +
        "</div></li>";
    });
    $("review").innerHTML = html;
    $("result").classList.add("show");
    $("resultActions").classList.add("show");
    try { if (window.TestStars) TestStars.award(GAME_ID); } catch(e){}
    try {
      if (window.LAFinish) LAFinish.show({
        gameId: GAME_ID, gameName: "Present Simple Sentences", score: correct, total: TOTAL,
        accuracy: pct, onAgain: reset, backHref: "../", category: "tests", unit: "starter-5"
      });
      else if (window.LAStars && LAStars.saveFromAccuracy) LAStars.saveFromAccuracy(GAME_ID, pct);
    } catch(e){}
  }
  function reset() {
    idx = 0; correct = 0; answers = []; answered = false; sel = null;
    render();
  }
  $("mainBtn").addEventListener("click", onMain);
  $("retryBtn").addEventListener("click", reset);
  render();
});
</script>
<script src="/theme.js"></script>
<script src="/learningarcade/la-stars.js" data-la-stars></script>
