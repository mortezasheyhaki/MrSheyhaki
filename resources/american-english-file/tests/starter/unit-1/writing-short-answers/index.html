<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit 1 · Writing: Short Answers | AEF Starter | Mr. Sheyhaki</title>
<meta name="description" content="Answer the questions about yourself with short answers. American English File Starter, Unit 1.">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<style>
/* Fixed viewport layout — no page scroll on mobile or desktop */
html:root, html:root body.ws{
  height:100% !important; max-height:100% !important;
  overflow:hidden !important; padding:0 !important; margin:0 !important;
}
body.ws{
  --bg:#f5f3ff; --card:#ffffff; --ink:#1e1b3a; --mut:#64668a; --line:#e4e1f2;
  --acc:#5b21b6; --acc-d:#4c1d95; --acc-two:#8b5cf6; --acc-soft:rgba(91,33,182,.10);
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b91c1c; --warn-bg:#fee2e2; --amber:#b45309; --amber-bg:#fef3c7;
  --btn-ink:#fff; --ghost:#fff; --shadow:rgba(30,27,58,.08);
  --app-bg:radial-gradient(900px 480px at 0% -10%, rgba(139,92,246,.18), transparent 60%),
           radial-gradient(800px 500px at 100% 0%, rgba(99,102,241,.12), transparent 60%),
           linear-gradient(180deg, #faf8ff 0%, #f1f5ff 100%);
  height:100dvh; height:100vh; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--app-bg) fixed; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
html[data-theme="dark"] body.ws{
  --bg:#0f1420; --card:#171e2d; --ink:#e8edf6; --mut:#a3a9c4; --line:#2c3550;
  --acc:#a78bfa; --acc-d:#7c3aed; --acc-two:#c4b5fd; --acc-soft:rgba(167,139,250,.14);
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --warn:#f87171; --warn-bg:rgba(248,113,113,.14);
  --amber:#fbbf24; --amber-bg:rgba(251,191,36,.14); --btn-ink:#1e1b3a; --ghost:#1e2433;
  --app-bg:radial-gradient(900px 480px at 0% -10%, rgba(139,92,246,.22), transparent 60%),
           linear-gradient(180deg, #111728 0%, #0f1420 100%);
}
body.ws *, body.ws *::before, body.ws *::after{ box-sizing:border-box; }

body.ws .wrap{
  width:100%; max-width:520px; margin:0 auto;
  height:100%; display:flex; flex-direction:column;
  padding:10px 14px max(12px, env(safe-area-inset-bottom));
  gap:8px; overflow:hidden;
}

/* Top bar */
body.ws .top{
  flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 12px; background:rgba(255,255,255,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line); border-radius:16px; box-shadow:0 6px 16px -12px rgba(30,27,58,.3);
}
html[data-theme="dark"] body.ws .top{ background:rgba(23,30,45,.85); }
body.ws .back-btn{
  display:inline-flex; align-items:center; gap:.3rem; min-height:36px; padding:.35rem .8rem;
  border-radius:999px; background:#fff; border:2px solid rgba(124,58,237,.16); color:#5b21b6;
  font-weight:700; font-size:.88rem; text-decoration:none; box-shadow:0 2px 0 rgba(124,58,237,.12);
}
body.ws .back-btn:active{ transform:translateY(1px); box-shadow:0 1px 0 rgba(124,58,237,.12); }
html[data-theme="dark"] body.ws .back-btn{ background:var(--card); color:var(--acc); border-color:rgba(167,139,250,.25); }
body.ws .count{
  margin-left:auto; font-weight:700; font-size:.9rem; color:var(--mut); font-variant-numeric:tabular-nums;
}

/* Compact hero */
body.ws .hero{ flex:none; text-align:center; padding:2px 4px 0; }
body.ws .badge{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:.7px; text-transform:uppercase;
  padding:5px 12px; border-radius:999px; background:var(--acc-soft); color:var(--acc);
}
body.ws .hero h1{ margin:6px 0 2px; font-size:clamp(1.15rem, 4vw, 1.4rem); font-weight:900; letter-spacing:-.02em; line-height:1.15; }
body.ws .hero p{ margin:0; color:var(--mut); font-size:.82rem; line-height:1.35; }
body.ws .hint{
  margin:6px auto 0; padding:7px 12px; border-radius:12px;
  background:var(--amber-bg); color:var(--amber); font-size:.78rem; font-weight:650; line-height:1.3;
  border:1px solid rgba(180,83,9,.12);
}
html[data-theme="dark"] body.ws .hint{ border-color:rgba(251,191,36,.2); }

/* Stage fills remaining space */
body.ws .stage{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:16px 16px 14px; box-shadow:0 10px 24px -16px var(--shadow);
  overflow:auto;
}
body.ws .q-label{
  font-size:.68rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:4px;
}
body.ws .question{
  font-size:clamp(1.15rem, 4.2vw, 1.4rem); font-weight:800; line-height:1.3; margin:0 0 10px; color:var(--ink);
}
body.ws .example{
  margin:0 0 12px; padding:8px 12px; border-radius:10px; background:var(--acc-soft);
  font-size:.82rem; color:var(--mut); line-height:1.35;
}
body.ws .example b{ color:var(--acc); font-weight:800; }

body.ws .field label{
  display:block; font-size:.72rem; font-weight:750; color:var(--mut); margin-bottom:5px;
}
body.ws .answer-input{
  width:100%; font:inherit; font-size:1.05rem; font-weight:700; color:var(--ink);
  padding:12px 14px; border-radius:12px; border:2px solid var(--line);
  background:var(--bg); outline:none; transition:border-color .15s, box-shadow .15s;
  caret-color:var(--acc);
}
body.ws .answer-input:focus{ border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); }
body.ws .answer-input.ok{ border-color:var(--ok); background:var(--ok-bg); }
body.ws .answer-input.bad{ border-color:var(--warn); background:var(--warn-bg); }
body.ws .answer-input:disabled{ opacity:.95; cursor:default; }

body.ws .fb{ min-height:1.25em; margin-top:8px; font-weight:750; font-size:.88rem; line-height:1.3; }
body.ws .fb.ok{ color:var(--ok); }
body.ws .fb.bad{ color:var(--warn); }

/* Bottom controls */
body.ws .bottom{ flex:none; display:flex; flex-direction:column; gap:8px; }
body.ws .progress-label{
  display:flex; justify-content:space-between; font-size:.7rem; font-weight:800;
  letter-spacing:.06em; color:var(--mut);
}
body.ws .progress-bar{ height:6px; border-radius:99px; background:rgba(127,127,127,.14); overflow:hidden; }
body.ws .progress-fill{
  height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,var(--acc),var(--acc-two)); transition:width .35s ease;
}
body.ws .actions{ display:flex; justify-content:center; }
body.ws .btn{
  appearance:none; border:none; cursor:pointer; min-height:46px; min-width:140px; padding:.65rem 1.6rem;
  border-radius:999px; font:inherit; font-size:1rem; font-weight:800; color:var(--btn-ink);
  background:var(--acc); box-shadow:0 3px 0 var(--acc-d); transition:transform .12s, box-shadow .12s, opacity .15s;
}
body.ws .btn:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 var(--acc-d); }
body.ws .btn:disabled{ opacity:.4; cursor:default; box-shadow:0 3px 0 transparent; }
body.ws .btn.ghost{
  background:var(--ghost); color:var(--acc); border:2px solid rgba(124,58,237,.2);
  box-shadow:0 2px 0 rgba(124,58,237,.1); text-decoration:none; display:inline-flex; align-items:center;
}
html[data-theme="dark"] body.ws .btn.ghost{ border-color:rgba(167,139,250,.3); }

/* Results */
body.ws .result{
  flex:1 1 auto; min-height:0; display:none; flex-direction:column;
  text-align:center; overflow:auto; padding:4px 2px;
}
body.ws .result.show{ display:flex; animation:ws-in .35s ease both; }
@keyframes ws-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
body.ws .result .big{
  font-size:clamp(1.8rem, 7vw, 2.6rem); font-weight:900; color:var(--acc); line-height:1;
  font-variant-numeric:tabular-nums; margin-bottom:4px;
}
body.ws .result h2{ margin:4px 0 2px; font-size:1.15rem; font-weight:900; }
body.ws .result .msg{ margin:0 0 10px; color:var(--mut); font-size:.88rem; }
body.ws .review{
  list-style:none; margin:0; padding:0; text-align:left; display:grid; gap:6px; flex:1; overflow:auto;
}
body.ws .review li{
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  font-size:.84rem; line-height:1.35;
}
body.ws .review li .q{ font-weight:750; color:var(--ink); margin-bottom:2px; }
body.ws .review li .a{ color:var(--mut); }
body.ws .review li.ok .a{ color:var(--ok); }
body.ws .review li.bad .a{ color:var(--warn); }
body.ws .review li .correct{ color:var(--ok); font-weight:700; }

body.ws .result-actions{ display:none; gap:8px; justify-content:center; flex-wrap:wrap; flex:none; }
body.ws .result-actions.show{ display:flex; }

body.ws .stage.hide, body.ws .hero-extra.hide{ display:none !important; }
body.ws.done .hero p,
body.ws.done .hint{ display:none; }

/* Very short screens */
@media (max-height:580px){
  body.ws .hero h1{ font-size:1.1rem; margin:4px 0 0; }
  body.ws .hero p{ display:none; }
  body.ws .hint{ font-size:.72rem; padding:5px 10px; }
  body.ws .stage{ padding:12px 14px; }
  body.ws .question{ font-size:1.1rem; margin-bottom:8px; }
  body.ws .example{ margin-bottom:8px; padding:6px 10px; font-size:.78rem; }
  body.ws .answer-input{ padding:10px 12px; font-size:1rem; }
  body.ws .btn{ min-height:42px; }
}
@media (max-height:480px){
  body.ws .badge{ display:none; }
  body.ws .hint{ display:none; }
  body.ws .example{ display:none; }
}

/* shared Tests & Exams top bar: round sound button */
body.ws .count{ margin-left:auto; }
body.ws .tui-sound{
  appearance:none; border:2px solid rgba(124,58,237,.16); background:#fff; color:inherit;
  width:36px; height:36px; border-radius:50%; font-size:1rem; cursor:pointer; flex:none; padding:0;
  display:inline-grid; place-items:center; box-shadow:0 2px 0 rgba(124,58,237,.12); transition:transform .15s;
}
body.ws .tui-sound:active{ transform:translateY(2px); }
html[data-theme="dark"] body.ws .tui-sound{ background:var(--card); border-color:rgba(167,139,250,.25); }

}
html[data-theme="dark"] </style>
</head>
<body class="ws">
<div class="wrap">
  <div class="top header">
    <a class="back-btn" href="../">← Unit 1</a>
    <span class="count" id="count">1 / 5</span>
  </div>

  <div class="hero">
    <span class="badge">Writing</span>
    <h1>Short Answers</h1>
    <p>Answer the questions about yourself with short answers.</p>
    <div class="hint hero-extra" id="heroHint">Start with a capital letter. Example: <b>No, I’m not.</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="q-label" id="qLabel">Question 1</div>
    <p class="question" id="question"></p>
    <div class="example" id="exampleBox">
      Example: Are you from the US?<br><b>No, I’m not.</b>
    </div>
    <div class="field">
      <label for="answer">Your short answer</label>
      <input class="answer-input" id="answer" type="text" autocomplete="off" autocapitalize="sentences"
             autocorrect="off" spellcheck="false" placeholder="Type here…">
    </div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
  </div>

  <div class="result" id="result">
    <div class="big" id="score">0 / 5</div>
    <h2 id="resultTitle"></h2>
    <p class="msg" id="resultMsg"></p>
    <ul class="review" id="review"></ul>
  </div>

  <div class="bottom" id="bottom">
    <div>
      <div class="progress-label"><span>PROGRESS</span><span id="progressText">0 / 5</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="actions" id="actions">
      <button type="button" class="btn" id="mainBtn" disabled>Check</button>
    </div>
    <div class="result-actions" id="resultActions">
      <button type="button" class="btn" id="retryBtn">Try again</button>
      <a class="btn ghost" href="../">← Unit 1</a>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var GAME_ID = "starter-u1-writing-short-answers";

  var YES_I = ["Yes, I am.", "Yes, I am"];
  var NO_I  = ["No, I'm not.", "No, I'm not", "No, I am not.", "No, I am not"];
  var YES_IT = ["Yes, it is.", "Yes, it is"];
  var NO_IT  = ["No, it isn't.", "No, it isn't", "No, it's not.", "No, it's not", "No, it is not.", "No, it is not"];

  var ITEMS = [
    { q: "Are you a student?",              accept: YES_I.concat(NO_I),   tip: "Yes, I am. / No, I'm not." },
    { q: "Is it your birthday tomorrow?",   accept: YES_IT.concat(NO_IT), tip: "Yes, it is. / No, it isn't." },
    { q: "Are you from Mexico?",            accept: YES_I.concat(NO_I),   tip: "Yes, I am. / No, I'm not." },
    { q: "Are you Miguel?",                 accept: YES_I.concat(NO_I),   tip: "Yes, I am. / No, I'm not." },
    { q: "Are you in a classroom?",         accept: YES_I.concat(NO_I),   tip: "Yes, I am. / No, I'm not." }
  ];

  var TOTAL = ITEMS.length;
  var idx = 0, correct = 0, answered = false;
  var answers = [];
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function normalize(s) {
    return String(s).replace(/[\u2018\u2019\u02BC\u0060]/g, "'").replace(/\s+/g, " ").trim();
  }
  function startsWithCapital(s) {
    var ch = s.charAt(0);
    return ch >= "A" && ch <= "Z";
  }
  function isAccepted(typed, list) {
    var n = normalize(typed);
    if (!startsWithCapital(n)) return false;
    var lower = n.toLowerCase().replace(/\.$/, "");
    for (var i = 0; i < list.length; i++) {
      var a = normalize(list[i]).toLowerCase().replace(/\.$/, "");
      if (lower === a) return true;
    }
    return false;
  }
  function sampleAnswer(item) {
    var list = item.accept;
    for (var i = 0; i < list.length; i++) {
      if (/I'm|isn't|it's/i.test(list[i]) || list[i].indexOf("Yes, I am.") === 0 || list[i].indexOf("Yes, it is.") === 0) {
        return list[i].replace(/\.$/, "") + ".";
      }
    }
    return list[0];
  }

  function render() {
    answered = false;
    var item = ITEMS[idx];
    document.body.classList.remove("done");
    $("count").textContent = (idx + 1) + " / " + TOTAL;
    $("qLabel").textContent = "Question " + (idx + 1);
    $("question").textContent = item.q;
    $("exampleBox").style.display = idx === 0 ? "" : "none";
    $("answer").value = "";
    $("answer").disabled = false;
    $("answer").className = "answer-input";
    $("fb").className = "fb";
    $("fb").textContent = "";
    $("mainBtn").textContent = "Check";
    $("mainBtn").disabled = true;
    $("progressText").textContent = idx + " / " + TOTAL;
    $("progressFill").style.width = (idx / TOTAL * 100) + "%";
    $("stage").classList.remove("hide");
    $("actions").style.display = "";
    $("result").classList.remove("show");
    $("resultActions").classList.remove("show");
    $("heroHint").classList.remove("hide");
    setTimeout(function () { try { $("answer").focus({ preventScroll: true }); } catch (e) {} }, 40);
  }

  function onInput() {
    if (answered) return;
    $("mainBtn").disabled = normalize($("answer").value).length === 0;
  }

  function check() {
    if (answered) return;
    var item = ITEMS[idx];
    var typed = $("answer").value;
    var n = normalize(typed);
    if (!n) return;
    var _mb = document.getElementById("mainBtn"); if (_mb) { _mb.disabled = true; }
    

    answered = true;
    $("answer").disabled = true;

    if (!startsWithCapital(n)) {
      answers[idx] = { ok: false, text: typed, reason: "capital" };
      $("answer").className = "answer-input bad";
      $("fb").className = "fb bad";
      $("fb").textContent = "Start with a capital letter. → " + sampleAnswer(item);
    } else {
      var ok = isAccepted(typed, item.accept);
      answers[idx] = { ok: ok, text: typed };
      if (ok) correct++;
      $("answer").className = "answer-input " + (ok ? "ok" : "bad");
      $("fb").className = "fb " + (ok ? "ok" : "bad");
      $("fb").textContent = ok ? "Correct!" : "→ " + sampleAnswer(item) + "  (or the other short answer)";
    }
    $("mainBtn").disabled = false;
    $("mainBtn").textContent = idx === TOTAL - 1 ? "See results" : "Next";
    $("mainBtn").disabled = false;
    $("progressText").textContent = (idx + 1) + " / " + TOTAL;
    $("progressFill").style.width = ((idx + 1) / TOTAL * 100) + "%";
  
    
}

  function next() {
    idx++;
    if (idx >= TOTAL) finish();
    else render();
  }

  function onMain() {
    if (!answered) check();
    else next();
  }

  function finish() {
    document.body.classList.add("done");
    $("stage").classList.add("hide");
    $("actions").style.display = "none";
    $("heroHint").classList.add("hide");
    $("progressFill").style.width = "100%";
    $("progressText").textContent = TOTAL + " / " + TOTAL;
    $("count").textContent = TOTAL + " / " + TOTAL;

    var pct = Math.round((correct / TOTAL) * 100);
    $("score").textContent = correct + " / " + TOTAL;
    $("resultTitle").textContent = correct === TOTAL ? "Excellent!" :
      pct >= 70 ? "Well done!" : "Good effort!";
    $("resultMsg").textContent = correct === TOTAL
      ? "All short answers are correct."
      : "Review the answers below, then try again.";

    var html = "";
    ITEMS.forEach(function (item, i) {
      var a = answers[i] || { ok: false, text: "" };
      html += '<li class="' + (a.ok ? "ok" : "bad") + '">' +
        '<div class="q">' + (i + 1) + ". " + esc(item.q) + "</div>" +
        '<div class="a">You: ' + (a.text ? esc(a.text) : "—") +
        (a.ok ? "" : ' · <span class="correct">e.g. ' + esc(sampleAnswer(item)) + "</span>") +
        "</div></li>";
    });
    $("review").innerHTML = html;
    $("result").classList.add("show");
    $("resultActions").classList.add("show");

    try {
      if (window.TestStars && typeof TestStars.award === "function") TestStars.award(GAME_ID);
    } catch (e0) {}
    try {
      if (window.LAFinish && typeof LAFinish.show === "function") {
        LAFinish.show({
          gameId: GAME_ID, gameName: "Writing: Short Answers", score: correct, total: TOTAL,
          stars: pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0, accuracy: pct,
          onAgain: reset, backHref: "../", title: "Writing: Short Answers",
          category: "tests", unit: "starter-1"
        });
      } else if (window.LAStars) {
        if (typeof LAStars.recordPlay === "function") LAStars.recordPlay(GAME_ID);
        if (typeof LAStars.saveFromAccuracy === "function") LAStars.saveFromAccuracy(GAME_ID, pct);
      }
    } catch (e) {}
  }

  function reset() {
    idx = 0; correct = 0; answers = []; answered = false;
    document.body.classList.remove("done");
    render();
  }

  $("answer").addEventListener("input", onInput);
  $("answer").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (!answered && normalize($("answer").value)) check();
      else if (answered) next();
    }
  });
  $("mainBtn").addEventListener("click", onMain);
  $("retryBtn").addEventListener("click", reset);

  render();
});
</script>
