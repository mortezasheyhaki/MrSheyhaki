<script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)
document.documentElement.setAttribute("data-theme","dark");
else document.documentElement.setAttribute("data-theme","light");
}catch(e){}})();

<style>
/* Choose-the-information rows, sized to fit a phone screen without scrolling */
.ul-list{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:10px; overflow:hidden; padding:4px 0; }
.ul-row{ background:var(--lc-card); border:1px solid var(--lc-line); border-radius:16px; padding:12px 14px; box-shadow:var(--lc-shadow); }
.ul-row.is-right{ border-color:var(--lc-ok); }
.ul-row.is-wrong{ border-color:var(--lc-bad); }
.ul-line{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
.ul-num{ width:26px; height:26px; border-radius:50%; background:var(--lc-accent-soft); color:var(--lc-accent); font-weight:800; font-size:13px; display:grid; place-items:center; flex:none; margin-right:2px; }
.ul-text{ font-size:17px; line-height:1.5; color:var(--lc-ink); }
.ul-opt{ appearance:none; position:relative; min-height:38px; padding:6px 14px; border-radius:12px; cursor:pointer;
  border:2px solid var(--lc-line); background:var(--lc-card); color:var(--lc-ink); font:inherit; font-size:15px; font-weight:700;
  -webkit-tap-highlight-color:transparent; transition:border-color .15s, background .15s; }
.ul-opt:active{ transform:translateY(1px); }
.ul-opt.is-picked{ border-color:var(--lc-accent); background:var(--lc-accent-soft); color:var(--lc-accent); }
.ul-opt.is-correct{ border-color:var(--lc-ok); background:var(--lc-ok-soft); color:var(--lc-ok-ink); }
.ul-opt.is-wrong{ border-color:var(--lc-bad); background:var(--lc-bad-soft); color:var(--lc-bad-ink); }
.ul-opt:disabled{ cursor:default; }
.ul-opt:disabled:not(.is-picked):not(.is-correct):not(.is-wrong){ opacity:.5; }
.ul-tick{ margin-left:6px; font-weight:900; }
@media (max-width:480px){
  .ul-row{ padding:10px 11px; }
  .ul-text{ font-size:15px; }
  .ul-opt{ min-height:34px; padding:5px 10px; font-size:14px; }
  .ul-num{ width:22px; height:22px; font-size:12px; }

}
@media (max-height:720px){

}
/* layout polish: compact audio strip, lines start under it, footer aligned */
.ul-list{ justify-content:flex-start !important; flex:0 1 auto !important; padding:6px 0 0 !important; }

/* ---- dark mode: one consistent surface for every card ---- */
html[data-theme="dark"] .al-listen,
html[data-theme="dark"] .al-foot{
  background:var(--lc-card) !important;
  border:1px solid var(--lc-line) !important;
  box-shadow:var(--lc-shadow) !important;
}
html[data-theme="dark"] .al-listen-title{ color:var(--lc-ink) !important; }
html[data-theme="dark"] .al-listen-sub,
html[data-theme="dark"] .al-foot-text{ color:var(--lc-muted) !important; }
html[data-theme="dark"] .al-foot-text.is-ok{ color:var(--lc-ok-ink) !important; }
html[data-theme="dark"] .al-foot-text.is-bad{ color:var(--lc-bad-ink) !important; }

/* play square: accent fill with dark glyph, so the triangle and bars stand out */
html[data-theme="dark"] .al-play{
  background:linear-gradient(145deg,var(--lc-accent),var(--lc-accent-2)) !important;
  box-shadow:0 10px 26px rgba(92,124,250,.35);
}
html[data-theme="dark"] .al-play-tri{ border-left-color:#0b1020 !important; }
html[data-theme="dark"] .al-play-bars i{ background:#0b1020 !important; }
html[data-theme="dark"] .al-play-alert{ color:#0b1020 !important; }
html[data-theme="dark"] .al-play.is-playing{
  background:linear-gradient(145deg,var(--lc-accent-2),var(--lc-accent)) !important;
}
html[data-theme="dark"] .al-play.is-playing::after{ border-color:var(--lc-accent-2); }
html[data-theme="dark"] .al-play:disabled{ background:var(--lc-line) !important; }

/* Check / See results button */
html[data-theme="dark"] .al-next{
  background:var(--lc-accent) !important; color:#0b1020 !important;
  box-shadow:0 4px 0 rgba(0,0,0,.35) !important;
}
html[data-theme="dark"] .al-next:disabled{ background:var(--lc-line) !important; color:var(--lc-muted) !important; }
/* multiple-choice layout: question above, three choices in one row */
.ul-line{ display:grid !important; grid-template-columns:26px minmax(0,1fr) !important; align-items:start !important; gap:10px !important; }
