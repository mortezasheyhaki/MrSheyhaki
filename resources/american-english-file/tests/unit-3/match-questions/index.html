<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit 3 · Match the Questions and Answers | AEF 1 | Mr. Sheyhaki</title>
<meta name="description" content="Match each question with the correct answer. American English File 1 Unit 3.">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<style>
body.pst{
  --bg:#f7f4ee; --card:#ffffff; --ink:#1d2430; --mut:#6b7280; --line:#e6e0d4;
  --acc:#0f766e; --acc-d:#0b5c56; --acc-two:#14b8a6; --acc-soft:rgba(15,118,110,.10); --btn-ink:#ffffff;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b91c1c; --warn-bg:#fee2e2;
  --ghost:#ffffff; --ghost-ink:#1d2430; --shadow:rgba(29,36,48,.07);
  --app-bg:radial-gradient(900px 520px at 8% -12%, rgba(20,184,166,.20), transparent 60%), radial-gradient(760px 480px at 100% 0%, rgba(124,58,237,.11), transparent 58%), linear-gradient(180deg, #f0fdfa 0%, #eef4ff 100%);
}
html[data-theme="dark"] body.pst{
  --bg:#0f1420; --card:#171e2d; --ink:#e8edf6; --mut:#9aa6b8; --line:#2a3447;
  --acc:#2dd4bf; --acc-d:#0f8a7b; --acc-two:#5eead4; --acc-soft:rgba(45,212,191,.14); --btn-ink:#062b27;
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --warn:#f87171; --warn-bg:rgba(248,113,113,.14);
  --ghost:#1d2638; --ghost-ink:#e8edf6; --shadow:rgba(0,0,0,.35);
  --app-bg:radial-gradient(900px 520px at 8% -12%, rgba(45,212,191,.16), transparent 60%), radial-gradient(760px 480px at 100% 0%, rgba(124,58,237,.18), transparent 58%), linear-gradient(180deg, #0c1a1f 0%, #0f1420 100%);
}
html, html[data-theme="dark"]{ background:var(--bg); }
html[data-theme="dark"] body.pst{ background:var(--app-bg) fixed !important; }
html, body.pst{ margin:0; padding:0; height:100%; overflow:hidden; }
body.pst{
  position:fixed; inset:0; overflow:hidden; box-sizing:border-box;
  background:var(--app-bg) fixed; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; touch-action:manipulation;
}
body.pst *, body.pst *::before, body.pst *::after{ box-sizing:border-box; }
body.pst .app{
  position:fixed; top:0; right:0; bottom:0; left:0;
  display:flex; flex-direction:column;
  width:100%; max-width:680px; margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));
  overflow:hidden;
}
body.pst .app > *{ margin:0; }
body.pst .top{
  display:flex; align-items:center; gap:10px; flex:0 0 auto;
}
body.pst .back-btn{
  display:inline-flex; align-items:center; gap:.35rem; min-height:40px; padding:.4rem .9rem;
  border-radius:999px; background:#fff; border:2px solid rgba(124,58,237,.16); color:#5b21b6;
  font-weight:700; font-size:.92rem; text-decoration:none;
  box-shadow:0 3px 0 rgba(124,58,237,.12);
}
body.pst .count{ margin-left:auto; font-weight:700; font-size:.92rem; color:var(--mut); font-variant-numeric:tabular-nums; }

body.pst .tui-sound{
  appearance:none; border:2px solid rgba(124,58,237,.16); background:#fff;
  width:40px; height:40px; border-radius:50%; font-size:1.05rem; cursor:pointer; flex:none;
  box-shadow:0 3px 0 rgba(124,58,237,.12); transition:transform .15s; padding:0;
  display:inline-grid; place-items:center; margin-left:8px;
}
body.pst .tui-sound:active{ transform:translateY(2px); }
body.pst .tui-sound.is-floating{
  position:fixed; top:max(12px, env(safe-area-inset-top)); right:14px; z-index:50;
}


body.pst .stage{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:4px 0; gap:8px;
}
body.pst .stage.hide{ display:none; }
body.pst .kind{
  display:inline-block; padding:6px 12px; border-radius:20px;
  background:var(--acc-soft); color:var(--acc);
  font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
}
body.pst .hint{ font-size:14px; font-weight:600; color:var(--mut); margin:0; }
body.pst .example{ font-size:12.5px; color:var(--mut); }
body.pst .example b{ color:var(--acc); font-weight:700; text-decoration:underline; text-underline-offset:3px; }

/* phrase with gap */
body.pst .phrase{
  display:flex; flex-direction:column; flex-wrap:nowrap; align-items:center; justify-content:center; gap:10px;
  font-size:clamp(18px, 3.6vw, 26px); font-weight:800; line-height:1.35;
  margin:6px 0 4px; min-height:3.2em; width:100%;
}
body.pst .phrase .qtext{ display:block; text-align:center; }

body.pst .slot{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:min(100%, 14em); min-height:2.3em; max-width:100%; padding:4px 10px;
  border:3px dashed var(--acc); border-radius:12px;
  background:rgba(15,118,110,.06); color:var(--mut);
  transition:background .15s, border-color .15s, box-shadow .15s;
}
body.pst .slot.over{ background:var(--acc-soft); border-style:solid; box-shadow:0 0 0 3px var(--acc-soft); }
body.pst .slot.filled{ border-style:solid; background:var(--card); color:var(--ink); }
body.pst .slot.ok{ border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
body.pst .slot.bad{ border-color:var(--warn); background:var(--warn-bg); color:var(--warn); }
body.pst .slot .chip{
  pointer-events:none; box-shadow:none; border:0; background:transparent; color:inherit;
  font:inherit; font-weight:800; padding:0; min-height:0;
}

/* word bank */
body.pst .bank-wrap{
  flex:0 0 auto; width:100%; max-width:640px;
  padding:10px 0 0; margin-top:4px;
}
body.pst .bank-label{
  font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--mut);
  text-transform:uppercase; margin-bottom:6px; text-align:center;
}
body.pst .bank{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:8px;
  width:100%;
  max-width:560px;
  margin:0 auto;
  min-height:52px;
}
body.pst .bank .chip{
  width:100%;
  justify-self:stretch;
  text-align:center;
}
@media (max-width:420px){
  body.pst .bank{ grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; max-width:100%; }
  body.pst .bank .chip{ padding:6px 4px; font-size:13px; min-height:38px; }
}
body.pst .chip{
  appearance:none; cursor:grab; user-select:none;
  min-height:42px; padding:8px 14px; border-radius:14px;
  border:2px solid var(--line); background:var(--ghost); color:var(--ghost-ink);
  font:inherit; font-size:clamp(15px,2.2vw,17px); font-weight:700;
  box-shadow:0 3px 0 var(--line);
  -webkit-tap-highlight-color:transparent;
  transition:transform .08s, opacity .15s, box-shadow .12s, background .15s;
  touch-action:none;
}
body.pst .chip:active{ cursor:grabbing; transform:translateY(2px); box-shadow:0 1px 0 var(--line); }
body.pst .chip.used{ opacity:.32; pointer-events:none; filter:grayscale(.4); }
body.pst .chip.selected{
  border-color:var(--acc); background:var(--acc-soft); color:var(--acc);
  box-shadow:0 3px 0 var(--acc); transform:translateY(-2px);
}
body.pst .chip.dragging{ opacity:.35; }

body.pst .fb{ min-height:1.35em; font-size:15px; font-weight:700; margin:2px 0 0; }
body.pst .fb.ok{ color:var(--ok); }
body.pst .fb.bad{ color:var(--warn); }

body.pst .progress{ flex:0 0 auto; margin:6px 0 2px; padding:0 2px; }
body.pst .progress-label{ display:flex; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--mut); margin-bottom:4px; }
body.pst .progress-bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; }
body.pst .progress-fill{ height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg, var(--acc), var(--acc-two)); transition:width .25s ease; }

body.pst .actions{ flex:0 0 auto; display:flex; gap:10px; justify-content:center; padding:4px 0 0; }
body.pst .btn{
  appearance:none; border:0; cursor:pointer;
  min-height:48px; min-width:130px; padding:.65rem 1.3rem;
  border-radius:14px; font-weight:800; font-size:1rem;
  background:var(--acc); color:var(--btn-ink);
  box-shadow:0 4px 0 var(--acc-d);
}
body.pst .btn:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 var(--acc-d); }
body.pst .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }
body.pst .btn.ghost{ background:var(--ghost); color:var(--ink); border:2px solid var(--line); box-shadow:0 3px 0 rgba(0,0,0,.06); }

body.pst .result{ display:none; flex-direction:column; align-items:center; text-align:center; flex:1 1 auto; min-height:0; overflow:auto; padding:8px 0 4px; }
body.pst .result.show{ display:flex; }
body.pst .result .big{ font-size:clamp(2.4rem, 8vw, 3.2rem); font-weight:900; color:var(--acc); line-height:1; margin-bottom:6px; }
body.pst .result h2{ font-size:1.25rem; margin:0 0 4px; }
body.pst .result .msg{ color:var(--mut); font-size:.95rem; margin-bottom:12px; }
body.pst .review{ list-style:none; width:100%; max-width:560px; text-align:left; margin:0; padding:0; font-size:14px; }
body.pst .review li{ display:flex; align-items:flex-start; gap:8px; padding:8px 10px; border-radius:10px; margin-bottom:6px; background:var(--card); border:1px solid var(--line); }
body.pst .review li.ok{ border-color:rgba(21,128,61,.25); background:var(--ok-bg); }
body.pst .review li.no{ border-color:rgba(185,28,28,.2); background:var(--warn-bg); }
body.pst .review .n{ flex:none; font-weight:800; color:var(--mut); min-width:1.4em; }
body.pst .review .was{ text-decoration:line-through; opacity:.7; margin-right:6px; }
body.pst .review .right{ font-weight:700; color:var(--ok); }

@media (max-height:640px){
  body.pst .example{ display:none; }
  body.pst .hint{ font-size:13px; }
  body.pst .phrase{ font-size:clamp(18px, 3.8vw, 24px); min-height:2.6em; }
  body.pst .chip{ min-height:38px; padding:6px 12px; }
}
@media (max-height:560px){
  body.pst .kind{ display:none; }
  body.pst .bank{ gap:6px; }
}
</style>
</head>
<body class="pst">
<div class="app">
  <div class="top header">
    <a class="back-btn" href="/resources/american-english-file/tests/unit-3/">← Unit 3</a>
    <span class="count" id="count">1 / 6</span>
  </div>

  <div class="stage" id="stage">
    <div class="kind" id="kind">MATCH Q &amp; A</div>
    <p class="hint" id="hint">Tap an answer to match it to the question (or drag it).</p>
    <div class="phrase" id="phrase"></div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <div class="example">Example: Who is your favorite actor? → <b>Brad Pitt</b></div>
    <div class="bank-wrap" id="bankWrap">
      <div class="bank-label">Answers</div>
      <div class="bank" id="bank" role="list"></div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="big" id="score">0 / 6</div>
    <h2 id="resultTitle"></h2>
    <p class="msg" id="resultMsg"></p>
    <ul class="review" id="review"></ul>
  </div>

  <div class="progress">
    <div class="progress-label"><span>PROGRESS</span><span id="progressText">0 / 6</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="actions" id="actions">
    <button type="button" class="btn" id="mainBtn" disabled>Check</button>
  </div>
  <div class="actions" id="resultActions" style="display:none">
    <button type="button" class="btn" id="retryBtn">Try again</button>
    <a class="btn ghost" href="../">← Unit 3</a>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
/* before / after surround the gap; ans = correct chip text */
var ITEMS = [
  { before: "When do you study English?", after: "", ans: "In the afternoon", full: "When do you study English? In the afternoon." },
  { before: "Why do you play football?", after: "", ans: "Because I like it", full: "Why do you play football? Because I like it." },
  { before: "What kind of music do you like?", after: "", ans: "Jazz", full: "What kind of music do you like? Jazz." },
  { before: "What do you do?", after: "", ans: "I'm an administrator", full: "What do you do? I'm an administrator." },
  { before: "Where do you work?", after: "", ans: "In a shop", full: "Where do you work? In a shop." },
  { before: "How old are you?", after: "", ans: "27 years old", full: "How old are you? 27 years old." }
];
var BANK = ["In a shop", "27 years old", "In the afternoon", "Jazz", "Because I like it", "I'm an administrator"];
var TOTAL = ITEMS.length;
var idx = 0, correct = 0, answers = [], checked = false;
var placed = null;   /* chip text currently in the slot */
var selected = null;
var used = [];       /* words already placed (muted in bank) */
var bankOrder = [];  /* stable shuffled order for the bank */
var $ = function (id) { return document.getElementById(id); };

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}

function renderBank() {
  var bank = $("bank");
  bank.innerHTML = "";
  bankOrder.forEach(function (w) {
    var isUsed = used.indexOf(w) !== -1;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (isUsed ? " used" : "") + (selected === w ? " selected" : "");
    b.textContent = w;
    b.setAttribute("draggable", isUsed || checked ? "false" : "true");
    b.setAttribute("data-word", w);
    b.setAttribute("role", "listitem");
    if (isUsed || checked) b.disabled = true;
    /* drag (desktop) */
    b.addEventListener("dragstart", function (e) {
      if (checked || isUsed) { e.preventDefault(); return; }
      e.dataTransfer.setData("text/plain", w);
      e.dataTransfer.effectAllowed = "move";
      b.classList.add("dragging");
    });
    b.addEventListener("dragend", function () { b.classList.remove("dragging"); });
    /* tap → place into gap */
    b.addEventListener("click", function () {
      if (checked || isUsed) return;
      placeWord(w);
    });
    bank.appendChild(b);
  });
}

function renderPhrase() {
  var item = ITEMS[idx];
  var html = "";
  if (item.before) html += '<span class="qtext">' + escapeHtml(item.before) + '</span>';
  html += '<span class="slot' + (placed ? " filled" : "") + '" id="slot" tabindex="0" role="button" aria-label="drop zone">' +
    (placed ? '<span class="chip">' + escapeHtml(placed) + '</span>' : "…") +
    '</span>';
  if (item.after) html += '<span>' + escapeHtml(item.after) + '</span>';
  $("phrase").innerHTML = html;

  var slot = $("slot");
  /* drop handlers */
  slot.addEventListener("dragover", function (e) {
    if (checked) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    slot.classList.add("over");
  });
  slot.addEventListener("dragleave", function () { slot.classList.remove("over"); });
  slot.addEventListener("drop", function (e) {
    e.preventDefault();
    slot.classList.remove("over");
    if (checked) return;
    var w = e.dataTransfer.getData("text/plain");
    if (!w || used.indexOf(w) !== -1) return;
    placeWord(w);
  });
  /* tap slot to place selected chip, or clear filled slot */
  slot.addEventListener("click", function () {
    if (checked) return;
    if (placed) {
      /* return chip to bank (unmute) */
      var ui = used.indexOf(placed);
      if (ui !== -1) used.splice(ui, 1);
      placed = null;
      selected = null;
      $("mainBtn").disabled = true;
      renderPhrase();
      renderBank();
    }
  });
}

function placeWord(w) {
  if (checked) return;
  if (used.indexOf(w) !== -1 && w !== placed) return;
  /* if swapping, free the previous word */
  if (placed && placed !== w) {
    var pi = used.indexOf(placed);
    if (pi !== -1) used.splice(pi, 1);
  }
  placed = w;
  if (used.indexOf(w) === -1) used.push(w);
  selected = null;
  $("mainBtn").disabled = false;
  renderPhrase();
  renderBank();
}

function render() {
  var item = ITEMS[idx];
  checked = false;
  placed = null;
  selected = null;
  /* remaining = bank words not yet used in previous answers? No — full bank each time is clearer for learning,
     but worksheet has one shared bank. Use shared remaining across items so used words disappear. */
  if (idx === 0) { bankOrder = shuffle(BANK.slice()); used = []; }
  $("count").textContent = (idx + 1) + " / " + TOTAL;
  $("progressText").textContent = idx + " / " + TOTAL;
  $("progressFill").style.width = (idx / TOTAL * 100) + "%";
  $("kind").textContent = "MATCH Q &amp; A  ·  " + (idx + 1) + " / " + TOTAL;
  $("fb").className = "fb"; $("fb").textContent = "";
  $("mainBtn").textContent = "Check";
  $("mainBtn").disabled = true;
  $("bankWrap").style.display = "";
  renderPhrase();
  renderBank();
}

function check() {
  if (checked || !placed) return;
  checked = true;
  var item = ITEMS[idx];
  var ok = String(placed).replace(/[\u2019']/g,"'").toLowerCase().trim() === String(item.ans).replace(/[\u2019']/g,"'").toLowerCase().trim();
  answers[idx] = { ok: ok, text: placed, full: item.full };
  if (ok) correct++;
  var slot = $("slot");
  if (slot) {
    slot.classList.remove("filled");
    slot.classList.add(ok ? "ok" : "bad");
  }
  $("fb").className = "fb " + (ok ? "ok" : "bad");
  $("fb").textContent = ok ? "Correct!" : "→ " + item.ans;
  if (!ok) {
    /* wrong: unmute so it can be used on a later item */
    var ui = used.indexOf(placed);
    if (ui !== -1) used.splice(ui, 1);
  }
  $("progressText").textContent = (idx + 1) + " / " + TOTAL;
  $("progressFill").style.width = ((idx + 1) / TOTAL * 100) + "%";
  $("mainBtn").disabled = false;
  $("mainBtn").textContent = idx === TOTAL - 1 ? "See results" : "Next";
  renderBank();
}

function onMain() { if (!checked) check(); else next(); }
function next() {
  idx++;
  if (idx >= TOTAL) finish();
  else render();
}

function finish() {
  $("progressFill").style.width = "100%";
  $("progressText").textContent = TOTAL + " / " + TOTAL;
  $("stage").classList.add("hide");
  $("bankWrap").style.display = "none";
  $("actions").style.display = "none";
  $("resultActions").style.display = "flex";
  $("result").classList.add("show");
  $("score").textContent = correct + " / " + TOTAL;
  $("resultTitle").textContent = correct === TOTAL ? "Wonderful work!" : correct >= TOTAL - 2 ? "Nice work!" : "Good effort!";
  $("resultMsg").textContent = correct === TOTAL ? "Every phrase is complete." : "Check the answers below, then try again if you like.";
  var ul = $("review"); ul.innerHTML = "";
  ITEMS.forEach(function (item, i) {
    var a = answers[i] || {};
    var li = document.createElement("li");
    if (a.ok) {
      li.className = "ok";
      li.innerHTML = '<span class="n">' + (i + 1) + '</span>' + escapeHtml(item.full);
    } else {
      li.className = "no";
      li.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="was">' +
        escapeHtml(a.text || "—") + '</span><span class="right">' + escapeHtml(item.ans) + '</span>';
    }
    ul.appendChild(li);
  });
  var gameId = "aef1-u3-match-questions";
  try { if (window.TestStars && typeof TestStars.award === "function") TestStars.award(gameId); } catch (e0) {}
  try {
    if (window.LAFinish && typeof LAFinish.show === "function") {
      LAFinish.show({
        gameId: gameId, gameName: "Match the Questions and Answers", score: correct, total: TOTAL,
        title: "Match the Questions and Answers", backHref: "/resources/american-english-file/tests/unit-3/",
        onAgain: function () { $("retryBtn").click(); }, category: "grammar"
      });
    }
  } catch (e1) {}
  try {
    if (window.LAStars) {
      if (typeof LAStars.recordPlay === "function") LAStars.recordPlay(gameId);
      if (typeof LAStars.saveFromAccuracy === "function") LAStars.saveFromAccuracy(gameId, Math.round((correct / TOTAL) * 100));
    }
  } catch (e) {}
}

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); if (!$("stage").classList.contains("hide")) onMain(); }
});
$("mainBtn").addEventListener("click", onMain);
$("retryBtn").addEventListener("click", function () {
  idx = 0; correct = 0; answers = []; checked = false; bankOrder = shuffle(BANK.slice()); used = [];
  $("result").classList.remove("show");
  $("resultActions").style.display = "none";
  $("actions").style.display = "flex";
  $("stage").classList.remove("hide");
  $("mainBtn").textContent = "Check";
  render();
});
render();
});
</script>

<script>
document.addEventListener("click", function (e) {
  var m = e.target.closest && e.target.closest("#mainBtn");
  if (!m) return;
  var label = (m.textContent || "").trim();
  setTimeout(function () {
    try {
      if (/See results/.test(label)) { LASfx.win(); return; }
      if (/Next/.test(label)) { LASfx.pop(); return; }
      var fb = document.getElementById("fb");
      if (!fb) return;
      if (fb.className.indexOf("ok") !== -1) LASfx.correct();
      else if (fb.className.indexOf("bad") !== -1) LASfx.wrong();
    } catch (x) {}
  }, 40);
}, true);
</script>
