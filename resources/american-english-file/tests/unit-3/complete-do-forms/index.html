body.pst #sentence{ max-width:640px; width:auto; margin:0 auto; text-align:left; font-size:clamp(20px, 3.4vw, 28px); line-height:1.7; font-weight:800; height:auto; min-height:0; overflow:visible; white-space:normal; padding:0 8px; box-sizing:border-box; display:flex; flex-direction:column; align-items:flex-start; gap:6px; }

<body class="pst">
<div class="bg" aria-hidden="true"></div>
<div class="app">
  <div class="top header">
    <a class="back-btn" href="/resources/american-english-file/tests/unit-3/">← Unit 3</a>
    <span class="count" id="count">1 / 6</span>
  </div>

  <div class="stage" id="stage">
    <div class="kind" id="kind" aria-live="polite"></div>
    <p class="instr">Complete the sentences with a form of <b>do</b>.</p>
    <div class="sentence" id="sentence"></div>
    <p class="hint" id="hint"></p>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <div class="example">Example: <b>Do</b> you drink coffee?</div>
  </div>

  <div class="result" id="result">
    <div class="big" id="score">0 / 6</div>
    <h2 id="resultTitle"></h2>
    <p class="msg" id="resultMsg"></p>
    <ul class="review" id="review"></ul>
  </div>

  <div class="progress">
    <div class="progress-label"><span>PROGRESS</span><span id="progressText">0 / 6</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="actions" id="actions">
    <button type="button" class="btn" id="mainBtn" disabled>Check</button>
  </div>
  <div class="actions" id="resultActions" style="display:none">
    <button type="button" class="btn" id="retryBtn">Try again</button>
    <a class="btn ghost" href="../">← Unit 3</a>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
/* lines = dialogue or sentence parts; ___ = gap; acc = accepted answers; ans = shown when wrong; strict = require capital */
var ITEMS = [
  {
    lines: ["___ your phone have a good camera?"],
    acc: ["Does"],
    ans: "Does",
    strict: true
  },
  {
    lines: [
      "A: ‘Do you speak Japanese?’",
      "B: ‘Yes, I ___.’"
    ],
    acc: ["do"],
    ans: "do",
    strict: false
  },
  {
    lines: ["___ Ethan work in a hotel?"],
    acc: ["Does"],
    ans: "Does",
    strict: true
  },
  {
    lines: [
      "A: ‘Does Sunita live near you?’",
      "B: ‘No, she ___.’"
    ],
    acc: ["doesn’t", "doesn't", "does not"],
    ans: "doesn’t",
    strict: false
  },
  {
    lines: ["What ___ your parents do for a living?"],
    acc: ["do"],
    ans: "do",
    strict: false
  },
  {
    lines: ["___ your cousins live in the USA?"],
    acc: ["Do"],
    ans: "Do",
    strict: true
  }
];
var TOTAL = ITEMS.length;
var idx = 0, correct = 0, answers = [], answered = false;
var $ = function (id) { return document.getElementById(id); };
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
/* lower case, straight apostrophes, single spaces */
function exact(s) { return String(s).replace(/’/g, "'").replace(/\s+/g, " ").trim(); }
function norm(s) { return String(s).toLowerCase().replace(/’/g, "'").replace(/\s+/g, " ").trim(); }

function sentenceHtml(item, i) {
  return item.lines.map(function (ln) {
    var parts = ln.split("___");
    var inner = escapeHtml(parts[0]) +
      (parts.length > 1
        ? '<input type="text" id="typed" class="typed" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="gap ' + (i + 1) + '">' + escapeHtml(parts.slice(1).join("___"))
        : "");
    return '<span class="sline">' + inner + "</span>";
  }).join("");
}

/* One font size for every sentence (so the gap is the same width everywhere):
   the size at which the LONGEST sentence still fits on one row.
   Measured on a hidden copy so the live question is never touched. */
function fitSentences() {
  var el = $("sentence");
  var probe = el.cloneNode(false);
  probe.removeAttribute("id");
  probe.style.cssText = "position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;white-space:nowrap;width:auto;max-width:none;height:auto;font-size:28px;";
  el.parentNode.appendChild(probe);
  var maxW = 0;
  ITEMS.forEach(function (it, i) {
    probe.innerHTML = sentenceHtml(it, i).replace(' id="typed"', "");
    maxW = Math.max(maxW, probe.scrollWidth);
  });
  el.parentNode.removeChild(probe);
  var par = el.parentNode, cs = getComputedStyle(par);
  var avail = Math.min(640, par.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) - 16;
  var px = maxW > avail && maxW > 0 ? Math.floor(28 * avail / maxW) : 28;
  el.style.fontSize = Math.max(18, Math.min(28, px)) + "px";
}

function render() {
  var item = ITEMS[idx];
  answered = false;
  $("count").textContent = (idx + 1) + " / " + TOTAL;
  $("progressText").textContent = idx + " / " + TOTAL;
  $("progressFill").style.width = (idx / TOTAL * 100) + "%";
  $("kind").textContent = "FORMS OF DO  ·  " + (idx + 1) + " / " + TOTAL;
  $("sentence").innerHTML = sentenceHtml(item, idx);
  $("hint").textContent = "";
  $("fb").className = "fb";
  $("fb").textContent = "";
  $("mainBtn").textContent = "Check";
  $("mainBtn").disabled = true;
  var t = $("typed");
  if (t) {
    t.addEventListener("input", function () { if (!answered) $("mainBtn").disabled = norm(t.value) === ""; });
    t.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); onMain(); } });
    setTimeout(function () { t.focus(); }, 50);
  }
}

function check() {
  if (answered) return;
  var item = ITEMS[idx];
  var t = $("typed");
  if (!t) return;
  var v = t.value;
  if (norm(v) === "") return;
  answered = true;
  var ok = item.acc.some(function (a) {
    if (item.strict) return exact(a) === exact(v);   /* sentence-start gap: capital letter needed */
    return norm(a) === norm(v);
  });
  answers[idx] = { ok: ok, text: v.trim() };
  if (ok) correct++;
  t.disabled = true;
  t.classList.add(ok ? "ok" : "bad");
  $("fb").className = "fb " + (ok ? "ok" : "bad");
  $("fb").textContent = ok ? "Correct!" : "→ " + item.ans;
  $("progressText").textContent = (idx + 1) + " / " + TOTAL;
  $("progressFill").style.width = ((idx + 1) / TOTAL * 100) + "%";
  $("mainBtn").disabled = false;
  $("mainBtn").textContent = idx === TOTAL - 1 ? "See results" : "Next";
}

function onMain() { if (!answered) check(); else next(); }
function next() { idx++; if (idx >= TOTAL) finish(); else render(); }

function finish() {
  $("progressFill").style.width = "100%";
  $("progressText").textContent = TOTAL + " / " + TOTAL;
  $("stage").classList.add("hide");
  $("actions").style.display = "none";
  $("resultActions").style.display = "flex";
  $("result").classList.add("show");
  $("score").textContent = correct + " / " + TOTAL;
  $("resultTitle").textContent =
    correct === TOTAL ? "Wonderful work!" : correct >= TOTAL - 1 ? "Nice work!" : "Good effort!";
  $("resultMsg").textContent =
    correct === TOTAL ? "Every answer is correct." : "Check the answers below, then try again if you like.";

  var ul = $("review");
  ul.innerHTML = "";
  ITEMS.forEach(function (item, i) {
    var a = answers[i] || {};
    var li = document.createElement("li");
    var filled = item.lines.map(function (ln) {
      return ln.replace("___", a.text || "___");
    }).join(" · ");
    if (a.ok) {
      li.className = "ok";
      li.innerHTML = '<span class="n">' + (i + 1) + '</span>' + escapeHtml(filled);
    } else {
      li.className = "no";
      li.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="was">' +
        escapeHtml(a.text || "—") + '</span><span class="right">' + escapeHtml(item.ans) + '</span>';
    }
    ul.appendChild(li);
  });

  var gameId = "aef1-u3-complete-do-forms";
  try {
    if (window.TestStars && typeof TestStars.award === "function") TestStars.award(gameId);
  } catch (e0) {}
  try {
    if (window.LAFinish && typeof LAFinish.show === "function") {
      LAFinish.show({
        gameId: gameId,
        gameName: "Complete the Sentences with a Form of do",
        score: correct,
        total: TOTAL,
        title: "Complete the Sentences with a Form of do",
        backHref: "/resources/american-english-file/tests/unit-3/",
        onAgain: function () { $("retryBtn").click(); },
        category: "grammar"
      });
    }
  } catch (e1) {}
  try {
    if (window.LAStars) {
      if (typeof LAStars.recordPlay === "function") LAStars.recordPlay(gameId);
      if (typeof LAStars.saveFromAccuracy === "function") {
        LAStars.saveFromAccuracy(gameId, Math.round((correct / TOTAL) * 100));
      }
    }
  } catch (e) {}
}

$("mainBtn").addEventListener("click", onMain);
$("retryBtn").addEventListener("click", function () {
  idx = 0; correct = 0; answers = []; answered = false;
  $("result").classList.remove("show");
  $("resultActions").style.display = "none";
  $("actions").style.display = "flex";
  $("stage").classList.remove("hide");
  render();
});

fitSentences();
window.addEventListener("resize", fitSentences);
render();
});
</script>

<script>
/* desktop: Enter presses the Check / Next / See results button (capture phase, so the game handles it once) */
(function () {
  if (window.__enterCheck) return; window.__enterCheck = true;
  var isDesktop = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  var IDS = ["ul-results", "ul-check", "mainBtn", "checkBtn"];
  window.addEventListener("keydown", function (e) {
    if (!isDesktop || e.key !== "Enter" || e.isComposing) return;
    var target = null;
    for (var i = 0; i < IDS.length; i++) {
      var b = document.getElementById(IDS[i]);
      if (b && !b.disabled && b.offsetParent !== null && b.style.display !== "none") { target = b; break; }
    }
    if (!target) return;
    e.preventDefault(); e.stopPropagation();
    target.click();
  }, true);
})();
</script>
<script>
/* sounds (same as the other units) */
document.addEventListener("click", function (e) {
  var t = e.target;
  var m = t.closest && t.closest("#mainBtn");
  if (!m) return;
  var label = (m.textContent || "").trim();
  var isNext = /Next|See results/.test(label);
  var isFinish = /See results/.test(label);
  setTimeout(function () {
    try {
      if (isFinish) { LASfx.win(); return; }
      if (isNext) { LASfx.pop(); return; }
      var fb = document.getElementById("fb");
      if (!fb) return;
      if (fb.className.indexOf("ok") !== -1) LASfx.correct();
      else if (fb.className.indexOf("bad") !== -1) LASfx.wrong();
    } catch (x) {}
  }, 40);
}, true);
</script>
