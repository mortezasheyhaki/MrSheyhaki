<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("mrsheyhaki-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Listen & Write Adjectives | Starter Unit 4B | Mr. Sheyhaki</title>
  <meta name="description" content="Listen to the adjective and write it, or listen and say it.">
  <link rel="stylesheet" href="../../../../../../../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
  <div class="game" id="app">
    <!-- START -->
    <div class="screen" id="startScreen">
      <header class="top-bar">
        <a href="../" class="back-btn" aria-label="Back">←</a>
        <div class="top-center">
          <span class="unit-label">Starter · Unit 4B</span>
          <span class="game-title">Listen & Write</span>
        </div>
        <div class="top-spacer"></div>
      </header>
      <div class="start-body">
        <p class="start-lead">Choose a mode</p>
        <button type="button" class="mode-card" id="modeWrite" data-mode="write">
          <span class="mode-ico">✍️</span>
          <span class="mode-title">Listen & Write</span>
          <span class="mode-desc">Hear the word, type it. Earn stars!</span>
        </button>
        <button type="button" class="mode-card" id="modeSay" data-mode="say">
          <span class="mode-ico">🗣️</span>
          <span class="mode-title">Listen & Say</span>
          <span class="mode-desc">Hear the word, say it out loud. Practice mode.</span>
        </button>
      </div>
    </div>

    <!-- GAME -->
    <div class="screen hidden" id="gameScreen">
      <header class="top-bar">
        <button type="button" class="back-btn" id="backToModes" aria-label="Back">←</button>
        <div class="top-center">
          <span class="unit-label" id="modeLabel">Listen & Write</span>
          <span class="game-title">Adjectives</span>
        </div>
        <div class="top-stats">
          <div class="stat"><span class="stat-label">Q</span><strong id="qProgress">1/16</strong></div>
          <div class="stat" id="scoreStat"><span class="stat-label">Score</span><strong id="scoreText">0</strong></div>
        </div>
      </header>

      <main class="main">
        <div class="stage">
          <div class="pic-wrap">
            <img id="sceneImg" src="" alt="">
          </div>

          <div class="listen-area">
            <button type="button" class="play-audio-btn" id="playBtn" aria-label="Play sound">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            </button>
            <p class="listen-hint" id="listenHint">Tap to listen</p>
          </div>

          <!-- Write mode -->
          <div class="write-panel" id="writePanel">
            <input type="text" id="answerInput" class="answer-input"
                   placeholder="type the word…"
                   autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
            <div class="feedback" id="feedback" hidden></div>
            <div class="action-row" id="actionRow">
              <button type="button" class="primary-btn" id="checkBtn" disabled>Check</button>
            </div>
          </div>

          <!-- Say mode -->
          <div class="say-panel hidden" id="sayPanel">
            <p class="say-prompt" id="sayPrompt">Tap the mic and say the word</p>
            <button type="button" class="mic-btn" id="micBtn" aria-label="Speak">
              <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
                <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-3.07A7 7 0 0 0 19 11z"/>
              </svg>
              <span class="mic-pulse" aria-hidden="true"></span>
            </button>
            <p class="mic-status" id="micStatus">Tap microphone</p>
            <div class="revealed-word" id="revealedWord" hidden></div>
            <div class="feedback" id="sayFeedback" hidden></div>
            <div class="action-row" id="sayActionRow" hidden>
              <button type="button" class="primary-btn continue-btn" id="nextSayBtn">Next →</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- END -->
    <div class="overlay" id="endOverlay" hidden>
      <div class="overlay-card">
        <div class="overlay-emoji" id="endEmoji">🎉</div>
        <h2 id="endTitle">Well done!</h2>
        <p id="endMsg"></p>
        <div class="end-actions">
          <button type="button" class="end-icon-btn" id="againBtn">
            <span class="end-ico">↻</span><span class="end-ico-label">Again</span>
          </button>
          <button type="button" class="end-icon-btn" id="homeModesBtn">
            <span class="end-ico">☰</span><span class="end-ico-label">Modes</span>
          </button>
          <a class="end-icon-btn" href="../">
            <span class="end-ico">←</span><span class="end-ico-label">Unit 4B</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../../../../../theme.js"></script>
  <script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
  <script src="script.js"></script>
</body>
</html>
