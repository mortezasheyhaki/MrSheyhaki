<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#6937d8" />
  <title>Opposite Snap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #202636;
      --muted: #687184;
      --purple: #6937d8;
      --purple-deep: #5425b8;
      --purple-soft: #f3efff;
      --line: #e7e9ef;
      --ok: #16a34a;
      --bad: #e11d48;
      --paper: #fff;
      --shadow: 0 6px 0 rgba(84,37,184,0.1), 0 12px 24px rgba(32,38,54,0.07);
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(105,55,216,0.08), transparent 42%),
        radial-gradient(ellipse at 88% 18%, rgba(237,107,134,0.06), transparent 40%),
        linear-gradient(180deg, #f8f7ff 0%, #fff 50%, #f3efff 100%);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      min-height: calc(100dvh - 20px);
      background: var(--paper);
      border-radius: 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .hidden { display: none !important; }

    .start-back {
      position: absolute;
      top: 12px;
      left: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(32,38,54,0.06);
      z-index: 5;
    }
    .start-back:hover { color: var(--ink); border-color: #c4b5fd; }
    .start { position: relative; }


    /* Start */
    .start {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      text-align: center;
      gap: 10px;
    }
    .start .eyebrow {
      color: var(--purple);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .start h1 {
      font-size: clamp(1.6rem, 6vw, 2rem);
      font-weight: 900;
      line-height: 1.15;
    }
    .start h1 em { color: var(--purple); font-style: normal; }
    .start p { color: var(--muted); font-size: 0.95rem; max-width: 320px; margin: 0 auto 8px; }
    .modes {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .mode-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid var(--line);
      background: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .mode-btn:hover {
      border-color: var(--purple);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(105,55,216,0.12);
    }
    .mode-btn .ico {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      background: var(--purple-soft);
      flex-shrink: 0;
    }
    .mode-btn small {
      display: block;
      font-weight: 500;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Game chrome */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 6px;
      flex-shrink: 0;
    }
    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 1rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .stats {
      flex: 1;
      display: flex;
      gap: 8px;
    }
    .stat {
      flex: 1;
      background: var(--purple-soft);
      border-radius: 12px;
      padding: 6px 4px;
      text-align: center;
    }
    .stat small {
      display: block;
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--purple);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .stat strong { font-size: 1rem; font-weight: 800; }

    .mode-bar {
      display: flex;
      gap: 6px;
      padding: 4px 12px 8px;
      flex-shrink: 0;
    }
    .mode-tab {
      flex: 1;
      border: none;
      border-radius: 999px;
      padding: 8px 6px;
      font-size: 0.72rem;
      font-weight: 700;
      background: #f3f4f6;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-tab.active {
      background: var(--purple);
      color: #fff;
    }

    .title-row {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0 12px 6px;
      flex-shrink: 0;
    }

    /* Board: 4 left + 4 right */
    .board {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, minmax(56px, 1fr));
      gap: 8px 10px;
      padding: 4px 12px 12px;
      min-height: 0;
      overflow-y: auto;
    }
    .card {
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      user-select: none;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .card:hover:not(.matched):not(.disabled) {
      border-color: #c4b5fd;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(105,55,216,0.1);
    }
    .card.selected {
      border-color: var(--purple);
      background: var(--purple-soft);
      box-shadow: 0 0 0 3px rgba(105,55,216,0.25);
      transform: scale(1.03);
      z-index: 2;
    }
    .card.matched {
      opacity: 0.4;
      pointer-events: none;
      border-color: #86efac;
      background: #f0fdf4;
    }
    .card.matched::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ok);
    }
    .card.wrong {
      animation: shake 0.4s ease;
      border-color: var(--bad);
      background: #fff1f2;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .card .word {
      font-size: clamp(14px, 4vw, 18px);
      font-weight: 700;
      text-transform: lowercase;
      text-align: center;
      padding: 0 6px;
    }
    .card img {
      max-width: 90%;
      max-height: 82%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Audio button + equalizer */
    .card[data-audio] {
      background: linear-gradient(180deg, #f0f9ff 0%, #fff 55%);
      border-color: #e0f2fe;
    }
    .audio-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e0f2fe, #bae6fd);
      border: 2.5px solid #7dd3fc;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0369a1;
      box-shadow: 0 3px 0 #7dd3fc, 0 6px 12px rgba(14,165,233,0.2);
      pointer-events: none;
    }
    .audio-btn .play-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      margin-left: 2px;
    }
    .audio-btn .eq {
      display: none;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      height: 20px;
    }
    .audio-btn .eq span {
      width: 3.5px;
      border-radius: 2px;
      background: #0369a1;
      animation: eqBounce 0.55s ease-in-out infinite;
      transform-origin: bottom center;
    }
    .audio-btn .eq span:nth-child(1) { height: 9px; animation-delay: 0s; }
    .audio-btn .eq span:nth-child(2) { height: 16px; animation-delay: 0.12s; }
    .audio-btn .eq span:nth-child(3) { height: 12px; animation-delay: 0.24s; }
    .audio-btn .eq span:nth-child(4) { height: 18px; animation-delay: 0.08s; }
    .card.playing .audio-btn {
      background: linear-gradient(145deg, #38bdf8, #0ea5e9);
      border-color: #0284c7;
      color: #fff;
      box-shadow: 0 3px 0 #0284c7, 0 0 0 6px rgba(14,165,233,0.22);
      animation: audioPulse 1s ease-in-out infinite;
    }
    .card.playing .audio-btn .play-icon { display: none; }
    .card.playing .audio-btn .eq { display: flex; }
    .card.playing .audio-btn .eq span { background: #fff; }
    @keyframes eqBounce {
      0%,100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1); }
    }
    @keyframes audioPulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }


    /* Classic quiz layout */
    .classic-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 14px 16px;
      min-height: 0;
      overflow-y: auto;
    }
    .classic-prompt {
      background: linear-gradient(165deg, #f8f7ff, #fff);
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 20px 16px;
      text-align: center;
    }
    .classic-prompt .label {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--purple);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .classic-prompt .word {
      font-size: clamp(1.6rem, 7vw, 2.2rem);
      font-weight: 900;
      text-transform: lowercase;
    }
    .classic-prompt img {
      max-width: 160px;
      max-height: 120px;
      object-fit: contain;
      margin: 8px auto 0;
      display: block;
      border-radius: 12px;
    }
    .classic-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .classic-opt {
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 16px 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
    }
    .classic-opt:hover { border-color: #c4b5fd; transform: translateY(-2px); }
    .classic-opt.is-correct { border-color: var(--ok); background: #f0fdf4; }
    .classic-opt.is-wrong { border-color: var(--bad); background: #fff1f2; }
    .classic-opt:disabled { cursor: default; }

    .hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0 12px 10px;
      flex-shrink: 0;
    }

    /* Finish */
    .finish {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      text-align: center;
      gap: 12px;
    }
    .finish h2 { font-size: 1.5rem; font-weight: 900; color: var(--purple); }
    .finish p { color: var(--muted); }
    .finish .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
    .primary {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      background: var(--purple);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--purple-deep);
    }
    .secondary {
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 12px 22px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- START -->
    <section id="startScreen" class="start">
      <a class="start-back" href="../" aria-label="Back to Adjectives">← Back</a>
      <p class="eyebrow">Vocabulary · Adjectives</p>
      <h1>Opposite<br /><em>Snap</em></h1>
      <p>Find opposites — classic quiz or match modes. Choose how to play.</p>
      <div class="modes">
        <button class="mode-btn" data-mode="classic" type="button">
          <span class="ico">↔</span>
          <span>
            Classic Quiz
            <small>See a word · tap the opposite (multiple choice)</small>
          </span>
        </button>
        <button class="mode-btn" data-mode="words" type="button">
          <span class="ico">Aa</span>
          <span>
            Word ↔ Word
            <small>4 words left · 4 opposites right</small>
          </span>
        </button>
        <button class="mode-btn" data-mode="pictures" type="button">
          <span class="ico">🖼️</span>
          <span>
            Picture ↔ Picture
            <small>4 pictures left · 4 opposite pictures right</small>
          </span>
        </button>
        <button class="mode-btn" data-mode="audio" type="button">
          <span class="ico">🔊</span>
          <span>
            Audio ↔ Audio
            <small>4 sounds left · 4 opposite sounds right</small>
          </span>
        </button>
      </div>
    </section>

    <!-- GAME -->
    <section id="gameScreen" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div class="header">
        <button class="back-btn" id="backBtn" type="button" aria-label="Back">←</button>
        <div class="stats">
          <div class="stat"><small>Matched</small><strong id="matchedVal">0 / 4</strong></div>
          <div class="stat"><small>Score</small><strong id="scoreVal">0</strong></div>
          <div class="stat"><small>Round</small><strong id="roundVal">1 / 2</strong></div>
        </div>
      </div>
      <div class="mode-bar" id="modeBar">
        <button class="mode-tab" data-mode="words" type="button">Words</button>
        <button class="mode-tab" data-mode="pictures" type="button">Pictures</button>
        <button class="mode-tab" data-mode="audio" type="button">Audio</button>
      </div>
      <p class="title-row" id="modeTitle">Word ↔ Word</p>
      <div class="board" id="board"></div>
      <div class="classic-wrap hidden" id="classicWrap">
        <div class="classic-prompt">
          <p class="label">Find the opposite of</p>
          <p class="word" id="classicWord">big</p>
          <img id="classicImg" alt="" hidden />
        </div>
        <div class="classic-options" id="classicOptions"></div>
      </div>
      <p class="hint" id="hint">Tap one on the left, then its opposite on the right.</p>
    </section>

    <!-- FINISH -->
    <section id="finishScreen" class="finish hidden">
      <h2>Great job!</h2>
      <p id="finishText">You matched all opposite pairs.</p>
      <div class="actions">
        <button class="primary" id="againBtn" type="button">Play again</button>
        <button class="secondary" id="homeBtn" type="button">Modes</button>
      </div>
    </section>
  </div>

  <script>
  (function () {
    const PAIRS = [
      { id: 1,  a: 'big',        b: 'small',      imgA: 'assets/01-big.png',        imgB: 'assets/02-small.png',      audA: 'assets/01-big.mp3',        audB: 'assets/02-small.mp3' },
      { id: 2,  a: 'old',        b: 'new',        imgA: 'assets/03-old.png',        imgB: 'assets/04-new.png',        audA: 'assets/03-old.mp3',        audB: 'assets/04-new.mp3' },
      { id: 3,  a: 'fast',       b: 'slow',       imgA: 'assets/05-fast.png',       imgB: 'assets/06-slow.png',       audA: 'assets/05-fast.mp3',       audB: 'assets/06-slow.mp3' },
      { id: 4,  a: 'beautiful',  b: 'ugly',       imgA: 'assets/07-beautiful.png',  imgB: 'assets/08-ugly.png',       audA: 'assets/07-beautiful.mp3',  audB: 'assets/08-ugly.mp3' },
      { id: 5,  a: 'cheap',      b: 'expensive',  imgA: 'assets/09-cheap.png',      imgB: 'assets/10-expensive.png',  audA: 'assets/09-cheap.mp3',      audB: 'assets/10-expensive.mp3' },
      { id: 6,  a: 'long',       b: 'short',      imgA: 'assets/11-long.png',       imgB: 'assets/12-short.png',      audA: 'assets/11-long.mp3',       audB: 'assets/12-short.mp3' },
      { id: 7,  a: 'clean',      b: 'dirty',      imgA: 'assets/13-clean.png',      imgB: 'assets/14-dirty.png',      audA: 'assets/13-clean.mp3',      audB: 'assets/14-dirty.mp3' },
      { id: 8,  a: 'easy',       b: 'difficult',  imgA: 'assets/15-easy.png',       imgB: 'assets/16-difficult.png',  audA: 'assets/15-easy.mp3',       audB: 'assets/16-difficult.mp3' },
    ];

    const MODE_META = {
      classic:   { title: 'Classic Quiz',      hint: 'Read the word, then tap its opposite.' },
      words:     { title: 'Word ↔ Word',       hint: 'Match each word with its opposite word.' },
      pictures:  { title: 'Picture ↔ Picture', hint: 'Match each picture with its opposite picture.' },
      audio:     { title: 'Audio ↔ Audio',     hint: 'Listen, then match each sound with its opposite sound.' },
    };

    let mode = 'words';
    let round = 1;          // 1 or 2 (4 pairs each)
    let score = 0;
    let matched = 0;
    let selected = null;
    let locked = false;
    let currentPairs = [];
    let usedIds = new Set();
    let classicOrder = [];
    let classicIndex = 0;
    let classicLocked = false;
    const audioCache = {};

    const $ = (id) => document.getElementById(id);
    const startScreen = $('startScreen');
    const gameScreen = $('gameScreen');
    const finishScreen = $('finishScreen');
    const board = $('board');

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickPairs() {
      let available = PAIRS.filter((p) => !usedIds.has(p.id));
      if (available.length < 4) {
        usedIds.clear();
        available = [...PAIRS];
      }
      const picked = shuffle(available).slice(0, 4);
      picked.forEach((p) => usedIds.add(p.id));
      return picked;
    }

    function playAudio(src) {
      Object.values(audioCache).forEach((a) => { a.pause(); a.currentTime = 0; });
      if (!audioCache[src]) audioCache[src] = new Audio(src);
      const a = audioCache[src];
      a.play().catch(() => {});
      return a;
    }

    function updateStats() {
      $('matchedVal').textContent = matched + ' / 4';
      $('scoreVal').textContent = score;
      $('roundVal').textContent = round + ' / 2';
    }

    function createCard(pair, side) {
      // side: 'left' shows A, 'right' shows B (the opposite)
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.pairId = pair.id;
      card.dataset.side = side;

      if (mode === 'words') {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = side === 'left' ? pair.a : pair.b;
        card.appendChild(span);
      } else if (mode === 'pictures') {
        const img = document.createElement('img');
        img.src = side === 'left' ? pair.imgA : pair.imgB;
        img.alt = side === 'left' ? pair.a : pair.b;
        card.appendChild(img);
      } else {
        // audio
        const src = side === 'left' ? pair.audA : pair.audB;
        card.dataset.audio = src;
        card.innerHTML = `
          <div class="audio-btn" aria-label="Play ${side === 'left' ? pair.a : pair.b}">
            <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          </div>`;
      }

      card.addEventListener('click', () => onCardClick(card));
      return card;
    }

    function renderBoard() {
      board.innerHTML = '';
      selected = null;
      locked = false;
      matched = 0;
      currentPairs = pickPairs();
      updateStats();

      const leftItems = shuffle([...currentPairs]);
      const rightItems = shuffle([...currentPairs]);

      for (let i = 0; i < 4; i++) {
        const left = createCard(leftItems[i], 'left');
        const right = createCard(rightItems[i], 'right');
        left.style.gridRow = String(i + 1);
        right.style.gridRow = String(i + 1);
        board.appendChild(left);
        board.appendChild(right);
      }
    }

    function onCardClick(card) {
      if (locked || card.classList.contains('matched')) return;

      if (card.dataset.audio) {
        document.querySelectorAll('.card.playing').forEach((c) => c.classList.remove('playing'));
        card.classList.add('playing');
        const a = playAudio(card.dataset.audio);
        a.onended = () => card.classList.remove('playing');
      }

      if (!selected) {
        selected = card;
        card.classList.add('selected');
        return;
      }
      if (selected === card) {
        selected.classList.remove('selected');
        selected = null;
        return;
      }
      // same column → retarget
      if (selected.dataset.side === card.dataset.side) {
        selected.classList.remove('selected');
        selected = card;
        card.classList.add('selected');
        return;
      }

      locked = true;
      const id1 = selected.dataset.pairId;
      const id2 = card.dataset.pairId;

      if (id1 === id2) {
        selected.classList.remove('selected');
        selected.classList.add('matched');
        card.classList.add('matched');
        matched += 1;
        score += 10;
        updateStats();
        selected = null;
        locked = false;

        if (matched >= 4) {
          setTimeout(() => {
            if (round < 2) {
              round += 1;
              renderBoard();
            } else {
              showFinish();
            }
          }, 550);
        }
      } else {
        selected.classList.add('wrong');
        card.classList.add('wrong');
        const prev = selected;
        setTimeout(() => {
          prev.classList.remove('selected', 'wrong');
          card.classList.remove('wrong');
          selected = null;
          locked = false;
        }, 450);
      }
    }

    function showFinish() {
      gameScreen.classList.add('hidden');
      finishScreen.classList.remove('hidden');
      $('finishText').textContent = `Final score: ${score}. You matched all opposite pairs.`;
    }

    function allWords() {
      const w = [];
      PAIRS.forEach((p) => { w.push(p.a, p.b); });
      return w;
    }

    function renderClassicRound() {
      classicLocked = false;
      const pair = classicOrder[classicIndex];
      const promptIsA = Math.random() < 0.5;
      const promptWord = promptIsA ? pair.a : pair.b;
      const answerWord = promptIsA ? pair.b : pair.a;
      const promptImg = promptIsA ? pair.imgA : pair.imgB;

      $('classicWord').textContent = promptWord;
      const img = $('classicImg');
      if (img) {
        img.src = promptImg;
        img.alt = promptWord;
        img.hidden = false;
      }

      // 1 correct + 3 distractors
      let pool = allWords().filter((w) => w !== promptWord && w !== answerWord);
      pool = shuffle(pool).slice(0, 3);
      const opts = shuffle([answerWord, ...pool]);

      const box = $('classicOptions');
      box.innerHTML = '';
      opts.forEach((word) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'classic-opt';
        btn.textContent = word;
        btn.addEventListener('click', () => {
          if (classicLocked) return;
          classicLocked = true;
          const correct = word === answerWord;
          btn.classList.add(correct ? 'is-correct' : 'is-wrong');
          if (correct) {
            score += 10;
          } else {
            // reveal correct
            [...box.children].forEach((b) => {
              if (b.textContent === answerWord) b.classList.add('is-correct');
            });
          }
          updateStats();
          setTimeout(() => {
            classicIndex += 1;
            if (classicIndex < classicOrder.length) {
              $('roundVal').textContent = (classicIndex + 1) + ' / ' + classicOrder.length;
              $('matchedVal').textContent = classicIndex + ' / ' + classicOrder.length;
              renderClassicRound();
            } else {
              showFinish();
            }
          }, 700);
        });
        box.appendChild(btn);
      });

      $('matchedVal').textContent = classicIndex + ' / ' + classicOrder.length;
      $('roundVal').textContent = (classicIndex + 1) + ' / ' + classicOrder.length;
      $('scoreVal').textContent = score;
    }

    function startGame(m) {
      mode = m;
      round = 1;
      score = 0;
      matched = 0;
      usedIds.clear();
      startScreen.classList.add('hidden');
      finishScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      gameScreen.style.display = 'flex';

      const isClassic = mode === 'classic';
      $('board').classList.toggle('hidden', isClassic);
      $('classicWrap').classList.toggle('hidden', !isClassic);
      $('modeBar').style.display = isClassic ? 'none' : 'flex';

      document.querySelectorAll('.mode-tab').forEach((t) => {
        t.classList.toggle('active', t.dataset.mode === mode);
      });
      $('modeTitle').textContent = MODE_META[mode].title;
      $('hint').textContent = MODE_META[mode].hint;

      if (isClassic) {
        classicOrder = shuffle([...PAIRS]);
        classicIndex = 0;
        renderClassicRound();
      } else {
        renderBoard();
      }
    }

    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => startGame(btn.dataset.mode));
    });
    document.querySelectorAll('.mode-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.mode === mode) return;
        startGame(btn.dataset.mode);
      });
    });
    $('backBtn').addEventListener('click', () => {
      gameScreen.classList.add('hidden');
      finishScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });
    $('againBtn').addEventListener('click', () => startGame(mode));
    $('homeBtn').addEventListener('click', () => {
      finishScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });
  })();
  </script>
</body>
</html>
