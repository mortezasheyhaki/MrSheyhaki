<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("mrsheyhaki-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Perfect Car | Starter Unit 4B | Mr. Sheyhaki</title>
  <meta name="description" content="Listen to the conversation. Which car is perfect for the woman in her opinion and in her son's opinion?">
  <link rel="stylesheet" href="../../../../../../../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="app">
    <header class="top-bar">
      <a href="../" class="back-btn" id="backBtn" aria-label="Back">←</a>
      <div class="top-center">
        <span class="unit-label">Starter · Unit 4B</span>
        <span class="game-title">The Perfect Car</span>
      </div>
      <div class="top-stats">
        <div class="stat"><span class="stat-label">Score</span><strong id="scoreText">0/2</strong></div>
      </div>
    </header>

    <main class="main">
      <p class="instruction">
        Look at the picture and listen to the conversation.<br>
        Which car is perfect for the woman?
      </p>

      <div class="stage">
        <div class="pic-wrap">
          <img id="sceneImg"
               src="https://cdn.imgurl.ir/uploads/t29552_ChatGPT_Image_Sep_17_2026_09_22_52_PM.png"
               alt="Woman, son and salesman looking at a blue car and a red sports car"
               loading="eager">
        </div>

        <div class="audio-row">
          <button type="button" class="play-btn" id="playBtn" aria-label="Play audio">
            <span class="play-ico" id="playIco">▶</span>
            <span class="play-label" id="playLabel">Listen</span>
          </button>
          <audio id="audio" preload="auto"
                 src="https://cdn.imgurl.ir/uploads/m741866_AEF3e_Starter_SB_4_mp3cut_net3.mp3"></audio>
        </div>

        <div class="q-panel">
          <div class="input-group">
            <label for="womanInput" class="q-label">
              <span class="q-letter">A</span>
              In the <strong>woman’s</strong> opinion
            </label>
            <input type="text"
                   id="womanInput"
                   class="answer-input"
                   placeholder="the … car"
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="none"
                   spellcheck="false">
            <div class="field-feedback" id="womanFeedback" hidden></div>
          </div>

          <div class="input-group">
            <label for="sonInput" class="q-label">
              <span class="q-letter">B</span>
              In her <strong>son’s</strong> opinion
            </label>
            <input type="text"
                   id="sonInput"
                   class="answer-input"
                   placeholder="the … car"
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="none"
                   spellcheck="false">
            <div class="field-feedback" id="sonFeedback" hidden></div>
          </div>

          <div class="action-row" id="actionRow">
            <button type="button" class="primary-btn" id="checkBtn" disabled>Check</button>
          </div>

          <div class="action-row" id="afterRow" hidden>
            <button type="button" class="primary-btn listen-btn" id="replayBtn">🔊 Listen again</button>
            <button type="button" class="primary-btn continue-btn" id="againBtn">Try again</button>
          </div>
        </div>
      </div>
    </main>

    <div class="overlay" id="endOverlay" hidden>
      <div class="overlay-card">
        <div class="overlay-emoji" id="endEmoji">🎉</div>
        <h2 id="endTitle">Well done!</h2>
        <p id="endMsg"></p>
        <div class="end-actions">
          <button type="button" class="end-icon-btn" id="restartBtn">
            <span class="end-ico">↻</span><span class="end-ico-label">Again</span>
          </button>
          <a class="end-icon-btn" href="../">
            <span class="end-ico">←</span><span class="end-ico-label">Unit 4B</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../../../../../theme.js"></script>
  <script src="../../../../../../learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
</body>
</html>
