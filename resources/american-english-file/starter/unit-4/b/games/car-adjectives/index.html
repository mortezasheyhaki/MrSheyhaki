<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("mrsheyhaki-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Car Adjectives | Starter Unit 4B | Mr. Sheyhaki</title>
  <meta name="description" content="Listen to the conversation. Put the correct adjectives under each car.">
  <link rel="stylesheet" href="../../../../../../../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="app">
    <header class="top-bar">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="top-center">
        <span class="unit-label">Starter · Unit 4B</span>
        <span class="game-title">Car Adjectives</span>
      </div>
      <div class="top-stats">
        <div class="stat"><span class="stat-label">Score</span><strong id="scoreText">0/8</strong></div>
      </div>
    </header>

    <main class="main">
      <p class="instruction">
        Listen to the conversation. Drag (or tap) the adjectives into the boxes under the correct car.
      </p>

      <div class="audio-row">
        <button type="button" class="play-btn" id="playBtn" aria-label="Play audio">
          <span class="play-ico" id="playIco">▶</span>
          <span class="play-label" id="playLabel">Listen</span>
        </button>
        <audio id="audio" preload="auto"
               src="https://cdn.imgurl.ir/uploads/m741866_AEF3e_Starter_SB_4_mp3cut_net3.mp3"></audio>
      </div>

      <div class="cars-row" id="carsRow">
        <!-- Blue car -->
        <div class="car-card" data-car="blue">
          <div class="car-img-wrap">
            <img src="https://cdn.imgurl.ir/uploads/h27729_image-Photoroom4.png"
                 alt="Blue car"
                 class="car-img"
                 loading="eager">
            <span class="car-label blue-label">Blue car</span>
          </div>
          <div class="slots" id="blueSlots">
            <div class="slot" data-index="0" data-car="blue"></div>
            <div class="slot" data-index="1" data-car="blue"></div>
            <div class="slot" data-index="2" data-car="blue"></div>
            <div class="slot" data-index="3" data-car="blue"></div>
          </div>
        </div>

        <!-- Red car -->
        <div class="car-card" data-car="red">
          <div class="car-img-wrap">
            <img src="https://cdn.imgurl.ir/uploads/g512667_image-Photoroom3.png"
                 alt="Red car"
                 class="car-img"
                 loading="eager">
            <span class="car-label red-label">Red car</span>
          </div>
          <div class="slots" id="redSlots">
            <div class="slot" data-index="0" data-car="red"></div>
            <div class="slot" data-index="1" data-car="red"></div>
            <div class="slot" data-index="2" data-car="red"></div>
            <div class="slot" data-index="3" data-car="red"></div>
          </div>
        </div>
      </div>

      <div class="bank" id="bank">
        <!-- adjectives injected by JS -->
      </div>

      <div class="action-row" id="actionRow">
        <button type="button" class="secondary-btn" id="resetBtn">Reset</button>
        <button type="button" class="primary-btn" id="checkBtn" disabled>Check</button>
      </div>

      <div class="action-row" id="afterRow" hidden>
        <button type="button" class="primary-btn listen-btn" id="replayBtn">🔊 Listen again</button>
        <button type="button" class="primary-btn continue-btn" id="againBtn">Try again</button>
      </div>
    </main>

    <div class="overlay" id="endOverlay" hidden>
      <div class="overlay-card">
        <div class="overlay-emoji" id="endEmoji">🎉</div>
        <h2 id="endTitle">Well done!</h2>
        <p id="endMsg"></p>
        <div class="end-actions">
          <button type="button" class="end-icon-btn" id="restartBtn">
            <span class="end-ico">↻</span><span class="end-ico-label">Again</span>
          </button>
          <a class="end-icon-btn" href="../">
            <span class="end-ico">←</span><span class="end-ico-label">Unit 4B</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../../../../../theme.js"></script>
  <script src="../../../../../../learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
</body>
</html>
