<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("mrsheyhaki-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Adjective Sentences | Starter Unit 4B | Mr. Sheyhaki</title>
  <meta name="description" content="Look at the picture and write a sentence with the adjective.">
  <link rel="stylesheet" href="../../../../../../../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="app">
    <div class="screen" id="startScreen">
      <header class="top-bar">
        <a href="../" class="back-btn" aria-label="Back">←</a>
        <div class="top-center">
          <span class="unit-label">Starter · Unit 4B</span>
          <span class="game-title">Adjective Sentences</span>
        </div>
        <div class="top-spacer"></div>
      </header>
      <div class="start-body">
        <p class="start-lead">Choose a mode</p>
        <button type="button" class="mode-card" id="modeWrite" data-mode="write">
          <span class="mode-ico">🖼️</span>
          <span class="mode-title">1 · Picture → Sentence</span>
          <span class="mode-desc">Look at the picture and write a sentence with the adjective.</span>
        </button>
        <button type="button" class="mode-card" id="modeOrder" data-mode="order">
          <span class="mode-ico">🧩</span>
          <span class="mode-title">2 · Word order</span>
          <span class="mode-desc">Put the words in the correct order to make a sentence.</span>
        </button>
      </div>
    </div>

    <div class="screen hidden" id="gameScreen">
      <header class="top-bar">
        <button type="button" class="back-btn" id="backHome" aria-label="Back">←</button>
        <div class="top-center">
          <span class="unit-label" id="modeLabel">Write the sentence</span>
          <span class="game-title">Adjectives</span>
        </div>
        <div class="top-stats">
          <div class="stat"><span class="stat-label">Q</span><strong id="qProgress">1/7</strong></div>
          <div class="stat"><span class="stat-label">Score</span><strong id="scoreText">0</strong></div>
        </div>
      </header>

      <main class="main">
        <div class="stage">
          <div class="pic-wrap">
            <img id="sceneImg" src="" alt="">
            <span class="adj-badge" id="adjBadge"></span>
          </div>
          <div class="adj-bar" id="adjBar">
            <span class="adj-pill" id="adjPill"></span>
          </div>
          <div class="q-panel" id="writePanel">
            <input type="text" id="answerInput" class="answer-input"
                   placeholder="Write a sentence…"
                   autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false">
            <div class="feedback" id="feedback" hidden></div>
            <div class="action-row" id="actionRow">
              <button type="button" class="primary-btn" id="checkBtn" disabled>Check</button>
            </div>
          </div>

          <div class="q-panel hidden" id="orderPanel">
            <p class="hint">Put the words in order</p>
            <div class="answer-slots" id="answerSlots"></div>
            <div class="chip-bank" id="chipBank"></div>
            <div class="feedback" id="orderFeedback" hidden></div>
            <div class="action-row" id="orderActions">
              <button type="button" class="secondary-btn" id="clearChipsBtn">Clear</button>
              <button type="button" class="primary-btn" id="checkOrderBtn" disabled>Check</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="overlay" id="endOverlay" hidden>
      <div class="overlay-card">
        <div class="overlay-emoji" id="endEmoji">🎉</div>
        <h2 id="endTitle">Well done!</h2>
        <p id="endMsg"></p>
        <div class="end-actions">
          <button type="button" class="end-icon-btn" id="againBtn">
            <span class="end-ico">↻</span><span class="end-ico-label">Again</span>
          </button>
          <button type="button" class="end-icon-btn" id="homeModesBtn">
            <span class="end-ico">☰</span><span class="end-ico-label">Modes</span>
          </button>
          <a class="end-icon-btn" href="../">
            <span class="end-ico">←</span><span class="end-ico-label">Unit 4B</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../../../../../theme.js"></script>
  <script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
  <script src="script.js"></script>
</body>
</html>
