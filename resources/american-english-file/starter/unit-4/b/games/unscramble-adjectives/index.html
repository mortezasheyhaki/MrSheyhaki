<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("mrsheyhaki-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Unscramble Adjectives | Starter Unit 4B | Mr. Sheyhaki</title>
  <meta name="description" content="Unscramble the letters to make the correct adjective.">
  <link rel="stylesheet" href="../../../../../../../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="app">
    <header class="top-bar">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="top-center">
        <span class="unit-label">Starter · Unit 4B</span>
        <span class="game-title">Unscramble</span>
      </div>
      <div class="top-stats">
        <div class="stat"><span class="stat-label">Q</span><strong id="qProgress">1/16</strong></div>
        <div class="stat"><span class="stat-label">Score</span><strong id="scoreText">0</strong></div>
      </div>
    </header>

    <main class="main">
      <p class="instruction">Unscramble the letters to make an adjective.</p>

      <div class="stage">
        <div class="pic-wrap">
          <img id="sceneImg" src="" alt="Hint picture">
          <button type="button" class="hint-audio" id="hintAudioBtn" aria-label="Play word">🔊</button>
        </div>

        <div class="q-panel">
          <div class="slots-row" id="answerSlots"></div>

          <div class="letter-bank" id="letterBank"></div>

          <div class="feedback" id="feedback" hidden></div>

          <div class="action-row" id="actionRow">
            <button type="button" class="secondary-btn" id="clearBtn">Clear</button>
            <button type="button" class="primary-btn" id="checkBtn" disabled>Check</button>
          </div>
        </div>
      </div>
    </main>

    <div class="overlay" id="endOverlay" hidden>
      <div class="overlay-card">
        <div class="overlay-emoji" id="endEmoji">🎉</div>
        <h2 id="endTitle">Well done!</h2>
        <p id="endMsg"></p>
        <div class="end-actions">
          <button type="button" class="end-icon-btn" id="againBtn">
            <span class="end-ico">↻</span><span class="end-ico-label">Again</span>
          </button>
          <a class="end-icon-btn" href="../">
            <span class="end-ico">←</span><span class="end-ico-label">Unit 4B</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../../../../../theme.js"></script>
  <script src="/learningarcade/la-stars.js" data-la-stars></script>
  <script src="script.js"></script>
</body>
</html>
