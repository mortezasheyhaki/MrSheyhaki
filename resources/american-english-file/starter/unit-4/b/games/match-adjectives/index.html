<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adjectives Match Making</title>
  <style>
    :root {
      --primary: #7c6af7;
      --primary-light: #ebe8ff;
      --card-bg: #ffffff;
      --text: #2d2d2d;
      --muted: #8b8b9a;
      --success: #4caf50;
      --error: #f44336;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(160deg, #f5f3ff 0%, #eef2ff 50%, #f8fafc 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      margin: 0;
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      max-height: 100dvh;
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }


    #gameScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    #gameScreen.hidden { display: none !important; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 2px;
      background: #fff;
      flex-shrink: 0;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #e5e7eb;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: #555;
      flex-shrink: 0;
    }

    .back-btn:hover { background: #f9fafb; }

    .stats {
      display: flex;
      flex: 1;
      gap: 8px;
    }

    .stat {
      flex: 1;
      background: var(--primary-light);
      border-radius: 12px;
      padding: 6px 4px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 1px;
    }

    /* Mode selector */
    .mode-bar {
      display: flex;
      gap: 5px;
      padding: 2px 10px 6px;
      background: #fff;
      border-bottom: 1px solid #f0f0f5;
      flex-shrink: 0;
    }

    .mode-btn {
      flex: 1;
      padding: 7px 3px;
      border: none;
      border-radius: 9px;
      background: #f3f4f6;
      color: #555;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 3px 10px rgba(124, 106, 247, 0.35);
    }

    /* Title */
    .game-title {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      padding: 4px 10px 2px;
      flex-shrink: 0;
    }

    /* Grid — exactly 5 left + 5 right (all 3 modes). Must stay fully visible. */
    .board {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(5, minmax(52px, 1fr));
      grid-auto-flow: row;
      gap: 6px 10px;
      padding: 4px 10px 8px;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      align-content: stretch;
      -webkit-overflow-scrolling: touch;
    }
    .card[data-side="left"] { grid-column: 1; }
    .card[data-side="right"] { grid-column: 2; }

    .card {
      background: var(--card-bg);
      border: 1.5px solid #eef0f5;
      border-radius: 10px;
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, opacity 0.4s ease;
      position: relative;
      overflow: visible;
      user-select: none;
    }

    .card:hover:not(.matched):not(.disabled) {
      border-color: #c7c4f0;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      z-index: 3;
    }

    .card.selected {
      border-color: var(--primary);
      background: #f5f3ff;
      box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.3);
      transform: scale(1.05);
      z-index: 4;
    }

    .card.matched {
      opacity: 0.4;
      pointer-events: none;
      border-color: #81c784;
      background: #e8f5e9;
      animation: matchPop 0.5s ease forwards;
    }

    .card.matched::after {
      content: '✓';
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #4caf50;
      animation: checkIn 0.35s ease 0.15s both;
    }

    .card.wrong {
      animation: shake 0.45s ease;
      border-color: var(--error);
      background: #ffebee;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px); }
      30% { transform: translateX(8px); }
      45% { transform: translateX(-6px); }
      60% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
    }

    @keyframes matchPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.12); }
      70% { transform: scale(0.96); }
      100% { transform: scale(1); opacity: 0.4; }
    }

    @keyframes checkIn {
      0% { transform: scale(0) rotate(-30deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* Particle burst container */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: visible;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      opacity: 1;
      animation: particleFly 0.7s ease-out forwards;
    }

    @keyframes particleFly {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0);
        opacity: 0;
      }
    }

    .card img {
      max-width: 92%;
      max-height: 78%;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    .card .word {
      font-size: clamp(15px, 4.5vw, 20px);
      font-weight: 600;
      color: #333;
      text-transform: lowercase;
      text-align: center;
      padding: 0 4px;
    }

    .card .audio-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e0f2fe 0%, #bae6fd 100%);
      border: 2.5px solid #7dd3fc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0369a1;
      pointer-events: none;
      box-shadow:
        0 4px 0 #7dd3fc,
        0 8px 16px rgba(14, 165, 233, 0.2),
        inset 0 1px 0 rgba(255,255,255,0.8);
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }
    .card .audio-btn .play-icon {
      width: 28px;
      height: 28px;
      fill: currentColor;
      margin-left: 3px; /* optical center for play triangle */
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.1));
    }
    .card .audio-btn .eq {
      display: none;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      height: 22px;
    }
    .card .audio-btn .eq span {
      display: block;
      width: 4px;
      border-radius: 2px;
      background: #0369a1;
      animation: eqBounce 0.55s ease-in-out infinite;
    }
    .card .audio-btn .eq span:nth-child(1) { height: 10px; animation-delay: 0s; }
    .card .audio-btn .eq span:nth-child(2) { height: 18px; animation-delay: 0.12s; }
    .card .audio-btn .eq span:nth-child(3) { height: 14px; animation-delay: 0.24s; }
    .card .audio-btn .eq span:nth-child(4) { height: 20px; animation-delay: 0.08s; }

    /* Card containing audio looks tappable */
    .card[data-audio] {
      background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 55%);
      border-color: #e0f2fe;
    }
    .card[data-audio]:hover:not(.matched):not(.disabled) {
      border-color: #38bdf8;
      background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 60%);
    }
    .card[data-audio].selected {
      border-color: var(--primary);
      background: linear-gradient(180deg, #ede9fe 0%, #f5f3ff 60%);
    }
    .card[data-audio].selected .audio-btn {
      background: linear-gradient(145deg, #ddd6fe 0%, #c4b5fd 100%);
      border-color: #a78bfa;
      color: #5b21b6;
      box-shadow:
        0 4px 0 #a78bfa,
        0 8px 16px rgba(124, 106, 247, 0.25),
        inset 0 1px 0 rgba(255,255,255,0.8);
    }

    /* Playing state: pulse ring + equalizer */
    .card.playing .audio-btn {
      background: linear-gradient(145deg, #38bdf8 0%, #0ea5e9 100%);
      border-color: #0284c7;
      color: #fff;
      box-shadow:
        0 4px 0 #0284c7,
        0 0 0 6px rgba(14, 165, 233, 0.25),
        0 10px 20px rgba(14, 165, 233, 0.35);
      animation: audioPulse 1s ease-in-out infinite;
    }
    .card.playing .audio-btn .play-icon { display: none; }
    .card.playing .audio-btn .eq { display: flex; }
    .card.playing .audio-btn .eq span { background: #fff; }

    @keyframes audioPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 0 #0284c7, 0 0 0 6px rgba(14,165,233,0.2), 0 10px 20px rgba(14,165,233,0.3); }
      50% { transform: scale(1.06); box-shadow: 0 4px 0 #0284c7, 0 0 0 12px rgba(14,165,233,0.12), 0 12px 24px rgba(14,165,233,0.4); }
    }
    @keyframes eqBounce {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Footer hint */
    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 2px 10px 8px;
      flex-shrink: 0;
    }

    /* Overlay screens */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      transform: scale(0.9);
      transition: transform 0.25s;
    }

    .overlay.show .modal {
      transform: scale(1);
    }

    .modal h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: var(--primary);
    }

    .modal p {
      color: #666;
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.4;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-btn.primary {
      background: var(--primary);
      color: #fff;
    }

    .modal-btn.secondary {
      background: #f3f4f6;
      color: #444;
    }


    .start-back {
      position: absolute;
      top: 12px;
      left: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      z-index: 5;
      box-shadow: 0 2px 8px rgba(15,23,42,0.06);
    }
    .start-back:hover { color: #0f172a; border-color: #c4b5fd; }
    .start-screen { position: relative; }

    /* Start screen */
    .start-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      overflow: hidden;
    }

    .start-screen h1 {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .start-screen p {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .start-modes {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .start-mode-btn {
      padding: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      background: #fff;
      font-size: 16px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .start-mode-btn:hover {
      border-color: var(--primary);
      background: #f8f7ff;
      color: var(--primary);
    }

    .hidden { display: none !important; }

    /* Round complete toast */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) scale(0.9);
      background: linear-gradient(135deg, #7c6af7, #5b4cdb);
      color: #fff;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 50;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(124, 106, 247, 0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
      <a class="start-back" href="../" aria-label="Back">← Back</a>
      <h1>Adjectives Match</h1>
      <p>Match the pairs. Choose a mode to start.</p>
      <div class="start-modes">
        <button class="start-mode-btn" data-mode="picture-word">🖼️ Picture → Word</button>
        <button class="start-mode-btn" data-mode="audio-word">🔊 Audio → Word</button>
        <button class="start-mode-btn" data-mode="audio-picture">🔊 Audio → Picture</button>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">
      <div class="header">
        <button class="back-btn" id="backBtn">←</button>
        <div class="stats">
          <div class="stat">
            <div class="stat-label">Round</div>
            <div class="stat-value" id="roundVal">1 / 2</div>
          </div>
          <div class="stat">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="scoreVal">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Matched</div>
            <div class="stat-value" id="matchedVal">0 / 5</div>
          </div>
        </div>
      </div>

      <div class="mode-bar">
        <button class="mode-btn" data-mode="picture-word">Picture → Word</button>
        <button class="mode-btn" data-mode="audio-word">Audio → Word</button>
        <button class="mode-btn" data-mode="audio-picture">Audio → Picture</button>
      </div>

      <div class="game-title" id="gameTitle">Picture → Word</div>

      <div class="board" id="board"></div>

      <div class="hint">Tap one, then its match</div>
    </div>
  </div>

  <!-- Round / Game Complete Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Round Complete!</h2>
      <p id="modalText">Great job! Ready for the next round?</p>
      <div class="modal-btns">
        <button class="modal-btn secondary" id="modalHome">Home</button>
        <button class="modal-btn primary" id="modalNext">Next Round</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const ALL_ITEMS = [
      { id: 1,  word: 'big',        img: '01-big.png',        audio: '01-big.mp3' },
      { id: 2,  word: 'small',      img: '02-small.png',      audio: '02-small.mp3' },
      { id: 3,  word: 'old',        img: '03-old.png',        audio: '03-old.mp3' },
      { id: 4,  word: 'new',        img: '04-new.png',        audio: '04-new.mp3' },
      { id: 5,  word: 'fast',       img: '05-fast.png',       audio: '05-fast.mp3' },
      { id: 6,  word: 'slow',       img: '06-slow.png',       audio: '06-slow.mp3' },
      { id: 7,  word: 'beautiful',  img: '07-beautiful.png',  audio: '07-beautiful.mp3' },
      { id: 8,  word: 'ugly',       img: '08-ugly.png',       audio: '08-ugly.mp3' },
      { id: 9,  word: 'cheap',      img: '09-cheap.png',      audio: '09-cheap.mp3' },
      { id: 10, word: 'expensive',  img: '10-expensive.png',  audio: '10-expensive.mp3' },
      { id: 11, word: 'long',       img: '11-long.png',       audio: '11-long.mp3' },
      { id: 12, word: 'short',      img: '12-short.png',      audio: '12-short.mp3' },
      { id: 13, word: 'clean',      img: '13-clean.png',      audio: '13-clean.mp3' },
      { id: 14, word: 'dirty',      img: '14-dirty.png',      audio: '14-dirty.mp3' },
      { id: 15, word: 'easy',       img: '15-easy.png',       audio: '15-easy.mp3' },
      { id: 16, word: 'difficult',  img: '16-difficult.png',  audio: '16-difficult.mp3' },
    ];

    const MODE_TITLES = {
      'picture-word': 'Picture → Word',
      'audio-word': 'Audio → Word',
      'audio-picture': 'Audio → Picture'
    };

    let currentMode = 'picture-word';
    let currentRound = 1;
    let score = 0;
    let matchedCount = 0;
    let selectedCard = null;
    let isLocked = false;
    let currentPairs = [];
    let usedIds = new Set();
    let audioElements = {};

    // DOM
    const startScreen = document.getElementById('startScreen');
    const gameScreen = document.getElementById('gameScreen');
    const board = document.getElementById('board');
    const roundVal = document.getElementById('roundVal');
    const scoreVal = document.getElementById('scoreVal');
    const matchedVal = document.getElementById('matchedVal');
    const gameTitle = document.getElementById('gameTitle');
    const overlay = document.getElementById('overlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalNext = document.getElementById('modalNext');
    const modalHome = document.getElementById('modalHome');
    const toast = document.getElementById('toast');

    // Helpers
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function spawnParticles(cardEl) {
      const colors = ['#7c6af7', '#4caf50', '#ff9800', '#e91e63', '#2196f3', '#ffeb3b'];
      const container = document.createElement('div');
      container.className = 'particles';
      cardEl.appendChild(container);

      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = (i / 10) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
        const dist = 28 + Math.random() * 36;
        p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
        p.style.background = colors[i % colors.length];
        p.style.width = `${5 + Math.random() * 5}px`;
        p.style.height = p.style.width;
        p.style.animationDelay = `${Math.random() * 0.06}s`;
        container.appendChild(p);
      }

      setTimeout(() => container.remove(), 800);
    }

    function playAudio(src) {
      // Stop any currently playing
      Object.values(audioElements).forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
      if (!audioElements[src]) {
        audioElements[src] = new Audio(src);
      }
      const a = audioElements[src];
      a.play().catch(() => {});
      return a;
    }

    function updateStats() {
      roundVal.textContent = `${currentRound} / 2`;
      scoreVal.textContent = score;
      matchedVal.textContent = `${matchedCount} / 5`;
    }

    function pickRoundItems() {
      // Prefer unused items, then fill
      let available = ALL_ITEMS.filter(i => !usedIds.has(i.id));
      if (available.length < 5) {
        usedIds.clear();
        available = [...ALL_ITEMS];
      }
      const selected = shuffle(available).slice(0, 5);
      selected.forEach(i => usedIds.add(i.id));
      return selected;
    }

    function renderBoard() {
      board.innerHTML = '';
      selectedCard = null;
      isLocked = false;
      matchedCount = 0;
      updateStats();

      currentPairs = pickRoundItems();
      const leftItems = shuffle([...currentPairs]);
      const rightItems = shuffle([...currentPairs]);

      // Always 5 on the LEFT column, 5 on the RIGHT column (all 3 game modes)
      for (let i = 0; i < 5; i++) {
        const left = createCard(leftItems[i], 'left');
        const right = createCard(rightItems[i], 'right');
        left.style.gridRow = String(i + 1);
        right.style.gridRow = String(i + 1);
        board.appendChild(left);
        board.appendChild(right);
      }
    }

    function createCard(item, side) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = item.id;
      card.dataset.side = side;

      if (currentMode === 'picture-word') {
        if (side === 'left') {
          const img = document.createElement('img');
          img.src = item.img;
          img.alt = item.word;
          card.appendChild(img);
        } else {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = item.word;
          card.appendChild(span);
        }
      } else if (currentMode === 'audio-word') {
        if (side === 'left') {
          card.innerHTML = `
            <div class="audio-btn" aria-label="Play sound">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            </div>`;
          card.dataset.audio = item.audio;
        } else {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = item.word;
          card.appendChild(span);
        }
      } else if (currentMode === 'audio-picture') {
        if (side === 'left') {
          card.innerHTML = `
            <div class="audio-btn" aria-label="Play sound">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            </div>`;
          card.dataset.audio = item.audio;
        } else {
          const img = document.createElement('img');
          img.src = item.img;
          img.alt = item.word;
          card.appendChild(img);
        }
      }

      card.addEventListener('click', () => onCardClick(card, item));
      return card;
    }

    function onCardClick(card, item) {
      if (isLocked || card.classList.contains('matched')) return;

      // If left side has audio, play it
      if (card.dataset.audio) {
        document.querySelectorAll('.card.playing').forEach(c => c.classList.remove('playing'));
        card.classList.add('playing');
        const a = playAudio(card.dataset.audio);
        a.onended = () => card.classList.remove('playing');
      }

      if (!selectedCard) {
        // First selection
        selectedCard = card;
        card.classList.add('selected');
        return;
      }

      if (selectedCard === card) {
        // Deselect
        selectedCard.classList.remove('selected');
        selectedCard = null;
        return;
      }

      // Must be opposite side
      if (selectedCard.dataset.side === card.dataset.side) {
        selectedCard.classList.remove('selected');
        selectedCard = card;
        card.classList.add('selected');
        return;
      }

      // Check match
      isLocked = true;
      const id1 = parseInt(selectedCard.dataset.id);
      const id2 = parseInt(card.dataset.id);

      if (id1 === id2) {
        // Correct
        selectedCard.classList.remove('selected');
        selectedCard.classList.add('matched');
        card.classList.add('matched');
        spawnParticles(selectedCard);
        spawnParticles(card);
        matchedCount++;
        score += 10;
        updateStats();
        showToast('✓ Correct!');

        // In Picture → Word mode, play the word audio on match
        if (currentMode === 'picture-word') {
          const matchedItem = currentPairs.find(p => p.id === id1);
          if (matchedItem) {
            playAudio(matchedItem.audio);
          }
        }

        selectedCard = null;
        isLocked = false;

        if (matchedCount === 5) {
          setTimeout(onRoundComplete, 800);
        }
      } else {
        // Wrong
        card.classList.add('selected');
        selectedCard.classList.add('wrong');
        card.classList.add('wrong');
        showToast('✗ Try again');

        setTimeout(() => {
          selectedCard.classList.remove('selected', 'wrong');
          card.classList.remove('selected', 'wrong');
          selectedCard = null;
          isLocked = false;
        }, 700);
      }
    }

    function onRoundComplete() {
      if (currentRound < 2) {
        showToast('Round complete! Next round...');
        setTimeout(() => {
          currentRound++;
          renderBoard();
        }, 1200);
      } else {
        modalTitle.textContent = 'Game Complete!';
        modalText.textContent = `Amazing! Final score: ${score}. Play again?`;
        modalNext.textContent = 'Play Again';
        modalNext.onclick = () => {
          overlay.classList.remove('show');
          currentRound = 1;
          score = 0;
          usedIds.clear();
          renderBoard();
        };
        overlay.classList.add('show');
      }
    }

    function startGame(mode) {
      currentMode = mode;
      currentRound = 1;
      score = 0;
      usedIds.clear();
      selectedCard = null;

      startScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');

      // Update mode buttons
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      gameTitle.textContent = MODE_TITLES[mode];
      renderBoard();
    }

    // Event listeners
    document.querySelectorAll('.start-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => startGame(btn.dataset.mode));
    });

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.mode === currentMode) return;
        startGame(btn.dataset.mode);
      });
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      gameScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      // Stop all audio
      Object.values(audioElements).forEach(a => { a.pause(); a.currentTime = 0; });
    });

    modalHome.addEventListener('click', () => {
      overlay.classList.remove('show');
      gameScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
    });

    // Preload images
    ALL_ITEMS.forEach(item => {
      const img = new Image();
      img.src = item.img;
    });
  </script>
</body>
</html>
