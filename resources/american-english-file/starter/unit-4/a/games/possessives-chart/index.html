<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Possessives Chart | Starter Unit 4A | Mr. Sheyhaki</title>
  <meta name="description" content="Learn possessive adjectives: my, your, his, her, its, our, their.">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
  <div class="game" id="app">
    <header class="top-bar">
      <a href="../" class="back-btn" aria-label="Back">←</a>
      <div class="top-center">
        <span class="unit-label">Starter · Unit 4A</span>
        <span class="game-title">Possessives Chart</span>
      </div>
      <div class="top-stats"></div>
    </header>
    <main class="main">
      <p class="instruction">Tap a subject to see its possessive adjective.</p>
      <div class="chart-grid" id="chartGrid"></div>
      <div class="detail-panel" id="detailPanel" hidden>
        <div class="detail-inner">
          <div class="detail-pair">
            <span class="detail-subj" id="detailSubj"></span>
            <span class="detail-arrow">→</span>
            <span class="detail-poss" id="detailPoss"></span>
          </div>
          <p class="detail-ex" id="detailEx"></p>
          <button type="button" class="primary-btn" id="closeDetail">Got it</button>
        </div>
      </div>
    </main>
  </div>
  <script src="/learningarcade/la-stars.js" data-la-stars></script>
  <script src="script.js"></script>
</body>
</html>
