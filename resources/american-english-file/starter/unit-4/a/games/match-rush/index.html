<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Family Match Rush | Mr. Sheyhaki</title>
  <meta name="description" content="Listen and match family words. Audio → Word.">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
  <header class="game-header">
    <a class="back-button" href="../" id="backBtn">←</a>
    <div class="header-center">
      <span class="eyebrow">VOCABULARY · PEOPLE &amp; FAMILY</span>
      <strong>Match Rush</strong>
    </div>
    <span class="header-spacer" aria-hidden="true"></span>
  </header>

  <main class="app">
    <section id="startScreen" class="panel">
      <div class="hero-icon" aria-hidden="true">🔊</div>
      <h1>Match Rush</h1>
      <p class="lead">Listen, then tap the matching family word.</p>
      <ul class="feature-list">
        <li>Audio → Word</li>
        <li>10 family words · 2 rounds</li>
        <li>Tap one, then its match</li>
      </ul>
      <button id="startBtn" class="primary-btn" type="button">START ▶</button>
    </section>

    <section id="gameScreen" class="panel" hidden>
      <div class="game-toolbar">
        <button type="button" id="backToStart" class="modes-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="stats-bar">
          <div class="stat"><span class="stat-label">ROUND</span><strong id="roundText">1 / 2</strong></div>
          <div class="stat"><span class="stat-label">SCORE</span><strong id="scoreText">0</strong></div>
          <div class="stat"><span class="stat-label">MATCHED</span><strong id="matchedText">0 / 5</strong></div>
        </div>
      </div>
      <p class="prompt" id="promptText">Audio → Word</p>
      <div class="pairs-grid" id="pairsGrid"></div>
      <p class="instruction">Tap one, then its match</p>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </section>

    <section id="endScreen" class="panel" hidden>
      <div class="hero-icon" aria-hidden="true">🏆</div>
      <h1 id="endTitle">Well done!</h1>
      <p id="endSummary" class="lead"></p>
      <div class="end-actions">
        <a class="icon-square-btn" href="../" aria-label="Back">←</a>
        <button id="playAgainBtn" class="icon-square-btn" type="button" aria-label="Again">↻</button>
      </div>
    </section>
  </main>

  <script src="/theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
