<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>What's in Your Bag? · Unit 3A | Mr. Sheyhaki</title>
  <meta name="description" content="Open the bag and wallet, see the items, and write sentences starting with I have…">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="game-header">
    <a class="back-btn" href="../" aria-label="Back to Unit 3A games">← Games</a>
    <div class="header-center">
      <span class="eyebrow">UNIT 3A</span>
      <strong>What's in Your Bag?</strong>
    </div>
    <div class="page-dots" id="pageDots" aria-label="Progress">
      <span class="dot active" data-page="0"></span>
      <span class="dot" data-page="1"></span>
    </div>
  </header>

  <main class="stage">

    <section class="panel" id="gamePanel">
      <h1 class="title" id="pageTitle">What's in your bag?</h1>
      <p class="hint" id="hint">Tap the bag to open it.</p>

      <div class="bag-scene" id="bagScene">
        <div class="items-ring" id="itemsRing" aria-live="polite"></div>

        <button type="button" class="bag" id="bagBtn" aria-label="Open the bag">
          <span class="bag-visual" id="bagVisual" aria-hidden="true">
            <span class="container-art" id="containerArt">
              <!-- bag or wallet art swapped by JS -->
              <span class="art-bag">
                <img class="bag-photo bag-closed" src="bag-closed.png" alt="" draggable="false">
                <img class="bag-photo bag-open-img" src="bag-open.png" alt="" draggable="false">
              </span>
              <span class="art-wallet" hidden>
                <img class="bag-photo wallet-closed" src="wallet-closed.png" alt="" draggable="false">
                <img class="bag-photo wallet-open-img" src="wallet-open.png" alt="" draggable="false">
              </span>
            </span>
            <span class="bag-label" id="bagLabel">BAG</span>
          </span>
        </button>
      </div>

      <div class="answer-area" id="answerArea" hidden>
        <label class="sr-only" for="answerInput">Write your sentence starting with I have</label>
        <input
          type="text"
          id="answerInput"
          class="answer-input"
          placeholder="I have…"
          autocomplete="off"
          spellcheck="true"
          enterkeyhint="done"
        >
        <button type="button" class="primary-btn" id="checkBtn">Check Answer</button>
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      </div>

      <button type="button" class="ghost-btn" id="tryAgainBtn">↻ Try Again</button>
    </section>

    <!-- Between pages -->
    <section class="panel mid-panel" id="midPanel" hidden>
      <div class="success-icon" aria-hidden="true">✓</div>
      <h2>Nice work!</h2>
      <p id="midMsg">You finished page 1.</p>
      <p class="model" id="midModel"></p>
      <button type="button" class="primary-btn" id="nextPageBtn">Next → Wallet</button>
    </section>

    <!-- Final success -->
    <section class="panel success-panel" id="successPanel" hidden>
      <div class="success-icon" aria-hidden="true">🏆</div>
      <h2>Excellent!</h2>
      <p id="successMsg">You completed both pages.</p>
      <div class="models" id="allModels"></div>
      <div class="success-actions">
        <a class="icon-btn icon-btn-back" href="../" id="backBtn" aria-label="Back to games" title="Back to games">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </a>
        <button type="button" class="icon-btn icon-btn-retry" id="playAgainBtn" aria-label="Try again" title="Try again">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.6-6.2"/>
            <path d="M21 3v6h-6"/>
          </svg>
        </button>
      </div>
    </section>

  </main>

  <script src="../../../../../../../learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="../../../../../../../theme.js"></script>
</body>
</html>
