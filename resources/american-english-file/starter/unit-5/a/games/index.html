<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 5A games | Mr. Sheyhaki</title>
<meta name="description" content="Unit 5A food and drink vocabulary games">
<link rel="stylesheet" href="../../../../../../style.css">
<link rel="stylesheet" href="../../../../../style.css">
<link rel="stylesheet" href="../../../../../../theme.css">
<style>
.games-page{max-width:1100px;margin:0 auto;padding:48px 20px 70px}
.games-back{
  display:inline-flex;align-items:center;gap:6px;
  margin-bottom:18px;padding:8px 14px;border-radius:999px;
  text-decoration:none;font-weight:700;font-size:.9rem;
  color:#6b7280;background:rgba(255,255,255,.7);
  border:1px solid rgba(120,130,150,.2);
  transition:background .15s,color .15s,border-color .15s;
}
.games-back:hover{color:#4f46e5;border-color:rgba(99,102,241,.35);background:#fff}
html[data-theme="dark"] .games-back{
  color:#9ca3af;background:rgba(30,41,59,.7);border-color:rgba(148,163,184,.2)
}
html[data-theme="dark"] .games-back:hover{color:#a5b4fc;border-color:rgba(99,102,241,.4)}
.games-intro{margin-bottom:28px}
.games-intro h1{margin:.2rem 0 .5rem}
.games-intro p{color:#6b7280}
html[data-theme="dark"] .games-intro p{color:#9ca3af}
.unit-resource-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.resource-card--game{
  display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:14px;
  padding:18px 20px;border-radius:20px;text-decoration:none;color:inherit;
  background:rgba(255,255,255,.9);border:1px solid rgba(120,130,150,.18);
  box-shadow:0 10px 28px rgba(25,40,65,.07);min-height:88px;box-sizing:border-box;
  transition:transform .18s,box-shadow .18s;
}
.resource-card--game:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(25,40,65,.12)}
.resource-card-main{display:flex;flex-direction:row;align-items:center;gap:14px;min-width:0;flex:1}
.resource-card--game .resource-icon{
  flex-shrink:0;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:1.45rem;background:rgba(99,102,241,.12);margin:0
}
.resource-card-body{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.resource-card--game h3{margin:0;font-size:1.05rem;font-weight:700;line-height:1.25}
.resource-card--game .game-stars{display:flex!important;flex-direction:row!important;align-items:center;gap:3px;margin:2px 0 0;font-size:1rem;line-height:1}
.resource-card--game .game-stars .star{opacity:.32;filter:grayscale(1);color:#94a3b8}
.resource-card--game .game-stars .star.is-filled,
.resource-card--game .game-stars .star.filled{opacity:1;filter:none;color:#f59e0b}
.resource-card--game .resource-button{
  flex-shrink:0;margin:0;padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;white-space:nowrap;
  background:rgba(99,102,241,.1);color:#4f46e5;border:1px solid rgba(99,102,241,.18)
}
.resource-card--game:hover .resource-button{background:#4f46e5;color:#fff}
@media(max-width:520px){
  .resource-card--game{padding:14px 16px;gap:10px}
  .resource-card--game .resource-icon{width:42px;height:42px;font-size:1.25rem}
  .resource-card--game h3{font-size:.98rem}
  .resource-card--game .resource-button{padding:8px 12px;font-size:.82rem}
}
html[data-theme="dark"] .resource-card--game{
  background:rgba(30,41,59,.85);border-color:rgba(148,163,184,.18);color:#e2e8f0
}
html[data-theme="dark"] .resource-card--game .resource-button{color:#a5b4fc;background:rgba(99,102,241,.2)}
</style>
</head>
<body data-course="american-english-file" data-type="games" data-level="starter" data-unit="5" data-lesson="a">

  <nav class="arcade-nav" id="mainNav" aria-label="Main navigation">
    <a href="../../../../../../" class="nav-link" aria-label="Home" data-icon="🏠"><span class="nav-ico" aria-hidden="true">🏠</span><span class="nav-text">Home</span></a>
    <a href="../../../../../../learningarcade/" class="nav-link" aria-label="Learning Arcade" data-icon="🕹️"><span class="nav-ico" aria-hidden="true">🕹️</span><span class="nav-text">Learning Arcade</span></a>
    <a href="../../../../../../resources/" class="nav-link active" aria-current="page" aria-label="Resources" data-icon="📚"><span class="nav-ico" aria-hidden="true">📚</span><span class="nav-text">Resources</span></a>
    <a href="../../../../../../about/" class="nav-link" aria-label="About" data-icon="👤"><span class="nav-ico" aria-hidden="true">👤</span><span class="nav-text">About</span></a>
  </nav>
</header>

<main class="games-page">
  <a class="games-back" href="../" aria-label="Back to Unit 5A">← Unit 5A</a>
  <section class="games-intro">
    <p class="eyebrow">AMERICAN ENGLISH FILE · STARTER · UNIT 5A</p>
    <h1>Unit 5A Games</h1>
    <p>Practice the vocabulary from Unit 5A with these interactive games.</p>
  </section>
  <section class="unit-resource-grid" aria-label="Games">
    <a class="content-card resource-card resource-card--game" href="food-verb-match/">
      <div class="resource-card-main">
        <div class="resource-icon" aria-hidden="true">🎮</div>
        <div class="resource-card-body">
          <h3>Food Verb Match</h3>
          <div class="game-stars" data-game="starter-5a-food-verb-match" aria-label="Progress stars">
            <span class="star" data-n="1">☆</span><span class="star" data-n="2">☆</span><span class="star" data-n="3">☆</span>
          </div>
        </div>
      </div>
      <span class="resource-button">Play →</span>
    </a>
  </section>
</main>

</body>
</html>
