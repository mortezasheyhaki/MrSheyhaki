<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)
document.documentElement.setAttribute("data-theme","dark");
else document.documentElement.setAttribute("data-theme","light");
}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sound Match Picture · Food · Unit 5A | Mr. Sheyhaki</title>
<meta name="description" content="Listen and tap the matching food picture – AEF Starter Unit 5A.">
<link rel="stylesheet" href="../../../../../../style.css">
<link rel="stylesheet" href="../../../../../../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-course="american-english-file" data-type="game" data-level="starter" data-unit="5" data-lesson="a">
<main class="app" id="app">
  <section class="start-screen" id="startScreen">
    <header class="topbar">
      <a class="back" href="../" aria-label="Back">←</a>
      <span class="title">Sound Match Picture</span>
      <span class="badge">5A</span>
    </header>
    <div class="start-body">
      <div class="hero" aria-hidden="true">🎧</div>
      <h1>Sound Match Picture</h1>
      <p class="lead">Listen, then tap the matching food picture.</p>
      <p class="muted">20 foods &amp; drinks · match all pictures</p>
      <button type="button" class="primary-btn" id="startBtn">Start</button>
    </div>
  </section>

  <section class="game-screen hidden" id="gameScreen">
    <header class="topbar">
      <a class="back" href="../" aria-label="Back">←</a>
      <span class="title" id="roundLabel">1 / 20</span>
      <div class="hearts" id="hearts" aria-label="Lives">
        <span class="heart is-full" data-i="0" aria-hidden="true">♥</span>
        <span class="heart is-full" data-i="1" aria-hidden="true">♥</span>
        <span class="heart is-full" data-i="2" aria-hidden="true">♥</span>
      </div>
    </header>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

    <div class="listen-panel">
      <button type="button" class="play-btn" id="playBtn" aria-label="Play sound">
        <span class="wave"></span><span class="wave"></span><span class="wave"></span>
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <div class="eq"><span></span><span></span><span></span><span></span></div>
      </button>
      <div class="listen-text">
        <strong>Listen</strong>
        <span id="feedback">Tap the matching picture.</span>
      </div>
    </div>

    <div class="picture-grid" id="pictureGrid"></div>
  </section>
</main>
<script src="../../../../../../script.js"></script>
<script src="../../../../../../../theme.js"></script>
<script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
<script src="/learningarcade/la-sfx.js"></script>
<script src="script.js"></script>
</body>
</html>
