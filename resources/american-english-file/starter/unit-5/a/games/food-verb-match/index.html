<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f7fb">

  <title>Food Verb Match | Unit 5A | Mr. Sheyhaki</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game" id="app">

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="top-bar">

      <div class="top-item">
        <span class="top-label">Score</span>
        <span class="top-value" id="score">0</span>
      </div>

      <div class="top-item">
        <span class="top-label">Time</span>
        <span class="top-value" id="timer">90</span>
      </div>

      <div class="top-item">
        <span class="top-label">Combo</span>
        <span class="top-value" id="combo">0x</span>
      </div>

    </header>


    <!-- =====================================================
         PROGRESS
         ===================================================== -->

    <div class="progress-wrap">
      <div
        class="progress-bar"
        id="progressFill"
        style="width: 0%;"
      ></div>
    </div>


    <!-- =====================================================
         GAME
         ===================================================== -->

    <main class="swipe-area" id="gameScreen">

      <!-- -----------------------------------------------
           THREE TARGETS
           ----------------------------------------------- -->

      <div class="targets">

        <!-- UP -->
        <div
          class="target target-have"
          id="targetHave"
          data-answer="have"
        >
          HAVE
        </div>

        <!-- LEFT -->
        <div
          class="target target-drink"
          id="targetDrink"
          data-answer="drink"
        >
          DRINK
        </div>

        <!-- RIGHT -->
        <div
          class="target target-eat"
          id="targetEat"
          data-answer="eat"
        >
          EAT
        </div>

      </div>


      <!-- -----------------------------------------------
           CARD AREA
           ----------------------------------------------- -->

      <div class="card-area" id="cardArea">

        <div
          class="swipe-card"
          id="swipeCard"
          role="button"
          tabindex="0"
          aria-label="Swipe this word to the correct verb"
        >
          <span class="word" id="word">
            APPLE
          </span>
        </div>

        <!-- Swipe direction hints -->

        <div class="swipe-hints">

          <div class="swipe-hint">
            ← DRINK
          </div>

          <div class="swipe-hint">
            ↑ HAVE
          </div>

          <div class="swipe-hint">
            EAT →
          </div>

        </div>

      </div>


      <!-- -----------------------------------------------
           FEEDBACK
           ----------------------------------------------- -->

      <p
        class="feedback"
        id="feedback"
        aria-live="polite"
      ></p>


      <!-- Screen-reader status -->

      <p
        class="sr-only"
        id="status"
        aria-live="polite"
      ></p>

    </main>


    <!-- =====================================================
         START SCREEN
         ===================================================== -->

    <div class="overlay" id="startOverlay">

      <div class="overlay-content">

        <div class="overlay-title">
          Food Verb Match
        </div>

        <p class="overlay-text">
          Swipe each word to the correct verb.
          <br><br>

          <strong>↑ HAVE</strong>
          &nbsp;&nbsp;
          <strong>← DRINK</strong>
          &nbsp;&nbsp;
          <strong>EAT →</strong>
        </p>

        <button
          type="button"
          class="start-button"
          id="startBtn"
        >
          Start Game
        </button>

      </div>

    </div>


    <!-- =====================================================
         END SCREEN
         ===================================================== -->

    <div
      class="overlay hidden"
      id="endModal"
    >

      <div class="overlay-content">

        <div
          class="overlay-title"
          id="resultIcon"
        >
          🏆
        </div>

        <h2 id="endTitle">
          Excellent!
        </h2>

        <p
          class="overlay-text"
          id="endMessage"
        >
          Great job!
        </p>


        <!-- Results -->

        <div class="result-row">

          <div>
            <span>Score</span>
            <strong id="finalScore">0</strong>
          </div>

          <div>
            <span>Accuracy</span>
            <strong id="accuracy">0%</strong>
          </div>

          <div>
            <span>Best Combo</span>
            <strong id="bestCombo">0x</strong>
          </div>

        </div>


        <button
          type="button"
          class="start-button"
          id="playAgain"
        >
          Play Again
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="script.js"></script>

</body>
</html>
