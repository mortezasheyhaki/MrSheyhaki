<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Choose the Verb · Unit 9B | Mr. Sheyhaki</title>
  <meta name="description" content="Choose the correct verb form — simple present or present continuous. American English File Starter Unit 9B.">
  <link rel="stylesheet" href="../../../../../../style.css">
  <link rel="stylesheet" href="../../../../../../../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-page" data-course="american-english-file" data-type="game" data-level="starter" data-unit="9" data-lesson="b">
  <div class="vc-game" id="app">
    <!-- Start -->
    <section class="vc-screen" id="startScreen">
      <header class="vc-top">
        <a class="vc-back" href="../" aria-label="Back">←</a>
        <div class="vc-top-center">
          <span class="vc-eyebrow">Starter · Unit 9B</span>
          <span class="vc-title">Choose the Verb</span>
        </div>
        <span class="vc-top-spacer"></span>
      </header>
      <div class="vc-body vc-start">
        <div class="vc-hero" aria-hidden="true">✍️</div>
        <h1>Simple present or continuous?</h1>
        <p class="vc-lead">Pick the correct verb for each sentence.<br>One sentence at a time — pick the correct form.</p>
        <ul class="vc-tips">
          <li><strong>usually / every</strong> → simple present</li>
          <li><strong>now / Look! / Listen!</strong> → present continuous</li>
        </ul>
        <button type="button" class="vc-btn" id="startBtn">Start</button>
      </div>
    </section>

    <!-- Play -->
    <section class="vc-screen hidden" id="playScreen">
      <header class="vc-top">
        <button type="button" class="vc-back" id="exitBtn" aria-label="Exit">←</button>
        <div class="vc-top-center">
          <span class="vc-eyebrow" id="progressLabel">1 / 10</span>
          <span class="vc-title">Choose the Verb</span>
        </div>
        <span class="vc-score-pill" id="scorePill" title="Score">0</span>
      </header>
      <div class="vc-body vc-play">
        <div class="vc-card" id="sentenceCard">
          <p class="vc-sentence" id="sentenceText"></p>
        </div>
        <div class="vc-options" id="options" role="group" aria-label="Verb choices"></div>
        <p class="vc-feedback" id="feedback" aria-live="polite"></p>
      </div>
    </section>
  </div>

  <script src="../../../../../../script.js"></script>
  <script src="../../../../../../../theme.js"></script>
  <script src="/learningarcade/la-stars.js" data-la-stars></script>
  <script src="/learningarcade/la-finish.js"></script>
  <script src="/learningarcade/la-sfx.js"></script>
  <script src="script.js"></script>
</body>
</html>
