<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("mrsheyhaki-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>Listen & Write | Unit 9A | Mr. Sheyhaki</title>
  <meta name="description" content="Listen to the audio and write what is happening. Unit 9A – American English File Starter.">
  <link rel="stylesheet" href="../../../../../../../theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-course="american-english-file" data-type="game" data-level="starter" data-unit="9" data-lesson="a" class="no-profile-fab">
  <div class="game" id="app">

    <!-- Top bar -->
    <header class="top-bar">
      <a href="../" class="back-btn" aria-label="Back to games">←</a>
      <div class="top-center">
        <span class="unit-label">Unit 9A</span>
        <span class="game-title">Listen & Write</span>
      </div>
      <div class="top-stats">
        <div class="stat">
          <span class="stat-label">Listens</span>
          <span class="stat-value" id="listensLeft">3</span>
        </div>
        <div class="stat">
          <span class="stat-label">Attempts</span>
          <span class="stat-value" id="attemptsLeft">3</span>
        </div>
      </div>
    </header>

    <!-- Main content -->
    <main class="main-content">

      <!-- Instruction -->
      <p class="instruction" id="instruction">
        Listen and write what is happening in each picture.
      </p>

<!-- Audio player -->
<div class="audio-wrap">
  <button class="play-btn" id="playBtn" aria-label="Play audio" type="button">
    <span class="play-icon" id="playIcon">▶</span>
    <div class="visualizer" id="visualizer" hidden>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </button>
  <div class="audio-info">
    <span class="audio-label">Audio</span>
    <span class="audio-hint" id="audioHint">Tap to play · 3 listens left</span>
  </div>
</div>

      <!-- Writing boxes -->
      <div class="boxes" id="boxes">
        <!-- Generated by JS -->
      </div>

      <!-- Feedback area -->
      <div class="feedback" id="feedback" hidden></div>

<!-- Continue / Next button -->
<button class="continue-btn" id="continueBtn" hidden type="button">
  Continue
</button>

    </main>

    <!-- Success overlay -->
    <div class="overlay" id="successOverlay">
      <div class="overlay-card">
        <div class="overlay-icon">✓</div>
        <h2>Well done!</h2>
        <p>All answers are correct.</p>
        <button class="continue-btn" id="successContinue" type="button">Continue</button>
      </div>
    </div>

  </div>

  <script src="/learningarcade/la-stars.js" data-la-stars></script>
  <script src="script.js"></script>
</body>
</html>
