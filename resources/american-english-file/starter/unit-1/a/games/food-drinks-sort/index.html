<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243e">
  <meta name="description" content="Food & Drinks Sort - vocabulary game">
  <title>Food & Drinks Sort | Mr. Sheyhaki</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" id="app">
    <header class="game-header">
      <div>
        <a class="back-link" href="../">← Unit 5A Games</a>
        <p class="eyebrow">UNIT 5A · VOCABULARY GAME</p>
        <h1>Food &amp; Drinks Sort</h1>
        <p class="instruction">Put each word in the correct category.</p>
      </div>
      <div class="header-badge" aria-label="22 vocabulary items">22 words</div>
    </header>

    <section class="hud" aria-label="Game information">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Combo</span><strong id="combo">×0</strong></div>
      <div class="stat"><span>Time</span><strong id="time">01:30</strong></div>
      <div class="stat progress-stat">
        <span>Progress</span>
        <strong><span id="progressCount">0</span>/22</strong>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </section>

    <section class="sort-board" aria-label="Food and drinks categories">
      <div class="drop-zone food-zone" data-category="food" tabindex="0">
        <div class="zone-heading"><span class="zone-icon">🍽️</span><div><h2>Food</h2><p>Drop food here</p></div></div>
        <div class="zone-items" id="foodItems"></div>
      </div>
      <div class="drop-zone drinks-zone" data-category="drinks" tabindex="0">
        <div class="zone-heading"><span class="zone-icon">🥤</span><div><h2>Drinks</h2><p>Drop drinks here</p></div></div>
        <div class="zone-items" id="drinkItems"></div>
      </div>
    </section>

    <section class="card-tray" id="cardTray" aria-label="Vocabulary cards"></section>
    <p class="sr-status" id="status" aria-live="polite"></p>

    <div class="modal hidden" id="endModal" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <div class="modal-card">
        <div class="result-icon" id="resultIcon">🏆</div>
        <p class="eyebrow">ROUND COMPLETE</p>
        <h2 id="endTitle">Great job!</h2>
        <p id="endMessage"></p>
        <div class="result-grid">
          <div><span>Score</span><strong id="finalScore">0</strong></div>
          <div><span>Accuracy</span><strong id="accuracy">0%</strong></div>
          <div><span>Best Combo</span><strong id="bestCombo">×0</strong></div>
        </div>
        <button class="primary-btn" id="playAgain" type="button">Play Again</button>
      </div>
    </div>
  </main>
  <script src="../../../../../../learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
</body>
</html>
