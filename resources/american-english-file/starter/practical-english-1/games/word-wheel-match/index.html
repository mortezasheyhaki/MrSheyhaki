<!DOCTYPE html>
<html lang="en" class="ww-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Word Wheel Match · PE1 | Mr. Sheyhaki</title>
<meta name="description" content="Drag the matching classroom word onto the picture — American English File Starter Practical English 1.">
<link rel="stylesheet" href="style.css">
<style>a.profile-fab,.profile-fab{display:none!important;visibility:hidden!important;pointer-events:none!important}</style>
</head>
<body class="game-page ww-page" data-course="american-english-file" data-type="game" data-level="starter" data-pe="1">
<div class="deco" aria-hidden="true">
  <span style="top:9%;left:6%">✏️</span>
  <span style="top:24%;left:14%;animation-delay:-2s">📐</span>
  <span style="top:62%;left:4%;animation-delay:-5s">📚</span>
  <span style="top:84%;left:16%;animation-delay:-3s">🖍️</span>
  <span style="top:10%;right:8%;animation-delay:-4s">📏</span>
  <span style="top:36%;right:4%;animation-delay:-1s">🎒</span>
  <span style="top:66%;right:12%;animation-delay:-6s">🖊️</span>
  <span style="top:86%;right:4%;animation-delay:-2.5s">📖</span>
</div>
<div class="app">
  <header>
    <div class="header-left">
      <a class="ww-back" href="../" aria-label="Back to Practical English 1">←</a>
      <h1>🎡 Word Wheel</h1>
    </div>
    <div class="hud">
      <span class="pill" id="round">Round 1/8</span>
      <span class="pill" id="score">✅ 0</span>
      <button type="button" class="iconbtn" id="mute" aria-label="Toggle sound">🔊</button>
    </div>
  </header>
  <div class="bar"><i id="prog"></i></div>

  <div class="stage" id="stage">
    <div class="ring"></div>
    <svg class="chains" id="chains" aria-hidden="true"></svg>
    <div class="center" id="target">
      <div class="lbl" id="lbl"></div>
      <img id="emoji" alt="" draggable="false"
        onerror="this.style.display='none';document.getElementById('lbl').style.display='block'"
        style="width:76%;height:76%;object-fit:contain;border-radius:14px;pointer-events:none">
    </div>
    <div class="feedback" id="fb" aria-live="polite"></div>
  </div>

  <p class="tip" id="tip">Drag the matching word onto the picture</p>
</div>

<div class="screen on" id="start">
  <div class="screen-card">
    <div class="screen-icon" aria-hidden="true">🎡</div>
    <h2>Word Wheel</h2>
    <p>Words spin around the wheel. Drag the matching word onto the picture in the middle!</p>
    <button type="button" class="btn" id="go">Start</button>
    <a class="screen-back" href="../">← Back to PE1</a>
  </div>
</div>

<div class="screen" id="end" hidden></div>

<script src="../../../../../script.js"></script>
<script src="../../../../../../theme.js"></script>
<script src="/learningarcade/la-stars.js" data-la-stars></script>
<script src="/learningarcade/la-finish.js"></script>
<script src="/learningarcade/la-sfx.js"></script>
<script src="script.js"></script>
</body>
</html>
