<!DOCTYPE html>
<html lang="en">
<head>
<script src="/resources/auth-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Free-Time Listen & Write · Unit 7A | AEF Starter | Mr. Sheyhaki</title>
<meta name="description" content="Look at the picture, listen, and type the free-time activity. American English File Starter Unit 7A.">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
  <div class="app" id="app">
    <header class="top">
      <a class="back" href="../" aria-label="Back to games">←</a>
      <div class="top-mid">
        <span class="pill">Unit 7A · Listen & Write</span>
        <h1>Free Time</h1>
      </div>
      <div class="progress" aria-label="Progress"><span id="prog">1/12</span></div>
    </header>

    <main class="stage">
      <div class="pic-wrap">
        <img id="pic" class="pic" alt="" draggable="false">
        <div class="pic-fallback" id="picFallback" hidden>?</div>
      </div>

      <button type="button" class="play" id="playBtn" aria-label="Play audio">
        <span class="play-ico" id="playIcon">▶</span>
        <span class="play-label">Listen</span>
      </button>

      <form class="type-row" id="form" autocomplete="off">
        <input type="text" id="input" class="input" placeholder="Type what you hear…" autocapitalize="none" autocomplete="off" spellcheck="false" enterkeyhint="done">
        <button type="submit" class="check" id="checkBtn">Check</button>
      </form>

      <p class="feedback" id="feedback" aria-live="polite"></p>
    </main>

    <footer class="bottom">
      <button type="button" class="ghost" id="skipBtn">Skip</button>
      <button type="button" class="ghost" id="hintBtn">Hint</button>
    </footer>
  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="/learningarcade/la-finish.js"></script>
  <script src="script.js"></script>
  <script src="/theme.js"></script>
  <script src="/visit-counter.js" defer></script>
</body>
</html>
