<!DOCTYPE html>
<html lang="en">
<head>
<script src="/resources/auth-gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#f7f7f7">
  <title>Amelia's Days | Unit 7A | Mr. Sheyhaki</title>
  <meta name="description" content="Listen to Amelia's weekend and pick Friday, Saturday or Sunday for each sentence. Unit 7A – American English File Starter.">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="style.css">
<!-- Cloudflare Web Analytics --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "02177b6ca21e456c8c869b6f675f461a"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body class="game-page">
  <div class="game" id="app">

    <header class="game-header">
      <a href="../" class="back-btn" aria-label="Back to Unit 7A games">
        <span class="back-arrow" aria-hidden="true">←</span>
        <span class="back-text">Games</span>
      </a>
      <div class="header-center">
        <span class="unit-pill">Unit 7A · Listening</span>
        <h1 class="game-title">Amelia's Days</h1>
      </div>
      <div class="header-right">
        <div class="progress-chip" aria-label="Answered">
          <span id="progressText">0/9</span>
        </div>
      </div>
    </header>

    <section class="audio-card" aria-label="Audio player">
      <button class="play-btn" id="playBtn" type="button" aria-label="Play">
        <span class="play-icon" id="playIcon" aria-hidden="true">▶</span>
      </button>
      <div class="audio-body">
        <p class="audio-hint">Listen to Amelia. Then pick <strong>Friday</strong>, <strong>Saturday</strong> or <strong>Sunday</strong> for each sentence.</p>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" aria-label="Seek">
          <span id="duration">0:00</span>
        </div>
      </div>
      <button class="replay-btn" id="replayBtn" type="button" aria-label="Replay from start" title="Replay">↺</button>
    </section>

    <main class="main-scroll">
      <ol class="sentence-list" id="sentenceList" aria-label="Sentences"></ol>
    </main>

    <footer class="bottom-bar">
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="bottom-actions">
        <button type="button" class="btn-ghost" id="resetBtn">RESET</button>
        <button type="button" class="btn-primary" id="checkBtn" disabled>CHECK ✓</button>
      </div>
    </footer>

  </div>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="/learningarcade/la-finish.js"></script>
  <script src="script.js"></script>
  <script src="/theme.js"></script>
  <script src="/visit-counter.js" defer></script>
</body>
</html>
