<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Amelia's Days | Unit 7A | Mr. Sheyhaki</title>
  <meta name="description" content="Listen to Amelia talk about her weekend and match each activity to the correct day. Unit 7A – American English File Starter.">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" id="app">

    <header class="top-bar">
      <a href="../" class="back-btn" aria-label="Back to games">←</a>
      <div class="top-center">
        <span class="unit-label">Unit 7A</span>
        <span class="game-title">Amelia's Days</span>
      </div>
      <div class="top-right">
        <button type="button" class="theme-toggle-btn theme-icon-only" data-theme-toggle="true" data-icon-only="true" aria-label="Toggle theme">🌙</button>
        <div class="progress-ring" aria-label="Progress">
          <span id="progressText">1/12</span>
        </div>
      </div>
    </header>

    <section class="audio-panel" id="audioPanel">
      <div class="waveform-wrap">
        <canvas id="waveform" width="600" height="48" aria-hidden="true"></canvas>
        <div class="progress-line" id="progressLine"></div>
      </div>
      <div class="audio-controls">
        <button class="play-btn" id="playBtn" type="button" aria-label="Play or pause">
          <span id="playIcon">▶</span>
        </button>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" aria-label="Seek">
          <span id="duration">1:40</span>
        </div>
        <button class="replay-btn" id="replayBtn" type="button" title="Replay" aria-label="Replay from start">↺</button>
      </div>
    </section>

    <main class="main-content">

      <section class="hero-card" id="heroCard">
        <img src="couple.png" alt="Amelia and Ben" class="couple-photo" width="640" height="360">
        <div class="hero-caption">
          <p><strong>Amelia</strong> is a nurse. She lives in Denver with her husband, <strong>Ben</strong>.</p>
          <p class="instruction-text">Listen and choose the day for each activity.</p>
        </div>
      </section>

      <section class="card-stage" id="cardStage">
        <article class="card" id="currentCard">
          <p class="card-num" id="cardNum">Activity 1 of 12</p>
          <p class="card-text" id="cardText"></p>
          <div class="day-choices" id="dayChoices" role="group" aria-label="Choose the day">
            <button type="button" class="day-btn" data-day="Friday">Friday</button>
            <button type="button" class="day-btn" data-day="Saturday">Saturday</button>
            <button type="button" class="day-btn" data-day="Sunday">Sunday</button>
          </div>
          <div class="card-result" id="cardResult" hidden></div>
        </article>

        <div class="nav-row">
          <button type="button" class="ghost-btn" id="prevBtn" disabled>← Prev</button>
          <button type="button" class="primary-btn" id="nextBtn" disabled>Next →</button>
        </div>
      </section>

      <section class="summary" id="summary" hidden>
        <h2>Your answers</h2>
        <div class="summary-list" id="summaryList"></div>
        <div class="actions">
          <button type="button" class="primary-btn" id="checkBtn">Check all answers</button>
          <button type="button" class="ghost-btn" id="resetBtn">Start over</button>
        </div>
        <div class="feedback" id="feedback" hidden></div>
      </section>

    </main>

    <div class="overlay" id="successOverlay" hidden>
      <div class="overlay-card">
        <div class="overlay-icon">🎉</div>
        <h2>Great listening!</h2>
        <p id="overlayMsg">You matched the days correctly.</p>
        <div class="overlay-score">Score: <strong id="finalScore">0</strong> / 12</div>
        <button class="primary-btn" id="playAgainBtn" type="button">Play again</button>
        <a href="../" class="ghost-link">Back to games</a>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
