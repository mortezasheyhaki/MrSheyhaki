<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Words · Subject vs Object Pronouns | Unit 7B</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="game-locked">
  <header class="game-header">
    <a class="back-button" href="../" aria-label="Back" title="Back">←</a>
    <div class="header-center">
      <span class="eyebrow">UNIT 7B · WORDS</span>
      <strong>Subject vs Object</strong>
    </div>
    <button type="button" class="theme-btn theme-icon-only" data-theme-toggle="true" data-icon-only="true" aria-label="Toggle theme">🌙</button>
  </header>

  <main class="app">
    <section id="startScreen" class="panel">
      <div class="hero-icon" aria-hidden="true">🔤</div>
      <h1>Words</h1>
      <p class="lead">Match subject pronouns, object pronouns, and nouns.</p>
      <div class="mode-tabs" id="modeTabs" role="tablist">
        <button type="button" class="mode-tab active" data-mode="0" role="tab" aria-selected="true">
          <span class="mode-ico" aria-hidden="true">Aa</span>
          <span class="mode-label">Subject · Object</span>
        </button>
        <button type="button" class="mode-tab" data-mode="1" role="tab" aria-selected="false">
          <span class="mode-ico" aria-hidden="true">🔊</span>
          <span class="mode-label">Audio · Object</span>
        </button>
        <button type="button" class="mode-tab" data-mode="2" role="tab" aria-selected="false">
          <span class="mode-ico" aria-hidden="true">👤</span>
          <span class="mode-label">Noun · Object</span>
        </button>
      </div>
      <button id="startBtn" class="primary-btn" type="button">START ▶</button>
    </section>

    <section id="gameScreen" class="panel" hidden>
      <div class="stats-bar">
        <div class="stat"><span class="stat-label">ROUND</span><strong id="roundText">1 / 1</strong></div>
        <div class="stat"><span class="stat-label">SCORE</span><strong id="scoreText">0</strong></div>
        <div class="stat"><span class="stat-label">MATCHED</span><strong id="matchedText">0 / 7</strong></div>
      </div>
      <p class="prompt" id="promptText">Subject → Object</p>
      <div class="pairs-grid" id="pairsGrid"></div>
      <p class="instruction" id="instruction">Tap one, then its match</p>
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    </section>

    <section id="endScreen" class="panel" hidden>
      <div class="hero-icon" aria-hidden="true">🏆</div>
      <h1 id="endTitle">Well done!</h1>
      <p id="endSummary" class="lead"></p>
      <div class="end-stats">
        <div><span class="stat-label">SCORE</span><strong id="finalScore">0</strong></div>
        <div><span class="stat-label">ACCURACY</span><strong id="finalAccuracy">0%</strong></div>
        <div><span class="stat-label">PAIRS</span><strong id="finalPairs">0</strong></div>
      </div>
      <div class="end-stars game-stars" data-game="starter-7b-pronouns-words" aria-label="Progress stars">
        <span class="star" data-n="1">☆</span>
        <span class="star" data-n="2">☆</span>
        <span class="star" data-n="3">☆</span>
      </div>
      <div class="end-actions">
        <a class="icon-square-btn" href="../" aria-label="Back"><span aria-hidden="true">←</span></a>
        <button id="playAgainBtn" class="icon-square-btn again-square" type="button" aria-label="Again"><span aria-hidden="true">↻</span></button>
      </div>
    </section>
  </main>

  <script src="/learningarcade/la-stars.js"></script>
  <script src="script.js"></script>
  <script src="/theme.js"></script>
</body>
</html>
