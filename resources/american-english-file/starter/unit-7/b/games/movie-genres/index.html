<!DOCTYPE html>
<html lang="en">
<head>
<script src="/resources/auth-gate.js"></script>
<script>
(function(){try{var t=localStorage.getItem("mrsheyhaki-theme");
if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);
else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)
document.documentElement.setAttribute("data-theme","dark");
else document.documentElement.setAttribute("data-theme","light");
}catch(e){}})();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0b1020" />
<title>Movie Genres · Unit 7B | AEF Starter | Mr. Sheyhaki</title>
<meta name="description" content="Match each description to the correct movie genre. American English File Starter Unit 7B." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="game-page mg-page" data-course="aef-starter" data-type="game" data-level="starter" data-unit="7b">

  <div class="mg-shell" id="app">
    <a class="mg-back" href="../" aria-label="Back to Unit 7B Games">← Games</a>

    <header class="mg-top">
      <div class="mg-progress-wrap" aria-hidden="true">
        <div class="mg-progress" id="progressFill"></div>
      </div>
      <div class="mg-meta">
        <span class="mg-count" id="counter">1 / 7</span>
        <span class="mg-score" id="scoreLive">Score 0</span>
      </div>
    </header>

    <main class="mg-main">
      <p class="mg-prompt-label">Which genre is this?</p>
      <div class="mg-card" id="promptCard">
        <p class="mg-sentence" id="sentence">—</p>
      </div>
      <p class="mg-feedback" id="feedback" aria-live="polite"></p>
      <div class="mg-chips" id="chips" role="group" aria-label="Movie genres"></div>
    </main>
  </div>

  <!-- Start -->
  <div class="mg-overlay" id="startOverlay">
    <div class="mg-panel">
      <a class="mg-panel-back" href="../">← Games</a>
      <div class="mg-badge">Unit 7B</div>
      <h1>Movie Genres</h1>
      <p>Read each description and pick the matching movie genre.</p>
      <button type="button" class="mg-btn" id="startBtn">START</button>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script src="/learningarcade/la-stars.js" data-la-stars></script>
  <script src="/learningarcade/la-finish.js"></script>
  <script src="/learningarcade/la-sfx.js"></script>
  <script src="script.js"></script>
  <script src="/visit-counter.js" defer></script>
</body>
</html>
