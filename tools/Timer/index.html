<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Timer | Tools | Mr. Sheyhaki</title>
  <meta name="description" content="Editable countdown timer — set hours, minutes and seconds. Perfect for classroom activities and practice sessions.">
  <!-- Global site styles → floating arcade nav -->
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../theme.css">
  <!-- Page-specific styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="timer-page">

  <header class="arcade-header-bar">
    <nav class="arcade-nav" id="mainNav" aria-label="Main navigation">
      <a href="../../" class="nav-link" aria-label="Home" data-icon="🏠">
        <span class="nav-ico" aria-hidden="true">🏠</span>
        <span class="nav-text">Home</span>
      </a>
      <a href="../../learningarcade/" class="nav-link" aria-label="Arcade" data-icon="🕹️">
        <span class="nav-ico" aria-hidden="true">🕹️</span>
        <span class="nav-text">Arcade</span>
      </a>
      <a href="../../resources/" class="nav-link" aria-label="Resources" data-icon="📚">
        <span class="nav-ico" aria-hidden="true">📚</span>
        <span class="nav-text">Resources</span>
      </a>
      <a href="../../about/" class="nav-link" aria-label="About" data-icon="ℹ️">
        <span class="nav-ico" aria-hidden="true">ℹ️</span>
        <span class="nav-text">About</span>
      </a>
      <a href="../../learningarcade/profile/" class="nav-link nav-profile" aria-label="Profile" title="My Profile" data-icon="👤">
        <span class="nav-ico" aria-hidden="true">👤</span>
        <span class="nav-text">Profile</span>
      </a>
    </nav>
  </header>

  <main class="timer-main">

    <div class="timer-topbar">
      <a href="../" class="back-btn" aria-label="Back to Tools">
        <span class="back-arrow" aria-hidden="true">←</span>
        <span>Tools</span>
      </a>
    </div>

    <section class="timer-hero" aria-label="Timer tool">
      <p class="timer-kicker">CLASSROOM TOOL</p>
      <h1 class="timer-title">Countdown Timer</h1>
      <p class="timer-tagline">Set the time · Start · Focus · Ring when done</p>
    </section>

    <section class="timer-card" aria-label="Editable countdown timer">

      <div class="time-display" id="display" aria-live="polite">00:00:00</div>

      <div class="inputs" role="group" aria-label="Set timer duration">
        <div class="input-group">
          <label for="hours">Hours</label>
          <input type="number" id="hours" min="0" max="99" value="0" inputmode="numeric">
        </div>
        <div class="input-group">
          <label for="minutes">Minutes</label>
          <input type="number" id="minutes" min="0" max="59" value="0" inputmode="numeric">
        </div>
        <div class="input-group">
          <label for="seconds">Seconds</label>
          <input type="number" id="seconds" min="0" max="59" value="30" inputmode="numeric">
        </div>
      </div>

      <div class="presets" role="group" aria-label="Quick time presets">
        <button type="button" class="preset-btn" data-seconds="60">1 min</button>
        <button type="button" class="preset-btn" data-seconds="180">3 min</button>
        <button type="button" class="preset-btn" data-seconds="300">5 min</button>
        <button type="button" class="preset-btn" data-seconds="600">10 min</button>
        <button type="button" class="preset-btn" data-seconds="900">15 min</button>
        <button type="button" class="preset-btn" data-seconds="1500">25 min</button>
      </div>

      <div class="buttons">
        <button class="btn btn-start" id="startBtn" type="button">Start</button>
        <button class="btn btn-pause" id="pauseBtn" type="button" disabled>Pause</button>
        <button class="btn btn-reset" id="resetBtn" type="button">Reset</button>
      </div>

      <div class="status" id="status">Set a time and press Start</div>

      <div class="progress-wrap" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>

    </section>

    <p class="timer-hint">
      <span aria-hidden="true">✦</span>
      Perfect for speaking activities, timed exercises &amp; classroom games
      <span aria-hidden="true">✦</span>
    </p>

  </main>

  <footer class="site-footer timer-footer">
    <div class="footer-inner">
      <p class="hub-copy">© <span id="year"></span> Mr. Sheyhaki · English Teacher</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="../../swipe-nav.js"></script>
  <script src="../../theme.js"></script>
  <script>
    (function () {
      var y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
