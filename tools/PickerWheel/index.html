<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Picker Wheel | Tools | Mr. Sheyhaki</title>
  <meta name="description" content="Classroom picker wheel — large text for TV, spin, and mark used items so they cannot be picked again.">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="wheel-page">

  <header class="arcade-header-bar">
    <nav class="arcade-nav" id="mainNav" aria-label="Main navigation">
      <a href="/" class="nav-link" aria-label="Home" data-icon="🏠"><span class="nav-ico" aria-hidden="true">🏠</span><span class="nav-text">Home</span></a>
      <a href="/learningarcade/" class="nav-link" aria-label="Arcade" data-icon="🕹️"><span class="nav-ico" aria-hidden="true">🕹️</span><span class="nav-text">Arcade</span></a>
      <a href="/resources/" class="nav-link" aria-label="Resources" data-icon="📚"><span class="nav-ico" aria-hidden="true">📚</span><span class="nav-text">Resources</span></a>
      <a href="/about/" class="nav-link" aria-label="About" data-icon="ℹ️"><span class="nav-ico" aria-hidden="true">ℹ️</span><span class="nav-text">About</span></a>
      <a href="/learningarcade/profile/" class="nav-link nav-profile" aria-label="Profile" data-icon="👤"><span class="nav-ico" aria-hidden="true">👤</span><span class="nav-text">Profile</span></a>
    </nav>
  </header>

  <main class="wheel-main">
    <div class="wheel-topbar">
      <a href="../" class="back-btn" aria-label="Back to Tools"><span aria-hidden="true">←</span> Tools</a>
      <h1 class="page-title">Picker Wheel</h1>
      <span class="tv-badge">TV friendly</span>
    </div>

    <div class="layout">
      <!-- Wheel stage -->
      <section class="stage" aria-label="Wheel">
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="560" height="560" role="img" aria-label="Picker wheel"></canvas>
          <div class="hub" aria-hidden="true"></div>
          <p class="empty-hint">Add words →</p>
        </div>

        <div class="stage-actions">
          <button type="button" class="spin-btn" id="spinBtn">SPIN</button>
          <button type="button" class="ghost-btn" id="markUsedBtn" disabled title="Mark the last result as used">Mark used</button>
          <button type="button" class="ghost-btn" id="resetUsedBtn" title="Make all items available again">Reset used</button>
        </div>

        <p class="used-count" id="usedCount" aria-live="polite"></p>
        <p class="drag-hint">Drag the wheel or press SPIN</p>
      </section>

      <!-- Editor -->
      <aside class="editor" aria-label="Edit items">
        <form class="add-form" id="addForm">
          <input type="text" id="itemInput" placeholder="Add a word or name…" maxlength="40" autocomplete="off">
          <button type="submit" class="add-btn">Add</button>
        </form>
        <div class="editor-toolbar">
          <span><strong id="itemCount">0</strong> items</span>
          <button type="button" class="text-btn" id="shuffleBtn">Shuffle</button>
          <button type="button" class="text-btn danger" id="clearBtn">Clear all</button>
        </div>
        <ul class="item-list" id="itemList"></ul>
        <p class="hint">Used items are dimmed and will not be picked again until you reset them.</p>
      </aside>
    </div>
  </main>

  <!-- Big TV result overlay -->
  <div class="result-overlay" id="resultOverlay" hidden>
    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
    <div class="result-card">
      <p class="result-label">Selected</p>
      <p class="result-word" id="resultWord"></p>
      <div class="result-actions">
        <button type="button" class="spin-btn result-mark" id="overlayMarkBtn">Mark used</button>
        <button type="button" class="ghost-btn" id="overlayCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script src="script.js"></script>
  <script src="/visit-counter.js" defer></script>
</body>
</html>
